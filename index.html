<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Iron & Co — Tycoon isométrique</title>
  <style>
    /* ─── Reset minimal + thème ──────────────────────────────────── */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #1a1f1a;
      color: #e8e8e8;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body { user-select: none; }

    /* Canvas plein écran sous le HUD */
    #game {
      position: absolute;
      inset: 0;
      display: block;
      cursor: grab;
      /* Empêche les gestes par défaut du navigateur (scroll, pinch-zoom de
         page) — on gère tout nous-mêmes pour le tactile. */
      touch-action: none;
    }
    #game.grabbing { cursor: grabbing; }
    #game.placing  { cursor: crosshair; }

    /* ─── HUD : couches en overlay ─────────────────────────────── */
    .hud {
      position: absolute;
      pointer-events: none;
      z-index: 10;
    }
    .hud > * { pointer-events: auto; }

    /* Stocks (haut gauche) — env() compense les notches iPhone/Android */
    .stocks {
      top: calc(16px + env(safe-area-inset-top));
      left: calc(16px + env(safe-area-inset-left));
      display: flex; flex-direction: column; gap: 8px;
      max-height: calc(100vh - 220px);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .stock-row {
      display: flex; align-items: center; gap: 10px;
      background: rgba(15, 22, 17, 0.85);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 8px 12px;
      min-width: 180px;
      font-size: 13px;
    }
    .stock-icon {
      width: 18px; height: 18px;
      border-radius: 4px;
      flex-shrink: 0;
      box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.3);
    }
    .stock-name { font-weight: 600; flex: 1; }
    .stock-qty { font-family: 'Consolas', 'Monaco', monospace; }

    /* Crédits (haut droite) */
    .credits {
      top: calc(16px + env(safe-area-inset-top));
      right: calc(16px + env(safe-area-inset-right));
      background: rgba(15, 22, 17, 0.85);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 209, 102, 0.3);
      border-radius: 12px;
      padding: 12px 18px;
      text-align: right;
      min-width: 200px;
    }
    .credits-value {
      font-size: 28px;
      font-weight: 800;
      color: #ffd166;
      letter-spacing: -0.02em;
      line-height: 1;
    }
    .credits-rate {
      margin-top: 4px;
      font-size: 13px;
      color: #b6e8a3;     /* meilleur contraste sur fond sombre flouté */
      font-weight: 600;
      font-family: 'Consolas', monospace;
    }
    .credits-energy {
      margin-top: 6px;
      font-size: 11px;
      color: #aaa;
      font-family: 'Consolas', monospace;
    }
    .credits-energy.low { color: #ff6b6b; }

    /* Palette de bâtiments (bas centre) — scrollable horizontalement
       sur mobile pour ne jamais déborder du viewport. */
    .palette {
      bottom: calc(16px + env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      display: flex; gap: 6px;
      max-width: calc(100vw - 32px);
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      background: rgba(15, 22, 17, 0.92);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 6px;
    }
    .palette::-webkit-scrollbar { display: none; }
    .palette-btn {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      background: transparent;
      border: 2px solid transparent;
      border-radius: 10px;
      padding: 10px 14px;
      color: #e8e8e8;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
      min-width: 88px;
      min-height: 64px;          /* assure une cible tactile ≥ 44pt même avec icon+labels compacts */
      flex-shrink: 0;
      font-family: inherit;
    }
    .palette-btn:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.05);
    }
    .palette-btn.active {
      background: rgba(143, 191, 125, 0.15);
      border-color: #8fbf7d;
    }
    .palette-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .palette-btn-icon { font-size: 22px; line-height: 1; }
    .palette-btn-name { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
    .palette-btn-cost { font-size: 11px; color: #ffd166; font-family: 'Consolas', monospace; }

    /* Bouton recherches (bas droite) */
    .research-btn {
      bottom: calc(16px + env(safe-area-inset-bottom));
      right: calc(16px + env(safe-area-inset-right));
      background: rgba(15, 22, 17, 0.92);
      border: 1px solid rgba(192, 132, 252, 0.4);
      border-radius: 12px;
      padding: 12px 18px;
      color: #c084fc;
      cursor: pointer;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      min-height: 44px;
      display: flex; align-items: center; gap: 8px;
    }
    .research-btn:hover { background: rgba(192, 132, 252, 0.1); }

    /* Aide en bas (raccourcis clavier/souris) — masquée sur mobile pour
       laisser de la place. Le user mobile la découvrira via les gestes. */
    .help-text {
      bottom: calc(110px + env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      color: rgba(255, 255, 255, 0.45);
      text-align: center;
      pointer-events: none;
      white-space: nowrap;
    }
    @media (max-width: 720px) {
      .help-text { display: none; }
    }

    /* Indication visuelle sur les stocks proches du cap */
    .stock-row.is-near .stock-qty { color: #ffd166; }
    .stock-row.is-full .stock-qty { color: #ff6b6b; font-weight: 700; }
    .stock-row.is-full {
      border-color: rgba(255, 107, 107, 0.4);
      box-shadow: 0 0 12px rgba(255, 107, 107, 0.15);
    }

    /* Le bouton Recherches pulse quand au moins une techno est achetable */
    .research-btn.has-affordable {
      animation: research-pulse 1.6s ease-in-out infinite;
      border-color: #c084fc;
    }
    @keyframes research-pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(192, 132, 252, 0); }
      50%      { box-shadow: 0 0 16px 0 rgba(192, 132, 252, 0.55); }
    }

    /* Modal Recherches — overlay plein écran avec backdrop flouté */
    .research-modal {
      position: fixed; inset: 0; z-index: 50;
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
    }
    .research-modal[hidden] { display: none; }
    .research-backdrop {
      position: absolute; inset: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
    }
    .research-panel {
      position: relative;
      width: min(560px, 100%);
      max-height: calc(100vh - 40px);
      display: flex; flex-direction: column;
      background: linear-gradient(180deg, #1a221c 0%, #10160f 100%);
      border: 1px solid rgba(192, 132, 252, 0.25);
      border-radius: 16px;
      box-shadow: 0 20px 60px -10px rgba(0, 0, 0, 0.7),
                  0 0 30px rgba(192, 132, 252, 0.15);
      overflow: hidden;
    }
    .research-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 16px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }
    .research-header h2 {
      font-size: 18px; font-weight: 700; color: #c084fc;
    }
    .research-close {
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, 0.5);
      font-size: 28px;
      line-height: 1;
      cursor: pointer;
      width: 36px; height: 36px;
      border-radius: 8px;
      transition: background 0.15s, color 0.15s;
    }
    .research-close:hover { background: rgba(255, 255, 255, 0.06); color: #fff; }
    .research-list {
      padding: 16px;
      overflow-y: auto;
      display: flex; flex-direction: column; gap: 12px;
    }
    .research-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 14px;
      display: flex; flex-direction: column; gap: 8px;
      transition: border-color 0.15s, background 0.15s;
    }
    .research-card.is-affordable { border-color: rgba(192, 132, 252, 0.5); }
    .research-card.is-unlocked {
      border-color: rgba(143, 191, 125, 0.4);
      background: rgba(143, 191, 125, 0.05);
    }
    .research-card.is-locked { opacity: 0.55; }
    .research-card-head {
      display: flex; align-items: center; gap: 10px;
    }
    .research-card-icon { font-size: 22px; }
    .research-card-name { font-size: 14px; font-weight: 700; flex: 1; }
    .research-card-cost {
      font-family: 'Consolas', monospace;
      font-size: 13px;
      color: #ffd166;
    }
    .research-card-desc {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.65);
      line-height: 1.4;
    }
    .research-card-action {
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px;
      margin-top: 4px;
    }
    .research-buy {
      flex: 1;
      padding: 10px 14px;
      background: linear-gradient(180deg, rgba(192, 132, 252, 0.2) 0%, rgba(192, 132, 252, 0.05) 100%);
      border: 1px solid #c084fc;
      border-radius: 8px;
      color: #e9d5ff;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: filter 0.15s;
    }
    .research-buy:hover:not(:disabled) { filter: brightness(1.2); }
    .research-buy:disabled {
      opacity: 0.4; cursor: not-allowed;
      background: rgba(255, 255, 255, 0.04);
      border-color: rgba(255, 255, 255, 0.1);
      color: rgba(255, 255, 255, 0.5);
    }
    .research-status {
      font-size: 11px;
      color: #8fbf7d;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .research-locked-msg {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.45);
      font-style: italic;
    }

    /* Toast info (bas, après une action invalide par ex.) */
    .toast {
      top: 80px; left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 22, 17, 0.95);
      border: 1px solid #ff6b6b;
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 13px;
      color: #ff6b6b;
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <!-- HUD : tout en HTML overlay pour rester simple à mettre à jour -->
  <div class="hud stocks" id="stocks"></div>

  <div class="hud credits">
    <div class="credits-value" id="credits-value">200 €</div>
    <div class="credits-rate" id="credits-rate">+ 0 €/s</div>
    <div class="credits-energy" id="credits-energy">⚡ 0 / 5</div>
  </div>

  <div class="hud help-text">
    Glisser : déplacer la caméra • Molette / pincer : zoom • Touches 1·2·3 : choisir un bâtiment • Échap : annuler
  </div>

  <div class="hud palette" id="palette"></div>

  <button class="hud research-btn" id="research-btn" title="Ouvrir le panneau Recherches">🔬 Recherches</button>

  <!-- Modal Recherches (caché par défaut). Construit dynamiquement par updateResearchModal(). -->
  <div class="research-modal" id="research-modal" hidden>
    <div class="research-backdrop"></div>
    <div class="research-panel" role="dialog" aria-labelledby="research-title">
      <header class="research-header">
        <h2 id="research-title">🔬 Recherches</h2>
        <button class="research-close" id="research-close" aria-label="Fermer">×</button>
      </header>
      <div class="research-list" id="research-list"></div>
    </div>
  </div>

  <div class="hud toast" id="toast"></div>

  <script>
  'use strict';

  /* ════════════════════════════════════════════════════════════════
     IRON & CO — Tycoon isométrique en un seul fichier.
     Inspiré de Satisfactory : pose des extracteurs sur des gisements,
     produit des ressources, vend automatiquement contre des crédits.
     V1 : grille statique 20×20, 3 types de bâtiments, vente auto.
     ════════════════════════════════════════════════════════════════ */

  // ─── Constantes de jeu ──────────────────────────────────────────
  const TILE_W = 64;          // largeur d'une tuile iso (px)
  const TILE_H = 32;          // hauteur d'une tuile iso (ratio 2:1)
  const GRID_SIZE = 20;       // nb tuiles par côté
  const RESOURCE_DENSITY = 0.18; // ~18% des tuiles ont une ressource
  const TICK_MS = 1000;       // boucle de production = 1 tick/s
  // Taux de vente auto par ressource. Volontairement bas : avec 1 extracteur
  // qui produit 1 u/s, le 1er stock se draine ; à partir du 3e extracteur
  // d'une même ressource, le stock monte → l'entrepôt devient utile.
  const SELL_RATE_PER_TICK = 2;
  const MIN_ZOOM = 0.5;
  const MAX_ZOOM = 2;

  // ─── Définitions des ressources ─────────────────────────────────
  // `basic: true` → ressource brute extractible sur la map ; sinon =
  // ressource crafted (apparaît dans les recettes). Les crafted ne sont
  // affichées dans le HUD qu'une fois la techno correspondante débloquée.
  const RESOURCES = {
    fer:     { name: 'Fer',     short: 'FE', color: '#a86a3c', price: 1.0,  basic: true },
    cuivre:  { name: 'Cuivre',  short: 'CU', color: '#d97e2a', price: 2.0,  basic: true },
    charbon: { name: 'Charbon', short: 'CH', color: '#3d3d3d', price: 1.5,  basic: true },
    lingot:  { name: 'Lingot',  short: 'LI', color: '#b6c0d4', price: 8.0  },
    piece:   { name: 'Pièce',   short: 'PI', color: '#9aaab8', price: 50.0 },
  };

  // ─── Définitions des bâtiments ──────────────────────────────────
  // `requiresResource` : ne peut être posé que sur une tuile ressource
  // `energyUsage`      : consomme N énergie/tick (si pas assez → bloqué)
  // `energyProduction` : ajoute N énergie au pool global
  // `storage`          : ajoute N à la capacité de stockage
  // `recipe`           : { input: {res:n}, output: 'res', qty, cycleMs }
  // `locked`           : true → masqué de la palette tant que la recherche
  //                      correspondante n'est pas complétée
  const BUILDINGS = {
    extracteur: {
      name: 'Extracteur', icon: '⛏️', cost: 50, color: '#a06848',
      requiresResource: true, energyUsage: 1, productionPerTick: 1,
    },
    entrepot: {
      name: 'Entrepôt',   icon: '📦', cost: 100, color: '#8b6f47',
      storage: 100,
    },
    generateur: {
      name: 'Générateur', icon: '⚡', cost: 75, color: '#ffd166',
      energyProduction: 10,
    },
    fonderie: {
      name: 'Fonderie',   icon: '🏭', cost: 200, color: '#ef6c4a',
      energyUsage: 2, locked: true,
      recipe: { input: { fer: 1, charbon: 1 }, output: 'lingot', qty: 1, cycleMs: 2000 },
    },
    assembleur: {
      name: 'Assembleur', icon: '⚙️', cost: 400, color: '#9b6dff',
      energyUsage: 3, locked: true,
      recipe: { input: { lingot: 2, cuivre: 1 }, output: 'piece', qty: 1, cycleMs: 3000 },
    },
  };

  // ─── Recherches ─────────────────────────────────────────────────
  // Achat instantané (pas de timer pour V1). Chaque techno débloque un ou
  // plusieurs bâtiments + révèle de nouvelles ressources dans le HUD.
  const RESEARCH = {
    metallurgie: {
      name: 'Métallurgie', icon: '🔥', cost: 500,
      desc: 'Débloque la Fonderie : transforme Fer + Charbon en Lingot (×8 €).',
      requires: [], unlocks: ['fonderie'], reveals: ['lingot'],
    },
    mecanique: {
      name: 'Mécanique de précision', icon: '🛠️', cost: 1500,
      desc: 'Débloque l\'Assembleur : combine 2 Lingots + 1 Cuivre en Pièce (50 €).',
      requires: ['metallurgie'], unlocks: ['assembleur'], reveals: ['piece'],
    },
  };

  // ─── État global du jeu ─────────────────────────────────────────
  const state = {
    // Grille : tableau 2D, tiles[row][col] = { type, resource, building }
    tiles: [],
    // Liste plate des bâtiments (pour itérer plus vite que la grille)
    buildings: [],
    // Économie
    credits: 200,
    stocks: { fer: 0, cuivre: 0, charbon: 0, lingot: 0, piece: 0 },
    storageCap: 50,           // capacité de stockage par ressource
    revenuePerSec: 0,         // taux affiché dans le HUD
    energyBase: 5,            // énergie "gratuite" de base
    // Recherches achetées (instantanées). Liste d'IDs de RESEARCH.
    research: { unlocked: [] },
    // Caméra
    camera: { x: 0, y: 0, zoom: 1 },
    // Souris
    mouse: { x: 0, y: 0 },
    hoverTile: null,          // { col, row } ou null
    // Drag de caméra
    dragging: false,
    dragStart: null,
    dragMoved: false,         // pour distinguer un clic d'un drag
    // Mode construction
    selectedBuilding: null,   // ex: 'extracteur' ou null
  };

  // ─── Canvas + contexte ──────────────────────────────────────────
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  function resizeCanvas() {
    // Support écran HiDPI : on multiplie par devicePixelRatio
    const dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  // ─── Génération de la grille ─────────────────────────────────────
  // Place des ressources aléatoirement (~18% des tuiles), réparties
  // entre les 3 types possibles. Le reste reste en "ground".
  function generateGrid() {
    state.tiles = [];
    const types = Object.keys(RESOURCES);
    for (let r = 0; r < GRID_SIZE; r++) {
      const row = [];
      for (let c = 0; c < GRID_SIZE; c++) {
        let resource = null;
        if (Math.random() < RESOURCE_DENSITY) {
          resource = types[Math.floor(Math.random() * types.length)];
        }
        row.push({
          type: resource ? 'resource' : 'ground',
          resource,
          building: null,
        });
      }
      state.tiles.push(row);
    }
  }

  // ─── Conversions iso ↔ écran ────────────────────────────────────
  // Formule iso classique : screenX = (col - row) * tw/2, screenY = (col + row) * th/2
  // On applique zoom puis offset caméra pour obtenir les coords écran.
  function worldToScreen(col, row) {
    const z = state.camera.zoom;
    const x = (col - row) * (TILE_W / 2) * z + state.camera.x;
    const y = (col + row) * (TILE_H / 2) * z + state.camera.y;
    return { x, y };
  }

  // Inverse : trouve la tuile sous un point d'écran (sx, sy).
  // On résout le système linéaire en deux étapes.
  function screenToTile(sx, sy) {
    const z = state.camera.zoom;
    const dx = (sx - state.camera.x) / z;
    const dy = (sy - state.camera.y) / z;
    // dx = (col - row) * tw/2  =>  col - row = dx * 2/tw
    // dy = (col + row) * th/2  =>  col + row = dy * 2/th
    const a = dx / (TILE_W / 2);
    const b = dy / (TILE_H / 2);
    const col = Math.floor((a + b) / 2);
    const row = Math.floor((b - a) / 2);
    if (col < 0 || col >= GRID_SIZE || row < 0 || row >= GRID_SIZE) return null;
    return { col, row };
  }

  // Centre la caméra sur le milieu de la grille.
  function centerCamera() {
    state.camera.x = window.innerWidth / 2;
    // Un peu décalé vers le haut pour laisser de la place au HUD bas
    state.camera.y = window.innerHeight / 2 - (GRID_SIZE * TILE_H) / 4;
    state.camera.zoom = 1;
  }

  // ─── Utilitaires couleur ────────────────────────────────────────
  function hexToRgb(hex) {
    const h = hex.replace('#', '');
    return {
      r: parseInt(h.substring(0, 2), 16),
      g: parseInt(h.substring(2, 4), 16),
      b: parseInt(h.substring(4, 6), 16),
    };
  }
  function shade(hex, factor) {
    // factor < 1 → assombrit, > 1 → éclaircit
    const { r, g, b } = hexToRgb(hex);
    const cl = (v) => Math.max(0, Math.min(255, Math.round(v * factor)));
    return `rgb(${cl(r)}, ${cl(g)}, ${cl(b)})`;
  }

  // ─── Rendu ──────────────────────────────────────────────────────
  function render() {
    ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

    // Fond dégradé subtil pour donner de la profondeur
    const grad = ctx.createRadialGradient(
      window.innerWidth / 2, window.innerHeight / 2, 100,
      window.innerWidth / 2, window.innerHeight / 2, Math.max(window.innerWidth, window.innerHeight)
    );
    grad.addColorStop(0, '#252b25');
    grad.addColorStop(1, '#10130f');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

    // Ordre iso : on dessine row par row, col par col → le bas devant
    for (let r = 0; r < GRID_SIZE; r++) {
      for (let c = 0; c < GRID_SIZE; c++) {
        drawTile(c, r);
      }
    }

    // Aperçu fantôme du bâtiment à poser
    if (state.selectedBuilding && state.hoverTile) {
      drawGhost(state.hoverTile.col, state.hoverTile.row);
    }
  }

  function drawTile(col, row) {
    const tile = state.tiles[row][col];
    const { x, y } = worldToScreen(col, row);
    const z = state.camera.zoom;
    const w = TILE_W * z;
    const h = TILE_H * z;

    // Couleur de base : herbe pour ground, teintée pour ressource
    let baseColor = '#3a5a3a';
    if (tile.type === 'resource') {
      // Mélange herbe + couleur ressource (plus foncé)
      baseColor = shade(RESOURCES[tile.resource].color, 0.7);
    }

    // Surbrillance si on hover dessus en mode placement
    const isHover = state.hoverTile
      && state.hoverTile.col === col
      && state.hoverTile.row === row
      && state.selectedBuilding;

    // Diamond (losange iso)
    ctx.beginPath();
    ctx.moveTo(x, y - h / 2);
    ctx.lineTo(x + w / 2, y);
    ctx.lineTo(x, y + h / 2);
    ctx.lineTo(x - w / 2, y);
    ctx.closePath();
    ctx.fillStyle = isHover ? shade(baseColor, 1.4) : baseColor;
    ctx.fill();
    ctx.strokeStyle = 'rgba(0, 0, 0, 0.35)';
    ctx.lineWidth = 1;
    ctx.stroke();

    // Marqueurs de ressource (3 petits ronds)
    if (tile.type === 'resource' && !tile.building) {
      ctx.fillStyle = RESOURCES[tile.resource].color;
      // Plus visibles à zoom bas — sinon les gisements deviennent invisibles
      const dotR = Math.max(3, 4.5 * z);
      const positions = [
        { dx: -w * 0.18, dy: 0 },
        { dx:  w * 0.18, dy: -h * 0.12 },
        { dx:  0,        dy:  h * 0.18 },
      ];
      for (const p of positions) {
        ctx.beginPath();
        ctx.arc(x + p.dx, y + p.dy, dotR, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // Bâtiment posé sur cette tuile
    if (tile.building) {
      drawBuilding(tile.building, x, y, false);
    }
  }

  // Dessine un bâtiment en faux-3D : un cube vu de dessus en iso.
  function drawBuilding(building, cx, cy, ghost) {
    const def = BUILDINGS[building.type];
    const z = state.camera.zoom;
    const w = TILE_W * 0.7 * z;
    const d = TILE_H * 0.7 * z;
    const h = 26 * z;
    const alpha = ghost ? 0.55 : 1;

    ctx.globalAlpha = alpha;

    // Face droite (légèrement assombrie)
    ctx.fillStyle = shade(def.color, 0.75);
    ctx.beginPath();
    ctx.moveTo(cx,         cy - h);
    ctx.lineTo(cx + w / 2, cy - h - d / 2);
    ctx.lineTo(cx + w / 2, cy - d / 2);
    ctx.lineTo(cx,         cy);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.4)';
    ctx.lineWidth = 1;
    ctx.stroke();

    // Face gauche (encore plus sombre)
    ctx.fillStyle = shade(def.color, 0.55);
    ctx.beginPath();
    ctx.moveTo(cx,         cy - h);
    ctx.lineTo(cx - w / 2, cy - h - d / 2);
    ctx.lineTo(cx - w / 2, cy - d / 2);
    ctx.lineTo(cx,         cy);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Face de dessus (claire)
    ctx.fillStyle = def.color;
    ctx.beginPath();
    ctx.moveTo(cx,         cy - h - d);
    ctx.lineTo(cx + w / 2, cy - h - d / 2);
    ctx.lineTo(cx,         cy - h);
    ctx.lineTo(cx - w / 2, cy - h - d / 2);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Icône (emoji) sur le toit
    ctx.fillStyle = '#ffffff';
    ctx.font = `${Math.max(10, 16 * z)}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(def.icon, cx, cy - h - d / 4);

    // Barre de progression au-dessus des bâtiments à recette.
    // Toujours affichée (sauf ghost preview) :
    //   · vide  → idle (manque d'input ou stock output saturé)
    //   · plein → cycle en cours qui avance
    // Sans ce feedback, une fonderie idle est indiscernable d'une qui tourne.
    if (!ghost && def.recipe) {
      const progress = building.progress || 0;
      const ratio = Math.min(1, progress / def.recipe.cycleMs);
      const barW = w * 0.85;
      const barH = Math.max(3, 4 * z);
      const barX = cx - barW / 2;
      const barY = cy - h - d - barH - 2 * z;
      // Fond — orangé subtil quand idle pour signaler l'attente d'input
      ctx.fillStyle = progress === 0 ? 'rgba(80, 50, 30, 0.7)' : 'rgba(0, 0, 0, 0.55)';
      ctx.fillRect(barX, barY, barW, barH);
      if (ratio > 0) {
        ctx.fillStyle = ratio >= 1 ? '#ffd166' : '#8fbf7d'; // jaune si bloqué à 100%
        ctx.fillRect(barX, barY, barW * ratio, barH);
      }
      ctx.strokeStyle = 'rgba(0, 0, 0, 0.35)';
      ctx.lineWidth = 1;
      ctx.strokeRect(barX, barY, barW, barH);
    }

    ctx.globalAlpha = 1;
  }

  // Aperçu fantôme : on dessine le bâtiment sélectionné en transparent
  // sur la tuile hover, en rouge si la pose est invalide.
  function drawGhost(col, row) {
    const { x, y } = worldToScreen(col, row);
    const valid = canPlaceBuilding(state.selectedBuilding, col, row).ok;

    // Halo coloré sous la tuile pour indiquer la validité
    const z = state.camera.zoom;
    const w = TILE_W * z;
    const h = TILE_H * z;
    ctx.beginPath();
    ctx.moveTo(x, y - h / 2);
    ctx.lineTo(x + w / 2, y);
    ctx.lineTo(x, y + h / 2);
    ctx.lineTo(x - w / 2, y);
    ctx.closePath();
    ctx.fillStyle = valid ? 'rgba(143, 191, 125, 0.35)' : 'rgba(255, 107, 107, 0.35)';
    ctx.fill();
    ctx.strokeStyle = valid ? '#8fbf7d' : '#ff6b6b';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Bâtiment fantôme par-dessus
    drawBuilding({ type: state.selectedBuilding }, x, y, true);
  }

  // ─── Logique de placement ───────────────────────────────────────
  // Renvoie { ok, reason } — `reason` permet d'afficher un toast.
  function canPlaceBuilding(type, col, row) {
    if (col < 0 || col >= GRID_SIZE || row < 0 || row >= GRID_SIZE)
      return { ok: false, reason: 'Hors carte' };
    const tile = state.tiles[row][col];
    if (tile.building) return { ok: false, reason: 'Tuile occupée' };
    const def = BUILDINGS[type];
    if (state.credits < def.cost)
      return { ok: false, reason: `Pas assez de crédits (${def.cost} € requis)` };
    if (def.requiresResource && tile.type !== 'resource')
      return { ok: false, reason: 'Doit être posé sur une ressource' };
    return { ok: true };
  }

  function placeBuilding(type, col, row) {
    const check = canPlaceBuilding(type, col, row);
    if (!check.ok) {
      showToast(check.reason);
      return false;
    }
    const def = BUILDINGS[type];
    state.credits -= def.cost;
    const b = { type, col, row };
    state.tiles[row][col].building = b;
    state.buildings.push(b);
    if (def.storage) state.storageCap += def.storage;
    updateHUD();
    return true;
  }

  // ─── Tick : production + ventes auto ────────────────────────────
  function tick() {
    // 1. Calcul de l'énergie : on parcourt les bâtiments une fois et on
    //    additionne les flux. Plus extensible que filter() en boucle.
    let energyTotal = state.energyBase;
    let energyUsed = 0;
    for (const b of state.buildings) {
      const def = BUILDINGS[b.type];
      if (def.energyProduction) energyTotal += def.energyProduction;
      if (def.energyUsage)      energyUsed  += def.energyUsage;
    }
    const hasEnoughEnergy = energyTotal >= energyUsed;
    state.energyTotal = energyTotal;
    state.energyUsed = energyUsed;

    // 2. Production. Si pas assez d'énergie → toutes les machines à
    //    consommation sont bloquées (all-or-nothing, simple à comprendre).
    if (hasEnoughEnergy) {
      for (const b of state.buildings) {
        const def = BUILDINGS[b.type];

        if (b.type === 'extracteur') {
          // Extracteur : produit la ressource de la tuile, capé.
          const r = state.tiles[b.row][b.col].resource;
          if (r && state.stocks[r] < state.storageCap) {
            state.stocks[r] = Math.min(state.storageCap, state.stocks[r] + def.productionPerTick);
          }
        } else if (def.recipe) {
          // Bâtiment à recette (Fonderie, Assembleur, …)
          runRecipeTick(b, def.recipe);
        }
      }
    }

    // 3. Vente automatique : on écoule jusqu'à SELL_RATE_PER_TICK unités
    //    de chaque ressource par tick. Si la production dépasse ce taux,
    //    le stock monte → il faut bâtir des entrepôts pour ne pas saturer.
    let revenue = 0;
    for (const r of Object.keys(state.stocks)) {
      const sellQty = Math.min(state.stocks[r], SELL_RATE_PER_TICK);
      if (sellQty <= 0) continue;
      state.stocks[r] -= sellQty;
      revenue += sellQty * RESOURCES[r].price;
    }
    state.credits += revenue;
    state.revenuePerSec = revenue;

    updateHUD();
  }

  // Avance d'un tick le cycle d'un bâtiment à recette. `b.progress` (en ms)
  // suit la progression du cycle. Le bâtiment a 3 états possibles :
  //   1. progress >= cycleMs et stock output plein → bloqué (waiting room)
  //   2. progress === 0 et input manquant → idle (waiting room)
  //   3. sinon → avance normalement
  // Cette séparation évite de consommer un input pour ensuite jeter
  // l'output si le stock est plein.
  function runRecipeTick(b, recipe) {
    if (!b.progress) b.progress = 0;

    // Cycle terminé en attente d'écoulement → on tente de livrer l'output
    if (b.progress >= recipe.cycleMs) {
      if (state.stocks[recipe.output] >= state.storageCap) return; // bloqué
      state.stocks[recipe.output] = Math.min(
        state.storageCap,
        state.stocks[recipe.output] + recipe.qty
      );
      b.progress = 0;
    }

    // Démarrage d'un nouveau cycle → on vérifie + on consomme les inputs
    if (b.progress === 0) {
      for (const [r, n] of Object.entries(recipe.input)) {
        if ((state.stocks[r] ?? 0) < n) return; // input manquant → on attend
      }
      for (const [r, n] of Object.entries(recipe.input)) {
        state.stocks[r] -= n;
      }
    }

    b.progress += TICK_MS;
  }

  // ─── Helpers de découverte / déblocage ──────────────────────────
  // Une ressource est "découverte" si elle est `basic: true` OU si une
  // recherche déjà unlock l'a révélée (champ `reveals`). Évite d'afficher
  // Lingot/Pièce dans le HUD avant que le joueur ait recherché Métallurgie.
  function isResourceDiscovered(key) {
    if (RESOURCES[key].basic) return true;
    return state.research.unlocked.some((rid) => (RESEARCH[rid].reveals || []).includes(key));
  }

  // Un bâtiment est jouable s'il n'est pas `locked` OU si une recherche
  // déjà acquise le débloque (champ `unlocks`).
  function isBuildingAvailable(key) {
    const def = BUILDINGS[key];
    if (!def.locked) return true;
    return state.research.unlocked.some((rid) => (RESEARCH[rid].unlocks || []).includes(key));
  }

  // ─── Mise à jour du HUD (DOM) ───────────────────────────────────
  let lastHudHash = '';
  function updateHUD() {
    // Stocks (haut gauche) — n'affiche que les ressources découvertes
    const stocksEl = document.getElementById('stocks');
    let html = '';
    for (const [key, def] of Object.entries(RESOURCES)) {
      if (!isResourceDiscovered(key)) continue;
      const qty = Math.floor(state.stocks[key]);
      const ratio = qty / state.storageCap;
      const fullClass = ratio >= 1 ? ' is-full' : (ratio >= 0.85 ? ' is-near' : '');
      html += `
        <div class="stock-row${fullClass}">
          <span class="stock-icon" style="background:${def.color}"></span>
          <span class="stock-name">${def.short} · ${def.name}</span>
          <span class="stock-qty">${qty} / ${state.storageCap}</span>
        </div>`;
    }
    stocksEl.innerHTML = html;

    // Crédits + €/s + énergie (haut droite)
    document.getElementById('credits-value').textContent = formatCredits(state.credits) + ' €';
    document.getElementById('credits-rate').textContent =
      '+ ' + state.revenuePerSec.toFixed(1) + ' €/s';
    const enEl = document.getElementById('credits-energy');
    enEl.textContent = `⚡ ${state.energyUsed || 0} / ${state.energyTotal || state.energyBase}`;
    enEl.classList.toggle('low', (state.energyUsed || 0) > (state.energyTotal || state.energyBase));

    // Palette (bas centre). Hash inclut l'affordability ET l'état de
    // déblocage de chaque bâtiment pour rebuild quand une recherche entre.
    const palette = document.getElementById('palette');
    const availables = Object.keys(BUILDINGS).filter(isBuildingAvailable);
    const hashParts = [state.selectedBuilding, availables.join(',')];
    for (const k of availables) hashParts.push(state.credits >= BUILDINGS[k].cost ? '1' : '0');
    const wantHash = hashParts.join('|');
    if (wantHash !== lastHudHash) {
      let pHtml = '';
      for (const key of availables) {
        const def = BUILDINGS[key];
        const affordable = state.credits >= def.cost;
        const isActive = state.selectedBuilding === key;
        pHtml += `
          <button
            class="palette-btn ${isActive ? 'active' : ''}"
            data-building="${key}"
            ${!affordable ? 'disabled' : ''}
          >
            <span class="palette-btn-icon">${def.icon}</span>
            <span class="palette-btn-name">${def.name}</span>
            <span class="palette-btn-cost">${def.cost} €</span>
          </button>`;
      }
      palette.innerHTML = pHtml;
      lastHudHash = wantHash;
      palette.querySelectorAll('.palette-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const k = btn.dataset.building;
          state.selectedBuilding = state.selectedBuilding === k ? null : k;
          canvas.classList.toggle('placing', !!state.selectedBuilding);
          updateHUD();
        });
      });
    }

    // Notif "achetable" sur le bouton Recherches s'il y a au moins une
    // techno qu'on peut acheter dès maintenant.
    const researchBtn = document.getElementById('research-btn');
    const hasAffordable = Object.entries(RESEARCH).some(([id, r]) =>
      !state.research.unlocked.includes(id)
      && r.requires.every((q) => state.research.unlocked.includes(q))
      && state.credits >= r.cost
    );
    researchBtn.classList.toggle('has-affordable', hasAffordable);
  }

  function formatCredits(n) {
    // Sépare les milliers par un espace insécable (style FR)
    return Math.floor(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  }

  // ─── Toast (message d'erreur éphémère) ──────────────────────────
  let toastTimer = null;
  function showToast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 1800);
  }

  // ─── Inputs unifiés (souris + tactile) ──────────────────────────
  // Toute la logique passe par 3 fonctions agnostiques (pointer*) qui
  // sont appelées indifféremment depuis les events souris ou tactiles.
  // Pour le tactile, on gère en plus le pinch-zoom à 2 doigts.

  function pointerDown(x, y) {
    state.mouse.x = x;
    state.mouse.y = y;
    state.dragging = true;
    state.dragMoved = false;
    state.dragStart = { x, y, camX: state.camera.x, camY: state.camera.y };
    // Important pour le tactile : on n'a pas de "mousemove" continu pour
    // garder hoverTile à jour. Sans ça, un tap sans mouvement utiliserait
    // la position du tap précédent → bâtiment posé au mauvais endroit.
    state.hoverTile = screenToTile(x, y);
    canvas.classList.add('grabbing');
  }

  function pointerMove(x, y) {
    state.mouse.x = x;
    state.mouse.y = y;
    if (state.dragging) {
      const dx = x - state.dragStart.x;
      const dy = y - state.dragStart.y;
      // Au-delà de 6 px on considère qu'on est en train de drag (un peu
      // plus généreux qu'à la souris pour éviter les faux drags tactiles).
      if (Math.abs(dx) + Math.abs(dy) > 6) state.dragMoved = true;
      state.camera.x = state.dragStart.camX + dx;
      state.camera.y = state.dragStart.camY + dy;
    }
    state.hoverTile = screenToTile(x, y);
  }

  function pointerUp() {
    canvas.classList.remove('grabbing');
    if (!state.dragging) return;
    state.dragging = false;
    // Tap/clic court avec un bâtiment sélectionné → on tente de poser
    if (!state.dragMoved && state.selectedBuilding && state.hoverTile) {
      placeBuilding(state.selectedBuilding, state.hoverTile.col, state.hoverTile.row);
    }
  }

  // Applique un zoom centré sur le point (cx, cy) — utilisé par la molette
  // ET par le pinch tactile.
  function applyZoom(newZoom, cx, cy) {
    const oldZoom = state.camera.zoom;
    newZoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, newZoom));
    if (newZoom === oldZoom) return;
    const ratio = newZoom / oldZoom;
    state.camera.x = cx - (cx - state.camera.x) * ratio;
    state.camera.y = cy - (cy - state.camera.y) * ratio;
    state.camera.zoom = newZoom;
  }

  // ─── Souris ─────
  canvas.addEventListener('mousedown',  (e) => pointerDown(e.clientX, e.clientY));
  canvas.addEventListener('mousemove',  (e) => pointerMove(e.clientX, e.clientY));
  canvas.addEventListener('mouseup',    () => pointerUp());
  canvas.addEventListener('mouseleave', () => {
    state.dragging = false;
    state.hoverTile = null;
    canvas.classList.remove('grabbing');
  });
  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    const delta = -Math.sign(e.deltaY) * 0.1;
    applyZoom(state.camera.zoom + delta, e.clientX, e.clientY);
  }, { passive: false });

  // ─── Tactile ─────
  // Un doigt = pan (équivalent souris). Deux doigts = pinch-zoom.
  let pinchPrev = null;     // { dist, cx, cy } pendant un pinch en cours

  function getPinchData(touches) {
    const t1 = touches[0], t2 = touches[1];
    const dx = t2.clientX - t1.clientX;
    const dy = t2.clientY - t1.clientY;
    return {
      dist: Math.sqrt(dx * dx + dy * dy),
      cx: (t1.clientX + t2.clientX) / 2,
      cy: (t1.clientY + t2.clientY) / 2,
    };
  }

  canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    if (e.touches.length === 1) {
      const t = e.touches[0];
      pointerDown(t.clientX, t.clientY);
    } else if (e.touches.length === 2) {
      // Démarrage d'un pinch — on annule le drag éventuel
      state.dragging = false;
      pinchPrev = getPinchData(e.touches);
    }
  }, { passive: false });

  canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    if (e.touches.length === 1 && !pinchPrev) {
      const t = e.touches[0];
      pointerMove(t.clientX, t.clientY);
    } else if (e.touches.length === 2) {
      const cur = getPinchData(e.touches);
      if (pinchPrev) {
        const ratio = cur.dist / pinchPrev.dist;
        applyZoom(state.camera.zoom * ratio, cur.cx, cur.cy);
      }
      pinchPrev = cur;
    }
  }, { passive: false });

  canvas.addEventListener('touchend', (e) => {
    if (e.touches.length === 0) {
      pinchPrev = null;
      pointerUp();
    } else if (e.touches.length === 1) {
      // Fin du pinch mais un doigt reste : on évite que ça déclenche un tap
      pinchPrev = null;
      state.dragging = false;
    }
  });

  canvas.addEventListener('touchcancel', () => {
    pinchPrev = null;
    state.dragging = false;
    canvas.classList.remove('grabbing');
  });

  // ─── Clavier ────
  // Flèches = pan ; Échap = annule la sélection ; 1..N = sélectionne un bâtiment
  // dans l'ordre courant de la palette (recalculé à chaque pression pour
  // tenir compte des recherches qui débloquent de nouveaux bâtiments).
  function currentBuildingKeys() {
    return Object.keys(BUILDINGS).filter(isBuildingAvailable);
  }
  document.addEventListener('keydown', (e) => {
    const step = 30;
    if (e.key === 'ArrowUp')    { state.camera.y += step; e.preventDefault(); }
    if (e.key === 'ArrowDown')  { state.camera.y -= step; e.preventDefault(); }
    if (e.key === 'ArrowLeft')  { state.camera.x += step; e.preventDefault(); }
    if (e.key === 'ArrowRight') { state.camera.x -= step; e.preventDefault(); }
    if (e.key === 'Escape') {
      // Si le modal Recherches est ouvert, on le ferme en priorité.
      if (!researchModal.hidden) {
        closeResearchModal();
      } else {
        state.selectedBuilding = null;
        canvas.classList.remove('placing');
        updateHUD();
      }
    }
    // Raccourcis 1..N pour la palette (toggle), dérivés des bâtiments dispos
    const idx = parseInt(e.key, 10) - 1;
    const keys = currentBuildingKeys();
    if (idx >= 0 && idx < keys.length) {
      const k = keys[idx];
      state.selectedBuilding = state.selectedBuilding === k ? null : k;
      canvas.classList.toggle('placing', !!state.selectedBuilding);
      updateHUD();
    }
  });

  // ─── Panneau Recherches ─────────────────────────────────────────
  const researchModal = document.getElementById('research-modal');
  const researchListEl = document.getElementById('research-list');

  function openResearchModal() {
    renderResearchModal();
    researchModal.hidden = false;
  }
  function closeResearchModal() {
    researchModal.hidden = true;
  }

  // Construit la liste des cartes de recherche. Chaque carte a 3 états :
  //   · unlocked   : déjà achetée → badge "ACQUIS"
  //   · locked     : prérequis manquant → opacity réduite + message
  //   · disponible : achetable si crédits suffisants
  function renderResearchModal() {
    let html = '';
    for (const [id, def] of Object.entries(RESEARCH)) {
      const unlocked = state.research.unlocked.includes(id);
      const reqsOk = def.requires.every((q) => state.research.unlocked.includes(q));
      const affordable = state.credits >= def.cost;
      let cls = 'research-card';
      if (unlocked)        cls += ' is-unlocked';
      else if (!reqsOk)    cls += ' is-locked';
      else if (affordable) cls += ' is-affordable';

      let actionHtml = '';
      if (unlocked) {
        actionHtml = '<span class="research-status">✓ Acquis</span>';
      } else if (!reqsOk) {
        const missing = def.requires
          .filter((q) => !state.research.unlocked.includes(q))
          .map((q) => RESEARCH[q].name).join(', ');
        actionHtml = `<span class="research-locked-msg">Prérequis : ${missing}</span>`;
      } else {
        actionHtml = `<button class="research-buy" data-research="${id}" ${affordable ? '' : 'disabled'}>
          Acheter pour ${def.cost} €
        </button>`;
      }

      html += `
        <div class="${cls}">
          <div class="research-card-head">
            <span class="research-card-icon">${def.icon}</span>
            <span class="research-card-name">${def.name}</span>
            <span class="research-card-cost">${def.cost} €</span>
          </div>
          <div class="research-card-desc">${def.desc}</div>
          <div class="research-card-action">${actionHtml}</div>
        </div>`;
    }
    researchListEl.innerHTML = html;
    // Re-bind des boutons d'achat
    researchListEl.querySelectorAll('.research-buy').forEach((btn) => {
      btn.addEventListener('click', () => buyResearch(btn.dataset.research));
    });
  }

  function buyResearch(id) {
    const def = RESEARCH[id];
    if (!def) return;
    if (state.research.unlocked.includes(id)) return;
    if (!def.requires.every((q) => state.research.unlocked.includes(q))) return;
    if (state.credits < def.cost) {
      showToast(`Pas assez de crédits (${def.cost} € requis)`);
      return;
    }
    state.credits -= def.cost;
    state.research.unlocked.push(id);
    showToast(`✓ ${def.name} débloqué !`);
    renderResearchModal();
    updateHUD();
  }

  document.getElementById('research-btn').addEventListener('click', openResearchModal);
  document.getElementById('research-close').addEventListener('click', closeResearchModal);
  // Clic sur le backdrop (mais pas sur le panel) ferme le modal
  researchModal.querySelector('.research-backdrop').addEventListener('click', closeResearchModal);

  // Empêche le menu contextuel sur clic droit (réservé pour usage futur)
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());

  // ─── Boucle principale ──────────────────────────────────────────
  function loop() {
    render();
    requestAnimationFrame(loop);
  }

  // ─── Démarrage ──────────────────────────────────────────────────
  generateGrid();
  centerCamera();
  updateHUD();
  loop();
  setInterval(tick, TICK_MS);

  // Petit log dev pour vérifier le bon démarrage
  console.log('[Iron & Co] Démarré — grille', GRID_SIZE + '×' + GRID_SIZE,
    '— ressources placées :',
    state.tiles.flat().filter((t) => t.type === 'resource').length);
  </script>
</body>
</html>
