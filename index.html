<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Iron & Co — Tycoon isométrique</title>
  <!-- Three.js depuis CDN — utilisé uniquement par le skin "3D Beta".
       Version 0.149.0 : C'EST LA DERNIÈRE qui distribue le build UMD
       `three.min.js` accessible via un simple <script src>. À partir
       de r156 (oct 2023), Three.js ne shipte plus que des ES modules,
       qui nécessitent un <script type="module"> + importmap.
       Si on upgrade un jour, prévoir le passage en module. -->
  <script src="https://unpkg.com/three@0.149.0/build/three.min.js" defer
          onerror="window._threeLoadError = 'unpkg ' + this.src;"></script>
  <style>
    /* ─── Reset minimal + thème ──────────────────────────────────── */
    * { box-sizing: border-box; margin: 0; padding: 0; }

    /* CSS vars — centralise les couleurs et tokens d'espacement pour
       éviter les dérives chromatiques et faciliter le tuning. */
    :root {
      /* Couleurs sémantiques */
      --primary: #ffd166;          /* or — argent, coûts, accent positif */
      --success: #b6e8a3;          /* vert pâle — production, refund */
      --success-bold: #8fbf7d;     /* vert plus saturé — bordures, valides */
      --danger: #ff6b6b;           /* rouge — invalide, plein, dépense */
      --danger-soft: #ff9d9d;      /* rouge tendre — états désactivés, refunds */
      --research: #c084fc;         /* violet — recherches */
      --research-light: #e9d5ff;
      /* Surfaces */
      --bg-panel: rgba(15, 22, 17, 0.92);
      --bg-panel-soft: rgba(15, 22, 17, 0.85);
      --border-soft: rgba(255, 255, 255, 0.08);
      /* Texte */
      --text: #e8e8e8;
      --text-muted: #d0d0d0;       /* relevé de #aaa pour passer WCAG AA */
      --text-faint: rgba(255, 255, 255, 0.7); /* relevé de 0.45 → 0.7 */
    }
    /* Respect prefers-reduced-motion : neutralise les animations pour
       l'accessibilité (vestibular disorders, préférence système). */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #1a1f1a;
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body { user-select: none; }

    /* Canvas plein écran sous le HUD — partagé par les 2 canvas (2D et 3D) */
    #game, #game3d {
      position: absolute;
      inset: 0;
      display: block;
      cursor: grab;
      width: 100%;
      height: 100%;
      /* Empêche les gestes par défaut du navigateur (scroll, pinch-zoom de
         page) — on gère tout nous-mêmes pour le tactile. */
      touch-action: none;
    }
    #game[hidden], #game3d[hidden] { display: none; }
    #game.grabbing    { cursor: grabbing; }
    #game.placing     { cursor: crosshair; }
    #game.demolishing { cursor: not-allowed; }

    /* ─── HUD : couches en overlay ─────────────────────────────── */
    .hud {
      position: absolute;
      pointer-events: none;
      z-index: 10;
    }
    .hud > * { pointer-events: auto; }

    /* Stocks (haut gauche) — env() compense les notches iPhone/Android */
    .stocks {
      top: calc(16px + env(safe-area-inset-top));
      left: calc(16px + env(safe-area-inset-left));
      display: flex; flex-direction: column; gap: 8px;
      max-height: calc(100vh - 220px);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .stock-row {
      display: flex; align-items: center; gap: 10px;
      background: rgba(15, 22, 17, 0.85);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 8px 12px;
      min-width: 180px;
      font-size: 13px;
    }
    .stock-icon {
      width: 18px; height: 18px;
      border-radius: 4px;
      flex-shrink: 0;
      box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.3);
    }
    .stock-name { font-weight: 600; flex: 1; font-size: 12px; }
    .stock-qty {
      font-family: 'Consolas', 'Monaco', monospace;
      font-size: 14px;          /* plus dominant — c'est le chiffre que l'œil cherche */
      font-weight: 700;
      color: var(--primary);
      letter-spacing: -0.01em;
    }
    /* Badge "+1.0/s" ou "-0.5/s" affiché dans la ligne de stock — donne
       un feedback live de la production/consommation, même quand le
       stock courant reste à 0 (vente immédiate). */
    .stock-rate {
      font-family: 'Consolas', monospace;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 6px;
    }
    .stock-rate.is-positive {
      color: #b6e8a3;
      background: rgba(143, 191, 125, 0.15);
    }
    .stock-rate.is-negative {
      color: #ffb088;
      background: rgba(239, 108, 74, 0.18);
    }

    /* Crédits (haut droite) */
    .credits {
      top: calc(16px + env(safe-area-inset-top));
      right: calc(16px + env(safe-area-inset-right));
      background: rgba(15, 22, 17, 0.85);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 209, 102, 0.3);
      border-radius: 12px;
      padding: 12px 18px;
      text-align: right;
      min-width: 200px;
    }
    .credits-value {
      /* Augmenté de 28→32px : c'est LA stat qui doit dominer le HUD
         (hiérarchie tycoon classique — le solde au-dessus de tout). */
      font-size: 32px;
      font-weight: 800;
      color: var(--primary);
      letter-spacing: -0.02em;
      line-height: 1;
      text-shadow: 0 2px 12px rgba(255, 209, 102, 0.18);
    }
    .credits-rate {
      margin-top: 4px;
      font-size: 13px;
      color: var(--success);
      font-weight: 600;
      font-family: 'Consolas', monospace;
    }
    .credits-energy {
      margin-top: 6px;
      font-size: 12px;
      color: var(--text-muted);
      font-family: 'Consolas', monospace;
      display: flex;
      align-items: center;
      gap: 6px;
      justify-content: flex-end;
    }
    .credits-energy.low { color: var(--danger); font-weight: 700; }
    /* Mini-bar visuelle pour l'énergie : remplace le simple "X / Y" par
       une jauge dégradée → l'utilisateur capte le ratio sans lire les
       chiffres. Largeur 60px à droite du texte. */
    .energy-bar {
      width: 60px;
      height: 6px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 3px;
      overflow: hidden;
      position: relative;
    }
    .energy-bar-fill {
      position: absolute;
      inset: 0;
      width: var(--ratio, 0%);
      background: linear-gradient(90deg, var(--success-bold) 0%, var(--primary) 70%, var(--danger) 100%);
      border-radius: 3px;
      transition: width 0.25s ease;
    }
    .credits-energy.low .energy-bar-fill {
      /* À surchauffe (>100%), on ferme à 100% mais on signale en pulsant */
      animation: energy-bar-overflow-pulse 0.9s ease-in-out infinite;
    }
    @keyframes energy-bar-overflow-pulse {
      0%, 100% { filter: brightness(1); }
      50%      { filter: brightness(1.4) saturate(1.3); }
    }

    /* Palette de bâtiments (bas centre) — scrollable horizontalement
       sur mobile pour ne jamais déborder du viewport. */
    .palette {
      bottom: calc(16px + env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      display: flex; gap: 6px;
      max-width: calc(100vw - 32px);
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      background: rgba(15, 22, 17, 0.92);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 6px;
    }
    .palette::-webkit-scrollbar { display: none; }
    .palette-btn {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      background: transparent;
      border: 2px solid transparent;
      border-radius: 10px;
      padding: 10px 14px;
      color: #e8e8e8;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
      min-width: 88px;
      min-height: 64px;          /* assure une cible tactile ≥ 44pt même avec icon+labels compacts */
      flex-shrink: 0;
      font-family: inherit;
    }
    .palette-btn:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.05);
    }
    .palette-btn.active {
      background: rgba(143, 191, 125, 0.15);
      border-color: #8fbf7d;
    }
    .palette-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .palette-btn-icon { font-size: 22px; line-height: 1; }
    .palette-btn-name { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
    .palette-btn-cost { font-size: 11px; color: var(--primary); font-family: 'Consolas', monospace; }
    /* Info production/consommation always-on — renseigne le joueur sur
       ce que le bâtiment fait sans devoir consulter une doc externe. */
    .palette-btn-info {
      font-size: 9px;
      color: var(--text-faint);
      font-family: 'Consolas', monospace;
      letter-spacing: 0.02em;
      max-width: 100px;
      text-align: center;
      line-height: 1.25;
      margin-top: 2px;
    }
    /* Démolir : style rouge pour bien le distinguer des bâtiments à poser */
    .palette-btn-demolish .palette-btn-cost { color: var(--success); }
    .palette-btn-demolish.active {
      background: rgba(255, 107, 107, 0.18);
      border-color: var(--danger);
    }
    .palette-btn-demolish.active .palette-btn-name { color: var(--danger-soft); }

    /* Pulse subtil sur le bâtiment sélectionné — clarifie le mode actif */
    @keyframes palette-active-pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(143, 191, 125, 0.0); }
      50%      { box-shadow: 0 0 0 3px rgba(143, 191, 125, 0.35); }
    }
    .palette-btn.active:not(.palette-btn-demolish) {
      animation: palette-active-pulse 1.4s ease-in-out infinite;
    }
    @keyframes palette-active-pulse-red {
      0%, 100% { box-shadow: 0 0 0 0 rgba(255, 107, 107, 0.0); }
      50%      { box-shadow: 0 0 0 3px rgba(255, 107, 107, 0.4); }
    }
    .palette-btn-demolish.active {
      animation: palette-active-pulse-red 1.4s ease-in-out infinite;
    }

    /* Bouton recherches (bas droite). pointer-events: auto explicite car
       l'élément a la classe `.hud` (pointer-events: none) mais n'est pas
       un enfant de `.hud` — la règle `.hud > *` ne le réactive donc pas. */
    .research-btn {
      bottom: calc(16px + env(safe-area-inset-bottom));
      right: calc(16px + env(safe-area-inset-right));
      pointer-events: auto;
      background: rgba(15, 22, 17, 0.92);
      border: 1px solid rgba(192, 132, 252, 0.4);
      border-radius: 12px;
      padding: 12px 18px;
      color: #c084fc;
      cursor: pointer;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      min-height: 44px;
      display: flex; align-items: center; gap: 8px;
    }
    .research-btn:hover { background: rgba(192, 132, 252, 0.1); }

    /* Bouton Prestige — au-dessus du bouton Recherches. Or pulsé pour
       attirer l'œil quand l'opportunité de prestige est dispo. */
    .prestige-btn {
      bottom: calc(72px + env(safe-area-inset-bottom));
      right: calc(16px + env(safe-area-inset-right));
      pointer-events: auto;
      background: linear-gradient(180deg, rgba(255, 209, 102, 0.18) 0%, rgba(255, 209, 102, 0.06) 100%);
      border: 1px solid var(--primary);
      border-radius: 12px;
      padding: 12px 18px;
      color: var(--primary);
      cursor: pointer;
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      min-height: 44px;
      display: flex; align-items: center; gap: 8px;
      animation: prestige-btn-pulse 1.6s ease-in-out infinite;
      box-shadow: 0 8px 24px -8px rgba(255, 209, 102, 0.4);
    }
    .prestige-btn:hover { filter: brightness(1.15); }
    .prestige-btn[hidden] { display: none; }
    @keyframes prestige-btn-pulse {
      0%, 100% { box-shadow: 0 8px 20px -8px rgba(255, 209, 102, 0.35); }
      50%      { box-shadow: 0 8px 32px -4px rgba(255, 209, 102, 0.7); }
    }
    /* Indicateur permanent du multiplicateur de prestige dans le HUD crédits. */
    .credits-prestige {
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px solid rgba(255, 209, 102, 0.15);
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      font-family: 'Consolas', monospace;
      font-size: 12px;
      color: var(--primary);
      font-weight: 700;
    }
    .credits-prestige[hidden] { display: none; }
    .credits-prestige-mult { color: var(--success); }

    /* Aide en bas (raccourcis clavier/souris) — masquée sur mobile pour
       laisser de la place. Le user mobile la découvrira via les gestes. */
    .help-text {
      bottom: calc(110px + env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      font-size: 12px;                 /* 11→12 lisibilité */
      color: var(--text-faint);        /* alpha 0.45→0.7 — passe WCAG AA */
      text-align: center;
      pointer-events: none;
      white-space: nowrap;
    }
    @media (max-width: 720px) {
      .help-text { display: none; }
    }

    /* Indication visuelle sur les stocks proches du cap */
    /* Le qty est doré par défaut → "is-near" doit ressortir avec une teinte
       orangée plus chaude, et "is-full" en rouge franc. */
    .stock-row.is-near .stock-qty { color: #ffa94d; }
    .stock-row.is-full .stock-qty { color: var(--danger); }
    .stock-row.is-full {
      border-color: rgba(255, 107, 107, 0.4);
      box-shadow: 0 0 12px rgba(255, 107, 107, 0.15);
    }

    /* Le bouton Recherches pulse quand au moins une techno est achetable */
    .research-btn.has-affordable {
      animation: research-pulse 1.6s ease-in-out infinite;
      border-color: #c084fc;
    }
    @keyframes research-pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(192, 132, 252, 0); }
      50%      { box-shadow: 0 0 16px 0 rgba(192, 132, 252, 0.55); }
    }

    /* Modal Recherches — overlay plein écran avec backdrop flouté */
    .research-modal {
      position: fixed; inset: 0; z-index: 50;
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
    }
    .research-modal[hidden] { display: none; }
    .research-backdrop {
      position: absolute; inset: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
    }
    .research-panel {
      position: relative;
      width: min(560px, 100%);
      max-height: calc(100vh - 40px);
      display: flex; flex-direction: column;
      background: linear-gradient(180deg, #1a221c 0%, #10160f 100%);
      border: 1px solid rgba(192, 132, 252, 0.25);
      border-radius: 16px;
      box-shadow: 0 20px 60px -10px rgba(0, 0, 0, 0.7),
                  0 0 30px rgba(192, 132, 252, 0.15);
      overflow: hidden;
    }
    .research-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 16px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      flex-shrink: 0;          /* sticky : ne se rétrécit jamais avec la liste */
    }
    .research-header h2 {
      font-size: 18px; font-weight: 700; color: #c084fc;
    }
    .research-close {
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, 0.55);
      cursor: pointer;
      width: 40px; height: 40px;     /* ≥ 44pt tactile : un peu sous mais centré dans header */
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s, color 0.15s;
    }
    .research-close:hover { background: rgba(255, 255, 255, 0.08); color: #fff; }
    .research-list {
      padding: 16px;
      overflow-y: auto;
      flex: 1 1 auto;          /* prend l'espace restant entre header/footer */
      min-height: 0;           /* nécessaire pour que overflow-y fonctionne en flex column */
      display: flex; flex-direction: column; gap: 12px;
    }
    /* Footer du modal Recherches — héberge l'action destructive (reset).
       Volontairement caché ici plutôt que dans le HUD principal pour éviter
       un clic accidentel. */
    .research-footer {
      padding: 12px 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      display: flex; justify-content: center;
      flex-shrink: 0;          /* sticky : reste collé en bas même si la liste scrolle */
    }
    .research-reset {
      padding: 8px 16px;
      background: transparent;
      border: 1px solid rgba(255, 107, 107, 0.4);
      border-radius: 8px;
      color: #ff9d9d;
      font-family: inherit;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .research-reset:hover { background: rgba(255, 107, 107, 0.12); color: #ffb6b6; }
    .research-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 14px;
      display: flex; flex-direction: column; gap: 8px;
      transition: border-color 0.15s, background 0.15s;
    }
    .research-card.is-affordable { border-color: rgba(192, 132, 252, 0.5); }
    .research-card.is-unlocked {
      border-color: rgba(143, 191, 125, 0.4);
      background: rgba(143, 191, 125, 0.05);
    }
    .research-card.is-locked { opacity: 0.55; }
    .research-card-head {
      display: flex; align-items: center; gap: 10px;
    }
    .research-card-icon { font-size: 22px; }
    .research-card-name { font-size: 14px; font-weight: 700; flex: 1; }
    .research-card-cost {
      font-family: 'Consolas', monospace;
      font-size: 13px;
      color: #ffd166;
    }
    .research-card-desc {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.85);   /* 0.65→0.85 contraste suffisant */
      line-height: 1.5;                    /* 1.4→1.5 plus aéré */
    }
    .research-card-action {
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px;
      margin-top: 4px;
    }
    .research-buy {
      flex: 1;
      padding: 10px 14px;
      background: linear-gradient(180deg, rgba(192, 132, 252, 0.2) 0%, rgba(192, 132, 252, 0.05) 100%);
      border: 1px solid #c084fc;
      border-radius: 8px;
      color: #e9d5ff;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: filter 0.15s;
    }
    .research-buy:hover:not(:disabled) { filter: brightness(1.2); }
    .research-buy:disabled {
      opacity: 0.4; cursor: not-allowed;
      background: rgba(255, 255, 255, 0.04);
      border-color: rgba(255, 255, 255, 0.1);
      color: rgba(255, 255, 255, 0.5);
    }
    .research-status {
      font-size: 11px;
      color: #8fbf7d;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .research-locked-msg {
      font-size: 12px;                  /* 11→12 lisibilité */
      color: var(--text-faint);         /* 0.45→0.7 WCAG AA */
      font-style: italic;
    }

    /* Bannière énergie insuffisante — positionnée SOUS le panneau crédits
       (qui fait ~86 px de haut + 16 px d'offset) pour ne pas le masquer
       au moment où le joueur en a le plus besoin pour décider quoi démolir. */
    .energy-warning {
      top: calc(112px + env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      max-width: calc(100vw - 32px);
      background: linear-gradient(180deg, rgba(255, 107, 107, 0.92) 0%, rgba(180, 60, 60, 0.92) 100%);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 10px;
      padding: 10px 18px;
      font-size: 13px;
      font-weight: 600;
      text-align: center;
      box-shadow: 0 8px 24px -4px rgba(255, 107, 107, 0.4);
      animation: energy-warn-pulse 1.6s ease-in-out infinite;
      pointer-events: none;
      z-index: 20;
    }
    .energy-warning[hidden] { display: none; }
    @keyframes energy-warn-pulse {
      0%, 100% { transform: translateX(-50%) scale(1); }
      50%      { transform: translateX(-50%) scale(1.03); }
    }

    /* Toast info (bas, après une action invalide par ex.) */
    .toast {
      top: 80px; left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 22, 17, 0.95);
      border: 1px solid #ff6b6b;
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 13px;
      color: #ff6b6b;
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
    }
    .toast.show { opacity: 1; }

    /* ─── Active states (clic enfoncé) ─────────────────────────────
       Les agents UI ont remonté l'absence totale de feedback :active —
       un clic sur un bouton n'avait aucune réponse visuelle, ni desktop
       ni tactile. Maintenant tous les boutons réagissent au press. */
    .palette-btn:active:not(:disabled) {
      transform: scale(0.96);
      transition: transform 0.05s ease;
    }
    .research-btn:active,
    .research-buy:active:not(:disabled),
    .research-close:active,
    .research-reset:active {
      filter: brightness(0.85);
      transition: filter 0.05s ease;
    }

    /* ─── Focus-visible (accessibilité clavier) ────────────────────
       Important pour navigation tab/Enter et lecteurs d'écran.
       (Pas de border-radius: inherit — ça écrasait la border-radius
       propre des boutons. Les navigateurs modernes suivent déjà la
       courbure du bouton avec l'outline.) */
    button:focus-visible,
    a:focus-visible {
      outline: 2px solid var(--research);
      outline-offset: 2px;
    }

    /* ─── Animation d'apparition du modal Recherches ───────────────
       Avant : hidden → visible binaire, choc visuel. Maintenant : fade
       + scale subtil, plus "polished". L'attribut [hidden] reste la
       source de vérité ; la classe .closing déclenche la sortie. */
    @keyframes modal-fade-in {
      from { opacity: 0; transform: scale(0.96); }
      to   { opacity: 1; transform: scale(1); }
    }
    @keyframes modal-fade-out {
      from { opacity: 1; transform: scale(1); }
      to   { opacity: 0; transform: scale(0.96); }
    }
    .research-modal:not([hidden]):not(.closing) .research-panel,
    .research-modal:not([hidden]):not(.closing) .research-backdrop {
      animation: modal-fade-in 0.22s ease-out;
    }
    .research-modal.closing .research-panel,
    .research-modal.closing .research-backdrop {
      animation: modal-fade-out 0.18s ease-in;
    }

    /* ─── Affordance de scroll horizontal sur la palette ───────────
       Sur mobile la palette déborde et le scroll-x est invisible :
       on fade les bords pour suggérer "il y a plus à voir". Sur desktop
       large où la palette ne déborde pas, on ne l'applique pas — sinon
       les boutons d'extrémité seraient fadés sans raison. */
    @media (max-width: 720px) {
      .palette {
        mask-image: linear-gradient(90deg,
          transparent 0,
          #000 20px,
          #000 calc(100% - 20px),
          transparent 100%
        );
        -webkit-mask-image: linear-gradient(90deg,
          transparent 0,
          #000 20px,
          #000 calc(100% - 20px),
          transparent 100%
        );
      }
    }

    /* ─── Compaction écrans étroits (iPhone SE 375 px) ─────────────
       Sans ça, .credits (200 px) + .stocks (180 px) > viewport et se
       chevauchent sur petit écran. */
    /* ═══════════════════════════════════════════════════════════════
       TAB BAR + NOUVELLES FEATURES (speed, minimap, tooltip)
       ═══════════════════════════════════════════════════════════════ */
    .theme-tabs {
      position: absolute;
      top: calc(8px + env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 2px;
      background: var(--bg-panel);
      border: 1px solid var(--border-soft);
      border-radius: 999px;
      padding: 4px;
      z-index: 30;
      pointer-events: auto;
    }
    .theme-tab {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      letter-spacing: 0.04em;
    }
    .theme-tab:hover { color: var(--text); }
    .theme-tab[aria-pressed="true"] {
      background: var(--primary);
      color: #1a1f1a;
    }

    /* Speed controls — pause / 1× / 2× / 4× */
    .speed-ctrl {
      top: calc(8px + env(safe-area-inset-top));
      left: calc(16px + env(safe-area-inset-left));
      display: flex;
      gap: 2px;
      background: var(--bg-panel);
      border: 1px solid var(--border-soft);
      border-radius: 10px;
      padding: 4px;
      pointer-events: auto;
    }
    .speed-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-family: 'Consolas', monospace;
      font-size: 13px;
      font-weight: 700;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      min-width: 32px;
      transition: background 0.12s, color 0.12s;
    }
    .speed-btn:hover { background: rgba(255,255,255,0.06); color: var(--text); }
    .speed-btn.active {
      background: var(--success);
      color: #1a1f1a;
    }
    .speed-btn[data-speed="0"].active { background: var(--danger-soft); }
    .speed-btn[data-speed="2"].active { background: var(--primary); }
    .speed-btn[data-speed="4"].active { background: var(--danger); color: #fff; }

    /* Contrôles caméra 3D — visibles uniquement quand state.theme === '3d'.
       Position : à droite des speed controls, en haut à gauche. */
    .cam3d-ctrl {
      top: calc(56px + env(safe-area-inset-top));
      left: calc(16px + env(safe-area-inset-left));
      display: flex;
      gap: 2px;
      background: var(--bg-panel);
      border: 1px solid var(--border-soft);
      border-radius: 10px;
      padding: 4px;
      pointer-events: auto;
    }
    .cam3d-ctrl[hidden] { display: none; }
    .cam3d-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      min-width: 32px;
      transition: background 0.12s, color 0.12s;
    }
    .cam3d-btn:hover { background: rgba(255,255,255,0.06); color: var(--text); }
    .cam3d-btn:active { background: rgba(255, 209, 102, 0.2); }

    /* Mini-map */
    .minimap {
      bottom: calc(110px + env(safe-area-inset-bottom));
      left: calc(16px + env(safe-area-inset-left));
      background: rgba(15, 22, 17, 0.92);
      border: 1px solid var(--border-soft);
      border-radius: 8px;
      cursor: pointer;
      pointer-events: auto;
      box-shadow: 0 4px 12px -4px rgba(0,0,0,0.5);
    }

    /* Tooltip bâtiment au hover */
    .building-tooltip {
      position: absolute;
      pointer-events: none;
      background: rgba(15, 22, 17, 0.96);
      border: 1px solid var(--border-soft);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 12px;
      line-height: 1.5;
      max-width: 220px;
      box-shadow: 0 8px 24px -8px rgba(0,0,0,0.6);
      z-index: 25;
      transform: translate(-50%, -100%);
      transition: opacity 0.12s;
    }
    .building-tooltip[hidden] { display: none; }
    .building-tooltip-title {
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 4px;
      display: flex; align-items: center; gap: 6px;
    }
    .building-tooltip-row {
      display: flex; justify-content: space-between;
      gap: 12px;
      font-family: 'Consolas', monospace;
      color: var(--text-muted);
    }
    .building-tooltip-row.is-pos { color: var(--success); }
    .building-tooltip-row.is-neg { color: var(--danger-soft); }

    /* ═══════════════════════════════════════════════════════════════
       SKIN "NÉO" — refonte complète de l'UI avec palette cyberpunk,
       angles géométriques, scanlines, fonts monospace.
       Gameplay strictement identique au skin classique.
       ═══════════════════════════════════════════════════════════════ */
    body.theme-neo {
      --primary: #00ffaa;
      --success: #22ffcc;
      --success-bold: #00cc88;
      --danger: #ff2266;
      --danger-soft: #ff5588;
      --research: #ff44ff;
      --research-light: #ffaaff;
      --bg-panel: rgba(5, 8, 19, 0.94);
      --bg-panel-soft: rgba(5, 8, 19, 0.85);
      --border-soft: rgba(0, 255, 170, 0.25);
      --text: #ddffee;
      --text-muted: #88ccaa;
      --text-faint: rgba(0, 255, 170, 0.55);
      background: #050813;
      font-family: 'Consolas', 'Monaco', monospace;
    }
    /* Effet scanlines superposé — inspiré CRT / cyberpunk */
    body.theme-neo::before {
      content: '';
      position: fixed; inset: 0;
      pointer-events: none;
      background:
        repeating-linear-gradient(
          0deg,
          transparent 0,
          transparent 3px,
          rgba(0, 255, 170, 0.03) 3px,
          rgba(0, 255, 170, 0.03) 4px
        );
      z-index: 100;
      mix-blend-mode: overlay;
    }
    /* Grille de fond subtile */
    body.theme-neo {
      background-image:
        linear-gradient(rgba(0, 255, 170, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 255, 170, 0.04) 1px, transparent 1px);
      background-size: 40px 40px;
    }
    /* Panneaux : clip-path angulaire (coins coupés) + glow */
    body.theme-neo .credits,
    body.theme-neo .stock-row,
    body.theme-neo .palette,
    body.theme-neo .speed-ctrl,
    body.theme-neo .research-btn,
    body.theme-neo .prestige-btn,
    body.theme-neo .theme-tabs,
    body.theme-neo .minimap,
    body.theme-neo .building-tooltip,
    body.theme-neo .energy-warning {
      clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
      border-radius: 0 !important;
      box-shadow:
        0 0 12px rgba(0, 255, 170, 0.15),
        inset 0 0 16px rgba(0, 255, 170, 0.05);
    }
    body.theme-neo .credits-value {
      background: linear-gradient(180deg, #00ffaa 0%, #00cc88 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 8px rgba(0, 255, 170, 0.5));
      font-family: 'Consolas', monospace;
      letter-spacing: 0.04em;
    }
    body.theme-neo .credits-rate { text-shadow: 0 0 6px rgba(34, 255, 204, 0.6); }
    body.theme-neo .stock-icon {
      box-shadow: 0 0 6px currentColor;
      border: 1px solid rgba(0, 255, 170, 0.4);
    }
    body.theme-neo .palette-btn.active {
      box-shadow: 0 0 12px var(--primary), inset 0 0 12px rgba(0, 255, 170, 0.2);
    }
    body.theme-neo .palette-btn-icon { filter: hue-rotate(120deg) saturate(1.4); }
    /* Bouton tab actif en néo */
    body.theme-neo .theme-tab[aria-pressed="true"] {
      background: var(--primary);
      color: #050813;
      text-shadow: none;
      box-shadow: 0 0 12px var(--primary);
    }
    /* Scanlines réduites pour reduced-motion */
    @media (prefers-reduced-motion: reduce) {
      body.theme-neo::before { display: none; }
    }

    @media (max-width: 400px) {
      .credits {
        min-width: 150px;
        padding: 10px 14px;
      }
      .credits-value { font-size: 26px; }
      .stock-row {
        min-width: 150px;
        padding: 7px 10px;
        font-size: 12px;
      }
      .palette-btn { min-width: 76px; padding: 8px 10px; }
      /* Sur petit écran, le bouton Recherches était quasi-collé à la
         palette → mis-tap risque. On le remonte au-dessus de la palette. */
      .research-btn {
        bottom: calc(100px + env(safe-area-inset-bottom));
        padding: 8px 12px;
        font-size: 12px;
      }
      /* Prestige doit rester au-dessus de Recherches sur mobile (la palette
         remonte à ~96 px ce qui chevauchait l'ancien bottom: 72 px). */
      .prestige-btn {
        bottom: calc(156px + env(safe-area-inset-bottom));
        padding: 8px 12px;
        font-size: 12px;
      }
      /* Mini-map cachée sur très petit écran : elle se confondait avec
         la map principale (les 2 vues iso côte à côte). Sur grand écran
         elle reste utile, sur mobile c'est de la pollution visuelle. */
      .minimap { display: none; }
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <!-- Tab bar global : switch entre deux skins UI complètement différents
       (Classique / Néo). Le state du jeu est partagé : seule la couche
       de rendu HTML/CSS change. -->
  <nav class="theme-tabs" id="theme-tabs" aria-label="Skin de l'interface">
    <button class="theme-tab" data-theme="classic" aria-pressed="true">▮ Classique</button>
    <button class="theme-tab" data-theme="neo" aria-pressed="false">▰ Néo</button>
    <button class="theme-tab" data-theme="3d" aria-pressed="false">▼ 3D Beta</button>
  </nav>

  <!-- Canvas WebGL pour le skin 3D. Caché par défaut (montré seulement
       quand state.theme === '3d'). Initialisé à la demande pour ne pas
       payer le coût Three.js si le user reste en 2D. -->
  <canvas id="game3d" hidden></canvas>

  <!-- Contrôles spécifiques à la 3D : rotation + tilt. Visibles uniquement
       en mode 3D. -->
  <div class="hud cam3d-ctrl" id="cam3d-ctrl" hidden aria-label="Contrôles caméra 3D">
    <button class="cam3d-btn" data-cam="rot-l" title="Tourner à gauche">↺</button>
    <button class="cam3d-btn" data-cam="rot-r" title="Tourner à droite">↻</button>
    <button class="cam3d-btn" data-cam="tilt-u" title="Pencher vers le haut">▲</button>
    <button class="cam3d-btn" data-cam="tilt-d" title="Pencher vers le bas">▼</button>
    <button class="cam3d-btn" data-cam="reset" title="Vue par défaut">⌂</button>
  </div>

  <!-- HUD : tout en HTML overlay pour rester simple à mettre à jour -->
  <div class="hud stocks" id="stocks"></div>

  <div class="hud credits">
    <div class="credits-value" id="credits-value">200 €</div>
    <div class="credits-rate" id="credits-rate">+ 0 €/s</div>
    <div class="credits-energy" id="credits-energy">
      <span id="credits-energy-text">⚡ 0 / 5</span>
      <span class="energy-bar"><span class="energy-bar-fill" id="credits-energy-bar"></span></span>
    </div>
    <!-- Affiché seulement si prestige.tokens > 0. Indicateur permanent
         du bonus actuel — rappelle au joueur la valeur de ses runs précédents. -->
    <div class="credits-prestige" id="credits-prestige" hidden>
      <span>💎 <span id="credits-prestige-count">0</span></span>
      <span class="credits-prestige-mult" id="credits-prestige-mult">×1.00</span>
    </div>
  </div>

  <div class="hud help-text">
    Glisser : déplacer la caméra • Molette / pincer : zoom • Touches 1-5 : bâtiment • D : démolir • Échap : annuler
  </div>

  <div class="hud palette" id="palette"></div>

  <button class="hud research-btn" id="research-btn" title="Ouvrir le panneau Recherches">🔬 Recherches</button>

  <!-- Contrôles de vitesse — pause / 1× / 2× / 4×. Le tick interval
       du setInterval se reconfigure à chaque clic. La vitesse est
       persistée dans la save. -->
  <div class="hud speed-ctrl" id="speed-ctrl" aria-label="Vitesse de jeu">
    <button class="speed-btn" data-speed="0" title="Pause">⏸</button>
    <button class="speed-btn active" data-speed="1" title="Vitesse normale">1×</button>
    <button class="speed-btn" data-speed="2" title="Vitesse ×2">2×</button>
    <button class="speed-btn" data-speed="4" title="Vitesse ×4">4×</button>
  </div>

  <!-- Mini-map en bas-gauche (au-dessus des stocks). Sur tactile, un
       tap dessus recentre la caméra sur la zone correspondante. -->
  <canvas class="hud minimap" id="minimap" width="160" height="100" aria-label="Mini-carte"></canvas>

  <!-- Tooltip flottant qui apparaît au hover/tap d'un bâtiment.
       Position calculée en JS pour suivre le curseur. -->
  <div class="hud building-tooltip" id="building-tooltip" hidden></div>
  <!-- Bouton Prestige — caché tant qu'on n'a pas atteint le seuil. Apparaît
       en pulsant pour signaler l'opportunité de méta-progression. -->
  <button class="hud prestige-btn" id="prestige-btn" hidden title="Effectuer un prestige : reset contre bonus permanent">💎 Prestige</button>

  <!-- Avertissement plein-écran quand l'énergie est insuffisante.
       Sans ça, le joueur peut spammer des extracteurs sans s'en rendre compte
       et finir bloqué (rien ne tourne, plus assez de crédits pour un générateur). -->
  <div class="hud energy-warning" id="energy-warning" hidden>
    ⚠ Énergie insuffisante — construis des Générateurs ou démolis des bâtiments
  </div>

  <!-- Modal Recherches (caché par défaut). Construit dynamiquement par updateResearchModal(). -->
  <div class="research-modal" id="research-modal" hidden>
    <div class="research-backdrop"></div>
    <div class="research-panel" role="dialog" aria-labelledby="research-title">
      <header class="research-header">
        <h2 id="research-title">🔬 Recherches</h2>
        <button class="research-close" id="research-close" aria-label="Fermer">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
            <path d="M6 6l12 12M18 6L6 18"/>
          </svg>
        </button>
      </header>
      <div class="research-list" id="research-list"></div>
      <footer class="research-footer">
        <button class="research-reset" id="reset-btn" title="Effacer la sauvegarde et recommencer">
          🔄 Réinitialiser la partie
        </button>
      </footer>
    </div>
  </div>

  <div class="hud toast" id="toast"></div>

  <script>
  'use strict';

  /* ════════════════════════════════════════════════════════════════
     IRON & CO — Tycoon isométrique en un seul fichier.
     Inspiré de Satisfactory : pose des extracteurs sur des gisements,
     produit des ressources, vend automatiquement contre des crédits.
     V1 : grille statique 20×20, 3 types de bâtiments, vente auto.
     ════════════════════════════════════════════════════════════════ */

  // ─── Constantes de jeu ──────────────────────────────────────────
  const TILE_W = 64;          // largeur d'une tuile iso (px)
  const TILE_H = 32;          // hauteur d'une tuile iso (ratio 2:1)
  // Taille de grille — démarre à 20×20, augmente à chaque prestige selon la
  // formule `gridSizeFor(totalPrestiges)`. Persisté dans la save sous
  // state.gridSize. C'est `let` (pas `const`) parce qu'on doit pouvoir
  // l'augmenter dynamiquement quand un prestige est effectué.
  let GRID_SIZE = 20;
  function gridSizeFor(prestiges) {
    // Min 20, +8 par prestige, plafond 60. Donne : 20, 28, 36, 44, 52, 60.
    // Cap pour éviter d'avoir 100×100 = 10 000 tuiles qui font ramer.
    return Math.max(20, Math.min(60, 20 + 8 * (prestiges || 0)));
  }
  const RESOURCE_DENSITY = 0.18; // ~18% des tuiles ont une ressource
  const TICK_MS = 1000;       // boucle de production = 1 tick/s
  // Taux de vente auto par ressource. Volontairement bas : avec 1 extracteur
  // qui produit 1 u/s, le 1er stock se draine ; à partir du 3e extracteur
  // d'une même ressource, le stock monte → l'entrepôt devient utile.
  const SELL_RATE_PER_TICK = 2;
  const MIN_ZOOM = 0.5;
  const MAX_ZOOM = 2;

  // ─── Définitions des ressources ─────────────────────────────────
  // `basic: true` → ressource brute extractible sur la map ; sinon =
  // ressource crafted (apparaît dans les recettes). Les crafted ne sont
  // affichées dans le HUD qu'une fois la techno correspondante débloquée.
  // ─── Définitions des ressources ─────────────────────────────────
  // `basic: true` → ressource brute extractible sur la map ; sinon =
  // ressource crafted (apparaît dans les recettes).
  // `spawnWeight` (basic only) : poids relatif dans le tirage aléatoire à
  //   la génération de carte. Plus c'est haut, plus c'est commun.
  // `prodRate` (basic only) : unités/seconde extraites par un extracteur.
  //   Volontairement décroissant avec la valeur — sinon l'extracteur de
  //   cuivre (2 €) serait toujours strictement meilleur que celui de fer
  //   (1 €) pour le même coût. Maintenant : fer rapide+commun, cuivre
  //   lent+rare. €/s par extracteur reste comparable, mais le gameplay
  //   devient stratégique (chercher les rares gisements de cuivre).
  const RESOURCES = {
    fer:       { name: 'Fer',       short: 'FE', color: '#a86a3c', price: 1.0,    basic: true,  spawnWeight: 50, prodRate: 1.0 },
    cuivre:    { name: 'Cuivre',    short: 'CU', color: '#d97e2a', price: 2.0,    basic: true,  spawnWeight: 20, prodRate: 0.6 },
    charbon:   { name: 'Charbon',   short: 'CH', color: '#3d3d3d', price: 1.5,    basic: true,  spawnWeight: 30, prodRate: 0.8 },
    lingot:    { name: 'Lingot',    short: 'LI', color: '#b6c0d4', price: 8.0   },
    piece:     { name: 'Pièce',     short: 'PI', color: '#9aaab8', price: 50.0  },
    composant: { name: 'Composant', short: 'CP', color: '#6db8a8', price: 250.0 },
    module:    { name: 'Module',    short: 'MO', color: '#d4a86a', price: 2000.0 },
  };

  // ─── Définitions des bâtiments ──────────────────────────────────
  // `requiresResource` : ne peut être posé que sur une tuile ressource
  // `energyUsage`      : consomme N énergie/tick (si pas assez → bloqué)
  // `energyProduction` : ajoute N énergie au pool global
  // `storage`          : ajoute N à la capacité de stockage
  // `recipe`           : { input: {res:n}, output: 'res', qty, cycleMs }
  // `locked`           : true → masqué de la palette tant que la recherche
  //                      correspondante n'est pas complétée
  const BUILDINGS = {
    extracteur: {
      name: 'Extracteur', icon: '⛏️', cost: 50, color: '#a06848',
      requiresResource: true, energyUsage: 1, productionPerTick: 1,
      info: 'Sur minerai · vitesse selon ressource · 1⚡',
    },
    entrepot: {
      name: 'Entrepôt',   icon: '📦', cost: 100, color: '#8b6f47',
      storage: 100,
      info: '+100 capacité',
    },
    generateur: {
      name: 'Générateur', icon: '⚡', cost: 75, color: '#ffd166',
      energyProduction: 10,
      info: '+10⚡',
    },
    fonderie: {
      name: 'Fonderie',   icon: '🏭', cost: 200, color: '#ef6c4a',
      energyUsage: 2, locked: true,
      recipe: { input: { fer: 1, charbon: 1 }, output: 'lingot', qty: 1, cycleMs: 2000 },
      info: 'Fer+Charbon → Lingot · 2s · 2⚡',
    },
    assembleur: {
      // Bronze chaud — cohérent avec la palette industrielle "vert/brun/or"
      // au lieu du violet précédent qui détonnait (audit 10 agents).
      name: 'Assembleur', icon: '⚙️', cost: 400, color: '#b89060',
      energyUsage: 3, locked: true,
      recipe: { input: { lingot: 2, cuivre: 1 }, output: 'piece', qty: 1, cycleMs: 3000 },
      info: '2 Lingot+Cuivre → Pièce · 3s · 3⚡',
    },
    atelier: {
      // Tier 3 — assemble les pièces et lingots en composants à 250 €
      name: 'Atelier', icon: '🔧', cost: 1200, color: '#6db8a8',
      energyUsage: 5, locked: true,
      recipe: { input: { piece: 1, lingot: 2 }, output: 'composant', qty: 1, cycleMs: 5000 },
      info: 'Pièce+2 Lingot → Composant · 5s · 5⚡',
    },
    usine: {
      // Tier 4 — fin de chaîne, modules à 2 000 € pièce. Énorme ROI.
      name: 'Usine', icon: '🏗️', cost: 4000, color: '#d4a86a',
      energyUsage: 8, locked: true,
      recipe: { input: { composant: 2, cuivre: 3 }, output: 'module', qty: 1, cycleMs: 8000 },
      info: '2 Composant+3 Cuivre → Module · 8s · 8⚡',
    },
  };

  // ─── Recherches ─────────────────────────────────────────────────
  // Achat instantané (pas de timer pour V1). Chaque techno débloque un ou
  // plusieurs bâtiments + révèle de nouvelles ressources dans le HUD.
  const RESEARCH = {
    // ── Tiers de matériaux (déblocages de bâtiments) ──
    metallurgie: {
      name: 'Métallurgie', icon: '🔥', cost: 500,
      desc: 'Débloque la Fonderie : transforme Fer + Charbon en Lingot (×8 €).',
      requires: [], unlocks: ['fonderie'], reveals: ['lingot'],
    },
    mecanique: {
      name: 'Mécanique de précision', icon: '🛠️', cost: 1500,
      desc: 'Débloque l\'Assembleur : combine 2 Lingots + 1 Cuivre en Pièce (50 €).',
      requires: ['metallurgie'], unlocks: ['assembleur'], reveals: ['piece'],
    },
    composants_avances: {
      name: 'Composants avancés', icon: '🔧', cost: 8000,
      desc: 'Débloque l\'Atelier : Pièce + 2 Lingots → Composant (250 €), cycle 5s.',
      requires: ['mecanique'], unlocks: ['atelier'], reveals: ['composant'],
    },
    modules_industriels: {
      name: 'Modules industriels', icon: '🏗️', cost: 30000,
      desc: 'Débloque l\'Usine : 2 Composants + 3 Cuivre → Module (2 000 €), cycle 8s.',
      requires: ['composants_avances'], unlocks: ['usine'], reveals: ['module'],
    },

    // ── Recherches de scaling (modifient les paramètres de jeu) ──
    extracteur_mk2: {
      name: 'Extracteur Mk2', icon: '⛏️', cost: 5000,
      desc: 'Tous les extracteurs produisent +50% de ressource par seconde.',
      requires: ['metallurgie'],
    },
    vente_acceleree: {
      name: 'Vente accélérée', icon: '📈', cost: 12000,
      desc: 'Le taux de vente automatique passe de 2 à 4 unités/s par ressource.',
      requires: ['metallurgie'],
    },
    cycles_rapides: {
      name: 'Cycles rapides', icon: '⏱️', cost: 25000,
      desc: 'Toutes les recettes (Fonderie, Assembleur, Atelier, Usine) tournent 30% plus vite.',
      requires: ['mecanique'],
    },
    energie_etendue: {
      name: 'Énergie étendue', icon: '🔋', cost: 3000,
      desc: '+5 énergie de base permanente (passe de 5 à 10 énergie gratuite).',
      requires: [],
    },
    stockage_massif: {
      name: 'Stockage massif', icon: '📦', cost: 10000,
      desc: 'Capacité de stockage doublée pour toutes les ressources (entrepôts inclus).',
      requires: ['metallurgie'],
    },
  };

  // ─── État global du jeu ─────────────────────────────────────────
  const state = {
    // Grille : tableau 2D, tiles[row][col] = { type, resource, building }
    tiles: [],
    // Liste plate des bâtiments (pour itérer plus vite que la grille)
    buildings: [],
    // Économie
    credits: 200,
    stocks: { fer: 0, cuivre: 0, charbon: 0, lingot: 0, piece: 0, composant: 0, module: 0 },
    storageCap: 50,           // capacité de stockage par ressource
    energyBase: 5,            // énergie "gratuite" de base
    // Recherches achetées (instantanées). Liste d'IDs de RESEARCH.
    research: { unlocked: [] },
    // ─── Prestige (méta-progression) ────────────────────────────
    // tokens : "Lingots Précieux" — gagnés en prestige, donnent un
    //   bonus permanent de revenu cumulatif. Persistent à travers
    //   tous les resets (c'est le sel du jeu).
    // lifetimeEarned : total cumulé de revenus depuis la première
    //   partie ou la dernière sauvegarde fraîche — sert au calcul
    //   des tokens à la prochaine prestige.
    // totalPrestiges : juste pour stats (combien de fois on a reset).
    prestige: { tokens: 0, lifetimeEarned: 0, totalPrestiges: 0 },
    // Caméra
    camera: { x: 0, y: 0, zoom: 1 },
    // Souris
    mouse: { x: 0, y: 0 },
    hoverTile: null,          // { col, row } ou null
    // Drag de caméra
    dragging: false,
    dragStart: null,
    dragMoved: false,         // pour distinguer un clic d'un drag
    // Mode construction
    selectedBuilding: null,   // ex: 'extracteur' ou null
    // Préférences UI (persistées) : skin actif et vitesse de jeu
    theme: 'classic',         // 'classic' | 'neo'
    speedMul: 1,              // 0 = pause, 1 = normal, 2 = ×2, 4 = ×4
    // Nombres flottants spawn par les bâtiments productifs : feedback
    // visuel "tycoon" classique (Cookie Clicker / AdVenture Capitalist).
    // Volatile — pas sauvegardé.
    floaters: [],
    // "Fantômes" de bâtiments en train de disparaître après une démolition.
    // Maintenus 280 ms le temps de jouer l'animation (scale down + fade).
    demolishGhosts: [],
  };

  // ─── Canvas + contexte ──────────────────────────────────────────
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  function resizeCanvas() {
    // Support écran HiDPI : on multiplie par devicePixelRatio
    const dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  // ─── Génération de la grille ─────────────────────────────────────
  // Place des ressources aléatoirement (~18% des tuiles), réparties
  // entre les 3 types possibles. Le reste reste en "ground".
  // Tirage pondéré d'une ressource basic selon spawnWeight. Fer rare ?
  // Non — fer abondant. Cuivre rare = il faut chercher les filons,
  // ce qui justifie sa meilleure valeur.
  function pickWeightedResource() {
    const weighted = Object.entries(RESOURCES).filter(([k, def]) => def.basic && def.spawnWeight > 0);
    const total = weighted.reduce((s, [k, def]) => s + def.spawnWeight, 0);
    let r = Math.random() * total;
    for (const [key, def] of weighted) {
      r -= def.spawnWeight;
      if (r <= 0) return key;
    }
    return weighted[0][0];
  }

  function generateGrid() {
    state.tiles = [];
    for (let r = 0; r < GRID_SIZE; r++) {
      const row = [];
      for (let c = 0; c < GRID_SIZE; c++) {
        let resource = null;
        if (Math.random() < RESOURCE_DENSITY) {
          resource = pickWeightedResource();
        }
        row.push({
          type: resource ? 'resource' : 'ground',
          resource,
          building: null,
        });
      }
      state.tiles.push(row);
    }
  }

  // ─── Conversions iso ↔ écran ────────────────────────────────────
  // Formule iso classique : screenX = (col - row) * tw/2, screenY = (col + row) * th/2
  // On applique zoom puis offset caméra pour obtenir les coords écran.
  function worldToScreen(col, row) {
    const z = state.camera.zoom;
    const x = (col - row) * (TILE_W / 2) * z + state.camera.x;
    const y = (col + row) * (TILE_H / 2) * z + state.camera.y;
    return { x, y };
  }

  // Inverse : trouve la tuile sous un point d'écran (sx, sy).
  // On résout le système linéaire en deux étapes.
  function screenToTile(sx, sy) {
    const z = state.camera.zoom;
    const dx = (sx - state.camera.x) / z;
    const dy = (sy - state.camera.y) / z;
    // dx = (col - row) * tw/2  =>  col - row = dx * 2/tw
    // dy = (col + row) * th/2  =>  col + row = dy * 2/th
    const a = dx / (TILE_W / 2);
    const b = dy / (TILE_H / 2);
    // Math.round, pas Math.floor : les tuiles iso ont leur CENTRE en
    // (col, row) entier — la tuile (5,5) "possède" la zone continue
    // [4.5, 5.5] × [4.5, 5.5]. Avec floor, on serait décalé d'une
    // demi-tuile vers le haut-gauche.
    const col = Math.round((a + b) / 2);
    const row = Math.round((b - a) / 2);
    if (col < 0 || col >= GRID_SIZE || row < 0 || row >= GRID_SIZE) return null;
    return { col, row };
  }

  // Centre la caméra sur le milieu de la grille.
  function centerCamera() {
    state.camera.x = window.innerWidth / 2;
    // Un peu décalé vers le haut pour laisser de la place au HUD bas
    state.camera.y = window.innerHeight / 2 - (GRID_SIZE * TILE_H) / 4;
    state.camera.zoom = 1;
  }

  // ─── Utilitaires couleur ────────────────────────────────────────
  function hexToRgb(hex) {
    const h = hex.replace('#', '');
    return {
      r: parseInt(h.substring(0, 2), 16),
      g: parseInt(h.substring(2, 4), 16),
      b: parseInt(h.substring(4, 6), 16),
    };
  }
  function shade(hex, factor) {
    // factor < 1 → assombrit, > 1 → éclaircit
    const { r, g, b } = hexToRgb(hex);
    const cl = (v) => Math.max(0, Math.min(255, Math.round(v * factor)));
    return `rgb(${cl(r)}, ${cl(g)}, ${cl(b)})`;
  }

  // ─── Rendu ──────────────────────────────────────────────────────
  function render() {
    ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

    // Fond dégradé subtil pour donner de la profondeur
    const grad = ctx.createRadialGradient(
      window.innerWidth / 2, window.innerHeight / 2, 100,
      window.innerWidth / 2, window.innerHeight / 2, Math.max(window.innerWidth, window.innerHeight)
    );
    grad.addColorStop(0, '#252b25');
    grad.addColorStop(1, '#10130f');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

    // Ordre iso : on dessine row par row, col par col → le bas devant
    for (let r = 0; r < GRID_SIZE; r++) {
      for (let c = 0; c < GRID_SIZE; c++) {
        drawTile(c, r);
      }
    }

    // Aperçu fantôme du bâtiment à poser
    if (state.selectedBuilding && state.hoverTile) {
      drawGhost(state.hoverTile.col, state.hoverTile.row);
    }

    // Bâtiments en train de disparaître (animation de démolition)
    drawDemolishGhosts();

    // Floaters au-dessus de tout (les "+€X" qui montent des bâtiments)
    drawFloaters();
  }

  // Dessine les fantômes de démolition : bâtiments retirés mais qu'on
  // continue d'afficher pendant ~280 ms en scale down + fade pour
  // la cohérence visuelle (sinon le bâtiment disparaît brutalement).
  function drawDemolishGhosts() {
    const now = performance.now();
    const DEMOLISH_MS = 280;
    // Filtre en place
    let writeIdx = 0;
    for (let i = 0; i < state.demolishGhosts.length; i++) {
      if (now - state.demolishGhosts[i].demolishedAt < DEMOLISH_MS) {
        state.demolishGhosts[writeIdx++] = state.demolishGhosts[i];
      }
    }
    state.demolishGhosts.length = writeIdx;

    for (const g of state.demolishGhosts) {
      const t = (now - g.demolishedAt) / DEMOLISH_MS;
      // Easing in : commence taille pleine, rétrécit accélérant
      const scale = 1 - Math.pow(t, 1.6);
      const opacity = 1 - t;
      const { x, y } = worldToScreen(g.col, g.row);
      // Réutilise drawBuilding avec un objet temporaire qui simule le scale
      // via placedAt lointain (équivalent à pop terminé) — on triche en
      // injectant le scale directement.
      ctx.save();
      ctx.globalAlpha = opacity;
      // Petit hack : on construit un building virtuel avec scale forcé via
      // placedAt manipulé. drawBuilding lit performance.now() - placedAt
      // pour calculer son scale, donc on calcule un placedAt fictif qui
      // donne le bon ease. Plus simple : on duplique brièvement le calcul.
      const z = state.camera.zoom * scale;
      const w = TILE_W * 0.7 * z;
      const d = TILE_H * 0.7 * z;
      const h = 26 * z;
      const def = BUILDINGS[g.type];
      // Face droite
      ctx.fillStyle = shade(def.color, 0.75);
      ctx.beginPath();
      ctx.moveTo(x,         y - h);
      ctx.lineTo(x + w / 2, y - h - d / 2);
      ctx.lineTo(x + w / 2, y - d / 2);
      ctx.lineTo(x,         y);
      ctx.closePath();
      ctx.fill();
      // Face gauche
      ctx.fillStyle = shade(def.color, 0.55);
      ctx.beginPath();
      ctx.moveTo(x,         y - h);
      ctx.lineTo(x - w / 2, y - h - d / 2);
      ctx.lineTo(x - w / 2, y - d / 2);
      ctx.lineTo(x,         y);
      ctx.closePath();
      ctx.fill();
      // Toit
      ctx.fillStyle = def.color;
      ctx.beginPath();
      ctx.moveTo(x,         y - h - d);
      ctx.lineTo(x + w / 2, y - h - d / 2);
      ctx.lineTo(x,         y - h);
      ctx.lineTo(x - w / 2, y - h - d / 2);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
  }

  function drawTile(col, row) {
    const tile = state.tiles[row][col];
    const { x, y } = worldToScreen(col, row);
    const z = state.camera.zoom;
    const w = TILE_W * z;
    const h = TILE_H * z;

    // Couleur de base : herbe pour ground, teintée pour ressource
    let baseColor = '#3a5a3a';
    if (tile.type === 'resource') {
      // Mélange herbe + couleur ressource (plus foncé)
      baseColor = shade(RESOURCES[tile.resource].color, 0.7);
    }

    // Surbrillance si on hover dessus en mode placement
    const isHover = state.hoverTile
      && state.hoverTile.col === col
      && state.hoverTile.row === row
      && state.selectedBuilding;

    // Diamond (losange iso)
    ctx.beginPath();
    ctx.moveTo(x, y - h / 2);
    ctx.lineTo(x + w / 2, y);
    ctx.lineTo(x, y + h / 2);
    ctx.lineTo(x - w / 2, y);
    ctx.closePath();
    ctx.fillStyle = isHover ? shade(baseColor, 1.4) : baseColor;
    ctx.fill();
    ctx.strokeStyle = 'rgba(0, 0, 0, 0.35)';
    ctx.lineWidth = 1;
    ctx.stroke();

    // Marqueurs de ressource — sprite distinct par type pour qu'on
    // identifie le minerai d'un coup d'œil sans regarder la couleur de fond.
    if (tile.type === 'resource' && !tile.building) {
      drawResourceMarkers(tile.resource, x, y, w, h, z);
    }

    // Bâtiment posé sur cette tuile
    if (tile.building) {
      drawBuilding(tile.building, x, y, false);
    }
  }

  // Dessine un bâtiment en faux-3D : un cube vu de dessus en iso.
  // Dessine les marqueurs de minerai sur une tuile ressource. Chaque
  // type a son sprite distinct — feedback visuel beaucoup plus fort que
  // les 3 ronds génériques de la V1, où seule la couleur changeait.
  function drawResourceMarkers(resource, x, y, w, h, z) {
    const color = RESOURCES[resource].color;
    ctx.lineWidth = 1;
    ctx.strokeStyle = 'rgba(0, 0, 0, 0.4)';

    if (resource === 'fer') {
      // 3 mini-cubes empilés (look "minerai brut concassé")
      const blocks = [
        { dx: -w * 0.18, dy: -h * 0.04, s: 6 },
        { dx:  w * 0.16, dy: -h * 0.02, s: 5 },
        { dx: -w * 0.02, dy:  h * 0.20, s: 7 },
      ];
      for (const b of blocks) {
        drawIsoMiniCube(x + b.dx, y + b.dy, Math.max(3.5, b.s * z), color);
      }

    } else if (resource === 'cuivre') {
      // 4 pépites arrondies brillantes avec highlight
      const nuggets = [
        { dx: -w * 0.18, dy: -h * 0.04, r: 3.6 },
        { dx:  w * 0.16, dy: -h * 0.10, r: 3.2 },
        { dx:  w * 0.08, dy:  h * 0.16, r: 4.0 },
        { dx: -w * 0.10, dy:  h * 0.20, r: 3.0 },
      ];
      for (const n of nuggets) {
        const rr = Math.max(2, n.r * z);
        // Ombre
        ctx.fillStyle = shade(color, 0.55);
        ctx.beginPath();
        ctx.ellipse(x + n.dx, y + n.dy + 1 * z, rr * 1.05, rr * 0.55, 0, 0, Math.PI * 2);
        ctx.fill();
        // Corps
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.ellipse(x + n.dx, y + n.dy, rr, rr * 0.55, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        // Highlight (reflet)
        ctx.fillStyle = shade(color, 1.5);
        ctx.beginPath();
        ctx.ellipse(x + n.dx - rr * 0.3, y + n.dy - rr * 0.2, rr * 0.35, rr * 0.18, 0, 0, Math.PI * 2);
        ctx.fill();
      }

    } else if (resource === 'charbon') {
      // 3 éclats polygonaux. Le corps est volontairement plus clair que
      // le pur noir (#2c2e33 au lieu de #1a1a1a) parce que la tuile de
      // fond est déjà très sombre — sinon les éclats étaient invisibles.
      const chunks = [
        { dx: -w * 0.18, dy: -h * 0.04, s: 5 },
        { dx:  w * 0.16, dy:  h * 0.04, s: 6 },
        { dx: -w * 0.02, dy:  h * 0.20, s: 5 },
      ];
      // Outline plus clair pour ressortir sur fond sombre
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
      for (const c of chunks) {
        const cx = x + c.dx, cy = y + c.dy;
        const r = Math.max(3, c.s * z);
        // Corps (charbon avec undertone bleuté)
        ctx.fillStyle = '#2c2e33';
        ctx.beginPath();
        ctx.moveTo(cx - r * 0.85, cy + r * 0.35);
        ctx.lineTo(cx - r * 0.55, cy - r * 0.55);
        ctx.lineTo(cx + r * 0.45, cy - r * 0.65);
        ctx.lineTo(cx + r * 0.95, cy - r * 0.10);
        ctx.lineTo(cx + r * 0.50, cy + r * 0.55);
        ctx.lineTo(cx - r * 0.30, cy + r * 0.65);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        // Facette supérieure brillante (reflet caractéristique du charbon)
        ctx.fillStyle = '#6a6e78';
        ctx.beginPath();
        ctx.moveTo(cx - r * 0.55, cy - r * 0.55);
        ctx.lineTo(cx + r * 0.45, cy - r * 0.65);
        ctx.lineTo(cx + r * 0.20, cy - r * 0.15);
        ctx.lineTo(cx - r * 0.35, cy - r * 0.20);
        ctx.closePath();
        ctx.fill();
      }
    }
  }

  // Petit cube iso utilitaire pour les blocs de fer.
  function drawIsoMiniCube(x, y, s, color) {
    // Top (clair)
    ctx.fillStyle = shade(color, 1.2);
    ctx.beginPath();
    ctx.moveTo(x,         y - s * 0.6);
    ctx.lineTo(x + s,     y - s * 0.3);
    ctx.lineTo(x,         y);
    ctx.lineTo(x - s,     y - s * 0.3);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    // Face droite
    ctx.fillStyle = shade(color, 0.85);
    ctx.beginPath();
    ctx.moveTo(x,         y);
    ctx.lineTo(x + s,     y - s * 0.3);
    ctx.lineTo(x + s,     y + s * 0.4);
    ctx.lineTo(x,         y + s * 0.7);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    // Face gauche
    ctx.fillStyle = shade(color, 0.6);
    ctx.beginPath();
    ctx.moveTo(x,         y);
    ctx.lineTo(x - s,     y - s * 0.3);
    ctx.lineTo(x - s,     y + s * 0.4);
    ctx.lineTo(x,         y + s * 0.7);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
  }

  function drawBuilding(building, cx, cy, ghost) {
    const def = BUILDINGS[building.type];
    const z = state.camera.zoom;
    const alpha = ghost ? 0.55 : 1;

    // Animation "pop" à la pose : scale de 0.4 → 1 en ~280 ms avec easing
    // back-out (overshoot léger) — feedback tactile satisfaisant.
    let popScale = 1;
    if (!ghost && building.placedAt) {
      const POP_MS = 280;
      const age = performance.now() - building.placedAt;
      if (age < POP_MS) {
        const t = age / POP_MS;
        const ease = 1 + 2.7 * Math.pow(t - 1, 3) + 1.7 * Math.pow(t - 1, 2);
        popScale = 0.4 + 0.6 * ease;
      } else {
        delete building.placedAt; // cycle fini, on libère
      }
    }
    const ez = z * popScale; // "effective z" qui inclut le scale du pop
    const w = TILE_W * 0.7 * ez;
    const d = TILE_H * 0.7 * ez;
    const h = 26 * ez;

    ctx.globalAlpha = alpha;

    // Face droite (légèrement assombrie)
    ctx.fillStyle = shade(def.color, 0.75);
    ctx.beginPath();
    ctx.moveTo(cx,         cy - h);
    ctx.lineTo(cx + w / 2, cy - h - d / 2);
    ctx.lineTo(cx + w / 2, cy - d / 2);
    ctx.lineTo(cx,         cy);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.4)';
    ctx.lineWidth = 1;
    ctx.stroke();

    // Face gauche (encore plus sombre)
    ctx.fillStyle = shade(def.color, 0.55);
    ctx.beginPath();
    ctx.moveTo(cx,         cy - h);
    ctx.lineTo(cx - w / 2, cy - h - d / 2);
    ctx.lineTo(cx - w / 2, cy - d / 2);
    ctx.lineTo(cx,         cy);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Face de dessus (claire)
    ctx.fillStyle = def.color;
    ctx.beginPath();
    ctx.moveTo(cx,         cy - h - d);
    ctx.lineTo(cx + w / 2, cy - h - d / 2);
    ctx.lineTo(cx,         cy - h);
    ctx.lineTo(cx - w / 2, cy - h - d / 2);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Détails distinctifs par type — dessinés au-dessus du toit pour
    // qu'on identifie le bâtiment d'un coup d'œil sans emoji.
    drawBuildingDetails(building.type, cx, cy, w, d, h, ez);

    // Barre de progression au-dessus des bâtiments à recette.
    // Toujours affichée (sauf ghost preview) :
    //   · vide  → idle (manque d'input ou stock output saturé)
    //   · plein → cycle en cours qui avance
    // Sans ce feedback, une fonderie idle est indiscernable d'une qui tourne.
    if (!ghost && def.recipe) {
      const progress = building.progress || 0;
      // Cycle effectif = cycle de base × boost recherche (cycles_rapides)
      const effCycle = def.recipe.cycleMs * getResearchBoosts().cycleMult;
      const ratio = Math.min(1, progress / effCycle);
      const barW = w * 0.85;
      const barH = Math.max(3, 4 * z);
      const barX = cx - barW / 2;
      // Décalage suffisant pour passer au-dessus des silhouettes sur le toit
      // (cheminée de la fonderie = 18*z de haut). Sinon la barre coupait
      // visuellement la cheminée en deux.
      const barY = cy - h - d - barH - 22 * z;
      // Fond — orangé subtil quand idle pour signaler l'attente d'input
      ctx.fillStyle = progress === 0 ? 'rgba(80, 50, 30, 0.7)' : 'rgba(0, 0, 0, 0.55)';
      ctx.fillRect(barX, barY, barW, barH);
      if (ratio > 0) {
        ctx.fillStyle = ratio >= 1 ? '#ffd166' : '#8fbf7d'; // jaune si bloqué à 100%
        ctx.fillRect(barX, barY, barW * ratio, barH);
      }
      ctx.strokeStyle = 'rgba(0, 0, 0, 0.35)';
      ctx.lineWidth = 1;
      ctx.strokeRect(barX, barY, barW, barH);
    }

    ctx.globalAlpha = 1;
  }

  // Dessine les éléments distinctifs au-dessus du toit selon le type.
  // Le toit (face supérieure) a son centre à (cx, cy - h - d/2).
  // Les éléments verticaux (cheminées, derricks) sont dessinés "de face"
  // pour rester lisibles — convention classique des jeux iso 2D.
  function drawBuildingDetails(type, cx, cy, w, d, h, z) {
    const top = cy - h - d / 2;
    const def = BUILDINGS[type];
    const color = def.color;
    ctx.lineWidth = 1;
    ctx.strokeStyle = 'rgba(0, 0, 0, 0.5)';

    if (type === 'extracteur') {
      // Derrick triangulaire avec voyant doré au sommet
      const tipY = top - 18 * z;
      const baseR = w * 0.22;
      ctx.fillStyle = shade(color, 0.85);
      ctx.beginPath();
      ctx.moveTo(cx, tipY);
      ctx.lineTo(cx - baseR, top);
      ctx.lineTo(cx + baseR, top);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      // Voyant
      ctx.fillStyle = '#fbbf24';
      ctx.beginPath();
      ctx.arc(cx, tipY, Math.max(2, 2.5 * z), 0, Math.PI * 2);
      ctx.fill();

    } else if (type === 'generateur') {
      // Panneau solaire iso (losange) avec grille de cellules
      const pw = w * 0.55;
      const pd = d * 0.55;
      ctx.fillStyle = '#1e3a5f';
      ctx.beginPath();
      ctx.moveTo(cx,            top - pd / 2);
      ctx.lineTo(cx + pw / 2,   top);
      ctx.lineTo(cx,            top + pd / 2);
      ctx.lineTo(cx - pw / 2,   top);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      // Reflets bleu vif (cellules)
      ctx.strokeStyle = '#60a5fa';
      ctx.lineWidth = Math.max(1, 0.8 * z);
      ctx.beginPath();
      ctx.moveTo(cx - pw / 4, top - pd / 4);
      ctx.lineTo(cx + pw / 4, top + pd / 4);
      ctx.moveTo(cx + pw / 4, top - pd / 4);
      ctx.lineTo(cx - pw / 4, top + pd / 4);
      ctx.stroke();
      ctx.lineWidth = 1;

    } else if (type === 'entrepot') {
      // Cube empilé (caisse) en miniature — réutilise la même perspective iso
      const cw = w * 0.4;
      const cd = d * 0.4;
      const ch = 9 * z;
      const tx = cx;
      const ty = top - ch / 2;
      // Top
      ctx.fillStyle = shade(color, 1.05);
      ctx.beginPath();
      ctx.moveTo(tx,            ty - cd / 2 - ch / 2);
      ctx.lineTo(tx + cw / 2,   ty - ch / 2);
      ctx.lineTo(tx,            ty + cd / 2 - ch / 2);
      ctx.lineTo(tx - cw / 2,   ty - ch / 2);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      // Face droite
      ctx.fillStyle = shade(color, 0.75);
      ctx.beginPath();
      ctx.moveTo(tx,            ty + cd / 2 - ch / 2);
      ctx.lineTo(tx + cw / 2,   ty - ch / 2);
      ctx.lineTo(tx + cw / 2,   ty + ch / 2);
      ctx.lineTo(tx,            ty + cd / 2 + ch / 2);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      // Face gauche
      ctx.fillStyle = shade(color, 0.55);
      ctx.beginPath();
      ctx.moveTo(tx,            ty + cd / 2 - ch / 2);
      ctx.lineTo(tx - cw / 2,   ty - ch / 2);
      ctx.lineTo(tx - cw / 2,   ty + ch / 2);
      ctx.lineTo(tx,            ty + cd / 2 + ch / 2);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      // Croix sur le top (signe "caisse")
      ctx.strokeStyle = 'rgba(0, 0, 0, 0.45)';
      ctx.beginPath();
      ctx.moveTo(tx - cw / 2,   ty - ch / 2);
      ctx.lineTo(tx + cw / 2,   ty - ch / 2);
      ctx.moveTo(tx,            ty - cd / 2 - ch / 2);
      ctx.lineTo(tx,            ty + cd / 2 - ch / 2);
      ctx.stroke();

    } else if (type === 'fonderie') {
      // Grande cheminée principale + petite annexe
      const chimW = 6 * z;
      const chimH = 18 * z;
      // Grande à droite
      ctx.fillStyle = shade(color, 0.6);
      ctx.fillRect(cx + 3 * z, top - chimH, chimW, chimH);
      ctx.strokeRect(cx + 3 * z, top - chimH, chimW, chimH);
      // Anneau métallique au sommet
      ctx.fillStyle = '#3a2a1a';
      ctx.fillRect(cx + 3 * z - 1, top - chimH - 2 * z, chimW + 2, 2 * z);
      // Petite cheminée à gauche
      const smH = 11 * z;
      const smW = 5 * z;
      ctx.fillStyle = shade(color, 0.7);
      ctx.fillRect(cx - 9 * z, top - smH, smW, smH);
      ctx.strokeRect(cx - 9 * z, top - smH, smW, smH);

    } else if (type === 'assembleur') {
      // Engrenage stylisé (8 dents) sur le toit
      const r = 9 * z;
      const teeth = 8;
      const inner = r * 0.72;
      ctx.fillStyle = shade(color, 0.8);
      ctx.beginPath();
      for (let i = 0; i < teeth * 2; i++) {
        const a = (i / (teeth * 2)) * Math.PI * 2 - Math.PI / 2;
        const radius = (i % 2 === 0) ? r : inner;
        const x = cx + Math.cos(a) * radius;
        const y = top + Math.sin(a) * radius * 0.55; // aplatissement iso
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      // Trou central
      ctx.fillStyle = '#1a1f1a';
      ctx.beginPath();
      ctx.ellipse(cx, top, inner * 0.35, inner * 0.35 * 0.55, 0, 0, Math.PI * 2);
      ctx.fill();

    } else if (type === 'atelier') {
      // Dôme + petite antenne — look "labo / établi de précision"
      const r = 9 * z;
      // Dôme (demi-ellipse)
      ctx.fillStyle = shade(color, 1.05);
      ctx.beginPath();
      ctx.ellipse(cx, top, r, r * 0.7, 0, Math.PI, 0);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      // Bande horizontale du dôme
      ctx.strokeStyle = 'rgba(0, 0, 0, 0.35)';
      ctx.beginPath();
      ctx.moveTo(cx - r, top);
      ctx.lineTo(cx + r, top);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(0, 0, 0, 0.5)';
      // Petite antenne au sommet
      ctx.fillStyle = shade(color, 0.6);
      ctx.fillRect(cx - 1 * z, top - r * 0.7 - 6 * z, 2 * z, 6 * z);
      ctx.fillStyle = '#fbbf24';
      ctx.beginPath();
      ctx.arc(cx, top - r * 0.7 - 7 * z, Math.max(2, 2 * z), 0, Math.PI * 2);
      ctx.fill();

    } else if (type === 'usine') {
      // 3 cheminées de hauteurs différentes — look "complexe industriel"
      const chimW = 5 * z;
      const heights = [20, 14, 16];
      const offsets = [-9, -1, 7];
      for (let i = 0; i < 3; i++) {
        const cH = heights[i] * z;
        const ox = offsets[i] * z;
        ctx.fillStyle = shade(color, 0.65);
        ctx.fillRect(cx + ox, top - cH, chimW, cH);
        ctx.strokeRect(cx + ox, top - cH, chimW, cH);
        // Anneau métallique
        ctx.fillStyle = '#3a2a1a';
        ctx.fillRect(cx + ox - 1, top - cH - 2 * z, chimW + 2, 2 * z);
      }
    }
  }

  // ─── Floating numbers (feedback visuel des productions) ─────────
  // Chaque bâtiment qui produit spawn un petit "+€X" qui monte et fade.
  // Donne au joueur un retour immédiat et "vivant" sur ce que sa base
  // génère — sans ça, regarder l'argent monter dans le HUD est plat.
  const FLOATER_LIFETIME_MS = 1100;
  const FLOATER_RISE_PX = 28;

  function spawnFloater(col, row, text, color) {
    state.floaters.push({
      col, row, text, color,
      spawnedAt: performance.now(),
      // Petit jitter horizontal pour que des floaters simultanés du même
      // bâtiment ne se superposent pas pixel-perfect.
      jitterX: (Math.random() - 0.5) * 16,
    });
    // Cap dur — sur de très grandes bases on évite que le rendu
    // s'écroule sous des centaines de floaters simultanés.
    if (state.floaters.length > 80) state.floaters.shift();
  }

  function drawFloaters() {
    const now = performance.now();
    // Filtre les expirés en place.
    let writeIdx = 0;
    for (let i = 0; i < state.floaters.length; i++) {
      if (now - state.floaters[i].spawnedAt < FLOATER_LIFETIME_MS) {
        state.floaters[writeIdx++] = state.floaters[i];
      }
    }
    state.floaters.length = writeIdx;

    const z = state.camera.zoom;
    ctx.save();
    ctx.font = `bold ${Math.max(11, 14 * z)}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    // Contour noir + remplissage couleur — meilleure lisibilité sur tous
    // fonds (herbe vert, ressources colorées, toits clairs des bâtiments)
    // qu'un simple shadowBlur qui restait flou.
    ctx.strokeStyle = 'rgba(0, 0, 0, 0.85)';
    ctx.lineWidth = Math.max(2, 3 * z);
    ctx.lineJoin = 'round';

    for (const f of state.floaters) {
      const age = now - f.spawnedAt;
      const t = age / FLOATER_LIFETIME_MS; // 0..1
      // Easing : monte vite au début, ralentit. Fade rapide en fin.
      const opacity = t < 0.85 ? 1 : (1 - (t - 0.85) / 0.15);
      const offsetY = -Math.pow(t, 0.7) * FLOATER_RISE_PX * z;

      const { x, y } = worldToScreen(f.col, f.row);
      // Au-dessus du toit du bâtiment (h=26z, d/2=11.2z, +marge)
      const py = y - 50 * z + offsetY;
      const px = x + f.jitterX * z;

      ctx.globalAlpha = opacity;
      ctx.strokeText(f.text, px, py);
      ctx.fillStyle = f.color;
      ctx.fillText(f.text, px, py);
    }
    ctx.restore();
  }

  // Aperçu fantôme : on dessine le bâtiment sélectionné en transparent
  // sur la tuile hover, en rouge si la pose est invalide.
  function drawGhost(col, row) {
    const { x, y } = worldToScreen(col, row);
    const z = state.camera.zoom;
    const w = TILE_W * z;
    const h = TILE_H * z;

    // Mode démolir : tuile rouge si occupée, gris/désactivé sinon.
    if (state.selectedBuilding === '__demolish__') {
      const target = state.tiles[row][col].building;
      ctx.beginPath();
      ctx.moveTo(x, y - h / 2);
      ctx.lineTo(x + w / 2, y);
      ctx.lineTo(x, y + h / 2);
      ctx.lineTo(x - w / 2, y);
      ctx.closePath();
      ctx.fillStyle = target ? 'rgba(255, 107, 107, 0.45)' : 'rgba(120, 120, 120, 0.18)';
      ctx.fill();
      ctx.strokeStyle = target ? '#ff6b6b' : 'rgba(255, 255, 255, 0.3)';
      ctx.lineWidth = 2;
      ctx.stroke();
      return;
    }

    // Mode placement : halo + ghost preview.
    const valid = canPlaceBuilding(state.selectedBuilding, col, row).ok;
    ctx.beginPath();
    ctx.moveTo(x, y - h / 2);
    ctx.lineTo(x + w / 2, y);
    ctx.lineTo(x, y + h / 2);
    ctx.lineTo(x - w / 2, y);
    ctx.closePath();
    ctx.fillStyle = valid ? 'rgba(143, 191, 125, 0.35)' : 'rgba(255, 107, 107, 0.35)';
    ctx.fill();
    ctx.strokeStyle = valid ? '#8fbf7d' : '#ff6b6b';
    ctx.lineWidth = 2;
    ctx.stroke();

    drawBuilding({ type: state.selectedBuilding }, x, y, true);
  }

  // ─── Logique de placement ───────────────────────────────────────
  // Renvoie { ok, reason } — `reason` permet d'afficher un toast.
  function canPlaceBuilding(type, col, row) {
    if (col < 0 || col >= GRID_SIZE || row < 0 || row >= GRID_SIZE)
      return { ok: false, reason: 'Hors carte' };
    const tile = state.tiles[row][col];
    if (tile.building) return { ok: false, reason: 'Tuile occupée' };
    const def = BUILDINGS[type];
    if (state.credits < def.cost)
      return { ok: false, reason: `Pas assez de crédits (${def.cost} € requis)` };
    if (def.requiresResource && tile.type !== 'resource')
      return { ok: false, reason: 'Doit être posé sur une ressource' };
    return { ok: true };
  }

  function placeBuilding(type, col, row) {
    const check = canPlaceBuilding(type, col, row);
    if (!check.ok) {
      showToast(check.reason);
      return false;
    }
    const def = BUILDINGS[type];
    state.credits -= def.cost;
    const b = { type, col, row, placedAt: performance.now() };
    state.tiles[row][col].building = b;
    state.buildings.push(b);
    if (def.storage) state.storageCap += def.storage;
    // Floater rouge "-€X" pour matérialiser la dépense
    spawnFloater(col, row, '-' + def.cost + '€', '#ff9d9d');
    updateHUD();
    return true;
  }

  // Démolit le bâtiment de la tuile et rembourse 50% du coût initial.
  // Indispensable pour sortir d'un état "trop d'extracteurs, pas assez
  // d'énergie, plus assez de crédits pour un générateur".
  const REFUND_RATIO = 0.5;
  function demolishAt(col, row) {
    if (col < 0 || col >= GRID_SIZE || row < 0 || row >= GRID_SIZE) return false;
    const tile = state.tiles[row][col];
    if (!tile.building) {
      showToast('Pas de bâtiment ici');
      return false;
    }
    const b = tile.building;
    const def = BUILDINGS[b.type];
    const refund = Math.floor(def.cost * REFUND_RATIO);
    state.credits += refund;
    if (def.storage) state.storageCap = Math.max(50, state.storageCap - def.storage);
    tile.building = null;
    state.buildings = state.buildings.filter((x) => x !== b);
    // Push un fantôme pour l'animation de disparition (scale down + fade)
    state.demolishGhosts.push({ type: b.type, col, row, demolishedAt: performance.now() });
    // Floater vert "+€X" pour matérialiser le refund
    spawnFloater(col, row, '+' + refund + '€', '#b6e8a3');
    showToast(`✓ Démoli — ${refund} € remboursés`);
    updateHUD();
    return true;
  }

  // ─── Stats live (énergie + taux de production par ressource) ───
  // Calculé à la demande pour que tout réagisse instantanément aux
  // placements/destructions de bâtiments. Les taux affichés reflètent
  // la production RÉELLE, pas théorique : un extracteur sans énergie
  // ou sur un stock plein contribue 0.

  // ─── Prestige helpers ───────────────────────────────────────────
  const PRESTIGE_THRESHOLD = 50000;          // € lifetime requis pour 1er prestige
  const PRESTIGE_BONUS_PER_TOKEN = 0.05;     // +5% revenu par jeton
  // Calcule le total de jetons accordés pour `lifetimeEarned` cumulé.
  // Formule sqrt → croissance sub-linéaire qui force à viser de plus
  // en plus haut pour gagner plus (10k pour 1 token, 1M pour 31).
  function prestigeTokensFor(lifetime) {
    if (lifetime < PRESTIGE_THRESHOLD) return 0;
    return Math.floor(Math.sqrt(lifetime / 1000));
  }
  // Jetons à GAGNER au prochain prestige (delta avec ce qu'on a déjà).
  function prestigeTokensGain() {
    return Math.max(0, prestigeTokensFor(state.prestige.lifetimeEarned) - state.prestige.tokens);
  }
  // Multiplicateur de revenu actuel (1 + 5% par token déjà détenu).
  function getPrestigeMultiplier() {
    return 1 + (state.prestige.tokens || 0) * PRESTIGE_BONUS_PER_TOKEN;
  }
  function canPrestige() {
    return prestigeTokensGain() > 0;
  }

  // ─── Boosts de scaling débloqués via la recherche ────────────────
  // Chaque techno de scaling modifie un paramètre global du jeu.
  // Centralisé ici → un seul endroit à mettre à jour quand on ajoute
  // une nouvelle recherche. Lu par tick/computeStats/storage cap.
  function getResearchBoosts() {
    const u = state.research.unlocked || [];
    return {
      extractorMult: u.includes('extracteur_mk2') ? 1.5 : 1,
      sellRateBonus: u.includes('vente_acceleree') ? 2 : 0,    // ajouté à SELL_RATE_PER_TICK
      cycleMult:     u.includes('cycles_rapides')  ? 0.7 : 1,  // appliqué à recipe.cycleMs
      energyBonus:   u.includes('energie_etendue') ? 5   : 0,
