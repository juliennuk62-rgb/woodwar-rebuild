<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Iron & Co — Tycoon isométrique</title>
  <style>
    /* ─── Reset minimal + thème ──────────────────────────────────── */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #1a1f1a;
      color: #e8e8e8;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body { user-select: none; }

    /* Canvas plein écran sous le HUD */
    #game {
      position: absolute;
      inset: 0;
      display: block;
      cursor: grab;
      /* Empêche les gestes par défaut du navigateur (scroll, pinch-zoom de
         page) — on gère tout nous-mêmes pour le tactile. */
      touch-action: none;
    }
    #game.grabbing    { cursor: grabbing; }
    #game.placing     { cursor: crosshair; }
    #game.demolishing { cursor: not-allowed; }

    /* ─── HUD : couches en overlay ─────────────────────────────── */
    .hud {
      position: absolute;
      pointer-events: none;
      z-index: 10;
    }
    .hud > * { pointer-events: auto; }

    /* Stocks (haut gauche) — env() compense les notches iPhone/Android */
    .stocks {
      top: calc(16px + env(safe-area-inset-top));
      left: calc(16px + env(safe-area-inset-left));
      display: flex; flex-direction: column; gap: 8px;
      max-height: calc(100vh - 220px);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .stock-row {
      display: flex; align-items: center; gap: 10px;
      background: rgba(15, 22, 17, 0.85);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 8px 12px;
      min-width: 180px;
      font-size: 13px;
    }
    .stock-icon {
      width: 18px; height: 18px;
      border-radius: 4px;
      flex-shrink: 0;
      box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.3);
    }
    .stock-name { font-weight: 600; flex: 1; }
    .stock-qty { font-family: 'Consolas', 'Monaco', monospace; }
    /* Badge "+1.0/s" ou "-0.5/s" affiché dans la ligne de stock — donne
       un feedback live de la production/consommation, même quand le
       stock courant reste à 0 (vente immédiate). */
    .stock-rate {
      font-family: 'Consolas', monospace;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 6px;
    }
    .stock-rate.is-positive {
      color: #b6e8a3;
      background: rgba(143, 191, 125, 0.15);
    }
    .stock-rate.is-negative {
      color: #ffb088;
      background: rgba(239, 108, 74, 0.18);
    }

    /* Crédits (haut droite) */
    .credits {
      top: calc(16px + env(safe-area-inset-top));
      right: calc(16px + env(safe-area-inset-right));
      background: rgba(15, 22, 17, 0.85);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 209, 102, 0.3);
      border-radius: 12px;
      padding: 12px 18px;
      text-align: right;
      min-width: 200px;
    }
    .credits-value {
      font-size: 28px;
      font-weight: 800;
      color: #ffd166;
      letter-spacing: -0.02em;
      line-height: 1;
    }
    .credits-rate {
      margin-top: 4px;
      font-size: 13px;
      color: #b6e8a3;     /* meilleur contraste sur fond sombre flouté */
      font-weight: 600;
      font-family: 'Consolas', monospace;
    }
    .credits-energy {
      margin-top: 6px;
      font-size: 11px;
      color: #aaa;
      font-family: 'Consolas', monospace;
    }
    .credits-energy.low { color: #ff6b6b; }

    /* Palette de bâtiments (bas centre) — scrollable horizontalement
       sur mobile pour ne jamais déborder du viewport. */
    .palette {
      bottom: calc(16px + env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      display: flex; gap: 6px;
      max-width: calc(100vw - 32px);
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      background: rgba(15, 22, 17, 0.92);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 6px;
    }
    .palette::-webkit-scrollbar { display: none; }
    .palette-btn {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      background: transparent;
      border: 2px solid transparent;
      border-radius: 10px;
      padding: 10px 14px;
      color: #e8e8e8;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
      min-width: 88px;
      min-height: 64px;          /* assure une cible tactile ≥ 44pt même avec icon+labels compacts */
      flex-shrink: 0;
      font-family: inherit;
    }
    .palette-btn:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.05);
    }
    .palette-btn.active {
      background: rgba(143, 191, 125, 0.15);
      border-color: #8fbf7d;
    }
    .palette-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .palette-btn-icon { font-size: 22px; line-height: 1; }
    .palette-btn-name { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
    .palette-btn-cost { font-size: 11px; color: #ffd166; font-family: 'Consolas', monospace; }
    /* Démolir : style rouge pour bien le distinguer des bâtiments à poser */
    .palette-btn-demolish .palette-btn-cost { color: #b6e8a3; }
    .palette-btn-demolish.active {
      background: rgba(255, 107, 107, 0.18);
      border-color: #ff6b6b;
    }
    .palette-btn-demolish.active .palette-btn-name { color: #ff9d9d; }

    /* Bouton recherches (bas droite). pointer-events: auto explicite car
       l'élément a la classe `.hud` (pointer-events: none) mais n'est pas
       un enfant de `.hud` — la règle `.hud > *` ne le réactive donc pas. */
    .research-btn {
      bottom: calc(16px + env(safe-area-inset-bottom));
      right: calc(16px + env(safe-area-inset-right));
      pointer-events: auto;
      background: rgba(15, 22, 17, 0.92);
      border: 1px solid rgba(192, 132, 252, 0.4);
      border-radius: 12px;
      padding: 12px 18px;
      color: #c084fc;
      cursor: pointer;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      min-height: 44px;
      display: flex; align-items: center; gap: 8px;
    }
    .research-btn:hover { background: rgba(192, 132, 252, 0.1); }

    /* Aide en bas (raccourcis clavier/souris) — masquée sur mobile pour
       laisser de la place. Le user mobile la découvrira via les gestes. */
    .help-text {
      bottom: calc(110px + env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      color: rgba(255, 255, 255, 0.45);
      text-align: center;
      pointer-events: none;
      white-space: nowrap;
    }
    @media (max-width: 720px) {
      .help-text { display: none; }
    }

    /* Indication visuelle sur les stocks proches du cap */
    .stock-row.is-near .stock-qty { color: #ffd166; }
    .stock-row.is-full .stock-qty { color: #ff6b6b; font-weight: 700; }
    .stock-row.is-full {
      border-color: rgba(255, 107, 107, 0.4);
      box-shadow: 0 0 12px rgba(255, 107, 107, 0.15);
    }

    /* Le bouton Recherches pulse quand au moins une techno est achetable */
    .research-btn.has-affordable {
      animation: research-pulse 1.6s ease-in-out infinite;
      border-color: #c084fc;
    }
    @keyframes research-pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(192, 132, 252, 0); }
      50%      { box-shadow: 0 0 16px 0 rgba(192, 132, 252, 0.55); }
    }

    /* Modal Recherches — overlay plein écran avec backdrop flouté */
    .research-modal {
      position: fixed; inset: 0; z-index: 50;
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
    }
    .research-modal[hidden] { display: none; }
    .research-backdrop {
      position: absolute; inset: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
    }
    .research-panel {
      position: relative;
      width: min(560px, 100%);
      max-height: calc(100vh - 40px);
      display: flex; flex-direction: column;
      background: linear-gradient(180deg, #1a221c 0%, #10160f 100%);
      border: 1px solid rgba(192, 132, 252, 0.25);
      border-radius: 16px;
      box-shadow: 0 20px 60px -10px rgba(0, 0, 0, 0.7),
                  0 0 30px rgba(192, 132, 252, 0.15);
      overflow: hidden;
    }
    .research-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 16px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }
    .research-header h2 {
      font-size: 18px; font-weight: 700; color: #c084fc;
    }
    .research-close {
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, 0.5);
      font-size: 28px;
      line-height: 1;
      cursor: pointer;
      width: 36px; height: 36px;
      border-radius: 8px;
      transition: background 0.15s, color 0.15s;
    }
    .research-close:hover { background: rgba(255, 255, 255, 0.06); color: #fff; }
    .research-list {
      padding: 16px;
      overflow-y: auto;
      display: flex; flex-direction: column; gap: 12px;
    }
    /* Footer du modal Recherches — héberge l'action destructive (reset).
       Volontairement caché ici plutôt que dans le HUD principal pour éviter
       un clic accidentel. */
    .research-footer {
      padding: 12px 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      display: flex; justify-content: center;
    }
    .research-reset {
      padding: 8px 16px;
      background: transparent;
      border: 1px solid rgba(255, 107, 107, 0.4);
      border-radius: 8px;
      color: #ff9d9d;
      font-family: inherit;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .research-reset:hover { background: rgba(255, 107, 107, 0.12); color: #ffb6b6; }
    .research-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 14px;
      display: flex; flex-direction: column; gap: 8px;
      transition: border-color 0.15s, background 0.15s;
    }
    .research-card.is-affordable { border-color: rgba(192, 132, 252, 0.5); }
    .research-card.is-unlocked {
      border-color: rgba(143, 191, 125, 0.4);
      background: rgba(143, 191, 125, 0.05);
    }
    .research-card.is-locked { opacity: 0.55; }
    .research-card-head {
      display: flex; align-items: center; gap: 10px;
    }
    .research-card-icon { font-size: 22px; }
    .research-card-name { font-size: 14px; font-weight: 700; flex: 1; }
    .research-card-cost {
      font-family: 'Consolas', monospace;
      font-size: 13px;
      color: #ffd166;
    }
    .research-card-desc {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.65);
      line-height: 1.4;
    }
    .research-card-action {
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px;
      margin-top: 4px;
    }
    .research-buy {
      flex: 1;
      padding: 10px 14px;
      background: linear-gradient(180deg, rgba(192, 132, 252, 0.2) 0%, rgba(192, 132, 252, 0.05) 100%);
      border: 1px solid #c084fc;
      border-radius: 8px;
      color: #e9d5ff;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: filter 0.15s;
    }
    .research-buy:hover:not(:disabled) { filter: brightness(1.2); }
    .research-buy:disabled {
      opacity: 0.4; cursor: not-allowed;
      background: rgba(255, 255, 255, 0.04);
      border-color: rgba(255, 255, 255, 0.1);
      color: rgba(255, 255, 255, 0.5);
    }
    .research-status {
      font-size: 11px;
      color: #8fbf7d;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .research-locked-msg {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.45);
      font-style: italic;
    }

    /* Bannière énergie insuffisante — positionnée SOUS le panneau crédits
       (qui fait ~86 px de haut + 16 px d'offset) pour ne pas le masquer
       au moment où le joueur en a le plus besoin pour décider quoi démolir. */
    .energy-warning {
      top: calc(112px + env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      max-width: calc(100vw - 32px);
      background: linear-gradient(180deg, rgba(255, 107, 107, 0.92) 0%, rgba(180, 60, 60, 0.92) 100%);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 10px;
      padding: 10px 18px;
      font-size: 13px;
      font-weight: 600;
      text-align: center;
      box-shadow: 0 8px 24px -4px rgba(255, 107, 107, 0.4);
      animation: energy-warn-pulse 1.6s ease-in-out infinite;
      pointer-events: none;
      z-index: 20;
    }
    .energy-warning[hidden] { display: none; }
    @keyframes energy-warn-pulse {
      0%, 100% { transform: translateX(-50%) scale(1); }
      50%      { transform: translateX(-50%) scale(1.03); }
    }

    /* Toast info (bas, après une action invalide par ex.) */
    .toast {
      top: 80px; left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 22, 17, 0.95);
      border: 1px solid #ff6b6b;
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 13px;
      color: #ff6b6b;
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <!-- HUD : tout en HTML overlay pour rester simple à mettre à jour -->
  <div class="hud stocks" id="stocks"></div>

  <div class="hud credits">
    <div class="credits-value" id="credits-value">200 €</div>
    <div class="credits-rate" id="credits-rate">+ 0 €/s</div>
    <div class="credits-energy" id="credits-energy">⚡ 0 / 5</div>
  </div>

  <div class="hud help-text">
    Glisser : déplacer la caméra • Molette / pincer : zoom • Touches 1-5 : bâtiment • D : démolir • Échap : annuler
  </div>

  <div class="hud palette" id="palette"></div>

  <button class="hud research-btn" id="research-btn" title="Ouvrir le panneau Recherches">🔬 Recherches</button>

  <!-- Avertissement plein-écran quand l'énergie est insuffisante.
       Sans ça, le joueur peut spammer des extracteurs sans s'en rendre compte
       et finir bloqué (rien ne tourne, plus assez de crédits pour un générateur). -->
  <div class="hud energy-warning" id="energy-warning" hidden>
    ⚠ Énergie insuffisante — construis des Générateurs ou démolis des bâtiments
  </div>

  <!-- Modal Recherches (caché par défaut). Construit dynamiquement par updateResearchModal(). -->
  <div class="research-modal" id="research-modal" hidden>
    <div class="research-backdrop"></div>
    <div class="research-panel" role="dialog" aria-labelledby="research-title">
      <header class="research-header">
        <h2 id="research-title">🔬 Recherches</h2>
        <button class="research-close" id="research-close" aria-label="Fermer">×</button>
      </header>
      <div class="research-list" id="research-list"></div>
      <footer class="research-footer">
        <button class="research-reset" id="reset-btn" title="Effacer la sauvegarde et recommencer">
          🔄 Réinitialiser la partie
        </button>
      </footer>
    </div>
  </div>

  <div class="hud toast" id="toast"></div>

  <script>
  'use strict';

  /* ════════════════════════════════════════════════════════════════
     IRON & CO — Tycoon isométrique en un seul fichier.
     Inspiré de Satisfactory : pose des extracteurs sur des gisements,
     produit des ressources, vend automatiquement contre des crédits.
     V1 : grille statique 20×20, 3 types de bâtiments, vente auto.
     ════════════════════════════════════════════════════════════════ */

  // ─── Constantes de jeu ──────────────────────────────────────────
  const TILE_W = 64;          // largeur d'une tuile iso (px)
  const TILE_H = 32;          // hauteur d'une tuile iso (ratio 2:1)
  const GRID_SIZE = 20;       // nb tuiles par côté
  const RESOURCE_DENSITY = 0.18; // ~18% des tuiles ont une ressource
  const TICK_MS = 1000;       // boucle de production = 1 tick/s
  // Taux de vente auto par ressource. Volontairement bas : avec 1 extracteur
  // qui produit 1 u/s, le 1er stock se draine ; à partir du 3e extracteur
  // d'une même ressource, le stock monte → l'entrepôt devient utile.
  const SELL_RATE_PER_TICK = 2;
  const MIN_ZOOM = 0.5;
  const MAX_ZOOM = 2;

  // ─── Définitions des ressources ─────────────────────────────────
  // `basic: true` → ressource brute extractible sur la map ; sinon =
  // ressource crafted (apparaît dans les recettes). Les crafted ne sont
  // affichées dans le HUD qu'une fois la techno correspondante débloquée.
  const RESOURCES = {
    fer:     { name: 'Fer',     short: 'FE', color: '#a86a3c', price: 1.0,  basic: true },
    cuivre:  { name: 'Cuivre',  short: 'CU', color: '#d97e2a', price: 2.0,  basic: true },
    charbon: { name: 'Charbon', short: 'CH', color: '#3d3d3d', price: 1.5,  basic: true },
    lingot:  { name: 'Lingot',  short: 'LI', color: '#b6c0d4', price: 8.0  },
    piece:   { name: 'Pièce',   short: 'PI', color: '#9aaab8', price: 50.0 },
  };

  // ─── Définitions des bâtiments ──────────────────────────────────
  // `requiresResource` : ne peut être posé que sur une tuile ressource
  // `energyUsage`      : consomme N énergie/tick (si pas assez → bloqué)
  // `energyProduction` : ajoute N énergie au pool global
  // `storage`          : ajoute N à la capacité de stockage
  // `recipe`           : { input: {res:n}, output: 'res', qty, cycleMs }
  // `locked`           : true → masqué de la palette tant que la recherche
  //                      correspondante n'est pas complétée
  const BUILDINGS = {
    extracteur: {
      name: 'Extracteur', icon: '⛏️', cost: 50, color: '#a06848',
      requiresResource: true, energyUsage: 1, productionPerTick: 1,
    },
    entrepot: {
      name: 'Entrepôt',   icon: '📦', cost: 100, color: '#8b6f47',
      storage: 100,
    },
    generateur: {
      name: 'Générateur', icon: '⚡', cost: 75, color: '#ffd166',
      energyProduction: 10,
    },
    fonderie: {
      name: 'Fonderie',   icon: '🏭', cost: 200, color: '#ef6c4a',
      energyUsage: 2, locked: true,
      recipe: { input: { fer: 1, charbon: 1 }, output: 'lingot', qty: 1, cycleMs: 2000 },
    },
    assembleur: {
      name: 'Assembleur', icon: '⚙️', cost: 400, color: '#9b6dff',
      energyUsage: 3, locked: true,
      recipe: { input: { lingot: 2, cuivre: 1 }, output: 'piece', qty: 1, cycleMs: 3000 },
    },
  };

  // ─── Recherches ─────────────────────────────────────────────────
  // Achat instantané (pas de timer pour V1). Chaque techno débloque un ou
  // plusieurs bâtiments + révèle de nouvelles ressources dans le HUD.
  const RESEARCH = {
    metallurgie: {
      name: 'Métallurgie', icon: '🔥', cost: 500,
      desc: 'Débloque la Fonderie : transforme Fer + Charbon en Lingot (×8 €).',
      requires: [], unlocks: ['fonderie'], reveals: ['lingot'],
    },
    mecanique: {
      name: 'Mécanique de précision', icon: '🛠️', cost: 1500,
      desc: 'Débloque l\'Assembleur : combine 2 Lingots + 1 Cuivre en Pièce (50 €).',
      requires: ['metallurgie'], unlocks: ['assembleur'], reveals: ['piece'],
    },
  };

  // ─── État global du jeu ─────────────────────────────────────────
  const state = {
    // Grille : tableau 2D, tiles[row][col] = { type, resource, building }
    tiles: [],
    // Liste plate des bâtiments (pour itérer plus vite que la grille)
    buildings: [],
    // Économie
    credits: 200,
    stocks: { fer: 0, cuivre: 0, charbon: 0, lingot: 0, piece: 0 },
    storageCap: 50,           // capacité de stockage par ressource
    energyBase: 5,            // énergie "gratuite" de base
    // Recherches achetées (instantanées). Liste d'IDs de RESEARCH.
    research: { unlocked: [] },
    // Caméra
    camera: { x: 0, y: 0, zoom: 1 },
    // Souris
    mouse: { x: 0, y: 0 },
    hoverTile: null,          // { col, row } ou null
    // Drag de caméra
    dragging: false,
    dragStart: null,
    dragMoved: false,         // pour distinguer un clic d'un drag
    // Mode construction
    selectedBuilding: null,   // ex: 'extracteur' ou null
  };

  // ─── Canvas + contexte ──────────────────────────────────────────
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  function resizeCanvas() {
    // Support écran HiDPI : on multiplie par devicePixelRatio
    const dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  // ─── Génération de la grille ─────────────────────────────────────
  // Place des ressources aléatoirement (~18% des tuiles), réparties
  // entre les 3 types possibles. Le reste reste en "ground".
  function generateGrid() {
    state.tiles = [];
    const types = Object.keys(RESOURCES);
    for (let r = 0; r < GRID_SIZE; r++) {
      const row = [];
      for (let c = 0; c < GRID_SIZE; c++) {
        let resource = null;
        if (Math.random() < RESOURCE_DENSITY) {
          resource = types[Math.floor(Math.random() * types.length)];
        }
        row.push({
          type: resource ? 'resource' : 'ground',
          resource,
          building: null,
        });
      }
      state.tiles.push(row);
    }
  }

  // ─── Conversions iso ↔ écran ────────────────────────────────────
  // Formule iso classique : screenX = (col - row) * tw/2, screenY = (col + row) * th/2
  // On applique zoom puis offset caméra pour obtenir les coords écran.
  function worldToScreen(col, row) {
    const z = state.camera.zoom;
    const x = (col - row) * (TILE_W / 2) * z + state.camera.x;
    const y = (col + row) * (TILE_H / 2) * z + state.camera.y;
    return { x, y };
  }

  // Inverse : trouve la tuile sous un point d'écran (sx, sy).
  // On résout le système linéaire en deux étapes.
  function screenToTile(sx, sy) {
    const z = state.camera.zoom;
    const dx = (sx - state.camera.x) / z;
    const dy = (sy - state.camera.y) / z;
    // dx = (col - row) * tw/2  =>  col - row = dx * 2/tw
    // dy = (col + row) * th/2  =>  col + row = dy * 2/th
    const a = dx / (TILE_W / 2);
    const b = dy / (TILE_H / 2);
    // Math.round, pas Math.floor : les tuiles iso ont leur CENTRE en
    // (col, row) entier — la tuile (5,5) "possède" la zone continue
    // [4.5, 5.5] × [4.5, 5.5]. Avec floor, on serait décalé d'une
    // demi-tuile vers le haut-gauche.
    const col = Math.round((a + b) / 2);
    const row = Math.round((b - a) / 2);
    if (col < 0 || col >= GRID_SIZE || row < 0 || row >= GRID_SIZE) return null;
    return { col, row };
  }

  // Centre la caméra sur le milieu de la grille.
  function centerCamera() {
    state.camera.x = window.innerWidth / 2;
    // Un peu décalé vers le haut pour laisser de la place au HUD bas
    state.camera.y = window.innerHeight / 2 - (GRID_SIZE * TILE_H) / 4;
    state.camera.zoom = 1;
  }

  // ─── Utilitaires couleur ────────────────────────────────────────
  function hexToRgb(hex) {
    const h = hex.replace('#', '');
    return {
      r: parseInt(h.substring(0, 2), 16),
      g: parseInt(h.substring(2, 4), 16),
      b: parseInt(h.substring(4, 6), 16),
    };
  }
  function shade(hex, factor) {
    // factor < 1 → assombrit, > 1 → éclaircit
    const { r, g, b } = hexToRgb(hex);
    const cl = (v) => Math.max(0, Math.min(255, Math.round(v * factor)));
    return `rgb(${cl(r)}, ${cl(g)}, ${cl(b)})`;
  }

  // ─── Rendu ──────────────────────────────────────────────────────
  function render() {
    ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

    // Fond dégradé subtil pour donner de la profondeur
    const grad = ctx.createRadialGradient(
      window.innerWidth / 2, window.innerHeight / 2, 100,
      window.innerWidth / 2, window.innerHeight / 2, Math.max(window.innerWidth, window.innerHeight)
    );
    grad.addColorStop(0, '#252b25');
    grad.addColorStop(1, '#10130f');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

    // Ordre iso : on dessine row par row, col par col → le bas devant
    for (let r = 0; r < GRID_SIZE; r++) {
      for (let c = 0; c < GRID_SIZE; c++) {
        drawTile(c, r);
      }
    }

    // Aperçu fantôme du bâtiment à poser
    if (state.selectedBuilding && state.hoverTile) {
      drawGhost(state.hoverTile.col, state.hoverTile.row);
    }
  }

  function drawTile(col, row) {
    const tile = state.tiles[row][col];
    const { x, y } = worldToScreen(col, row);
    const z = state.camera.zoom;
    const w = TILE_W * z;
    const h = TILE_H * z;

    // Couleur de base : herbe pour ground, teintée pour ressource
    let baseColor = '#3a5a3a';
    if (tile.type === 'resource') {
      // Mélange herbe + couleur ressource (plus foncé)
      baseColor = shade(RESOURCES[tile.resource].color, 0.7);
    }

    // Surbrillance si on hover dessus en mode placement
    const isHover = state.hoverTile
      && state.hoverTile.col === col
      && state.hoverTile.row === row
      && state.selectedBuilding;

    // Diamond (losange iso)
    ctx.beginPath();
    ctx.moveTo(x, y - h / 2);
    ctx.lineTo(x + w / 2, y);
    ctx.lineTo(x, y + h / 2);
    ctx.lineTo(x - w / 2, y);
    ctx.closePath();
    ctx.fillStyle = isHover ? shade(baseColor, 1.4) : baseColor;
    ctx.fill();
    ctx.strokeStyle = 'rgba(0, 0, 0, 0.35)';
    ctx.lineWidth = 1;
    ctx.stroke();

    // Marqueurs de ressource (3 petits ronds)
    if (tile.type === 'resource' && !tile.building) {
      ctx.fillStyle = RESOURCES[tile.resource].color;
      // Plus visibles à zoom bas — sinon les gisements deviennent invisibles
      const dotR = Math.max(3, 4.5 * z);
      const positions = [
        { dx: -w * 0.18, dy: 0 },
        { dx:  w * 0.18, dy: -h * 0.12 },
        { dx:  0,        dy:  h * 0.18 },
      ];
      for (const p of positions) {
        ctx.beginPath();
        ctx.arc(x + p.dx, y + p.dy, dotR, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // Bâtiment posé sur cette tuile
    if (tile.building) {
      drawBuilding(tile.building, x, y, false);
    }
  }

  // Dessine un bâtiment en faux-3D : un cube vu de dessus en iso.
  function drawBuilding(building, cx, cy, ghost) {
    const def = BUILDINGS[building.type];
    const z = state.camera.zoom;
    const w = TILE_W * 0.7 * z;
    const d = TILE_H * 0.7 * z;
    const h = 26 * z;
    const alpha = ghost ? 0.55 : 1;

    ctx.globalAlpha = alpha;

    // Face droite (légèrement assombrie)
    ctx.fillStyle = shade(def.color, 0.75);
    ctx.beginPath();
    ctx.moveTo(cx,         cy - h);
    ctx.lineTo(cx + w / 2, cy - h - d / 2);
    ctx.lineTo(cx + w / 2, cy - d / 2);
    ctx.lineTo(cx,         cy);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.4)';
    ctx.lineWidth = 1;
    ctx.stroke();

    // Face gauche (encore plus sombre)
    ctx.fillStyle = shade(def.color, 0.55);
    ctx.beginPath();
    ctx.moveTo(cx,         cy - h);
    ctx.lineTo(cx - w / 2, cy - h - d / 2);
    ctx.lineTo(cx - w / 2, cy - d / 2);
    ctx.lineTo(cx,         cy);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Face de dessus (claire)
    ctx.fillStyle = def.color;
    ctx.beginPath();
    ctx.moveTo(cx,         cy - h - d);
    ctx.lineTo(cx + w / 2, cy - h - d / 2);
    ctx.lineTo(cx,         cy - h);
    ctx.lineTo(cx - w / 2, cy - h - d / 2);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Détails distinctifs par type — dessinés au-dessus du toit pour
    // qu'on identifie le bâtiment d'un coup d'œil sans emoji.
    drawBuildingDetails(building.type, cx, cy, w, d, h, z);

    // Barre de progression au-dessus des bâtiments à recette.
    // Toujours affichée (sauf ghost preview) :
    //   · vide  → idle (manque d'input ou stock output saturé)
    //   · plein → cycle en cours qui avance
    // Sans ce feedback, une fonderie idle est indiscernable d'une qui tourne.
    if (!ghost && def.recipe) {
      const progress = building.progress || 0;
      const ratio = Math.min(1, progress / def.recipe.cycleMs);
      const barW = w * 0.85;
      const barH = Math.max(3, 4 * z);
      const barX = cx - barW / 2;
      // Décalage suffisant pour passer au-dessus des silhouettes sur le toit
      // (cheminée de la fonderie = 18*z de haut). Sinon la barre coupait
      // visuellement la cheminée en deux.
      const barY = cy - h - d - barH - 22 * z;
      // Fond — orangé subtil quand idle pour signaler l'attente d'input
      ctx.fillStyle = progress === 0 ? 'rgba(80, 50, 30, 0.7)' : 'rgba(0, 0, 0, 0.55)';
      ctx.fillRect(barX, barY, barW, barH);
      if (ratio > 0) {
        ctx.fillStyle = ratio >= 1 ? '#ffd166' : '#8fbf7d'; // jaune si bloqué à 100%
        ctx.fillRect(barX, barY, barW * ratio, barH);
      }
      ctx.strokeStyle = 'rgba(0, 0, 0, 0.35)';
      ctx.lineWidth = 1;
      ctx.strokeRect(barX, barY, barW, barH);
    }

    ctx.globalAlpha = 1;
  }

  // Dessine les éléments distinctifs au-dessus du toit selon le type.
  // Le toit (face supérieure) a son centre à (cx, cy - h - d/2).
  // Les éléments verticaux (cheminées, derricks) sont dessinés "de face"
  // pour rester lisibles — convention classique des jeux iso 2D.
  function drawBuildingDetails(type, cx, cy, w, d, h, z) {
    const top = cy - h - d / 2;
    const def = BUILDINGS[type];
    const color = def.color;
    ctx.lineWidth = 1;
    ctx.strokeStyle = 'rgba(0, 0, 0, 0.5)';

    if (type === 'extracteur') {
      // Derrick triangulaire avec voyant doré au sommet
      const tipY = top - 18 * z;
      const baseR = w * 0.22;
      ctx.fillStyle = shade(color, 0.85);
      ctx.beginPath();
      ctx.moveTo(cx, tipY);
      ctx.lineTo(cx - baseR, top);
      ctx.lineTo(cx + baseR, top);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      // Voyant
      ctx.fillStyle = '#fbbf24';
      ctx.beginPath();
      ctx.arc(cx, tipY, Math.max(2, 2.5 * z), 0, Math.PI * 2);
      ctx.fill();

    } else if (type === 'generateur') {
      // Panneau solaire iso (losange) avec grille de cellules
      const pw = w * 0.55;
      const pd = d * 0.55;
      ctx.fillStyle = '#1e3a5f';
      ctx.beginPath();
      ctx.moveTo(cx,            top - pd / 2);
      ctx.lineTo(cx + pw / 2,   top);
      ctx.lineTo(cx,            top + pd / 2);
      ctx.lineTo(cx - pw / 2,   top);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      // Reflets bleu vif (cellules)
      ctx.strokeStyle = '#60a5fa';
      ctx.lineWidth = Math.max(1, 0.8 * z);
      ctx.beginPath();
      ctx.moveTo(cx - pw / 4, top - pd / 4);
      ctx.lineTo(cx + pw / 4, top + pd / 4);
      ctx.moveTo(cx + pw / 4, top - pd / 4);
      ctx.lineTo(cx - pw / 4, top + pd / 4);
      ctx.stroke();
      ctx.lineWidth = 1;

    } else if (type === 'entrepot') {
      // Cube empilé (caisse) en miniature — réutilise la même perspective iso
      const cw = w * 0.4;
      const cd = d * 0.4;
      const ch = 9 * z;
      const tx = cx;
      const ty = top - ch / 2;
      // Top
      ctx.fillStyle = shade(color, 1.05);
      ctx.beginPath();
      ctx.moveTo(tx,            ty - cd / 2 - ch / 2);
      ctx.lineTo(tx + cw / 2,   ty - ch / 2);
      ctx.lineTo(tx,            ty + cd / 2 - ch / 2);
      ctx.lineTo(tx - cw / 2,   ty - ch / 2);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      // Face droite
      ctx.fillStyle = shade(color, 0.75);
      ctx.beginPath();
      ctx.moveTo(tx,            ty + cd / 2 - ch / 2);
      ctx.lineTo(tx + cw / 2,   ty - ch / 2);
      ctx.lineTo(tx + cw / 2,   ty + ch / 2);
      ctx.lineTo(tx,            ty + cd / 2 + ch / 2);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      // Face gauche
      ctx.fillStyle = shade(color, 0.55);
      ctx.beginPath();
      ctx.moveTo(tx,            ty + cd / 2 - ch / 2);
      ctx.lineTo(tx - cw / 2,   ty - ch / 2);
      ctx.lineTo(tx - cw / 2,   ty + ch / 2);
      ctx.lineTo(tx,            ty + cd / 2 + ch / 2);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      // Croix sur le top (signe "caisse")
      ctx.strokeStyle = 'rgba(0, 0, 0, 0.45)';
      ctx.beginPath();
      ctx.moveTo(tx - cw / 2,   ty - ch / 2);
      ctx.lineTo(tx + cw / 2,   ty - ch / 2);
      ctx.moveTo(tx,            ty - cd / 2 - ch / 2);
      ctx.lineTo(tx,            ty + cd / 2 - ch / 2);
      ctx.stroke();

    } else if (type === 'fonderie') {
      // Grande cheminée principale + petite annexe
      const chimW = 6 * z;
      const chimH = 18 * z;
      // Grande à droite
      ctx.fillStyle = shade(color, 0.6);
      ctx.fillRect(cx + 3 * z, top - chimH, chimW, chimH);
      ctx.strokeRect(cx + 3 * z, top - chimH, chimW, chimH);
      // Anneau métallique au sommet
      ctx.fillStyle = '#3a2a1a';
      ctx.fillRect(cx + 3 * z - 1, top - chimH - 2 * z, chimW + 2, 2 * z);
      // Petite cheminée à gauche
      const smH = 11 * z;
      const smW = 5 * z;
      ctx.fillStyle = shade(color, 0.7);
      ctx.fillRect(cx - 9 * z, top - smH, smW, smH);
      ctx.strokeRect(cx - 9 * z, top - smH, smW, smH);

    } else if (type === 'assembleur') {
      // Engrenage stylisé (8 dents) sur le toit
      const r = 9 * z;
      const teeth = 8;
      const inner = r * 0.72;
      ctx.fillStyle = shade(color, 0.8);
      ctx.beginPath();
      for (let i = 0; i < teeth * 2; i++) {
        const a = (i / (teeth * 2)) * Math.PI * 2 - Math.PI / 2;
        const radius = (i % 2 === 0) ? r : inner;
        const x = cx + Math.cos(a) * radius;
        const y = top + Math.sin(a) * radius * 0.55; // aplatissement iso
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      // Trou central
      ctx.fillStyle = '#1a1f1a';
      ctx.beginPath();
      ctx.ellipse(cx, top, inner * 0.35, inner * 0.35 * 0.55, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // Aperçu fantôme : on dessine le bâtiment sélectionné en transparent
  // sur la tuile hover, en rouge si la pose est invalide.
  function drawGhost(col, row) {
    const { x, y } = worldToScreen(col, row);
    const z = state.camera.zoom;
    const w = TILE_W * z;
    const h = TILE_H * z;

    // Mode démolir : tuile rouge si occupée, gris/désactivé sinon.
    if (state.selectedBuilding === '__demolish__') {
      const target = state.tiles[row][col].building;
      ctx.beginPath();
      ctx.moveTo(x, y - h / 2);
      ctx.lineTo(x + w / 2, y);
      ctx.lineTo(x, y + h / 2);
      ctx.lineTo(x - w / 2, y);
      ctx.closePath();
      ctx.fillStyle = target ? 'rgba(255, 107, 107, 0.45)' : 'rgba(120, 120, 120, 0.18)';
      ctx.fill();
      ctx.strokeStyle = target ? '#ff6b6b' : 'rgba(255, 255, 255, 0.3)';
      ctx.lineWidth = 2;
      ctx.stroke();
      return;
    }

    // Mode placement : halo + ghost preview.
    const valid = canPlaceBuilding(state.selectedBuilding, col, row).ok;
    ctx.beginPath();
    ctx.moveTo(x, y - h / 2);
    ctx.lineTo(x + w / 2, y);
    ctx.lineTo(x, y + h / 2);
    ctx.lineTo(x - w / 2, y);
    ctx.closePath();
    ctx.fillStyle = valid ? 'rgba(143, 191, 125, 0.35)' : 'rgba(255, 107, 107, 0.35)';
    ctx.fill();
    ctx.strokeStyle = valid ? '#8fbf7d' : '#ff6b6b';
    ctx.lineWidth = 2;
    ctx.stroke();

    drawBuilding({ type: state.selectedBuilding }, x, y, true);
  }

  // ─── Logique de placement ───────────────────────────────────────
  // Renvoie { ok, reason } — `reason` permet d'afficher un toast.
  function canPlaceBuilding(type, col, row) {
    if (col < 0 || col >= GRID_SIZE || row < 0 || row >= GRID_SIZE)
      return { ok: false, reason: 'Hors carte' };
    const tile = state.tiles[row][col];
    if (tile.building) return { ok: false, reason: 'Tuile occupée' };
    const def = BUILDINGS[type];
    if (state.credits < def.cost)
      return { ok: false, reason: `Pas assez de crédits (${def.cost} € requis)` };
    if (def.requiresResource && tile.type !== 'resource')
      return { ok: false, reason: 'Doit être posé sur une ressource' };
    return { ok: true };
  }

  function placeBuilding(type, col, row) {
    const check = canPlaceBuilding(type, col, row);
    if (!check.ok) {
      showToast(check.reason);
      return false;
    }
    const def = BUILDINGS[type];
    state.credits -= def.cost;
    const b = { type, col, row };
    state.tiles[row][col].building = b;
    state.buildings.push(b);
    if (def.storage) state.storageCap += def.storage;
    updateHUD();
    return true;
  }

  // Démolit le bâtiment de la tuile et rembourse 50% du coût initial.
  // Indispensable pour sortir d'un état "trop d'extracteurs, pas assez
  // d'énergie, plus assez de crédits pour un générateur".
  const REFUND_RATIO = 0.5;
  function demolishAt(col, row) {
    if (col < 0 || col >= GRID_SIZE || row < 0 || row >= GRID_SIZE) return false;
    const tile = state.tiles[row][col];
    if (!tile.building) {
      showToast('Pas de bâtiment ici');
      return false;
    }
    const b = tile.building;
    const def = BUILDINGS[b.type];
    const refund = Math.floor(def.cost * REFUND_RATIO);
    state.credits += refund;
    if (def.storage) state.storageCap = Math.max(50, state.storageCap - def.storage);
    tile.building = null;
    state.buildings = state.buildings.filter((x) => x !== b);
    showToast(`✓ Démoli — ${refund} € remboursés`);
    updateHUD();
    return true;
  }

  // ─── Stats live (énergie + taux de production par ressource) ───
  // Calculé à la demande pour que tout réagisse instantanément aux
  // placements/destructions de bâtiments. Les taux affichés reflètent
  // la production RÉELLE, pas théorique : un extracteur sans énergie
  // ou sur un stock plein contribue 0.
  function computeStats() {
    // Passe 1 : énergie globale (indépendante de la production)
    let energyTotal = state.energyBase;
    let energyUsed = 0;
    for (const b of state.buildings) {
      const def = BUILDINGS[b.type];
      if (def.energyProduction) energyTotal += def.energyProduction;
      if (def.energyUsage)      energyUsed  += def.energyUsage;
    }
    const hasEnergy = energyTotal >= energyUsed;

    // Passe 2 : taux par ressource. On n'additionne que ce qui produit
    // ou consomme RÉELLEMENT (pas l'idéal théorique).
    const rates = {};
    for (const k of Object.keys(RESOURCES)) rates[k] = 0;

    if (hasEnergy) {
      for (const b of state.buildings) {
        const def = BUILDINGS[b.type];
        if (b.type === 'extracteur') {
          const r = state.tiles[b.row][b.col].resource;
          // Stock plein → l'extracteur tourne pour rien, on ne compte pas.
          if (r && state.stocks[r] < state.storageCap) {
            rates[r] += def.productionPerTick;
          }
        } else if (def.recipe) {
          // Recettes : on garde le calcul théorique (cycle moyen) car
          // la simulation par bâtiment est trop coûteuse à reproduire ici.
          // Acceptable parce que le joueur voit la barre de progression
          // sur chaque bâtiment pour distinguer actif/idle.
          const sec = def.recipe.cycleMs / 1000;
          rates[def.recipe.output] += def.recipe.qty / sec;
          for (const [r, n] of Object.entries(def.recipe.input)) {
            rates[r] -= n / sec;
          }
        }
      }
    }

    // Revenu attendu : produit × prix, capé par la vente auto.
    let expectedRevenue = 0;
    for (const [r, rate] of Object.entries(rates)) {
      const sellable = Math.max(0, Math.min(rate, SELL_RATE_PER_TICK));
      expectedRevenue += sellable * RESOURCES[r].price;
    }

    return { energyTotal, energyUsed, hasEnergy, rates, expectedRevenue };
  }

  // ─── Tick : production + ventes auto ────────────────────────────
  function tick() {
    const stats = computeStats();
    state.energyTotal = stats.energyTotal;
    state.energyUsed  = stats.energyUsed;

    // 1. Production. Si pas assez d'énergie → toutes les machines à
    //    consommation sont bloquées (all-or-nothing, simple à comprendre).
    if (stats.hasEnergy) {
      for (const b of state.buildings) {
        const def = BUILDINGS[b.type];

        if (b.type === 'extracteur') {
          // Extracteur : produit la ressource de la tuile, capé.
          const r = state.tiles[b.row][b.col].resource;
          if (r && state.stocks[r] < state.storageCap) {
            state.stocks[r] = Math.min(state.storageCap, state.stocks[r] + def.productionPerTick);
          }
        } else if (def.recipe) {
          runRecipeTick(b, def.recipe);
        }
      }
    }

    // 2. Vente automatique : on écoule jusqu'à SELL_RATE_PER_TICK unités
    //    de chaque ressource par tick.
    let revenue = 0;
    for (const r of Object.keys(state.stocks)) {
      const sellQty = Math.min(state.stocks[r], SELL_RATE_PER_TICK);
      if (sellQty <= 0) continue;
      state.stocks[r] -= sellQty;
      revenue += sellQty * RESOURCES[r].price;
    }
    state.credits += revenue;

    updateHUD();
    // Sauvegarde auto à chaque tick (1 Hz). LocalStorage est synchrone
    // mais reste rapide sur un payload de cette taille (< 5 ko).
    saveGame();
  }

  // Avance d'un tick le cycle d'un bâtiment à recette. `b.progress` (en ms)
  // suit la progression du cycle. Le bâtiment a 3 états possibles :
  //   1. progress >= cycleMs et stock output plein → bloqué (waiting room)
  //   2. progress === 0 et input manquant → idle (waiting room)
  //   3. sinon → avance normalement
  // Cette séparation évite de consommer un input pour ensuite jeter
  // l'output si le stock est plein.
  function runRecipeTick(b, recipe) {
    if (!b.progress) b.progress = 0;

    // Cycle terminé en attente d'écoulement → on tente de livrer l'output
    if (b.progress >= recipe.cycleMs) {
      if (state.stocks[recipe.output] >= state.storageCap) return; // bloqué
      state.stocks[recipe.output] = Math.min(
        state.storageCap,
        state.stocks[recipe.output] + recipe.qty
      );
      b.progress = 0;
    }

    // Démarrage d'un nouveau cycle → on vérifie + on consomme les inputs
    if (b.progress === 0) {
      for (const [r, n] of Object.entries(recipe.input)) {
        if ((state.stocks[r] ?? 0) < n) return; // input manquant → on attend
      }
      for (const [r, n] of Object.entries(recipe.input)) {
        state.stocks[r] -= n;
      }
    }

    b.progress += TICK_MS;
  }

  // ─── Helpers de découverte / déblocage ──────────────────────────
  // Une ressource est "découverte" si elle est `basic: true` OU si une
  // recherche déjà unlock l'a révélée (champ `reveals`). Évite d'afficher
  // Lingot/Pièce dans le HUD avant que le joueur ait recherché Métallurgie.
  function isResourceDiscovered(key) {
    if (RESOURCES[key].basic) return true;
    return state.research.unlocked.some((rid) => (RESEARCH[rid].reveals || []).includes(key));
  }

  // Un bâtiment est jouable s'il n'est pas `locked` OU si une recherche
  // déjà acquise le débloque (champ `unlocks`).
  function isBuildingAvailable(key) {
    const def = BUILDINGS[key];
    if (!def.locked) return true;
    return state.research.unlocked.some((rid) => (RESEARCH[rid].unlocks || []).includes(key));
  }

  // ─── Mise à jour du HUD (DOM) ───────────────────────────────────
  let lastHudHash = '';
  function updateHUD() {
    // Recompute live — pas besoin d'attendre le tick (1 s) pour voir
    // l'énergie/€/s/taux de prod réagir aux placements.
    const stats = computeStats();

    // Stocks (haut gauche) — n'affiche que les ressources découvertes,
    // avec un badge "+N/s" (production) ou "-N/s" (consommation) pour
    // que le joueur voie le flux même quand le stock reste à 0.
    const stocksEl = document.getElementById('stocks');
    let html = '';
    for (const [key, def] of Object.entries(RESOURCES)) {
      if (!isResourceDiscovered(key)) continue;
      const qty = Math.floor(state.stocks[key]);
      const ratio = qty / state.storageCap;
      const fullClass = ratio >= 1 ? ' is-full' : (ratio >= 0.85 ? ' is-near' : '');
      const rate = stats.rates[key] || 0;
      let rateBadge = '';
      if (rate > 0.05) {
        rateBadge = `<span class="stock-rate is-positive">+${rate.toFixed(1)}/s</span>`;
      } else if (rate < -0.05) {
        rateBadge = `<span class="stock-rate is-negative">${rate.toFixed(1)}/s</span>`;
      }
      html += `
        <div class="stock-row${fullClass}">
          <span class="stock-icon" style="background:${def.color}"></span>
          <span class="stock-name">${def.short} · ${def.name}</span>
          ${rateBadge}
          <span class="stock-qty">${qty} / ${state.storageCap}</span>
        </div>`;
    }
    stocksEl.innerHTML = html;

    // Crédits + €/s + énergie (haut droite). expectedRevenue est calculé
    // live à partir des taux de production → réagit instantanément aux
    // placements, pas besoin d'attendre le prochain tick.
    document.getElementById('credits-value').textContent = formatCredits(state.credits) + ' €';
    document.getElementById('credits-rate').textContent =
      '+ ' + stats.expectedRevenue.toFixed(1) + ' €/s';
    const enEl = document.getElementById('credits-energy');
    enEl.textContent = `⚡ ${stats.energyUsed} / ${stats.energyTotal}`;
    enEl.classList.toggle('low', !stats.hasEnergy);

    // Bannière "énergie insuffisante" — visible seulement si on a déjà
    // posé au moins un bâtiment qui en consomme (sinon dès le départ
    // elle serait affichée alors qu'aucun problème réel n'existe).
    document.getElementById('energy-warning').hidden = stats.hasEnergy || stats.energyUsed === 0;

    // Palette (bas centre). Hash inclut l'affordability ET l'état de
    // déblocage de chaque bâtiment pour rebuild quand une recherche entre.
    const palette = document.getElementById('palette');
    const availables = Object.keys(BUILDINGS).filter(isBuildingAvailable);
    // Hash inclut la sélection courante (incluant le mode __demolish__),
    // les bâtiments dispos, et l'affordability de chacun → rebuild dès
    // qu'un de ces critères change.
    const hashParts = [state.selectedBuilding || '', availables.join(',')];
    for (const k of availables) hashParts.push(state.credits >= BUILDINGS[k].cost ? '1' : '0');
    const wantHash = hashParts.join('|');
    if (wantHash !== lastHudHash) {
      let pHtml = '';
      for (const key of availables) {
        const def = BUILDINGS[key];
        const affordable = state.credits >= def.cost;
        const isActive = state.selectedBuilding === key;
        pHtml += `
          <button
            class="palette-btn ${isActive ? 'active' : ''}"
            data-building="${key}"
            ${!affordable ? 'disabled' : ''}
          >
            <span class="palette-btn-icon">${def.icon}</span>
            <span class="palette-btn-name">${def.name}</span>
            <span class="palette-btn-cost">${def.cost} €</span>
          </button>`;
      }
      // Bouton "Démolir" — toujours présent, gratuit, refund 50% du coût.
      const demolishActive = state.selectedBuilding === '__demolish__';
      pHtml += `
        <button
          class="palette-btn palette-btn-demolish ${demolishActive ? 'active' : ''}"
          data-building="__demolish__"
        >
          <span class="palette-btn-icon">🗑️</span>
          <span class="palette-btn-name">Démolir</span>
          <span class="palette-btn-cost">+ 50%</span>
        </button>`;
      palette.innerHTML = pHtml;
      lastHudHash = wantHash;
      palette.querySelectorAll('.palette-btn').forEach((btn) => {
        btn.addEventListener('click', () => toggleSelection(btn.dataset.building));
      });
    }

    // Notif "achetable" sur le bouton Recherches s'il y a au moins une
    // techno qu'on peut acheter dès maintenant.
    const researchBtn = document.getElementById('research-btn');
    const hasAffordable = Object.entries(RESEARCH).some(([id, r]) =>
      !state.research.unlocked.includes(id)
      && r.requires.every((q) => state.research.unlocked.includes(q))
      && state.credits >= r.cost
    );
    researchBtn.classList.toggle('has-affordable', hasAffordable);
  }

  function formatCredits(n) {
    // Sépare les milliers par un espace insécable (style FR)
    return Math.floor(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  }

  // ─── Toast (message d'erreur éphémère) ──────────────────────────
  let toastTimer = null;
  function showToast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 1800);
  }

  // ─── Inputs unifiés (souris + tactile) ──────────────────────────
  // Toute la logique passe par 3 fonctions agnostiques (pointer*) qui
  // sont appelées indifféremment depuis les events souris ou tactiles.
  // Pour le tactile, on gère en plus le pinch-zoom à 2 doigts.

  function pointerDown(x, y) {
    state.mouse.x = x;
    state.mouse.y = y;
    state.dragging = true;
    state.dragMoved = false;
    state.dragStart = { x, y, camX: state.camera.x, camY: state.camera.y };
    // Important pour le tactile : on n'a pas de "mousemove" continu pour
    // garder hoverTile à jour. Sans ça, un tap sans mouvement utiliserait
    // la position du tap précédent → bâtiment posé au mauvais endroit.
    state.hoverTile = screenToTile(x, y);
    canvas.classList.add('grabbing');
  }

  function pointerMove(x, y) {
    state.mouse.x = x;
    state.mouse.y = y;
    if (state.dragging) {
      const dx = x - state.dragStart.x;
      const dy = y - state.dragStart.y;
      // Au-delà de 6 px on considère qu'on est en train de drag (un peu
      // plus généreux qu'à la souris pour éviter les faux drags tactiles).
      if (Math.abs(dx) + Math.abs(dy) > 6) state.dragMoved = true;
      state.camera.x = state.dragStart.camX + dx;
      state.camera.y = state.dragStart.camY + dy;
    }
    state.hoverTile = screenToTile(x, y);
  }

  function pointerUp() {
    canvas.classList.remove('grabbing');
    if (!state.dragging) return;
    state.dragging = false;
    // Tap/clic court → action selon le mode actif
    if (!state.dragMoved && state.hoverTile) {
      if (state.selectedBuilding === '__demolish__') {
        demolishAt(state.hoverTile.col, state.hoverTile.row);
      } else if (state.selectedBuilding) {
        placeBuilding(state.selectedBuilding, state.hoverTile.col, state.hoverTile.row);
      }
    }
  }

  // Applique un zoom centré sur le point (cx, cy) — utilisé par la molette
  // ET par le pinch tactile.
  function applyZoom(newZoom, cx, cy) {
    const oldZoom = state.camera.zoom;
    newZoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, newZoom));
    if (newZoom === oldZoom) return;
    const ratio = newZoom / oldZoom;
    state.camera.x = cx - (cx - state.camera.x) * ratio;
    state.camera.y = cy - (cy - state.camera.y) * ratio;
    state.camera.zoom = newZoom;
  }

  // ─── Souris ─────
  canvas.addEventListener('mousedown',  (e) => pointerDown(e.clientX, e.clientY));
  canvas.addEventListener('mousemove',  (e) => pointerMove(e.clientX, e.clientY));
  canvas.addEventListener('mouseup',    () => pointerUp());
  canvas.addEventListener('mouseleave', () => {
    state.dragging = false;
    state.hoverTile = null;
    canvas.classList.remove('grabbing');
  });
  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    const delta = -Math.sign(e.deltaY) * 0.1;
    applyZoom(state.camera.zoom + delta, e.clientX, e.clientY);
  }, { passive: false });

  // ─── Tactile ─────
  // Un doigt = pan (équivalent souris). Deux doigts = pinch-zoom.
  let pinchPrev = null;     // { dist, cx, cy } pendant un pinch en cours

  function getPinchData(touches) {
    const t1 = touches[0], t2 = touches[1];
    const dx = t2.clientX - t1.clientX;
    const dy = t2.clientY - t1.clientY;
    return {
      dist: Math.sqrt(dx * dx + dy * dy),
      cx: (t1.clientX + t2.clientX) / 2,
      cy: (t1.clientY + t2.clientY) / 2,
    };
  }

  canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    if (e.touches.length === 1) {
      const t = e.touches[0];
      pointerDown(t.clientX, t.clientY);
    } else if (e.touches.length === 2) {
      // Démarrage d'un pinch — on annule le drag éventuel
      state.dragging = false;
      pinchPrev = getPinchData(e.touches);
    }
  }, { passive: false });

  canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    if (e.touches.length === 1 && !pinchPrev) {
      const t = e.touches[0];
      pointerMove(t.clientX, t.clientY);
    } else if (e.touches.length === 2) {
      const cur = getPinchData(e.touches);
      if (pinchPrev) {
        const ratio = cur.dist / pinchPrev.dist;
        applyZoom(state.camera.zoom * ratio, cur.cx, cur.cy);
      }
      pinchPrev = cur;
    }
  }, { passive: false });

  canvas.addEventListener('touchend', (e) => {
    if (e.touches.length === 0) {
      pinchPrev = null;
      pointerUp();
    } else if (e.touches.length === 1) {
      // Fin du pinch mais un doigt reste : on évite que ça déclenche un tap
      pinchPrev = null;
      state.dragging = false;
    }
  });

  canvas.addEventListener('touchcancel', () => {
    pinchPrev = null;
    state.dragging = false;
    canvas.classList.remove('grabbing');
  });

  // ─── Clavier ────
  // Flèches = pan ; Échap = annule la sélection ; 1..N = sélectionne un bâtiment
  // dans l'ordre courant de la palette (recalculé à chaque pression pour
  // tenir compte des recherches qui débloquent de nouveaux bâtiments).
  function currentBuildingKeys() {
    return Object.keys(BUILDINGS).filter(isBuildingAvailable);
  }

  // Met à jour la sélection courante de manière cohérente — synchronise
  // les classes CSS du canvas (curseur) avec le state. Évite d'oublier
  // une classe quand on change de mode (placement → démolition → null).
  function setSelection(value) {
    state.selectedBuilding = value || null;
    canvas.classList.toggle('placing',
      !!state.selectedBuilding && state.selectedBuilding !== '__demolish__');
    canvas.classList.toggle('demolishing',
      state.selectedBuilding === '__demolish__');
    updateHUD();
  }
  // Toggle : si déjà sélectionné on revient au mode neutre.
  function toggleSelection(value) {
    setSelection(state.selectedBuilding === value ? null : value);
  }
  document.addEventListener('keydown', (e) => {
    // ESC traité en premier — ferme le modal ou clear la sélection.
    if (e.key === 'Escape') {
      if (!researchModal.hidden) closeResearchModal();
      else                       setSelection(null);
      return;
    }
    // Quand le modal Recherches est ouvert, on ignore tout le reste —
    // sinon flèches/D/1-5 modifieraient le state pendant la lecture.
    if (!researchModal.hidden) return;

    const step = 30;
    if (e.key === 'ArrowUp')    { state.camera.y += step; e.preventDefault(); }
    if (e.key === 'ArrowDown')  { state.camera.y -= step; e.preventDefault(); }
    if (e.key === 'ArrowLeft')  { state.camera.x += step; e.preventDefault(); }
    if (e.key === 'ArrowRight') { state.camera.x -= step; e.preventDefault(); }

    // 'D' = mode Démolir (toggle)
    if (e.key === 'd' || e.key === 'D') toggleSelection('__demolish__');

    // Raccourcis 1..N pour la palette, dérivés des bâtiments dispos.
    const idx = parseInt(e.key, 10) - 1;
    const keys = currentBuildingKeys();
    if (idx >= 0 && idx < keys.length) toggleSelection(keys[idx]);
  });

  // ─── Panneau Recherches ─────────────────────────────────────────
  const researchModal = document.getElementById('research-modal');
  const researchListEl = document.getElementById('research-list');

  function openResearchModal() {
    renderResearchModal();
    researchModal.hidden = false;
  }
  function closeResearchModal() {
    researchModal.hidden = true;
  }

  // Construit la liste des cartes de recherche. Chaque carte a 3 états :
  //   · unlocked   : déjà achetée → badge "ACQUIS"
  //   · locked     : prérequis manquant → opacity réduite + message
  //   · disponible : achetable si crédits suffisants
  function renderResearchModal() {
    let html = '';
    for (const [id, def] of Object.entries(RESEARCH)) {
      const unlocked = state.research.unlocked.includes(id);
      const reqsOk = def.requires.every((q) => state.research.unlocked.includes(q));
      const affordable = state.credits >= def.cost;
      let cls = 'research-card';
      if (unlocked)        cls += ' is-unlocked';
      else if (!reqsOk)    cls += ' is-locked';
      else if (affordable) cls += ' is-affordable';

      let actionHtml = '';
      if (unlocked) {
        actionHtml = '<span class="research-status">✓ Acquis</span>';
      } else if (!reqsOk) {
        const missing = def.requires
          .filter((q) => !state.research.unlocked.includes(q))
          .map((q) => RESEARCH[q].name).join(', ');
        actionHtml = `<span class="research-locked-msg">Prérequis : ${missing}</span>`;
      } else {
        actionHtml = `<button class="research-buy" data-research="${id}" ${affordable ? '' : 'disabled'}>
          Acheter pour ${def.cost} €
        </button>`;
      }

      html += `
        <div class="${cls}">
          <div class="research-card-head">
            <span class="research-card-icon">${def.icon}</span>
            <span class="research-card-name">${def.name}</span>
            <span class="research-card-cost">${def.cost} €</span>
          </div>
          <div class="research-card-desc">${def.desc}</div>
          <div class="research-card-action">${actionHtml}</div>
        </div>`;
    }
    researchListEl.innerHTML = html;
    // Re-bind des boutons d'achat
    researchListEl.querySelectorAll('.research-buy').forEach((btn) => {
      btn.addEventListener('click', () => buyResearch(btn.dataset.research));
    });
  }

  function buyResearch(id) {
    const def = RESEARCH[id];
    if (!def) return;
    if (state.research.unlocked.includes(id)) return;
    if (!def.requires.every((q) => state.research.unlocked.includes(q))) return;
    if (state.credits < def.cost) {
      showToast(`Pas assez de crédits (${def.cost} € requis)`);
      return;
    }
    state.credits -= def.cost;
    state.research.unlocked.push(id);
    showToast(`✓ ${def.name} débloqué !`);
    renderResearchModal();
    updateHUD();
  }

  document.getElementById('research-btn').addEventListener('click', openResearchModal);
  document.getElementById('research-close').addEventListener('click', closeResearchModal);
  document.getElementById('reset-btn').addEventListener('click', resetGame);
  // Clic sur le backdrop (mais pas sur le panel) ferme le modal
  researchModal.querySelector('.research-backdrop').addEventListener('click', closeResearchModal);

  // Empêche le menu contextuel sur clic droit (réservé pour usage futur)
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());

  // ─── Persistence (localStorage) ─────────────────────────────────
  // Sauvegarde automatique à chaque tick (1 Hz) — pas plus rapide,
  // localStorage est synchrone et bloquant. Au refresh de la page,
  // si une sauvegarde valide existe on la restaure ; sinon nouvelle partie.
  // Schéma versionné pour pouvoir migrer/casser proprement plus tard.
  const SAVE_KEY = 'iron-co-save-v1';
  const SAVE_VERSION = 1;
  let saveErrorReported = false; // évite de spammer le toast à chaque tick

  function saveGame() {
    try {
      const payload = {
        v: SAVE_VERSION,
        credits: state.credits,
        stocks: state.stocks,
        storageCap: state.storageCap,
        research: { unlocked: [...(state.research.unlocked || [])] },
        camera: { x: state.camera.x, y: state.camera.y, zoom: state.camera.zoom },
        // On sérialise les tuiles avec leur bâtiment éventuel — `state.buildings`
        // sera reconstruit au load à partir de ces références (single source of truth).
        tiles: state.tiles.map((row) => row.map((t) => ({
          type: t.type,
          resource: t.resource,
          building: t.building ? {
            type: t.building.type,
            col: t.building.col,
            row: t.building.row,
            progress: t.building.progress || 0,
          } : null,
        }))),
      };
      localStorage.setItem(SAVE_KEY, JSON.stringify(payload));
      saveErrorReported = false; // reset si on retombe sur un OK après un échec
      return true;
    } catch (e) {
      console.warn('[Iron & Co] échec sauvegarde:', e);
      // Avertit le joueur UNE FOIS — sinon le toast spam à chaque tick.
      // Cas typiques : quota dépassé, mode privé Safari (localStorage = 0 octet).
      if (!saveErrorReported) {
        showToast('⚠ Sauvegarde impossible — espace plein ou navigation privée');
        saveErrorReported = true;
      }
      return false;
    }
  }

  function loadGame() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return false;
      const data = JSON.parse(raw);
      if (!data || data.v !== SAVE_VERSION) return false;
      // Garde-fou : on refuse une save dont la grille est mal formée plutôt
      // que de planter le rendu. Le caller fallback sur generateGrid().
      if (!Array.isArray(data.tiles) || data.tiles.length !== GRID_SIZE) return false;
      if (!data.tiles.every((r) => Array.isArray(r) && r.length === GRID_SIZE)) return false;
      state.credits = data.credits ?? 200;
      // Merge avec tous les keys de RESOURCES pour gérer l'ajout de
      // nouvelles ressources entre 2 versions (lingot/piece initialisés à 0).
      state.stocks = { fer: 0, cuivre: 0, charbon: 0, lingot: 0, piece: 0, ...(data.stocks || {}) };
      state.storageCap = data.storageCap ?? 50;
      // Validation stricte de research.unlocked — si le champ est absent
      // ou pas un array, on tombe sur [] pour éviter les .includes() crash.
      state.research = {
        unlocked: Array.isArray(data.research?.unlocked) ? data.research.unlocked : [],
      };
      state.camera = data.camera || { x: 0, y: 0, zoom: 1 };
      state.tiles = data.tiles;
      // Reconstruction de state.buildings depuis tiles.
      state.buildings = [];
      for (const row of state.tiles) {
        for (const tile of row) {
          if (tile.building) state.buildings.push(tile.building);
        }
      }
      return true;
    } catch (e) {
      console.warn('[Iron & Co] échec chargement:', e);
      return false;
    }
  }

  function resetGame() {
    if (!confirm('Effacer la sauvegarde et recommencer une nouvelle partie ?')) return;
    try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
    location.reload();
  }

  // ─── Boucle principale ──────────────────────────────────────────
  function loop() {
    render();
    requestAnimationFrame(loop);
  }

  // ─── Démarrage ──────────────────────────────────────────────────
  // Tentative de restauration ; sinon nouvelle partie procédurale.
  const loaded = loadGame();
  if (!loaded) {
    generateGrid();
    centerCamera();
  }
  updateHUD();
  loop();
  setInterval(tick, TICK_MS);
  // Toast de bienvenue / confirmation de chargement (non bloquant)
  setTimeout(() => showToast(loaded ? '✓ Partie chargée' : 'Bienvenue ! Pose ton premier extracteur ⛏️'), 200);

  console.log('[Iron & Co]', loaded ? 'Save chargée' : 'Nouvelle partie',
    '— grille', GRID_SIZE + '×' + GRID_SIZE,
    '— ressources placées :',
    state.tiles.flat().filter((t) => t.type === 'resource').length);
  </script>
</body>
</html>
