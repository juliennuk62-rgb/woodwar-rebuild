      storageMult:   u.includes('stockage_massif') ? 2   : 1,
    };
  }
  function getEffectiveSellRate() {
    return SELL_RATE_PER_TICK + getResearchBoosts().sellRateBonus;
  }
  function getEffectiveStorageCap() {
    return Math.round(state.storageCap * getResearchBoosts().storageMult);
  }
  function getEffectiveEnergyBase() {
    return state.energyBase + getResearchBoosts().energyBonus;
  }

  function computeStats() {
    const boosts = getResearchBoosts();
    // Passe 1 : énergie globale (indépendante de la production)
    let energyTotal = state.energyBase + boosts.energyBonus;
    let energyUsed = 0;
    for (const b of state.buildings) {
      const def = BUILDINGS[b.type];
      if (def.energyProduction) energyTotal += def.energyProduction;
      if (def.energyUsage)      energyUsed  += def.energyUsage;
    }
    const hasEnergy = energyTotal >= energyUsed;

    // Passe 2 : taux par ressource. On n'additionne que ce qui produit
    // ou consomme RÉELLEMENT (pas l'idéal théorique).
    const rates = {};
    for (const k of Object.keys(RESOURCES)) rates[k] = 0;

    const cap = getEffectiveStorageCap();
    const sellRate = SELL_RATE_PER_TICK + boosts.sellRateBonus;
    if (hasEnergy) {
      for (const b of state.buildings) {
        const def = BUILDINGS[b.type];
        if (b.type === 'extracteur') {
          const r = state.tiles[b.row][b.col].resource;
          // Stock plein → l'extracteur tourne pour rien, on ne compte pas.
          // Le taux est modulé par la difficulté du minerai (prodRate) :
          // fer rapide (1.0), charbon medium (0.8), cuivre lent (0.6).
          if (r && state.stocks[r] < cap) {
            const tileRate = RESOURCES[r].prodRate ?? 1;
            rates[r] += def.productionPerTick * tileRate * boosts.extractorMult;
          }
        } else if (def.recipe) {
          // Recettes : taux théorique en supposant le cycle alimenté.
          // Le sec est divisé par cycleMult (recherche cycles_rapides
          // raccourcit le cycle → produit plus vite).
          const sec = (def.recipe.cycleMs * boosts.cycleMult) / 1000;
          rates[def.recipe.output] += def.recipe.qty / sec;
          for (const [r, n] of Object.entries(def.recipe.input)) {
            rates[r] -= n / sec;
          }
        }
      }
    }

    // Revenu attendu : produit × prix × multiplicateur prestige, capé
    // par la vente auto (boostée par recherche éventuelle).
    let expectedRevenue = 0;
    for (const [r, rate] of Object.entries(rates)) {
      const sellable = Math.max(0, Math.min(rate, sellRate));
      expectedRevenue += sellable * RESOURCES[r].price;
    }
    expectedRevenue *= getPrestigeMultiplier();

    return { energyTotal, energyUsed, hasEnergy, rates, expectedRevenue };
  }

  // ─── Tick : production + ventes auto ────────────────────────────
  function tick() {
    const stats = computeStats();
    state.energyTotal = stats.energyTotal;
    state.energyUsed  = stats.energyUsed;

    // 1. Production. Si pas assez d'énergie → toutes les machines à
    //    consommation sont bloquées (all-or-nothing, simple à comprendre).
    if (stats.hasEnergy) {
      const boosts = getResearchBoosts();
      const cap = getEffectiveStorageCap();
      for (const b of state.buildings) {
        const def = BUILDINGS[b.type];

        if (b.type === 'extracteur') {
          // Extracteur : produit la ressource de la tuile, modulé par la
          // difficulté du minerai (prodRate). Fer 1.0/s, charbon 0.8/s,
          // cuivre 0.6/s — le cuivre se monnaie sa rareté + sa lenteur.
          const r = state.tiles[b.row][b.col].resource;
          if (r && state.stocks[r] < cap) {
            const tileRate = RESOURCES[r].prodRate ?? 1;
            const produced = def.productionPerTick * tileRate * boosts.extractorMult;
            state.stocks[r] = Math.min(cap, state.stocks[r] + produced);
            // Le floater spawn avec proba = prodRate (fer 100%, cuivre 60%)
            // → on voit visuellement que le cuivre extrait moins souvent.
            if (Math.random() < tileRate) {
              spawnFloater(b.col, b.row, '+' + RESOURCES[r].price + '€', '#b6e8a3');
            }
          }
        } else if (def.recipe) {
          runRecipeTick(b, def.recipe);
        }
      }
    }

    // 2. Vente automatique : on écoule jusqu'à SELL_RATE_PER_TICK (+ boost
    //    "vente_acceleree") unités de chaque ressource par tick.
    const sellRate = SELL_RATE_PER_TICK + getResearchBoosts().sellRateBonus;
    let revenue = 0;
    for (const r of Object.keys(state.stocks)) {
      const sellQty = Math.min(state.stocks[r], sellRate);
      if (sellQty <= 0) continue;
      state.stocks[r] -= sellQty;
      revenue += sellQty * RESOURCES[r].price;
    }
    revenue *= getPrestigeMultiplier();
    state.credits += revenue;
    // Cumul lifetime pour calculer les tokens du prochain prestige.
    state.prestige.lifetimeEarned += revenue;

    updateHUD();
    // Sauvegarde auto à chaque tick (1 Hz). LocalStorage est synchrone
    // mais reste rapide sur un payload de cette taille (< 5 ko).
    saveGame();
  }

  // Avance d'un tick le cycle d'un bâtiment à recette. `b.progress` (en ms)
  // suit la progression du cycle. Le bâtiment a 3 états possibles :
  //   1. progress >= cycleMs et stock output plein → bloqué (waiting room)
  //   2. progress === 0 et input manquant → idle (waiting room)
  //   3. sinon → avance normalement
  // Cette séparation évite de consommer un input pour ensuite jeter
  // l'output si le stock est plein.
  function runRecipeTick(b, recipe) {
    if (!b.progress) b.progress = 0;
    // Boosts dynamiques : cycles plus rapides via recherche, cap plus
    // grand via "stockage_massif".
    const boosts = getResearchBoosts();
    const effectiveCycleMs = recipe.cycleMs * boosts.cycleMult;
    const cap = getEffectiveStorageCap();

    // Le tick avance le progress de TICK_MS. Plusieurs cycles peuvent être
    // complétés en un seul tick si effectiveCycleMs < TICK_MS (boost massif).
    // Surtout, on CONSERVE le surplus (progress -= effectiveCycleMs au lieu
    // de = 0) — sinon une recherche qui réduit le cycle de 2000 à 1400 ms ne
    // changeait rien parce que le progress passait quand même par 1000ms/tick
    // et perdait 600 ms à chaque reset à 0. Le boost cycles_rapides est
    // maintenant réellement effectif.
    b.progress += TICK_MS;

    // Inputs/outputs sont consommés/produits en même temps à la fin de chaque
    // cycle. Sémantique simplifiée vs l'ancien "consume at start" qui ne se
    // combinait pas avec les cycles multiples.
    while (b.progress >= effectiveCycleMs) {
      if (state.stocks[recipe.output] >= cap) {
        // Output plein → on clamp progress pour ne pas accumuler ad vitam
        b.progress = effectiveCycleMs;
        return;
      }
      // Tous les inputs présents ?
      let hasInputs = true;
      for (const [r, n] of Object.entries(recipe.input)) {
        if ((state.stocks[r] ?? 0) < n) { hasInputs = false; break; }
      }
      if (!hasInputs) {
        b.progress = effectiveCycleMs;
        return;
      }
      // Consume + produce
      for (const [r, n] of Object.entries(recipe.input)) {
        state.stocks[r] -= n;
      }
      state.stocks[recipe.output] = Math.min(cap, state.stocks[recipe.output] + recipe.qty);
      spawnFloater(b.col, b.row, '+' + (RESOURCES[recipe.output].price * recipe.qty) + '€', '#ffd166');
      b.progress -= effectiveCycleMs;
    }
  }

  // ─── Helpers de découverte / déblocage ──────────────────────────
  // Une ressource est "découverte" si elle est `basic: true` OU si une
  // recherche déjà unlock l'a révélée (champ `reveals`). Évite d'afficher
  // Lingot/Pièce dans le HUD avant que le joueur ait recherché Métallurgie.
  function isResourceDiscovered(key) {
    if (RESOURCES[key].basic) return true;
    return state.research.unlocked.some((rid) => (RESEARCH[rid].reveals || []).includes(key));
  }

  // Un bâtiment est jouable s'il n'est pas `locked` OU si une recherche
  // déjà acquise le débloque (champ `unlocks`).
  function isBuildingAvailable(key) {
    const def = BUILDINGS[key];
    if (!def.locked) return true;
    return state.research.unlocked.some((rid) => (RESEARCH[rid].unlocks || []).includes(key));
  }

  // ─── Mise à jour du HUD (DOM) ───────────────────────────────────
  let lastHudHash = '';
  function updateHUD() {
    // Recompute live — pas besoin d'attendre le tick (1 s) pour voir
    // l'énergie/€/s/taux de prod réagir aux placements.
    const stats = computeStats();

    // Stocks (haut gauche) — n'affiche que les ressources découvertes,
    // avec un badge "+N/s" (production) ou "-N/s" (consommation) pour
    // que le joueur voie le flux même quand le stock reste à 0.
    const stocksEl = document.getElementById('stocks');
    const effCap = getEffectiveStorageCap();
    let html = '';
    for (const [key, def] of Object.entries(RESOURCES)) {
      if (!isResourceDiscovered(key)) continue;
      const qty = Math.floor(state.stocks[key]);
      const ratio = qty / effCap;
      const fullClass = ratio >= 1 ? ' is-full' : (ratio >= 0.85 ? ' is-near' : '');
      const rate = stats.rates[key] || 0;
      let rateBadge = '';
      if (rate > 0.05) {
        rateBadge = `<span class="stock-rate is-positive">+${rate.toFixed(1)}/s</span>`;
      } else if (rate < -0.05) {
        rateBadge = `<span class="stock-rate is-negative">${rate.toFixed(1)}/s</span>`;
      }
      html += `
        <div class="stock-row${fullClass}">
          <span class="stock-icon" style="background:${def.color}"></span>
          <span class="stock-name">${def.short} · ${def.name}</span>
          ${rateBadge}
          <span class="stock-qty">${qty} / ${effCap}</span>
        </div>`;
    }
    stocksEl.innerHTML = html;

    // Crédits + €/s + énergie (haut droite). expectedRevenue est calculé
    // live à partir des taux de production → réagit instantanément aux
    // placements, pas besoin d'attendre le prochain tick.
    document.getElementById('credits-value').textContent = formatCredits(state.credits) + ' €';
    document.getElementById('credits-rate').textContent =
      '+ ' + stats.expectedRevenue.toFixed(1) + ' €/s';
    const enEl = document.getElementById('credits-energy');
    document.getElementById('credits-energy-text').textContent =
      `⚡ ${stats.energyUsed} / ${stats.energyTotal}`;
    enEl.classList.toggle('low', !stats.hasEnergy);
    // Mini-bar — ratio capé à 100% pour l'affichage visuel ; au-delà,
    // .low active la pulsation rouge pour signaler la surcharge.
    const ratio = stats.energyTotal > 0
      ? Math.min(100, (stats.energyUsed / stats.energyTotal) * 100)
      : 0;
    document.getElementById('credits-energy-bar').style.setProperty('--ratio', ratio + '%');

    // Bannière "énergie insuffisante" — visible seulement si on a déjà
    // posé au moins un bâtiment qui en consomme (sinon dès le départ
    // elle serait affichée alors qu'aucun problème réel n'existe).
    document.getElementById('energy-warning').hidden = stats.hasEnergy || stats.energyUsed === 0;

    // Palette (bas centre). Hash inclut l'affordability ET l'état de
    // déblocage de chaque bâtiment pour rebuild quand une recherche entre.
    const palette = document.getElementById('palette');
    const availables = Object.keys(BUILDINGS).filter(isBuildingAvailable);
    // Hash inclut la sélection courante (incluant le mode __demolish__),
    // les bâtiments dispos, et l'affordability de chacun → rebuild dès
    // qu'un de ces critères change.
    const hashParts = [state.selectedBuilding || '', availables.join(',')];
    for (const k of availables) hashParts.push(state.credits >= BUILDINGS[k].cost ? '1' : '0');
    const wantHash = hashParts.join('|');
    if (wantHash !== lastHudHash) {
      let pHtml = '';
      for (const key of availables) {
        const def = BUILDINGS[key];
        const affordable = state.credits >= def.cost;
        const isActive = state.selectedBuilding === key;
        pHtml += `
          <button
            class="palette-btn ${isActive ? 'active' : ''}"
            data-building="${key}"
            ${!affordable ? 'disabled' : ''}
          >
            <span class="palette-btn-icon">${def.icon}</span>
            <span class="palette-btn-name">${def.name}</span>
            <span class="palette-btn-cost">${def.cost} €</span>
            ${def.info ? `<span class="palette-btn-info">${def.info}</span>` : ''}
          </button>`;
      }
      // Bouton "Démolir" — toujours présent, gratuit, refund 50% du coût.
      const demolishActive = state.selectedBuilding === '__demolish__';
      pHtml += `
        <button
          class="palette-btn palette-btn-demolish ${demolishActive ? 'active' : ''}"
          data-building="__demolish__"
        >
          <span class="palette-btn-icon">🗑️</span>
          <span class="palette-btn-name">Démolir</span>
          <span class="palette-btn-cost">refund 50%</span>
          <span class="palette-btn-info">Tap un bâtiment</span>
        </button>`;
      palette.innerHTML = pHtml;
      lastHudHash = wantHash;
      palette.querySelectorAll('.palette-btn').forEach((btn) => {
        btn.addEventListener('click', () => toggleSelection(btn.dataset.building));
      });
    }

    // Notif "achetable" sur le bouton Recherches s'il y a au moins une
    // techno qu'on peut acheter dès maintenant.
    const researchBtn = document.getElementById('research-btn');
    const hasAffordable = Object.entries(RESEARCH).some(([id, r]) =>
      !state.research.unlocked.includes(id)
      && r.requires.every((q) => state.research.unlocked.includes(q))
      && state.credits >= r.cost
    );
    researchBtn.classList.toggle('has-affordable', hasAffordable);

    // ── Prestige : indicateur permanent + bouton conditionnel ──
    const prestigeEl = document.getElementById('credits-prestige');
    const tokens = state.prestige.tokens || 0;
    if (tokens > 0) {
      prestigeEl.hidden = false;
      document.getElementById('credits-prestige-count').textContent = tokens;
      document.getElementById('credits-prestige-mult').textContent =
        '×' + getPrestigeMultiplier().toFixed(2);
    } else {
      prestigeEl.hidden = true;
    }
    // Le bouton n'apparaît que quand on a au moins 1 token à gagner.
    const prestigeBtn = document.getElementById('prestige-btn');
    const gain = prestigeTokensGain();
    prestigeBtn.hidden = gain <= 0;
    if (gain > 0) {
      prestigeBtn.textContent = `💎 Prestige +${gain}`;
    }
  }

  function formatCredits(n) {
    // Sépare les milliers par un espace insécable (style FR)
    return Math.floor(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  }

  // ─── Toast (message d'erreur éphémère) ──────────────────────────
  let toastTimer = null;
  function showToast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 1800);
  }

  // ─── Inputs unifiés (souris + tactile) ──────────────────────────
  // Toute la logique passe par 3 fonctions agnostiques (pointer*) qui
  // sont appelées indifféremment depuis les events souris ou tactiles.
  // Pour le tactile, on gère en plus le pinch-zoom à 2 doigts.

  function pointerDown(x, y) {
    state.mouse.x = x;
    state.mouse.y = y;
    state.dragging = true;
    state.dragMoved = false;
    state.dragStart = { x, y, camX: state.camera.x, camY: state.camera.y };
    // Important pour le tactile : on n'a pas de "mousemove" continu pour
    // garder hoverTile à jour. Sans ça, un tap sans mouvement utiliserait
    // la position du tap précédent → bâtiment posé au mauvais endroit.
    state.hoverTile = screenToTile(x, y);
    canvas.classList.add('grabbing');
  }

  function pointerMove(x, y) {
    state.mouse.x = x;
    state.mouse.y = y;
    if (state.dragging) {
      const dx = x - state.dragStart.x;
      const dy = y - state.dragStart.y;
      // Au-delà de 6 px on considère qu'on est en train de drag (un peu
      // plus généreux qu'à la souris pour éviter les faux drags tactiles).
      if (Math.abs(dx) + Math.abs(dy) > 6) state.dragMoved = true;
      state.camera.x = state.dragStart.camX + dx;
      state.camera.y = state.dragStart.camY + dy;
    }
    state.hoverTile = screenToTile(x, y);
  }

  function pointerUp() {
    canvas.classList.remove('grabbing');
    if (!state.dragging) return;
    state.dragging = false;
    // Tap/clic court → action selon le mode actif
    if (!state.dragMoved && state.hoverTile) {
      if (state.selectedBuilding === '__demolish__') {
        demolishAt(state.hoverTile.col, state.hoverTile.row);
      } else if (state.selectedBuilding) {
        placeBuilding(state.selectedBuilding, state.hoverTile.col, state.hoverTile.row);
      }
    }
  }

  // Applique un zoom centré sur le point (cx, cy) — utilisé par la molette
  // ET par le pinch tactile.
  function applyZoom(newZoom, cx, cy) {
    const oldZoom = state.camera.zoom;
    newZoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, newZoom));
    if (newZoom === oldZoom) return;
    const ratio = newZoom / oldZoom;
    state.camera.x = cx - (cx - state.camera.x) * ratio;
    state.camera.y = cy - (cy - state.camera.y) * ratio;
    state.camera.zoom = newZoom;
  }

  // ─── Souris ─────
  canvas.addEventListener('mousedown',  (e) => pointerDown(e.clientX, e.clientY));
  canvas.addEventListener('mousemove',  (e) => pointerMove(e.clientX, e.clientY));
  canvas.addEventListener('mouseup',    () => pointerUp());
  canvas.addEventListener('mouseleave', () => {
    state.dragging = false;
    state.hoverTile = null;
    canvas.classList.remove('grabbing');
  });
  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    const delta = -Math.sign(e.deltaY) * 0.1;
    applyZoom(state.camera.zoom + delta, e.clientX, e.clientY);
  }, { passive: false });

  // ─── Tactile ─────
  // Un doigt = pan (équivalent souris). Deux doigts = pinch-zoom.
  let pinchPrev = null;     // { dist, cx, cy } pendant un pinch en cours

  function getPinchData(touches) {
    const t1 = touches[0], t2 = touches[1];
    const dx = t2.clientX - t1.clientX;
    const dy = t2.clientY - t1.clientY;
    return {
      dist: Math.sqrt(dx * dx + dy * dy),
      cx: (t1.clientX + t2.clientX) / 2,
      cy: (t1.clientY + t2.clientY) / 2,
    };
  }

  canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    if (e.touches.length === 1) {
      const t = e.touches[0];
      pointerDown(t.clientX, t.clientY);
    } else if (e.touches.length === 2) {
      // Démarrage d'un pinch — on annule le drag éventuel
      state.dragging = false;
      pinchPrev = getPinchData(e.touches);
    }
  }, { passive: false });

  canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    if (e.touches.length === 1 && !pinchPrev) {
      const t = e.touches[0];
      pointerMove(t.clientX, t.clientY);
    } else if (e.touches.length === 2) {
      const cur = getPinchData(e.touches);
      if (pinchPrev) {
        const ratio = cur.dist / pinchPrev.dist;
        applyZoom(state.camera.zoom * ratio, cur.cx, cur.cy);
      }
      pinchPrev = cur;
    }
  }, { passive: false });

  canvas.addEventListener('touchend', (e) => {
    if (e.touches.length === 0) {
      pinchPrev = null;
      pointerUp();
    } else if (e.touches.length === 1) {
      // Fin du pinch mais un doigt reste : on évite que ça déclenche un tap
      pinchPrev = null;
      state.dragging = false;
    }
  });

  canvas.addEventListener('touchcancel', () => {
    pinchPrev = null;
    state.dragging = false;
    canvas.classList.remove('grabbing');
  });

  // ─── Clavier ────
  // Flèches = pan ; Échap = annule la sélection ; 1..N = sélectionne un bâtiment
  // dans l'ordre courant de la palette (recalculé à chaque pression pour
  // tenir compte des recherches qui débloquent de nouveaux bâtiments).
  function currentBuildingKeys() {
    return Object.keys(BUILDINGS).filter(isBuildingAvailable);
  }

  // Met à jour la sélection courante de manière cohérente — synchronise
  // les classes CSS du canvas (curseur) avec le state. Évite d'oublier
  // une classe quand on change de mode (placement → démolition → null).
  function setSelection(value) {
    state.selectedBuilding = value || null;
    canvas.classList.toggle('placing',
      !!state.selectedBuilding && state.selectedBuilding !== '__demolish__');
    canvas.classList.toggle('demolishing',
      state.selectedBuilding === '__demolish__');
    updateHUD();
  }
  // Toggle : si déjà sélectionné on revient au mode neutre.
  function toggleSelection(value) {
    setSelection(state.selectedBuilding === value ? null : value);
  }
  document.addEventListener('keydown', (e) => {
    // ESC traité en premier — ferme le modal ou clear la sélection.
    if (e.key === 'Escape') {
      if (!researchModal.hidden) closeResearchModal();
      else                       setSelection(null);
      return;
    }
    // Quand le modal Recherches est ouvert, on ignore tout le reste —
    // sinon flèches/D/1-5 modifieraient le state pendant la lecture.
    if (!researchModal.hidden) return;

    const step = 30;
    if (e.key === 'ArrowUp')    { state.camera.y += step; e.preventDefault(); }
    if (e.key === 'ArrowDown')  { state.camera.y -= step; e.preventDefault(); }
    if (e.key === 'ArrowLeft')  { state.camera.x += step; e.preventDefault(); }
    if (e.key === 'ArrowRight') { state.camera.x -= step; e.preventDefault(); }

    // 'D' = mode Démolir (toggle)
    if (e.key === 'd' || e.key === 'D') toggleSelection('__demolish__');

    // Raccourcis 1..N pour la palette, dérivés des bâtiments dispos.
    const idx = parseInt(e.key, 10) - 1;
    const keys = currentBuildingKeys();
    if (idx >= 0 && idx < keys.length) toggleSelection(keys[idx]);
  });

  // ─── Panneau Recherches ─────────────────────────────────────────
  const researchModal = document.getElementById('research-modal');
  const researchListEl = document.getElementById('research-list');

  function openResearchModal() {
    renderResearchModal();
    researchModal.classList.remove('closing');
    researchModal.hidden = false;
  }
  // Fermeture animée : on ajoute la classe .closing → l'animation
  // CSS modal-fade-out joue, puis on hide réellement après sa durée.
  let closingTimer = null;
  function closeResearchModal() {
    if (researchModal.hidden) return;
    researchModal.classList.add('closing');
    clearTimeout(closingTimer);
    closingTimer = setTimeout(() => {
      researchModal.hidden = true;
      researchModal.classList.remove('closing');
    }, 180);
  }

  // Construit la liste des cartes de recherche. Chaque carte a 3 états :
  //   · unlocked   : déjà achetée → badge "ACQUIS"
  //   · locked     : prérequis manquant → opacity réduite + message
  //   · disponible : achetable si crédits suffisants
  function renderResearchModal() {
    let html = '';
    for (const [id, def] of Object.entries(RESEARCH)) {
      const unlocked = state.research.unlocked.includes(id);
      const reqsOk = def.requires.every((q) => state.research.unlocked.includes(q));
      const affordable = state.credits >= def.cost;
      let cls = 'research-card';
      if (unlocked)        cls += ' is-unlocked';
      else if (!reqsOk)    cls += ' is-locked';
      else if (affordable) cls += ' is-affordable';

      let actionHtml = '';
      if (unlocked) {
        actionHtml = '<span class="research-status">✓ Acquis</span>';
      } else if (!reqsOk) {
        const missing = def.requires
          .filter((q) => !state.research.unlocked.includes(q))
          .map((q) => RESEARCH[q].name).join(', ');
        actionHtml = `<span class="research-locked-msg">Prérequis : ${missing}</span>`;
      } else {
        actionHtml = `<button class="research-buy" data-research="${id}" ${affordable ? '' : 'disabled'}>
          Acheter pour ${def.cost} €
        </button>`;
      }

      html += `
        <div class="${cls}">
          <div class="research-card-head">
            <span class="research-card-icon">${def.icon}</span>
            <span class="research-card-name">${def.name}</span>
            <span class="research-card-cost">${def.cost} €</span>
          </div>
          <div class="research-card-desc">${def.desc}</div>
          <div class="research-card-action">${actionHtml}</div>
        </div>`;
    }
    researchListEl.innerHTML = html;
    // Re-bind des boutons d'achat
    researchListEl.querySelectorAll('.research-buy').forEach((btn) => {
      btn.addEventListener('click', () => buyResearch(btn.dataset.research));
    });
  }

  function buyResearch(id) {
    const def = RESEARCH[id];
    if (!def) return;
    if (state.research.unlocked.includes(id)) return;
    if (!def.requires.every((q) => state.research.unlocked.includes(q))) return;
    if (state.credits < def.cost) {
      showToast(`Pas assez de crédits (${def.cost} € requis)`);
      return;
    }
    state.credits -= def.cost;
    state.research.unlocked.push(id);
    showToast(`✓ ${def.name} débloqué !`);
    renderResearchModal();
    updateHUD();
  }

  document.getElementById('research-btn').addEventListener('click', openResearchModal);
  document.getElementById('prestige-btn').addEventListener('click', doPrestige);
  document.getElementById('research-close').addEventListener('click', closeResearchModal);
  document.getElementById('reset-btn').addEventListener('click', resetGame);
  // Clic sur le backdrop (mais pas sur le panel) ferme le modal
  researchModal.querySelector('.research-backdrop').addEventListener('click', closeResearchModal);

  // Empêche le menu contextuel sur clic droit (réservé pour usage futur)
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());

  // ─── Persistence (localStorage) ─────────────────────────────────
  // Sauvegarde automatique à chaque tick (1 Hz) — pas plus rapide,
  // localStorage est synchrone et bloquant. Au refresh de la page,
  // si une sauvegarde valide existe on la restaure ; sinon nouvelle partie.
  // Schéma versionné pour pouvoir migrer/casser proprement plus tard.
  const SAVE_KEY = 'iron-co-save-v1';
  const SAVE_VERSION = 1;
  let saveErrorReported = false; // évite de spammer le toast à chaque tick

  function saveGame() {
    try {
      const payload = {
        v: SAVE_VERSION,
        credits: state.credits,
        stocks: state.stocks,
        storageCap: state.storageCap,
        research: { unlocked: [...(state.research.unlocked || [])] },
        prestige: {
          tokens: state.prestige.tokens || 0,
          lifetimeEarned: state.prestige.lifetimeEarned || 0,
          totalPrestiges: state.prestige.totalPrestiges || 0,
        },
        camera: { x: state.camera.x, y: state.camera.y, zoom: state.camera.zoom },
        theme: state.theme || 'classic',
        speedMul: state.speedMul == null ? 1 : state.speedMul,
        gridSize: GRID_SIZE,
        // On sérialise les tuiles avec leur bâtiment éventuel — `state.buildings`
        // sera reconstruit au load à partir de ces références (single source of truth).
        tiles: state.tiles.map((row) => row.map((t) => ({
          type: t.type,
          resource: t.resource,
          building: t.building ? {
            type: t.building.type,
            col: t.building.col,
            row: t.building.row,
            progress: t.building.progress || 0,
          } : null,
        }))),
      };
      localStorage.setItem(SAVE_KEY, JSON.stringify(payload));
      saveErrorReported = false; // reset si on retombe sur un OK après un échec
      return true;
    } catch (e) {
      console.warn('[Iron & Co] échec sauvegarde:', e);
      // Avertit le joueur UNE FOIS — sinon le toast spam à chaque tick.
      // Cas typiques : quota dépassé, mode privé Safari (localStorage = 0 octet).
      if (!saveErrorReported) {
        showToast('⚠ Sauvegarde impossible — espace plein ou navigation privée');
        saveErrorReported = true;
      }
      return false;
    }
  }

  function loadGame() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return false;
      const data = JSON.parse(raw);
      if (!data || data.v !== SAVE_VERSION) return false;
      // Garde-fou : on refuse une save dont la grille est mal formée plutôt
      // que de planter le rendu. Le caller fallback sur generateGrid().
      // Validation tiles : on accepte n'importe quelle taille carrée entre
       // 20 et 60 (les paliers de gridSizeFor). On adopte la taille de la save.
      if (!Array.isArray(data.tiles)) return false;
      const savedGrid = data.tiles.length;
      if (savedGrid < 20 || savedGrid > 60) return false;
      if (!data.tiles.every((r) => Array.isArray(r) && r.length === savedGrid)) return false;
      GRID_SIZE = savedGrid; // adopte la taille du save
      state.credits = data.credits ?? 200;
      // Merge avec tous les keys de RESOURCES pour gérer l'ajout de
      // nouvelles ressources entre 2 versions (lingot/piece initialisés à 0).
      state.stocks = { fer: 0, cuivre: 0, charbon: 0, lingot: 0, piece: 0, composant: 0, module: 0, ...(data.stocks || {}) };
      state.storageCap = data.storageCap ?? 50;
      // Validation stricte de research.unlocked — si le champ est absent
      // ou pas un array, on tombe sur [] pour éviter les .includes() crash.
      state.research = {
        unlocked: Array.isArray(data.research?.unlocked) ? data.research.unlocked : [],
      };
      // Prestige — defaults conservateurs si la clé manque. Migration douce
      // pour les saves antérieures à la feature : on bootstrap lifetimeEarned
      // avec les crédits actuels (proxy conservateur — credits sous-estime
      // le lifetime réel puisque tu en as dépensé une partie en bâtiments,
      // mais c'est le mieux qu'on puisse faire sans tracking historique).
      const hasPrestigeData = data.prestige && typeof data.prestige === 'object';
      state.prestige = {
        tokens: Number(data.prestige?.tokens) || 0,
        lifetimeEarned: hasPrestigeData
          ? Number(data.prestige.lifetimeEarned) || 0
          : Number(data.credits) || 0,
        totalPrestiges: Number(data.prestige?.totalPrestiges) || 0,
      };
      state.camera = data.camera || { x: 0, y: 0, zoom: 1 };
      state.theme = (data.theme === 'neo' || data.theme === 'classic') ? data.theme : 'classic';
      state.speedMul = [0, 1, 2, 4].includes(data.speedMul) ? data.speedMul : 1;
      state.tiles = data.tiles;
      // Reconstruction de state.buildings depuis tiles.
      state.buildings = [];
      for (const row of state.tiles) {
        for (const tile of row) {
          if (tile.building) {
            // performance.now() redémarre à 0 à chaque page load — un placedAt
            // hérité de la session précédente donne age = now - placedAt < 0
            // → scale aberrant. On le drop pour que les bâtiments anciens
            // s'affichent en taille pleine immédiatement.
            delete tile.building.placedAt;
            state.buildings.push(tile.building);
          }
        }
      }
      return true;
    } catch (e) {
      console.warn('[Iron & Co] échec chargement:', e);
      return false;
    }
  }

  function resetGame() {
    if (!confirm('Effacer la sauvegarde et recommencer une nouvelle partie ?')) return;
    try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
    location.reload();
  }

  // ─── Prestige : reset partiel mais GARDE les jetons ─────────────
  // À l'inverse de resetGame() qui remet à zéro absolu, doPrestige()
  // accorde N nouveaux jetons (basés sur lifetimeEarned), wipe l'état
  // de jeu (crédits, bâtiments, stocks, recherches), et regénère une
  // grille fraîche. Les jetons amplifient les revenus de la prochaine
  // partie → boucle d'auto-progression infinie.
  function doPrestige() {
    const gain = prestigeTokensGain();
    if (gain <= 0) return false;
    if (!confirm(`Effectuer le prestige ?\n\nTu vas gagner ${gain} Lingots Précieux 💎\n(bonus permanent : +${(gain * PRESTIGE_BONUS_PER_TOKEN * 100).toFixed(0)} % revenu)\n\nCrédits, bâtiments, stocks et recherches seront RESET. Les jetons sont conservés.`)) return false;

    const newTokens = state.prestige.tokens + gain;
    const newTotal = (state.prestige.totalPrestiges || 0) + 1;
    // Reset de l'état de jeu — on garde uniquement le bloc prestige.
    state.credits = 200;
    state.stocks = { fer: 0, cuivre: 0, charbon: 0, lingot: 0, piece: 0, composant: 0, module: 0 };
    state.storageCap = 50;
    state.research = { unlocked: [] };
    state.buildings = [];
    state.floaters = [];
    state.demolishGhosts = [];
    state.selectedBuilding = null;
    state.prestige = { tokens: newTokens, lifetimeEarned: 0, totalPrestiges: newTotal };
    // Map plus grande à chaque prestige (jusqu'au plafond) — récompense
    // visuelle et stratégique : plus de tuiles pour exploiter, plus de
    // cuivre rare disponible.
    GRID_SIZE = gridSizeFor(newTotal);
    generateGrid();
    centerCamera();
    canvas.classList.remove('placing', 'demolishing');
    // Si on était en mode 3D, sync la scène avec la nouvelle grille.
    if (state.theme === '3d' && three.inited) rebuildTiles3D();
    closeResearchModal();
    saveGame();
    updateHUD();
    showToast(`💎 Prestige #${newTotal} — +${gain} Lingots Précieux (bonus ×${(1 + newTokens * PRESTIGE_BONUS_PER_TOKEN).toFixed(2)})`);
    return true;
  }

  // ─── Boucle principale ──────────────────────────────────────────
  function loop() {
    if (state.theme === '3d' && three.inited) {
      render3D();
    } else {
      render();
    }
    // Mini-map redraw throttled à ~5 Hz (suffit pour suivre la caméra)
    if ((loop._mmTick = (loop._mmTick || 0) + 1) % 12 === 0) drawMinimap();
    requestAnimationFrame(loop);
  }

  // ═══════════════════════════════════════════════════════════════
  // SKIN 3D BETA — Three.js scène isométrique. État de jeu inchangé.
  // ═══════════════════════════════════════════════════════════════
  const three = {
    inited: false,
    renderer: null,
    scene: null,
    camera: null,
    raycaster: null,
    pointer: null, // Vector2 NDC
    tileGroup: null,
    buildingGroup: null,
    hoverHelper: null,
    // Drag state propre au 3D (le 2D a son propre state.dragging)
    dragging3d: false,
    dragStart3d: null,
    dragMoved3d: false,
    cameraOffset: null,    // pivot world position (XZ) — on pan en bougeant ça
    cameraZoom: 1,
    cameraYaw: Math.PI / 4,   // rotation horizontale (autour de l'axe Y) — démarre à 45° pour un angle iso
    cameraPitch: Math.PI / 6, // inclinaison verticale — 30° par défaut (iso)
  };
  const TILE_3D = 1;       // taille d'une tuile en unités world
  // GRID_HALF est dérivé dynamiquement dans tilePosition3D — pas const
  // car GRID_SIZE peut changer après un prestige.

  function init3D() {
    if (three.inited) {
      // Resize au cas où la fenêtre a changé pendant qu'on était en 2D
      resize3D();
      // Resync : on a peut-être placé/démoli en 2D pendant qu'on était
      // sur l'autre skin, ou prestige a régénéré la grille. La scène 3D
      // était figée → rebuild complet pour refléter l'état actuel.
      rebuildTiles3D();
      return;
    }
    three.inited = true;
    const c = document.getElementById('game3d');
    three.renderer = new THREE.WebGLRenderer({ canvas: c, antialias: true });
    three.renderer.setPixelRatio(window.devicePixelRatio || 1);
    three.renderer.shadowMap.enabled = true;
    three.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    three.scene = new THREE.Scene();
    three.scene.background = new THREE.Color(0x1a1f1a);
    // Pas de fog : visibilité uniforme partout (demande user). Les bâtiments
    // distants restent aussi nets que ceux du centre.

    // Caméra orthographique avec angle iso classique (rotation Y -45° puis X 30°)
    three.camera = new THREE.OrthographicCamera(-12, 12, 8, -8, 0.1, 200);
    three.cameraOffset = new THREE.Vector3(0, 0, 0); // pivot
    three.cameraZoom = 1;
    updateCamera3D();

    // Lumière directionnelle (soleil) avec ombres
    const sun = new THREE.DirectionalLight(0xffffff, 1.2);
    sun.position.set(20, 30, 15);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -20; sun.shadow.camera.right = 20;
    sun.shadow.camera.top = 20; sun.shadow.camera.bottom = -20;
    sun.shadow.bias = -0.0005;
    three.scene.add(sun);
    three.scene.add(new THREE.AmbientLight(0xffffff, 0.45));
    // Hémisphère pour adoucir les ombres
    three.scene.add(new THREE.HemisphereLight(0xb6e8a3, 0x1a1f1a, 0.3));

    // Sol global (plan vert) pour recevoir les ombres
    const groundMat = new THREE.MeshStandardMaterial({ color: 0x2a3a2a });
    const groundGeo = new THREE.PlaneGeometry(80, 80);
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.01;
    ground.receiveShadow = true;
    three.scene.add(ground);

    three.tileGroup = new THREE.Group();
    three.buildingGroup = new THREE.Group();
    three.scene.add(three.tileGroup);
    three.scene.add(three.buildingGroup);
    rebuildTiles3D();

    // Hover helper (cube fil de fer pour matérialiser la tuile pointée)
    const hoverGeo = new THREE.BoxGeometry(TILE_3D * 1.02, 0.05, TILE_3D * 1.02);
    const hoverMat = new THREE.MeshBasicMaterial({ color: 0xffd166, transparent: true, opacity: 0.4 });
    three.hoverHelper = new THREE.Mesh(hoverGeo, hoverMat);
    three.hoverHelper.visible = false;
    three.scene.add(three.hoverHelper);

    three.raycaster = new THREE.Raycaster();
    three.pointer = new THREE.Vector2();
    setup3DInputs();
    resize3D();
    window.addEventListener('resize', resize3D);
  }

  function resize3D() {
    if (!three.renderer) return;
    const w = window.innerWidth, h = window.innerHeight;
    three.renderer.setSize(w, h, false);
    const aspect = w / h;
    const viewSize = 12 / three.cameraZoom;
    three.camera.left = -viewSize * aspect;
    three.camera.right = viewSize * aspect;
    three.camera.top = viewSize;
    three.camera.bottom = -viewSize;
    three.camera.updateProjectionMatrix();
  }

  function updateCamera3D() {
    // Caméra orbitale autour de cameraOffset selon yaw + pitch.
    // yaw  = rotation horizontale (autour de Y). 0 = face nord.
    // pitch = inclinaison (clampée 0.05..1.45 rad pour éviter passer sous le sol
    // ou regarder droit en haut, qui cassent l'orthographique).
    const isoDist = 30;
    const py = Math.max(0.05, Math.min(1.45, three.cameraPitch));
    const cosP = Math.cos(py), sinP = Math.sin(py);
    const cosY = Math.cos(three.cameraYaw), sinY = Math.sin(three.cameraYaw);
    // Position sphérique → cartésienne autour de l'offset
    three.camera.position.set(
      three.cameraOffset.x + isoDist * cosP * sinY,
      three.cameraOffset.y + isoDist * sinP,
      three.cameraOffset.z + isoDist * cosP * cosY
    );
    three.camera.lookAt(three.cameraOffset);
  }

  function tilePosition3D(col, row) {
    // Centre la grille à l'origine — col/row 0..GRID-1 → world -GRID_HALF..+GRID_HALF.
    // Recalculé à chaque appel pour suivre les changements de GRID_SIZE post-prestige.
    const half = (GRID_SIZE - 1) / 2;
    return { x: (col - half) * TILE_3D, z: (row - half) * TILE_3D };
  }

  function rebuildTiles3D() {
    // Reset complet (à l'init ou après un prestige qui régénère la grille)
    while (three.tileGroup.children.length) three.tileGroup.remove(three.tileGroup.children[0]);
    while (three.buildingGroup.children.length) three.buildingGroup.remove(three.buildingGroup.children[0]);

    const tileGeo = new THREE.BoxGeometry(TILE_3D * 0.96, 0.2, TILE_3D * 0.96);
    for (let r = 0; r < GRID_SIZE; r++) {
      for (let c = 0; c < GRID_SIZE; c++) {
        const tile = state.tiles[r][c];
        const pos = tilePosition3D(c, r);
        let color = 0x3a5a3a;
        if (tile.type === 'resource') color = parseInt(RESOURCES[tile.resource].color.slice(1), 16);
        const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.9 });
        const mesh = new THREE.Mesh(tileGeo, mat);
        mesh.position.set(pos.x, 0.1, pos.z);
        mesh.receiveShadow = true;
        mesh.userData = { col: c, row: r };
        three.tileGroup.add(mesh);
        if (tile.building) addBuildingMesh3D(tile.building);
      }
    }
  }

  function addBuildingMesh3D(b) {
    const def = BUILDINGS[b.type];
    const pos = tilePosition3D(b.col, b.row);
    const color = parseInt(def.color.slice(1), 16);
    const h = b.type === 'usine' ? 1.2 : (b.type === 'fonderie' || b.type === 'atelier' ? 1.0 : 0.7);
    const w = TILE_3D * 0.7;
    const geo = new THREE.BoxGeometry(w, h, w);
    const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.7, metalness: 0.2 });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(pos.x, 0.2 + h / 2, pos.z);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    mesh.userData = { col: b.col, row: b.row, buildingRef: b };
    // Animation pop : petit scale au spawn
    if (b.placedAt) {
      const age = performance.now() - b.placedAt;
      if (age < 280) {
        const t = age / 280;
        const ease = 1 + 2.7 * Math.pow(t - 1, 3) + 1.7 * Math.pow(t - 1, 2);
        const s = 0.4 + 0.6 * ease;
        mesh.scale.set(s, s, s);
      }
    }
    three.buildingGroup.add(mesh);

    // Détails par type — petit cylindre pour cheminée, etc.
    if (b.type === 'fonderie' || b.type === 'usine') {
      const chimGeo = new THREE.CylinderGeometry(0.08, 0.1, b.type === 'usine' ? 0.6 : 0.4, 8);
      const chimMat = new THREE.MeshStandardMaterial({ color: 0x4a3a2a, roughness: 0.8 });
      const chim = new THREE.Mesh(chimGeo, chimMat);
      chim.position.set(pos.x + 0.15, 0.2 + h + (b.type === 'usine' ? 0.3 : 0.2), pos.z + 0.15);
      chim.castShadow = true;
      three.buildingGroup.add(chim);
    } else if (b.type === 'extracteur') {
      // Petit derrick triangulaire
      const tipGeo = new THREE.ConeGeometry(0.12, 0.3, 4);
      const tipMat = new THREE.MeshStandardMaterial({ color: 0xfbbf24, roughness: 0.4, metalness: 0.6, emissive: 0xfbbf24, emissiveIntensity: 0.3 });
      const tip = new THREE.Mesh(tipGeo, tipMat);
      tip.position.set(pos.x, 0.2 + h + 0.2, pos.z);
      tip.castShadow = true;
      three.buildingGroup.add(tip);
    } else if (b.type === 'generateur') {
      // Antenne avec sphère lumineuse
      const sphGeo = new THREE.SphereGeometry(0.08, 8, 8);
      const sphMat = new THREE.MeshStandardMaterial({ color: 0xffd166, emissive: 0xffd166, emissiveIntensity: 0.7 });
      const sph = new THREE.Mesh(sphGeo, sphMat);
      sph.position.set(pos.x, 0.2 + h + 0.2, pos.z);
      three.buildingGroup.add(sph);
    }
  }

  function syncBuildings3D() {
    // Reconstruction simple : on vide et on rebuild les bâtiments à partir
    // du state. Pas optimal mais simple, et on a max ~50 bâtiments.
    while (three.buildingGroup.children.length) {
      three.buildingGroup.remove(three.buildingGroup.children[0]);
    }
    for (const b of state.buildings) addBuildingMesh3D(b);
  }

  function setup3DInputs() {
    const c = document.getElementById('game3d');
    let last3DSync = 0;

    function updatePointer(e) {
      const rect = c.getBoundingClientRect();
      three.pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      three.pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
    }
    function pickTile() {
      three.raycaster.setFromCamera(three.pointer, three.camera);
      const hits = three.raycaster.intersectObjects(three.tileGroup.children);
      if (hits.length === 0) return null;
      return hits[0].object.userData; // { col, row }
    }

    c.addEventListener('mousedown', (e) => {
      three.dragging3d = true;
      three.dragMoved3d = false;
      three.dragStart3d = { x: e.clientX, y: e.clientY,
        camX: three.cameraOffset.x, camZ: three.cameraOffset.z };
    });
    c.addEventListener('mousemove', (e) => {
      updatePointer(e);
      if (three.dragging3d) {
        const dx = e.clientX - three.dragStart3d.x;
        const dy = e.clientY - three.dragStart3d.y;
        if (Math.abs(dx) + Math.abs(dy) > 6) three.dragMoved3d = true;
        // Pan en world space — la projection iso fait que dy correspond à la
        // diagonale (col+row) et dx à l'antidiagonale (col-row). Approx : on
        // bouge la caméra dans le plan XZ proportionnellement.
        const k = 0.025 / three.cameraZoom;
        three.cameraOffset.x = three.dragStart3d.camX - dx * k - dy * k;
        three.cameraOffset.z = three.dragStart3d.camZ + dx * k - dy * k;
        updateCamera3D();
      }
      // Hover helper sur la tuile pointée
      const t = pickTile();
      if (t && state.selectedBuilding) {
        const pos = tilePosition3D(t.col, t.row);
        three.hoverHelper.position.set(pos.x, 0.21, pos.z);
        three.hoverHelper.visible = true;
        // Couleur selon validité
        const ok = state.selectedBuilding === '__demolish__'
          ? !!state.tiles[t.row][t.col].building
          : canPlaceBuilding(state.selectedBuilding, t.col, t.row).ok;
        three.hoverHelper.material.color.set(ok ? 0x8fbf7d : 0xff6b6b);
      } else {
        three.hoverHelper.visible = false;
      }
    });
    c.addEventListener('mouseup', () => {
      if (!three.dragging3d) return;
      three.dragging3d = false;
      if (!three.dragMoved3d) {
        const t = pickTile();
        if (t) {
          if (state.selectedBuilding === '__demolish__') {
            demolishAt(t.col, t.row); syncBuildings3D();
          } else if (state.selectedBuilding) {
            if (placeBuilding(state.selectedBuilding, t.col, t.row)) syncBuildings3D();
          }
        }
      }
    });
    c.addEventListener('wheel', (e) => {
      e.preventDefault();
      const delta = -Math.sign(e.deltaY) * 0.1;
      three.cameraZoom = Math.max(0.5, Math.min(2.5, three.cameraZoom + delta));
      resize3D();
    }, { passive: false });

    // Tactile basique : 1 doigt = drag/tap, comme la souris
    c.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        e.preventDefault();
        const t = e.touches[0];
        const fake = { clientX: t.clientX, clientY: t.clientY };
        three.dragging3d = true;
        three.dragMoved3d = false;
        three.dragStart3d = { x: t.clientX, y: t.clientY,
          camX: three.cameraOffset.x, camZ: three.cameraOffset.z };
        updatePointer(fake);
      }
    }, { passive: false });
    c.addEventListener('touchmove', (e) => {
      if (e.touches.length === 1 && three.dragging3d) {
        e.preventDefault();
        const t = e.touches[0];
        const dx = t.clientX - three.dragStart3d.x;
        const dy = t.clientY - three.dragStart3d.y;
        if (Math.abs(dx) + Math.abs(dy) > 6) three.dragMoved3d = true;
        const k = 0.025 / three.cameraZoom;
        three.cameraOffset.x = three.dragStart3d.camX - dx * k - dy * k;
        three.cameraOffset.z = three.dragStart3d.camZ + dx * k - dy * k;
        updateCamera3D();
      }
    }, { passive: false });
    c.addEventListener('touchend', (e) => {
      if (!three.dragging3d) return;
      three.dragging3d = false;
      if (!three.dragMoved3d) {
        const tt = pickTile();
        if (tt) {
          if (state.selectedBuilding === '__demolish__') {
            demolishAt(tt.col, tt.row); syncBuildings3D();
          } else if (state.selectedBuilding) {
            if (placeBuilding(state.selectedBuilding, tt.col, tt.row)) syncBuildings3D();
          }
        }
      }
    });
  }

  function render3D() {
    if (!three.renderer) return;
    // Animation pop des bâtiments récemment posés : on update les scales
    for (const m of three.buildingGroup.children) {
      const b = m.userData.buildingRef;
      if (!b || !b.placedAt) continue;
      const age = performance.now() - b.placedAt;
      if (age < 280) {
        const t = age / 280;
        const ease = 1 + 2.7 * Math.pow(t - 1, 3) + 1.7 * Math.pow(t - 1, 2);
        const s = 0.4 + 0.6 * ease;
        m.scale.set(s, s, s);
      } else if (m.scale.x !== 1) {
        m.scale.set(1, 1, 1);
      }
    }
    three.renderer.render(three.scene, three.camera);
  }

  // ─── Skin & speed controls ──────────────────────────────────────
  let tickIntervalId = null;
  function applyTheme(theme) {
    state.theme = theme;
    document.body.classList.remove('theme-classic', 'theme-neo', 'theme-3d');
    document.body.classList.add('theme-' + theme);
    document.querySelectorAll('.theme-tab').forEach((t) => {
      t.setAttribute('aria-pressed', t.dataset.theme === theme ? 'true' : 'false');
    });
    // Bascule entre canvas 2D et canvas 3D selon le skin
    const c2d = document.getElementById('game');
    const c3d = document.getElementById('game3d');
    const minimapEl = document.getElementById('minimap');
    if (theme === '3d') {
      if (typeof THREE === 'undefined') {
        // Three.js pas encore chargé — fallback CDN + retry. Si un
        // retry est déjà en cours (clic impatient), on l'annule pour
        // ne pas accumuler des intervals parallèles qui appelleraient
        // applyTheme('3d') plusieurs fois quand THREE arrive.
        if (window._threeRetryId) clearInterval(window._threeRetryId);
        showToast('Chargement de la 3D…');
        loadThreeJSFallback();
        const start = Date.now();
        window._threeRetryId = setInterval(() => {
          // L'utilisateur a peut-être changé d'avis pendant l'attente
          // (clic sur Classique/Néo) → on annule pour ne pas le forcer
          // de retour en 3D contre sa volonté.
          if (state.theme !== '3d') {
            clearInterval(window._threeRetryId); window._threeRetryId = null;
            return;
          }
          if (typeof THREE !== 'undefined') {
            clearInterval(window._threeRetryId); window._threeRetryId = null;
            applyTheme('3d');
          } else if (Date.now() - start > 12000) {
            clearInterval(window._threeRetryId); window._threeRetryId = null;
            showToast('⚠ ' + diagnose3DFailure());
            applyTheme('classic');
          }
        }, 250);
        return;
      }
      c2d.hidden = true;
      c3d.hidden = false;
      if (minimapEl) minimapEl.hidden = true;
      const camCtrl = document.getElementById('cam3d-ctrl');
      if (camCtrl) camCtrl.hidden = false;
      init3D();
    } else {
      c2d.hidden = false;
      c3d.hidden = true;
      if (minimapEl) minimapEl.hidden = false;
      const camCtrl = document.getElementById('cam3d-ctrl');
      if (camCtrl) camCtrl.hidden = true;
    }
  }

  // Bind des contrôles caméra 3D — appelé une seule fois au boot.
  function setupCam3DCtrl() {
    document.querySelectorAll('.cam3d-btn').forEach((b) => {
      b.addEventListener('click', () => {
        const action = b.dataset.cam;
        if (!three.inited) return;
        const ROT_STEP = Math.PI / 12; // 15°
        if (action === 'rot-l')  three.cameraYaw -= ROT_STEP;
        if (action === 'rot-r')  three.cameraYaw += ROT_STEP;
        if (action === 'tilt-u') three.cameraPitch = Math.min(1.45, three.cameraPitch + ROT_STEP);
        if (action === 'tilt-d') three.cameraPitch = Math.max(0.05, three.cameraPitch - ROT_STEP);
        if (action === 'reset') {
          three.cameraYaw = Math.PI / 4;
          three.cameraPitch = Math.PI / 6;
          three.cameraOffset.set(0, 0, 0);
          three.cameraZoom = 1;
          resize3D();
        }
        updateCamera3D();
      });
    });
  }

  // Charge Three.js depuis un CDN de secours (jsdelivr) si le tag <script>
  // initial (unpkg) a échoué. Ne fait rien si déjà chargé ou déjà tenté.
  let _threeFallbackTried = false;
  function loadThreeJSFallback() {
    if (typeof THREE !== 'undefined' || _threeFallbackTried) return;
    _threeFallbackTried = true;
    const s = document.createElement('script');
    // Même version 0.149.0 (dernière UMD) sur jsdelivr en cas d'échec d'unpkg.
    s.src = 'https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js';
    s.async = true;
    s.onerror = () => { window._threeLoadError = 'jsdelivr ' + s.src; };
    document.head.appendChild(s);
  }

  // Surface les erreurs de chargement Three.js dans le toast — sinon le user
  // n'a aucun moyen de comprendre POURQUOI la 3D ne marche pas.
  function diagnose3DFailure() {
    if (window._threeLoadError) {
      return 'Échec chargement: ' + window._threeLoadError.slice(0, 80);
    }
    if (typeof navigator !== 'undefined' && !navigator.onLine) {
      return 'Hors-ligne — la 3D nécessite une connexion (CDN Three.js)';
    }
    return 'CDN bloqué ou réseau lent — réessaie plus tard ou repasse en Classique';
  }
  function setupThemeTabs() {
    document.querySelectorAll('.theme-tab').forEach((btn) => {
      btn.addEventListener('click', () => applyTheme(btn.dataset.theme));
    });
  }

  function applySpeed(mul) {
    state.speedMul = mul;
    document.querySelectorAll('.speed-btn').forEach((b) => {
      b.classList.toggle('active', Number(b.dataset.speed) === mul);
    });
    if (tickIntervalId) clearInterval(tickIntervalId);
    if (mul > 0) {
      // Tick plus rapide = TICK_MS / mul (1×=1000ms, 2×=500ms, 4×=250ms)
      tickIntervalId = setInterval(tick, TICK_MS / mul);
    }
  }
  function setupSpeedCtrl() {
    document.querySelectorAll('.speed-btn').forEach((b) => {
      b.addEventListener('click', () => applySpeed(Number(b.dataset.speed)));
    });
  }

  // ─── Mini-map ───────────────────────────────────────────────────
  // Petite vue d'ensemble : tuiles ressource colorées, bâtiments en
  // points blancs, viewport actuel surligné. Tap = recentre la caméra.
  function setupMinimap() {
    const mm = document.getElementById('minimap');
    mm.addEventListener('click', (e) => {
      // Convertit la position du clic en (col, row) au centre de la carte
      const rect = mm.getBoundingClientRect();
      const px = (e.clientX - rect.left) / rect.width;   // 0..1
      const py = (e.clientY - rect.top) / rect.height;
      // La mini-map affiche le losange iso : on map (px, py) → centre de tuile
      // pour recentrer la caméra dessus.
      const col = Math.round(px * (GRID_SIZE - 1));
      const row = Math.round(py * (GRID_SIZE - 1));
      // worldToScreen sans la caméra = position relative
      const z = state.camera.zoom;
      const targetX = (col - row) * (TILE_W / 2) * z;
      const targetY = (col + row) * (TILE_H / 2) * z;
      state.camera.x = window.innerWidth / 2 - targetX;
      state.camera.y = window.innerHeight / 2 - targetY;
    });
  }
  function drawMinimap() {
    const mm = document.getElementById('minimap');
    if (!mm || mm.offsetParent === null) return;
    const ctx = mm.getContext('2d');
    const W = mm.width, H = mm.height;
    ctx.fillStyle = '#0d110e';
    ctx.fillRect(0, 0, W, H);
    const cellW = W / GRID_SIZE;
    const cellH = H / GRID_SIZE;
    for (let r = 0; r < GRID_SIZE; r++) {
      for (let c = 0; c < GRID_SIZE; c++) {
        const t = state.tiles[r][c];
        if (t.type === 'resource') {
          ctx.fillStyle = RESOURCES[t.resource].color;
          ctx.fillRect(c * cellW, r * cellH, cellW, cellH);
        }
        if (t.building) {
          ctx.fillStyle = '#fff';
          ctx.fillRect(c * cellW + cellW * 0.3, r * cellH + cellH * 0.3, cellW * 0.4, cellH * 0.4);
        }
      }
    }
    // Indicateur de viewport : où est la caméra
    // worldToScreen(c=0, r=0) = (cam.x, cam.y). On retrouve les bornes.
    const z = state.camera.zoom;
    // Point écran (0,0) → tuile (col, row)
    const tileCorners = [
      screenToTile(0, 0),
      screenToTile(window.innerWidth, 0),
      screenToTile(window.innerWidth, window.innerHeight),
      screenToTile(0, window.innerHeight),
    ];
    ctx.strokeStyle = 'rgba(255, 209, 102, 0.7)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    let first = true;
    for (const tc of tileCorners) {
      if (!tc) continue;
      const px = Math.max(0, Math.min(GRID_SIZE - 1, tc.col)) * cellW + cellW / 2;
      const py = Math.max(0, Math.min(GRID_SIZE - 1, tc.row)) * cellH + cellH / 2;
      if (first) { ctx.moveTo(px, py); first = false; }
      else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.stroke();
  }

  // ─── Tooltip bâtiment au hover ─────────────────────────────────
  function setupBuildingTooltip() {
    const tip = document.getElementById('building-tooltip');
    canvas.addEventListener('mousemove', (e) => {
      // Pas de tooltip si on drag ou si on a un bâtiment sélectionné
      if (state.dragging || state.selectedBuilding) {
        tip.hidden = true;
        return;
      }
      const t = screenToTile(e.clientX, e.clientY);
      if (!t || !state.tiles[t.row][t.col].building) {
        tip.hidden = true;
        return;
      }
      const b = state.tiles[t.row][t.col].building;
      const def = BUILDINGS[b.type];
      let html = `<div class="building-tooltip-title">${def.icon} ${def.name}</div>`;
      if (def.energyUsage) html += `<div class="building-tooltip-row is-neg">Énergie<span>−${def.energyUsage}⚡</span></div>`;
      if (def.energyProduction) html += `<div class="building-tooltip-row is-pos">Énergie<span>+${def.energyProduction}⚡</span></div>`;
      if (def.storage) html += `<div class="building-tooltip-row is-pos">Capacité<span>+${def.storage}</span></div>`;
      if (b.type === 'extracteur') {
        const r = state.tiles[t.row][t.col].resource;
        if (r) {
          const rate = (RESOURCES[r].prodRate || 1) * getResearchBoosts().extractorMult;
          html += `<div class="building-tooltip-row is-pos">${RESOURCES[r].name}<span>+${rate.toFixed(2)}/s</span></div>`;
          html += `<div class="building-tooltip-row">Valeur<span>${(rate * RESOURCES[r].price).toFixed(2)} €/s</span></div>`;
        }
      }
      if (def.recipe) {
        const sec = (def.recipe.cycleMs * getResearchBoosts().cycleMult) / 1000;
        for (const [r, n] of Object.entries(def.recipe.input)) {
          html += `<div class="building-tooltip-row is-neg">${RESOURCES[r].name}<span>−${(n / sec).toFixed(2)}/s</span></div>`;
        }
        const outName = RESOURCES[def.recipe.output].name;
        const outPrice = RESOURCES[def.recipe.output].price;
        html += `<div class="building-tooltip-row is-pos">${outName}<span>+${(def.recipe.qty / sec).toFixed(2)}/s</span></div>`;
        html += `<div class="building-tooltip-row">Valeur<span>${(def.recipe.qty * outPrice / sec).toFixed(2)} €/s</span></div>`;
      }
      tip.innerHTML = html;
      tip.hidden = false;
      tip.style.left = e.clientX + 'px';
      tip.style.top = (e.clientY - 12) + 'px';
    });
    canvas.addEventListener('mouseleave', () => { tip.hidden = true; });
  }

  // ─── Démarrage ──────────────────────────────────────────────────
  // Tentative de restauration ; sinon nouvelle partie procédurale.
  const loaded = loadGame();
  if (!loaded) {
    generateGrid();
    centerCamera();
  }
  applyTheme(state.theme || 'classic');
  applySpeed(state.speedMul == null ? 1 : state.speedMul);
  setupThemeTabs();
  setupSpeedCtrl();
  setupCam3DCtrl();
  setupMinimap();
  setupBuildingTooltip();
  updateHUD();
  loop();
  // Le tick interval est variable selon speedMul (0 = pause = pas d'interval).
  // applySpeed() s'occupe de re-créer l'interval avec la bonne cadence.
  // Toast de bienvenue / confirmation de chargement (non bloquant)
  setTimeout(() => showToast(loaded ? '✓ Partie chargée' : 'Bienvenue ! Pose ton premier extracteur ⛏️'), 200);

  console.log('[Iron & Co]', loaded ? 'Save chargée' : 'Nouvelle partie',
    '— grille', GRID_SIZE + '×' + GRID_SIZE,
    '— ressources placées :',
    state.tiles.flat().filter((t) => t.type === 'resource').length);
  </script>
</body>
</html>
