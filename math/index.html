        ${lc.example("Vérifier (x + 3)²", `<p>Par double distributivité : <code>(x + 3)(x + 3) = x² + 3x + 3x + 9 = x² + 6x + 9</code>. ✓ avec la formule.</p>`)}
        ${lc.example("Vérifier (x − 5)(x + 5)", `<p><code>= x² + 5x − 5x − 25 = x² − 25</code>. ✓ on retrouve <code>x² − 5²</code>.</p>`)}
        ${lc.warn("Erreur très fréquente", `<p>(a + b)² <strong>n'est pas</strong> a² + b² ! Il manque le terme <code>2ab</code>. Exemple : <code>(3 + 4)² = 49</code>, mais <code>3² + 4² = 25</code>.</p>`)}
      `,
    },

    {
      title: "Équations du 1er degré",
      category: "Calcul littéral",
      content: `
        <h2>1. Qu'est-ce qu'une équation ?</h2>
        ${lc.def("Équation", `<p>Une <strong>équation</strong> est une égalité contenant une ou plusieurs <strong>inconnues</strong> (souvent <code>x</code>). <strong>Résoudre</strong> l'équation, c'est trouver toutes les valeurs de l'inconnue qui rendent l'égalité vraie.</p>`)}
        ${lc.example("L'équation 3x + 5 = 14", `<p>Pour <code>x = 3</code> : <code>3 × 3 + 5 = 14</code> ✓ (vraie). Donc <code>x = 3</code> est <strong>solution</strong>.</p>`)}

        <h2>2. Principe : conserver l'équilibre</h2>
        ${lc.prop("Règle d'or", `<p>On peut, sans changer les solutions :</p>
          <ul><li>ajouter (ou soustraire) un même nombre aux <strong>deux membres</strong> ;</li>
          <li>multiplier (ou diviser) les deux membres par un même nombre <strong>non nul</strong>.</li></ul>
          <p>Comme une balance : ce qu'on fait d'un côté, on doit le faire de l'autre.</p>`)}

        <h2>3. Résoudre ax + b = c</h2>
        ${lc.prop("Méthode en 2 étapes", `<ol>
          <li><strong>Isoler le terme en x</strong> : on retire <code>b</code> des deux côtés. On obtient <code>ax = c − b</code>.</li>
          <li><strong>Diviser par a</strong> : <code>x = (c − b) / a</code>.</li>
        </ol>`)}
        ${lc.example("Résoudre 3x + 5 = 17", `<ol><li>Retirer 5 : <code>3x = 17 − 5 = 12</code>.</li>
          <li>Diviser par 3 : <code>x = 12 / 3 = 4</code>.</li>
          <li>Vérification : <code>3 × 4 + 5 = 17</code> ✓.</li></ol>`)}
        ${lc.example("Résoudre 7 − 2x = 3", `<ol><li>Retirer 7 : <code>−2x = 3 − 7 = −4</code>.</li>
          <li>Diviser par −2 : <code>x = −4 / (−2) = 2</code>.</li></ol>`)}

        <h2>4. Avec des x des deux côtés</h2>
        ${lc.prop("Méthode", `<p>On regroupe les <code>x</code> d'un côté et les nombres de l'autre.</p>`)}
        ${lc.example("Résoudre 5x + 2 = 3x + 14", `<ol><li>On enlève <code>3x</code> aux deux membres : <code>2x + 2 = 14</code>.</li>
          <li>On enlève 2 : <code>2x = 12</code>.</li>
          <li>On divise par 2 : <code>x = 6</code>.</li></ol>`)}

        <h2>5. Avec parenthèses</h2>
        ${lc.example("Résoudre 2(x + 3) = 5x − 6", `<ol><li>Développer : <code>2x + 6 = 5x − 6</code>.</li>
          <li>Regrouper les x à droite : <code>6 = 5x − 6 − 2x = 3x − 6</code>.</li>
          <li>Ajouter 6 : <code>12 = 3x</code>.</li>
          <li>Diviser par 3 : <code>x = 4</code>.</li></ol>`)}

        <h2>6. Mettre un problème en équation</h2>
        ${lc.prop("Méthode", `<ol>
          <li>Choisir l'inconnue : « Soit <code>x</code> le nombre cherché ».</li>
          <li>Traduire l'énoncé en équation.</li>
          <li>Résoudre.</li>
          <li>Conclure en revenant à l'énoncé.</li>
        </ol>`)}
        ${lc.example("Problème", `<p>« Le triple d'un nombre, augmenté de 7, vaut 25. Quel est ce nombre ? »</p>
          <ol><li>Soit <code>x</code> le nombre.</li>
          <li>Équation : <code>3x + 7 = 25</code>.</li>
          <li>Résolution : <code>3x = 18</code>, donc <code>x = 6</code>.</li>
          <li>Conclusion : le nombre cherché est <strong>6</strong>.</li></ol>`)}
      `,
    },

    {
      title: "Théorème de Pythagore",
      category: "Géométrie",
      content: `
        <h2>1. Vocabulaire (rappel)</h2>
        ${lc.def("Triangle rectangle", `<p>Un <strong>triangle rectangle</strong> a un angle droit. Le côté opposé à l'angle droit s'appelle l'<strong>hypoténuse</strong> ; c'est toujours le plus long des trois côtés.</p>
          <p>Les deux autres côtés (qui forment l'angle droit) s'appellent les <strong>côtés de l'angle droit</strong>.</p>`)}

        <h2>2. Énoncé du théorème</h2>
        ${lc.prop("Théorème de Pythagore", `<p>Si un triangle <code>ABC</code> est rectangle en <code>A</code>, alors :</p>`)}
        ${lc.formula("BC² &nbsp;=&nbsp; AB² + AC²")}
        <p>Le carré de l'hypoténuse est égal à la somme des carrés des deux autres côtés.</p>
        ${lc.tip("Pour bien identifier", `<p>L'<strong>hypoténuse</strong>, c'est <code>BC</code> ici (opposée à l'angle droit en <code>A</code>). Sur la formule, c'est toujours le côté seul à gauche.</p>`)}

        <h2>3. Calculer la longueur de l'hypoténuse</h2>
        ${lc.example("ABC rectangle en A, AB = 3 cm, AC = 4 cm. Calculer BC.", `<ol>
          <li>Pythagore : <code>BC² = AB² + AC² = 3² + 4² = 9 + 16 = 25</code>.</li>
          <li>Donc <code>BC = √25 = 5 cm</code>.</li>
        </ol>`)}

        <h2>4. Calculer un côté de l'angle droit</h2>
        ${lc.prop("Méthode", `<p>On part de la formule, puis on isole le côté cherché par soustraction.</p>`)}
        ${lc.example("ABC rectangle en A, BC = 13 cm, AB = 5 cm. Calculer AC.", `<ol>
          <li>Pythagore : <code>BC² = AB² + AC²</code>, soit <code>13² = 5² + AC²</code>.</li>
          <li><code>169 = 25 + AC²</code>, donc <code>AC² = 169 − 25 = 144</code>.</li>
          <li><code>AC = √144 = 12 cm</code>.</li>
        </ol>`)}
        ${lc.warn("Côté ou hypoténuse ?", `<p>Quand on cherche un côté de l'angle droit, on <strong>soustrait</strong> les carrés (hypoténuse² − autre côté²). Quand on cherche l'hypoténuse, on <strong>additionne</strong>. Identifie bien quel côté est l'hypoténuse !</p>`)}

        <h2>5. Réciproque : montrer qu'un triangle est rectangle</h2>
        ${lc.prop("Réciproque du théorème de Pythagore", `<p>Si dans un triangle <code>ABC</code>, <code>BC² = AB² + AC²</code> (où <code>BC</code> est le plus grand côté), alors le triangle est <strong>rectangle en A</strong>.</p>`)}
        ${lc.example("Le triangle de côtés 6, 8, 10 cm est-il rectangle ?", `<ol>
          <li>Le plus grand côté est 10. On vérifie : <code>10² =? 6² + 8²</code>.</li>
          <li><code>100 =? 36 + 64 = 100</code> ✓</li>
          <li>Donc <strong>oui</strong>, le triangle est rectangle (l'angle droit est opposé au côté de 10 cm).</li>
        </ol>`)}
        ${lc.example("Le triangle de côtés 5, 6, 8 cm est-il rectangle ?", `<ol>
          <li>Plus grand côté : 8. On teste : <code>8² =? 5² + 6²</code>.</li>
          <li><code>64 =? 25 + 36 = 61</code>. <strong>Non égal.</strong></li>
          <li>Donc le triangle n'est <strong>pas</strong> rectangle.</li>
        </ol>`)}

        <h2>6. Quelques triangles rectangles à mémoriser</h2>
        ${lc.tip("Triplets pythagoriciens classiques", `<p>Triangles dont les côtés sont des entiers et qui sont rectangles :</p>
          <ul><li>(3, 4, 5)</li>
          <li>(5, 12, 13)</li>
          <li>(8, 15, 17)</li>
          <li>(7, 24, 25)</li>
          <li>Et tous leurs multiples : (6, 8, 10), (9, 12, 15)…</li></ul>`)}
      `,
    },

    {
      title: "Théorème de Thalès (configuration de base)",
      category: "Géométrie",
      content: `
        <h2>1. La configuration</h2>
        ${lc.def("Configuration de Thalès", `<p>On a deux droites <code>(d)</code> et <code>(d')</code> qui se coupent en un point <code>A</code>. Sur <code>(d)</code>, on place deux points <code>B</code> et <code>M</code>. Sur <code>(d')</code>, deux points <code>C</code> et <code>N</code>. La configuration est valide si <strong>(BC) est parallèle à (MN)</strong>.</p>`)}
        ${lc.tip("Visualisation", `<p>Imagine deux triangles emboîtés qui partagent le sommet <code>A</code>. Les bases <code>(BC)</code> et <code>(MN)</code> sont parallèles, et les côtés sont alignés sur les mêmes droites passant par <code>A</code>.</p>`)}

        <h2>2. Énoncé du théorème</h2>
        ${lc.prop("Théorème de Thalès", `<p>Dans la configuration ci-dessus, si <code>(BC) ∥ (MN)</code>, alors les rapports des longueurs sont égaux :</p>`)}
        ${lc.formula("AM/AB &nbsp;=&nbsp; AN/AC &nbsp;=&nbsp; MN/BC")}
        ${lc.warn("Cohérence des rapports", `<p>On forme les rapports en partant <strong>toujours du même côté</strong> : du « petit » triangle (avec M, N) au « grand » (avec B, C), ou l'inverse, mais cohérent partout. Sinon le rapport est inversé.</p>`)}

        <h2>3. Calculer une longueur manquante</h2>
        ${lc.example("Application", `<p>On a <code>AM = 3 cm</code>, <code>AB = 5 cm</code>, <code>AN = 4 cm</code> et <code>(BC) ∥ (MN)</code>. Calculer <code>AC</code>.</p>
          <ol><li>D'après Thalès : <code>AM/AB = AN/AC</code>.</li>
          <li>Soit <code>3/5 = 4/AC</code>.</li>
          <li>En croix : <code>3 × AC = 5 × 4 = 20</code>.</li>
          <li>Donc <code>AC = 20/3 ≈ 6,67 cm</code>.</li></ol>`)}

        <h2>4. Calculer MN</h2>
        ${lc.example("Calculer la base parallèle", `<p>Avec <code>AM/AB = MN/BC</code>. On a <code>AM = 4</code>, <code>AB = 6</code>, <code>BC = 9</code>. Calculer <code>MN</code>.</p>
          <ol><li><code>4/6 = MN/9</code>, soit <code>2/3 = MN/9</code>.</li>
          <li><code>MN = (2 × 9)/3 = 18/3 = 6</code>.</li>
          <li>Donc <code>MN = 6 cm</code>.</li></ol>`)}

        <h2>5. Configuration en « papillon »</h2>
        ${lc.def("Configuration papillon", `<p>Si les points <code>B</code> et <code>M</code> sont de part et d'autre de <code>A</code> (et idem pour <code>C</code> et <code>N</code>), on parle de configuration « papillon ». Le théorème s'applique quand même, à condition que <code>(BC) ∥ (MN)</code>.</p>`)}
        ${lc.tip("Pareil mais inversé", `<p>Le calcul est identique. Visuellement, les triangles sont symétriques par rapport à <code>A</code>.</p>`)}

        <h2>6. Réciproque du théorème</h2>
        ${lc.prop("Réciproque de Thalès", `<p>Si :</p>
          <ul><li>les points <code>A</code>, <code>M</code>, <code>B</code> sont alignés <strong>dans cet ordre</strong> (ou dans l'ordre A, B, M),</li>
          <li>les points <code>A</code>, <code>N</code>, <code>C</code> sont alignés <strong>dans le même ordre</strong>,</li>
          <li>et les rapports <code>AM/AB = AN/AC</code> sont égaux,</li></ul>
          <p>alors les droites <code>(BC)</code> et <code>(MN)</code> sont <strong>parallèles</strong>.</p>`)}
        ${lc.warn("L'ordre est crucial", `<p>Si les points ne sont pas alignés dans le même ordre sur les deux droites, la conclusion ne tient plus. Toujours examiner la figure.</p>`)}
        ${lc.example("Démontrer un parallélisme", `<p>Sur une figure : <code>A, M, B</code> et <code>A, N, C</code> alignés dans cet ordre. <code>AM = 2</code>, <code>AB = 5</code>, <code>AN = 3</code>, <code>AC = 7,5</code>.</p>
          <ol><li>Rapports : <code>AM/AB = 2/5 = 0,4</code> et <code>AN/AC = 3/7,5 = 0,4</code>.</li>
          <li>Égaux et l'ordre est respecté → réciproque applicable.</li>
          <li>Donc <code>(BC) ∥ (MN)</code>.</li></ol>`)}

        <h2>7. Contraposée : montrer un non-parallélisme</h2>
        ${lc.prop("Contraposée", `<p>Si <code>AM/AB ≠ AN/AC</code> (rapports différents), alors les droites <code>(BC)</code> et <code>(MN)</code> ne sont <strong>pas parallèles</strong>.</p>`)}
        ${lc.example("Test du non-parallélisme", `<p><code>AM/AB = 2/5 = 0,4</code> mais <code>AN/AC = 3/7 ≈ 0,43</code>. Différents → <code>(BC)</code> et <code>(MN)</code> ne sont pas parallèles.</p>`)}

        <h2>8. Pourquoi c'est utile ?</h2>
        ${lc.example("Hauteur d'un arbre", `<p>On peut mesurer indirectement la hauteur d'un arbre en se servant de l'ombre. Si on mesure son ombre (10 m) et l'ombre d'un bâton (1 m de haut, 1,5 m d'ombre), on a une configuration de Thalès : <code>hauteur arbre / 1 = 10 / 1,5</code>, soit <code>arbre ≈ 6,67 m</code>.</p>`)}
      `,
    },

    {
      title: "Cosinus dans le triangle rectangle",
      category: "Géométrie",
      content: `
        <h2>1. Définition</h2>
        ${lc.def("Cosinus d'un angle aigu", `<p>Dans un triangle rectangle, pour un angle aigu <code>α</code> :</p>`)}
        ${lc.formula("cos(α) &nbsp;=&nbsp; (côté adjacent) / (hypoténuse)")}
        <p>Le <strong>côté adjacent</strong> à <code>α</code> est celui qui forme l'angle avec l'hypoténuse (et qui n'est pas l'hypoténuse).</p>
        ${lc.tip("Repérage", `<p>L'<strong>hypoténuse</strong> est toujours opposée à l'angle droit (le grand côté). Le <strong>côté opposé</strong> à <code>α</code> est celui qui ne touche pas <code>α</code>. Le reste, c'est l'<strong>adjacent</strong>.</p>`)}

        <h2>2. Propriétés du cosinus</h2>
        ${lc.prop("Encadrement", `<p>Pour tout angle aigu α (avec <code>0° ≤ α ≤ 90°</code>) : <code>0 ≤ cos(α) ≤ 1</code>. Les bornes ne sont atteintes qu'aux extrémités :</p>
          <ul><li><code>cos(0°) = 1</code></li>
          <li><code>cos(60°) = 0,5</code></li>
          <li><code>cos(90°) = 0</code></li></ul>
          <p>Pour <code>0° < α < 90°</code> strictement, on a bien <code>0 < cos(α) < 1</code>.</p>`)}

        <h2>3. Calculer un cosinus à partir des longueurs</h2>
        ${lc.example("Triangle rectangle", `<p>Triangle <code>ABC</code> rectangle en <code>C</code>. Pour l'angle <code>α</code> en <code>A</code> : adjacent = <code>AC</code>, hypoténuse = <code>AB</code>. Si <code>AC = 4</code> et <code>AB = 5</code> :</p>
          <p><code>cos(α) = AC / AB = 4 / 5 = 0,8</code>.</p>`)}

        <h2>4. Trouver un angle (cos⁻¹)</h2>
        ${lc.prop("Avec la calculatrice", `<p>Quand on connaît <code>cos(α)</code>, on retrouve <code>α</code> avec la touche <strong>cos⁻¹</strong> (parfois notée <strong>arccos</strong> ou <strong>acos</strong>).</p>`)}
        ${lc.example("Calculer l'angle α tel que cos(α) = 0,8", `<p>Sur la calculatrice : <code>α = cos⁻¹(0,8) ≈ 36,87°</code>.</p>
          <p>Penser à régler la calculatrice en <strong>degrés</strong> (DEG), pas en radians.</p>`)}

        <h2>5. Trouver une longueur</h2>
        ${lc.example("Connaissant l'angle et l'hypoténuse", `<p>Triangle rectangle, hypoténuse = 10 cm, angle α = 30°. Calculer le côté adjacent à α.</p>
          <ol><li><code>cos(30°) = adjacent / 10</code>.</li>
          <li>Donc <code>adjacent = 10 × cos(30°) ≈ 10 × 0,866 ≈ 8,66 cm</code>.</li></ol>`)}
        ${lc.example("Connaissant l'angle et l'adjacent", `<p>Adjacent = 6 cm, angle = 40°. Calculer l'hypoténuse.</p>
          <ol><li><code>cos(40°) = 6 / hypoténuse</code>.</li>
          <li><code>hypoténuse = 6 / cos(40°) ≈ 6 / 0,766 ≈ 7,83 cm</code>.</li></ol>`)}

        <h2>6. Erreurs à éviter</h2>
        ${lc.warn("Bien identifier les côtés", `<p>L'erreur la plus fréquente : confondre adjacent et opposé. <strong>Toujours partir de l'angle considéré</strong> et regarder : quel côté touche l'angle (sans être l'hypoténuse) ? C'est l'adjacent.</p>`)}
        ${lc.warn("Mode de la calculatrice", `<p>Si tu obtiens un résultat aberrant, vérifie que ta calculatrice est en mode <strong>DEG</strong> (degrés) et non RAD (radians) ou GRAD.</p>`)}
      `,
    },

    {
      title: "Translations",
      category: "Géométrie",
      content: `
        <h2>1. Qu'est-ce qu'une translation ?</h2>
        ${lc.def("Translation", `<p>Une <strong>translation</strong> est un déplacement <em>en ligne droite</em> de toute une figure, dans une <strong>direction</strong>, un <strong>sens</strong> et une <strong>distance</strong> donnés. On parle aussi de « glissement ».</p>`)}
        ${lc.tip("Image", `<p>Pousser un meuble droit devant toi sans le tourner : c'est une translation. Les rails d'un train qui glisse : tous les wagons subissent la même translation.</p>`)}

        <h2>2. Image d'un point par une translation</h2>
        ${lc.def("Image", `<p>L'<strong>image</strong> d'un point <code>A</code> par la translation qui transforme un point <code>P</code> en un point <code>P'</code> est le point <code>A'</code> tel que les segments <code>[AA']</code> et <code>[PP']</code> soient <strong>parallèles, de même longueur et de même sens</strong>.</p>`)}
        ${lc.tip("Idée pratique", `<p>Si la translation envoie <code>P</code> sur <code>P'</code> en allant « 4 cm vers la droite », alors elle envoie tous les autres points de la même façon : 4 cm vers la droite.</p>`)}

        <h2>3. Construire le translaté d'un point</h2>
        ${lc.prop("Méthode (équerre + règle)", `<ol>
          <li>Tracer une parallèle à <code>(PP')</code> passant par <code>A</code>.</li>
          <li>Sur cette parallèle, du même côté que <code>P'</code>, reporter une distance égale à <code>PP'</code>.</li>
          <li>Le point obtenu est <code>A'</code>.</li>
        </ol>`)}

        <h2>4. Propriétés de conservation</h2>
        ${lc.prop("La translation conserve", `<ul>
          <li>les <strong>longueurs</strong> ;</li>
          <li>les <strong>angles</strong> ;</li>
          <li>l'<strong>aire</strong> et le <strong>périmètre</strong> ;</li>
          <li>le <strong>parallélisme</strong> et la <strong>perpendicularité</strong> ;</li>
          <li>le <strong>sens</strong> (un sens horaire reste horaire — contrairement aux symétries).</li>
        </ul>`)}
        ${lc.tip("En résumé", `<p>Une translation déplace une figure sans la déformer ni la retourner. La figure-image est <em>parfaitement identique</em> à l'originale, juste positionnée ailleurs.</p>`)}

        <h2>5. Image d'une figure</h2>
        ${lc.example("Translater un triangle", `<p>Soit le triangle <code>ABC</code>. Pour construire son image <code>A'B'C'</code> par une translation donnée :</p>
          <ol><li>Construire l'image <code>A'</code> de <code>A</code>.</li>
          <li>Construire l'image <code>B'</code> de <code>B</code>.</li>
          <li>Construire l'image <code>C'</code> de <code>C</code>.</li>
          <li>Tracer le triangle <code>A'B'C'</code>.</li></ol>`)}

        <h2>6. Translation et parallélogramme</h2>
        ${lc.prop("Caractérisation par le parallélogramme", `<p>L'image d'un point <code>A</code> par la translation qui transforme <code>P</code> en <code>P'</code> est l'unique point <code>A'</code> tel que <code>APP'A'</code> soit un <strong>parallélogramme</strong> (à condition que <code>A</code> ne soit pas sur la droite <code>(PP')</code>).</p>`)}
        ${lc.tip("Pourquoi ?", `<p>Parce que dans un parallélogramme, les côtés opposés sont parallèles ET de même longueur. Or c'est exactement ce que demande la définition de la translation.</p>`)}
      `,
    },

    {
      title: "Proportionnalité avancée",
      category: "Organisation des données",
      content: `
        <h2>1. Tableau de proportionnalité</h2>
        ${lc.def("Tableau de proportionnalité", `<p>Un tableau à deux lignes est un <strong>tableau de proportionnalité</strong> si on passe de la première ligne à la deuxième en multipliant <strong>toujours par le même nombre</strong> (le coefficient).</p>`)}
        ${lc.example("Reconnaître", `<p>Tableau : 2 → 6, 5 → 15, 8 → 24. Rapport : <code>6/2 = 3</code>, <code>15/5 = 3</code>, <code>24/8 = 3</code>. Coefficient : <strong>3</strong>. Le tableau est proportionnel.</p>`)}

        <h2>2. Le coefficient de proportionnalité</h2>
        ${lc.prop("Calcul", `<p>Le <strong>coefficient</strong> est le rapport <code>y/x</code> (constant pour toutes les colonnes). Une fois trouvé, il permet de calculer toute valeur manquante.</p>`)}
        ${lc.example("Avec un coefficient", `<p>1 kg de pommes coûte 3 €. Coefficient = 3 €/kg. Combien pour 7 kg ? <code>7 × 3 = 21 €</code>.</p>`)}

        <h2>3. La 4e proportionnelle (produit en croix)</h2>
        ${lc.prop("Méthode du produit en croix", `<p>Si trois valeurs d'un tableau de proportionnalité sont connues, on calcule la 4e par <strong>produit en croix</strong> :</p>`)}
        ${lc.formula("a/b &nbsp;=&nbsp; c/d &nbsp;⇔&nbsp; a × d = b × c &nbsp;⇒&nbsp; d = (b × c) / a")}
        ${lc.example("Recette", `<p>Pour 4 personnes, il faut 200 g de farine. Pour 7 personnes, combien ?</p>
          <ol><li>Tableau : 4 → 200, 7 → ?.</li>
          <li>Produit en croix : <code>? = (200 × 7) / 4 = 1400 / 4 = 350 g</code>.</li></ol>`)}

        <h2>4. Pourcentages comme proportionnalité</h2>
        ${lc.prop("Lien", `<p>Calculer <code>p%</code> de <code>n</code> revient à appliquer un coefficient de proportionnalité égal à <code>p/100</code>.</p>`)}
        ${lc.example("Application", `<p>Calculer 17 % de 80 : coefficient = 17/100 = 0,17. Donc <code>0,17 × 80 = 13,6</code>.</p>`)}
        ${lc.example("Augmentation et réduction", `<p>Augmenter de 12 % = multiplier par <code>1,12</code>. Réduire de 12 % = multiplier par <code>0,88</code>.</p>
          <p>Un prix de 200 € augmenté de 12 % : <code>200 × 1,12 = 224 €</code>.</p>`)}

        <h2>5. Vitesse, distance, temps</h2>
        ${lc.prop("Formules", `<ul>
          <li><code>distance = vitesse × temps</code></li>
          <li><code>vitesse = distance / temps</code></li>
          <li><code>temps = distance / vitesse</code></li>
        </ul>
          <p>À vitesse constante, la distance est proportionnelle au temps.</p>`)}
        ${lc.example("Calculer une distance", `<p>Voiture roulant à 80 km/h pendant 2 h 30 min (= 2,5 h). Distance = <code>80 × 2,5 = 200 km</code>.</p>`)}
        ${lc.example("Convertir des unités", `<p>Pour passer de m/s à km/h : <strong>multiplier par 3,6</strong>. Pour passer de km/h à m/s : <strong>diviser par 3,6</strong>.</p>
          <p>10 m/s = <code>10 × 3,6 = 36 km/h</code>.</p>`)}

        <h2>6. Échelles</h2>
        ${lc.def("Échelle", `<p>Une <strong>échelle</strong> est un coefficient de proportionnalité entre une longueur sur le plan/maquette et la longueur réelle.</p>`)}
        ${lc.example("Échelle 1/200", `<p>1 cm sur le plan = 200 cm = 2 m en réalité. Si une distance fait 5 cm sur le plan, elle fait <code>5 × 2 = 10 m</code> en réalité.</p>`)}
      `,
    },

    {
      title: "Statistiques : moyenne et médiane",
      category: "Organisation des données",
      content: `
        <h2>1. Vocabulaire</h2>
        ${lc.def("Série statistique", `<p>Une <strong>série statistique</strong> est une liste de valeurs (chiffres) obtenues lors d'une enquête ou d'une mesure.</p>`)}
        <p>Exemple : notes d'un élève sur 6 contrôles : 12, 14, 9, 15, 11, 13.</p>

        <h2>2. La moyenne (simple)</h2>
        ${lc.def("Moyenne", `<p>La <strong>moyenne</strong> d'une série statistique est égale à la <strong>somme des valeurs</strong> divisée par leur <strong>nombre</strong>.</p>`)}
        ${lc.formula("moyenne &nbsp;=&nbsp; (somme des valeurs) / (nombre de valeurs)")}
        ${lc.example("Calculer la moyenne", `<p>Notes : 12, 14, 9, 15, 11, 13.</p>
          <ol><li>Somme : <code>12 + 14 + 9 + 15 + 11 + 13 = 74</code>.</li>
          <li>Nombre : <code>6</code>.</li>
          <li>Moyenne : <code>74 / 6 ≈ 12,33</code>.</li></ol>`)}

        <h2>3. Moyenne pondérée (avec effectifs)</h2>
        ${lc.def("Moyenne pondérée", `<p>Quand certaines valeurs apparaissent plusieurs fois (ou ont des coefficients différents), on les multiplie par leur <strong>effectif</strong> (ou poids) avant d'additionner.</p>`)}
        ${lc.formula("moyenne &nbsp;=&nbsp; (somme des (valeur × effectif)) / (effectif total)")}
        ${lc.example("Notes pondérées", `<p>Maths : 12 (coefficient 4). Français : 14 (coef 3). Histoire : 10 (coef 2).</p>
          <ol><li>Somme pondérée : <code>12 × 4 + 14 × 3 + 10 × 2 = 48 + 42 + 20 = 110</code>.</li>
          <li>Total des coefficients : <code>4 + 3 + 2 = 9</code>.</li>
          <li>Moyenne : <code>110 / 9 ≈ 12,22</code>.</li></ol>`)}
        ${lc.example("Notes en série", `<p>Sur 20 élèves, 5 ont eu 12, 8 ont eu 14, 7 ont eu 16. Moyenne ?</p>
          <p>Somme : <code>5 × 12 + 8 × 14 + 7 × 16 = 60 + 112 + 112 = 284</code>. Effectif : 20. Moyenne : <code>284 / 20 = 14,2</code>.</p>`)}

        <h2>4. Quelques propriétés</h2>
        ${lc.prop("Propriétés utiles", `<ul>
          <li>La moyenne est toujours <strong>comprise</strong> entre la valeur minimale et la valeur maximale de la série.</li>
          <li>Si on ajoute la même valeur <code>k</code> à toutes les données, la moyenne augmente aussi de <code>k</code>.</li>
          <li>Si on multiplie toutes les valeurs par <code>k</code>, la moyenne aussi.</li>
        </ul>`)}

        <h2>5. La médiane</h2>
        ${lc.def("Médiane", `<p>La <strong>médiane</strong> d'une série de valeurs (rangées dans l'ordre croissant) est la valeur qui partage la série en <strong>deux moitiés</strong> de même effectif : autant de valeurs en dessous qu'au-dessus.</p>`)}
        ${lc.prop("Calcul", `<ul>
          <li>Si l'effectif <code>n</code> est <strong>impair</strong> : la médiane est la valeur centrale (position <code>(n+1)/2</code>).</li>
          <li>Si l'effectif <code>n</code> est <strong>pair</strong> : la médiane est la moyenne des deux valeurs centrales (positions <code>n/2</code> et <code>n/2 + 1</code>).</li>
        </ul>`)}
        ${lc.example("Effectif impair", `<p>Notes triées : <code>8, 10, 12, 13, 14, 15, 18</code> (n = 7). Position centrale : <code>(7+1)/2 = 4</code>.</p>
          <p>Médiane = 4ᵉ valeur = <strong>13</strong>.</p>`)}
        ${lc.example("Effectif pair", `<p>Notes triées : <code>6, 9, 10, 11, 13, 14, 16, 18</code> (n = 8). Valeurs centrales : 4ᵉ (<code>11</code>) et 5ᵉ (<code>13</code>).</p>
          <p>Médiane = <code>(11 + 13)/2 = 12</code>.</p>`)}
        ${lc.tip("Moyenne vs médiane", `<p>La <strong>moyenne</strong> est sensible aux valeurs extrêmes ; la <strong>médiane</strong> ne l'est pas. Pour des salaires (1 800 €, 1 800 €, 1 800 €, 1 800 €, 30 000 €), la moyenne (7 440 €) est trompeuse alors que la médiane (1 800 €) reflète mieux le « salarié type ».</p>`)}

        <h2>6. Étendue</h2>
        ${lc.def("Étendue", `<p>L'<strong>étendue</strong> d'une série est la différence entre la plus grande et la plus petite valeur. Elle mesure la <em>dispersion</em>.</p>`)}
        ${lc.example("Étendue", `<p>Pour la série 12, 14, 9, 15, 11, 13 : étendue = <code>15 − 9 = 6</code>.</p>`)}
      `,
    },

    {
      title: "Volumes : pyramide et cône",
      category: "Géométrie",
      content: `
        <h2>1. La pyramide</h2>
        ${lc.def("Pyramide", `<p>Une <strong>pyramide</strong> est un solide formé d'un polygone (la <strong>base</strong>) et d'un point (le <strong>sommet</strong>) qui n'appartient pas au plan de la base. Les faces latérales sont des triangles.</p>
          <p>Si la base est un triangle, c'est un tétraèdre ; carrée, pyramide carrée ; etc.</p>`)}
        ${lc.def("Hauteur d'une pyramide", `<p>La <strong>hauteur</strong> est la distance entre le sommet et la base, mesurée perpendiculairement à la base.</p>`)}

        <h2>2. Volume d'une pyramide</h2>
        ${lc.formula("V_{pyramide} = (1/3) × (aire de la base) × hauteur")}
        ${lc.tip("Pourquoi 1/3 ?", `<p>Une pyramide tient exactement <strong>3 fois</strong> dans un prisme de même base et même hauteur. C'est un résultat géométrique élégant qu'on peut visualiser en remplissant le prisme avec 3 pyramides identiques.</p>`)}
        ${lc.example("Pyramide à base carrée", `<p>Base carrée de côté 6 cm, hauteur 9 cm.</p>
          <ol><li>Aire de la base : <code>6 × 6 = 36 cm²</code>.</li>
          <li>Volume : <code>V = (1/3) × 36 × 9 = 108 cm³</code>.</li></ol>`)}

        <h2>3. Le cône de révolution</h2>
        ${lc.def("Cône", `<p>Un <strong>cône de révolution</strong> est l'analogue circulaire de la pyramide : sa base est un <strong>disque</strong> de rayon <code>r</code>, et son sommet est à la distance <code>h</code> du plan de la base (perpendiculairement).</p>
          <p>Image : un cornet de glace.</p>`)}

        <h2>4. Volume d'un cône</h2>
        ${lc.formula("V_{cône} = (1/3) × π × r² × h")}
        ${lc.example("Cône rayon 4 cm, hauteur 9 cm", `<p><code>V = (1/3) × π × 16 × 9 = 48π ≈ 150,8 cm³</code>.</p>`)}

        <h2>5. Effet d'agrandissement / réduction</h2>
        ${lc.prop("Coefficient k", `<p>Si on multiplie toutes les longueurs d'un solide par <code>k</code> :</p>
          <ul><li>les longueurs sont multipliées par <code>k</code> ;</li>
          <li>les aires sont multipliées par <code>k²</code> ;</li>
          <li>les volumes sont multipliés par <code>k³</code>.</li></ul>`)}
        ${lc.example("Doubler les dimensions", `<p>Une pyramide dont on double toutes les dimensions voit son volume multiplié par <code>2³ = 8</code>.</p>`)}
      `,
    },

    {
      title: "Probabilités (introduction)",
      category: "Organisation des données",
      content: `
        <h2>1. Vocabulaire</h2>
        ${lc.def("Expérience aléatoire", `<p>Une <strong>expérience aléatoire</strong> est une expérience dont on ne peut pas prédire le résultat à l'avance, mais dont on connaît tous les résultats possibles.</p>
          <p>Exemples : lancer un dé, tirer une carte, jouer à pile ou face.</p>`)}
        ${lc.def("Issue", `<p>Une <strong>issue</strong> est l'un des résultats possibles d'une expérience aléatoire.</p>
          <p>Lancer d'un dé : 6 issues (1, 2, 3, 4, 5, 6).</p>`)}
        ${lc.def("Événement", `<p>Un <strong>événement</strong> est un ensemble d'issues. Exemple, pour un dé : « obtenir un nombre pair » est un événement composé des issues {2, 4, 6}.</p>`)}

        <h2>2. Calculer une probabilité (cas équiprobable)</h2>
        ${lc.prop("Formule", `<p>Quand toutes les issues ont la même chance d'apparaître (situation <strong>équiprobable</strong>), la probabilité d'un événement <code>A</code> est :</p>`)}
        ${lc.formula("P(A) &nbsp;=&nbsp; (nombre d'issues favorables à A) / (nombre total d'issues)")}
        <p>Une probabilité est toujours un nombre entre <code>0</code> et <code>1</code> (ou en pourcentage, entre 0 % et 100 %).</p>

        <h2>3. Exemples classiques</h2>
        ${lc.example("Lancer d'un dé", `<p>Probabilité d'obtenir un 6 ?</p>
          <p>1 issue favorable (le 6), 6 issues totales. Donc <code>P = 1/6 ≈ 0,167</code> (≈ 16,7 %).</p>`)}
        ${lc.example("Nombre pair", `<p>Probabilité d'obtenir un nombre pair en lançant un dé ?</p>
          <p>3 issues favorables {2, 4, 6}, 6 issues totales. Donc <code>P = 3/6 = 1/2</code> (50 %).</p>`)}
        ${lc.example("Tirer une carte", `<p>Dans un jeu de 32 cartes, probabilité de tirer un roi ?</p>
          <p>4 rois, 32 cartes : <code>P = 4/32 = 1/8</code> = 0,125 (12,5 %).</p>`)}

        <h2>4. Événement certain, impossible</h2>
        ${lc.def("Événements particuliers", `<ul>
          <li><strong>Certain</strong> : il se réalise toujours. Probabilité = <code>1</code>.</li>
          <li><strong>Impossible</strong> : il ne se réalise jamais. Probabilité = <code>0</code>.</li>
        </ul>`)}
        ${lc.example("Exemples", `<ul><li>Avec un dé : « obtenir un nombre entre 1 et 6 » est certain (<code>P = 1</code>).</li>
          <li>« Obtenir un 7 » est impossible (<code>P = 0</code>).</li></ul>`)}

        <h2>5. Événement contraire</h2>
        ${lc.def("Événement contraire", `<p>L'<strong>événement contraire</strong> de <code>A</code>, noté <code>Ā</code> (« A barre »), est l'événement « <code>A</code> ne se réalise pas ».</p>`)}
        ${lc.formula("P(Ā) &nbsp;=&nbsp; 1 − P(A)")}
        ${lc.example("Tirage", `<p>Si <code>P(« tirer un roi ») = 1/8</code>, alors <code>P(« ne pas tirer un roi ») = 1 − 1/8 = 7/8</code>.</p>`)}
        ${lc.tip("Astuce", `<p>Quand un événement est compliqué à dénombrer, calcule plutôt la probabilité de son contraire et fais <code>1 − P(contraire)</code>.</p>`)}

        <h2>6. Loi des grands nombres (intuition)</h2>
        ${lc.tip("Plus on répète, plus on s'approche", `<p>Si on lance un dé 10 fois, on n'aura pas forcément un 6 sur 1/6 des lancers. Mais sur des milliers de lancers, la fréquence d'apparition du 6 va se rapprocher de <code>1/6 ≈ 16,67 %</code>. C'est la <strong>loi des grands nombres</strong>.</p>`)}
        ${lc.warn("Pas de mémoire", `<p>Le dé n'a pas de « mémoire » : si tu obtiens 5 fois pile de suite, le 6e lancer a toujours <code>1/2</code> de chance de donner pile. Les lancers sont indépendants.</p>`)}
      `,
    },
  ];
}

        ${lc.def("Ordre de grandeur", `<p>L'<strong>ordre de grandeur</strong> d'un calcul, c'est une estimation rapide qu'on peut faire de tête en arrondissant les nombres.</p>`)}
        ${lc.example("Ordre de grandeur de 487 × 21", `<p>On arrondit : <code>487 ≈ 500</code> et <code>21 ≈ 20</code>. Donc <code>500 × 20 = 10 000</code>.</p>
          <p>Le vrai résultat (<code>10 227</code>) est cohérent. Si on avait trouvé 1 022, on saurait qu'il y a une erreur (ordre de grandeur 10 fois trop petit).</p>`)}
        ${lc.tip("Pourquoi c'est utile", `<p>Vérifier l'ordre de grandeur après chaque calcul permet d'<strong>attraper les grosses erreurs</strong> (virgule mal placée, oubli d'un zéro…).</p>`)}
      `,
    },

    {
      title: "Division euclidienne",
      category: "Nombres et calcul",
      content: `
        <h2>1. Vocabulaire</h2>
        ${lc.def("Division euclidienne", `<p>Diviser un nombre <code>a</code> (le <strong>dividende</strong>) par un nombre <code>b</code> non nul (le <strong>diviseur</strong>), c'est trouver deux entiers : un <strong>quotient</strong> <code>q</code> et un <strong>reste</strong> <code>r</code>.</p>`)}
        ${lc.formula("a = b × q + r &nbsp;&nbsp; avec &nbsp;&nbsp; 0 ≤ r < b")}
        <p>L'expression « avec <code>0 ≤ r < b</code> » est essentielle : le reste est toujours <strong>positif et plus petit que le diviseur</strong>.</p>

        <h2>2. Trouver le quotient et le reste</h2>
        ${lc.prop("Méthode mentale", `<p>On cherche le <strong>plus grand multiple du diviseur</strong> qui ne dépasse pas le dividende. Ce multiple est <code>b × q</code>. Le reste, c'est ce qu'il manque pour atteindre <code>a</code>.</p>`)}
        ${lc.example("Diviser 47 par 6", `<ol>
          <li>Multiples de 6 : 6, 12, 18, 24, 30, 36, 42, 48...</li>
          <li>Le plus grand qui ne dépasse pas 47 : <code>42 = 6 × 7</code>. Donc <code>q = 7</code>.</li>
          <li>Reste : <code>47 − 42 = 5</code>. Donc <code>r = 5</code>.</li>
          <li>Vérification : <code>5 < 6</code> ✓.</li>
        </ol><p>On écrit : <code>47 = 6 × 7 + 5</code>.</p>`)}

        <h2>3. Division posée</h2>
        ${lc.example("Poser 254 ÷ 4", `<ol>
          <li>On divise les chiffres de gauche à droite : 25 contient combien de fois 4 ? 6 fois (6 × 4 = 24), reste 1.</li>
          <li>On abaisse le 4 : on a 14. Combien de fois 4 dans 14 ? 3 fois (3 × 4 = 12), reste 2.</li>
          <li>Quotient : <code>63</code>. Reste : <code>2</code>.</li>
        </ol><p>Vérification : <code>4 × 63 + 2 = 252 + 2 = 254</code> ✓</p>`)}

        <h2>4. Division qui « tombe juste »</h2>
        ${lc.def("Divisible", `<p>Si le reste vaut 0, on dit que <code>a</code> est <strong>divisible</strong> par <code>b</code>, ou que <code>b</code> est un <strong>diviseur</strong> de <code>a</code>.</p>
          <p>Exemple : <code>20 = 4 × 5 + 0</code>, donc 20 est divisible par 4 (et aussi par 5).</p>`)}

        <h2>5. Critères de divisibilité</h2>
        ${lc.prop("Critères à mémoriser", `<ul>
          <li><strong>Par 2</strong> : le nombre se termine par 0, 2, 4, 6 ou 8 (les nombres pairs).</li>
          <li><strong>Par 5</strong> : le nombre se termine par 0 ou 5.</li>
          <li><strong>Par 10</strong> : le nombre se termine par 0.</li>
          <li><strong>Par 3</strong> : la <em>somme des chiffres</em> est divisible par 3.</li>
          <li><strong>Par 9</strong> : la <em>somme des chiffres</em> est divisible par 9.</li>
          <li><strong>Par 4</strong> : les deux derniers chiffres forment un nombre divisible par 4.</li>
        </ul>`)}
        ${lc.example("Tester 1 230", `<ul><li>Se termine par 0 → divisible par 2, par 5 et par 10.</li>
          <li>Somme des chiffres : <code>1 + 2 + 3 + 0 = 6</code>. <code>6</code> est divisible par 3 (mais pas par 9), donc 1 230 est divisible par 3 mais pas par 9.</li></ul>`)}
        ${lc.example("Tester 5 184 par 9", `<p>Somme : <code>5 + 1 + 8 + 4 = 18</code>. <code>18 = 9 × 2</code>, donc 5 184 est divisible par 9.</p>
          <p>Vérification : <code>5184 ÷ 9 = 576</code> ✓.</p>`)}
        ${lc.tip("Astuce", `<p>Si un nombre est divisible par 9, il est forcément divisible par 3 (puisque 9 = 3 × 3). La réciproque est fausse : 6 est divisible par 3, pas par 9.</p>`)}

        <h2>6. Multiples et diviseurs</h2>
        ${lc.def("Multiple", `<p>Un nombre est un <strong>multiple</strong> d'un autre s'il s'obtient en le multipliant par un entier. Les multiples de 7 sont : 0, 7, 14, 21, 28, 35, 42…</p>`)}
        ${lc.tip("Lien", `<p>« 35 est un multiple de 7 » <strong>=</strong> « 7 est un diviseur de 35 » <strong>=</strong> « 35 est divisible par 7 ». Trois façons de dire la même chose.</p>`)}
      `,
    },

    {
      title: "Fractions : sens et premières représentations",
      category: "Nombres et calcul",
      content: `
        <h2>1. Une fraction, ça représente quoi ?</h2>
        <p>Imagine une pizza partagée en <strong>4 parts égales</strong>. Si tu en manges <strong>3</strong>, tu as mangé les <code>3/4</code> de la pizza.</p>
        ${lc.def("Fraction", `<p>Une <strong>fraction</strong> s'écrit <code>a/b</code> où :</p>
          <ul><li><code>a</code> est le <strong>numérateur</strong> (nombre de parts qu'on prend) ;</li>
          <li><code>b</code> est le <strong>dénominateur</strong> (en combien de parts on a partagé).</li></ul>
          <p>Le dénominateur ne peut <strong>jamais être 0</strong> : on ne peut pas partager en 0 parts.</p>`)}

        <h2>2. Lire une fraction</h2>
        ${lc.prop("Lecture", `<p>On lit en disant le numérateur, puis le dénominateur avec un suffixe spécial :</p>
          <ul><li><code>1/2</code> = un <strong>demi</strong></li>
          <li><code>1/3</code> = un <strong>tiers</strong></li>
          <li><code>1/4</code> = un <strong>quart</strong></li>
          <li><code>1/5</code> = un <strong>cinquième</strong></li>
          <li><code>3/8</code> = trois <strong>huitièmes</strong></li>
          <li><code>5/100</code> = cinq <strong>centièmes</strong></li></ul>`)}

        <h2>3. Représenter une fraction</h2>
        <p>On peut représenter une fraction de plusieurs façons :</p>
        ${lc.example("Avec un disque", `<p>Diviser un disque en <code>b</code> parts égales et en colorier <code>a</code>. Pour <code>3/4</code>, on partage en 4 et on colorie 3 parts.</p>`)}
        ${lc.example("Avec un segment gradué", `<p>Sur une droite graduée entre 0 et 1 partagée en 4 parts égales, le point d'abscisse <code>3/4</code> est à la 3e graduation.</p>
          <p><code>0 — — — 1/4 — — — 2/4 — — — 3/4 — — — 1</code></p>`)}

        <h2>4. Fraction = quotient</h2>
        ${lc.prop("Lien essentiel", `<p>La fraction <code>a/b</code> est un autre nom pour le <strong>résultat de la division</strong> de <code>a</code> par <code>b</code>.</p>`)}
        ${lc.formula("a/b &nbsp;=&nbsp; a ÷ b")}
        ${lc.example("Calculer 3/4 en décimal", `<p><code>3/4 = 3 ÷ 4 = 0,75</code>.</p>`)}
        ${lc.example("Calculer 7/2", `<p><code>7/2 = 7 ÷ 2 = 3,5</code>.</p>`)}

        <h2>5. Comparer une fraction à 1</h2>
        ${lc.prop("Règle utile", `<ul>
          <li>Si <strong>numérateur < dénominateur</strong> → la fraction est <strong>plus petite que 1</strong>. Ex : <code>3/4 < 1</code>.</li>
          <li>Si <strong>numérateur = dénominateur</strong> → la fraction <strong>vaut 1</strong>. Ex : <code>5/5 = 1</code>.</li>
          <li>Si <strong>numérateur > dénominateur</strong> → la fraction est <strong>plus grande que 1</strong>. Ex : <code>7/4 > 1</code>.</li>
        </ul>`)}
        ${lc.tip("Vérification rapide", `<p>Pour <code>7/4</code> : « 7 quarts », c'est plus que « 4 quarts » (= 1 entier), donc <code>7/4 > 1</code>. Logique !</p>`)}

        <h2>6. Décimaux ↔ fractions</h2>
        ${lc.prop("Quelques équivalences à mémoriser", `<ul>
          <li><code>0,5 = 1/2</code></li>
          <li><code>0,25 = 1/4</code></li>
          <li><code>0,75 = 3/4</code></li>
          <li><code>0,1 = 1/10</code></li>
          <li><code>0,01 = 1/100</code></li>
        </ul>`)}
      `,
    },

    {
      title: "Proportionnalité (sensibilisation)",
      category: "Organisation des données",
      content: `
        <h2>1. C'est quoi, la proportionnalité ?</h2>
        ${lc.def("Définition", `<p>Deux grandeurs sont <strong>proportionnelles</strong> si on passe de l'une à l'autre en multipliant <em>toujours par le même nombre</em>.</p>`)}
        ${lc.example("Le prix des stylos", `<p>Si <code>1</code> stylo coûte <code>2 €</code>, alors :</p>
          <ul><li>2 stylos coûtent <code>2 × 2 = 4 €</code></li>
          <li>5 stylos coûtent <code>5 × 2 = 10 €</code></li>
          <li>10 stylos coûtent <code>10 × 2 = 20 €</code></li></ul>
          <p>On multiplie toujours par 2 : <strong>le prix est proportionnel au nombre de stylos</strong>.</p>`)}

        <h2>2. Reconnaître une situation proportionnelle</h2>
        ${lc.prop("Indices", `<p>C'est généralement proportionnel quand on parle :</p>
          <ul><li>de prix à payer (à prix fixe par unité) ;</li>
          <li>de distance parcourue à <em>vitesse constante</em> ;</li>
          <li>d'ingrédients dans une recette (pour plus ou moins de personnes).</li></ul>`)}
        ${lc.warn("Pas toujours proportionnel", `<p>L'âge d'une personne et sa taille ne sont <strong>pas</strong> proportionnels (sinon on grandirait toute notre vie au même rythme !). Le périmètre d'un carré est proportionnel à son côté, mais l'<strong>aire</strong> ne l'est pas.</p>`)}

        <h2>3. Tableau de proportionnalité</h2>
        <p>On présente souvent les données dans un tableau à deux lignes :</p>
        ${lc.formula("Stylos : 1 &nbsp; 2 &nbsp; 5 &nbsp; 10<br>Prix : &nbsp;2 &nbsp; 4 &nbsp;10 &nbsp;20")}
        <p>C'est un tableau de proportionnalité car on multiplie toujours par 2 pour passer de la ligne du haut à celle du bas.</p>
        ${lc.def("Coefficient de proportionnalité", `<p>Le nombre par lequel on multiplie s'appelle le <strong>coefficient de proportionnalité</strong>. Ici, c'est <code>2</code> (le prix par stylo).</p>`)}

        <h2>4. Calculer une valeur manquante</h2>
        ${lc.example("Recette pour 8 personnes au lieu de 4", `<p>Recette pour 4 personnes : 200 g de farine. Et pour 8 personnes ?</p>
          <ol><li>On passe de 4 à 8 en multipliant par 2.</li>
          <li>Donc on multiplie aussi la farine par 2 : <code>200 × 2 = 400 g</code>.</li></ol>`)}
        ${lc.example("Passer par l'unité", `<p>4 cahiers coûtent 12 €. Combien coûtent 7 cahiers ?</p>
          <ol><li>1 cahier coûte : <code>12 ÷ 4 = 3 €</code>.</li>
          <li>7 cahiers coûtent : <code>7 × 3 = 21 €</code>.</li></ol>`)}

        <h2>5. Vérifier qu'un tableau est proportionnel</h2>
        ${lc.example("Tableau proportionnel ?", `<p>3 stylos → 6 €, 5 stylos → 10 €, 7 stylos → 13 €.</p>
          <ol><li>On calcule le rapport prix/quantité : <code>6/3 = 2</code>, <code>10/5 = 2</code>, <code>13/7 ≈ 1,86</code>.</li>
          <li>Pas tous égaux → <strong>ce tableau n'est pas proportionnel</strong>.</li></ol>`)}
      `,
    },

    {
      title: "Volumes : cube et pavé droit",
      category: "Grandeurs et mesures",
      content: `
        <h2>1. Notion de volume</h2>
        ${lc.def("Volume", `<p>Le <strong>volume</strong> d'un solide est la mesure de la <strong>place qu'il occupe dans l'espace</strong>. C'est l'analogue 3D de l'aire en 2D.</p>
          <p>L'unité de base est le <strong>mètre cube</strong> (m³) : volume d'un cube de 1 m de côté.</p>`)}

        <h2>2. Volume du cube</h2>
        ${lc.prop("Formule", `<p>Pour un cube de côté <code>c</code> :</p>`)}
        ${lc.formula("V = c × c × c = c³")}
        ${lc.example("Cube de côté 4 cm", `<p><code>V = 4 × 4 × 4 = 64 cm³</code>.</p>`)}

        <h2>3. Volume du pavé droit</h2>
        ${lc.def("Pavé droit", `<p>Un <strong>pavé droit</strong> (ou parallélépipède rectangle) est un solide dont les 6 faces sont des rectangles. Il est défini par sa <strong>longueur</strong> L, sa <strong>largeur</strong> l et sa <strong>hauteur</strong> h.</p>`)}
        ${lc.formula("V = L × l × h")}
        ${lc.example("Boîte 8 × 5 × 3 cm", `<p><code>V = 8 × 5 × 3 = 120 cm³</code>.</p>`)}
        ${lc.tip("Astuce", `<p>L'ordre de multiplication n'a pas d'importance : <code>L × l × h = h × l × L</code>. Le volume reste le même.</p>`)}

        <h2>4. Unités de volume</h2>
        ${lc.prop("Conversions", `<p>Pour passer d'une unité de volume à une autre, on multiplie ou divise par <strong>1000</strong> à chaque palier (et non par 10 comme pour les longueurs).</p>
          <ul><li><code>1 m³ = 1 000 dm³ = 1 000 000 cm³</code></li>
          <li><code>1 dm³ = 1 000 cm³ = 1 000 000 mm³</code></li></ul>`)}
        ${lc.tip("Pourquoi 1000 ?", `<p>Parce que <code>1 m = 10 dm</code>, donc <code>1 m³ = 10 dm × 10 dm × 10 dm = 1 000 dm³</code>.</p>`)}

        <h2>5. Lien volume / contenance</h2>
        ${lc.formula("1 dm³ = 1 L &nbsp;&nbsp; 1 cm³ = 1 mL")}
        <p>Cela permet de relier le volume d'un récipient à sa contenance en eau.</p>
        ${lc.example("Combien de litres dans un aquarium 50 × 30 × 40 cm ?", `<ol>
          <li>Volume : <code>50 × 30 × 40 = 60 000 cm³</code>.</li>
          <li>Conversion : <code>60 000 cm³ = 60 dm³ = 60 L</code>.</li>
        </ol>`)}

        <h2>6. Patron du cube et du pavé</h2>
        ${lc.def("Patron", `<p>Un <strong>patron</strong> d'un solide est une figure plane qu'on peut plier pour reconstituer le solide.</p>
          <p>Un cube a un patron formé de <strong>6 carrés identiques</strong> ; un pavé droit a un patron de <strong>6 rectangles</strong> (3 paires de rectangles identiques face à face).</p>`)}
      `,
    },

        <h2>2. Diagramme en bâtons</h2>
        ${lc.def("Diagramme en bâtons", `<p>Un <strong>diagramme en bâtons</strong> représente des données par des barres dont la <strong>hauteur</strong> est proportionnelle à la valeur.</p>`)}
        ${lc.tip("Pour quoi c'est utile ?", `<p>Pour comparer rapidement plusieurs valeurs : on voit immédiatement la plus grande et la plus petite.</p>`)}

        <h2>3. Diagramme circulaire (camembert)</h2>
        ${lc.def("Diagramme circulaire", `<p>Un <strong>diagramme circulaire</strong> représente des données comme des parts d'un disque. Chaque part correspond à une <strong>fraction du tout</strong>.</p>`)}

        ${lc.example("Couleurs préférées", `<p>Sur 30 élèves : 10 bleu, 8 rouge, 7 vert, 5 jaune.</p>

        <h2>6. Bien lire un graphique : checklist</h2>

        ${lc.warn("Échelle trompeuse", `<p>Attention : un graphique peut être visuellement spectaculaire mais avec une échelle trompeuse (par exemple en zoomant entre 95 et 100 au lieu de 0 et 100). Toujours regarder l'<strong>échelle</strong>.</p>`)}
      `,

    {
      title: "Droites perpendiculaires et parallèles",
      category: "Géométrie",
      content: `
        <h2>1. Droites perpendiculaires</h2>
        ${lc.def("Droites perpendiculaires", `<p>Deux droites sont <strong>perpendiculaires</strong> si elles se coupent en formant un <strong>angle droit</strong> (90°).</p>
          <p>Notation : si <code>(d)</code> et <code>(d')</code> sont perpendiculaires, on écrit <code>(d) ⊥ (d')</code>.</p>`)}
        ${lc.tip("Reconnaître l'angle droit", `<p>Avec une <strong>équerre</strong> : on place le coin droit de l'équerre au point d'intersection. Si les deux côtés s'alignent avec les deux droites, c'est un angle droit.</p>`)}

        <h2>2. Tracer une droite perpendiculaire</h2>
        ${lc.prop("Avec règle et équerre", `<ol>
          <li>Placer le bord (coin droit) de l'équerre sur la droite donnée, en le faisant passer par le point.</li>
          <li>Tracer le long de l'autre côté de l'équerre.</li>
        </ol>`)}

        <h2>3. Droites parallèles</h2>
        ${lc.def("Droites parallèles", `<p>Deux droites sont <strong>parallèles</strong> si elles ne se coupent <strong>jamais</strong>, même prolongées à l'infini.</p>
          <p>Notation : <code>(d) ∥ (d')</code>.</p>`)}
        ${lc.tip("Image", `<p>Les rails d'un train, les bords d'une règle, les lignes d'un cahier… autant d'exemples de droites parallèles dans la vraie vie.</p>`)}

        <h2>4. Tracer une droite parallèle</h2>
        ${lc.prop("Avec règle et équerre", `<ol>
          <li>Placer un côté de l'équerre le long de la droite donnée.</li>
          <li>Glisser une règle contre l'autre côté de l'équerre, sans la bouger.</li>
          <li>Faire glisser l'équerre le long de la règle jusqu'au point voulu.</li>
          <li>Tracer le long du côté de l'équerre.</li>
        </ol>`)}

        <h2>5. Propriétés à retenir</h2>
        ${lc.prop("Propriété 1", `<p>Si deux droites sont <strong>perpendiculaires à une même droite</strong>, alors elles sont <strong>parallèles</strong> entre elles.</p>`)}
        ${lc.formula("(d₁) ⊥ (d) &nbsp;et&nbsp; (d₂) ⊥ (d) &nbsp;⇒&nbsp; (d₁) ∥ (d₂)")}
        ${lc.prop("Propriété 2", `<p>Si deux droites sont <strong>parallèles</strong>, et qu'une 3e droite est perpendiculaire à l'une, elle est aussi perpendiculaire à l'autre.</p>`)}
        ${lc.formula("(d₁) ∥ (d₂) &nbsp;et&nbsp; (d) ⊥ (d₁) &nbsp;⇒&nbsp; (d) ⊥ (d₂)")}
        ${lc.warn("Attention", `<p>Deux droites qui ne se touchent <strong>pas sur la feuille</strong> ne sont pas forcément parallèles : elles peuvent se rejoindre plus loin si on les prolonge. Pour être sûr qu'elles sont parallèles, il faut une justification (par exemple par les propriétés ci-dessus).</p>`)}

    {
      title: "Angles : mesure et construction",
      category: "Géométrie",
      content: `
        <h2>1. Vocabulaire</h2>
        ${lc.def("Angle", `<p>Un <strong>angle</strong> est l'écartement entre deux demi-droites ayant le même point d'origine (le <strong>sommet</strong>).</p>
          <p>On note un angle avec trois lettres, en plaçant le sommet au milieu : par exemple <code>BAC</code> ou <code>∠BAC</code>, où A est le sommet.</p>`)}

        <h2>2. Les types d'angles</h2>
        ${lc.prop("Selon la mesure", `<ul>
          <li><strong>Angle nul</strong> : 0°.</li>
          <li><strong>Angle aigu</strong> : entre 0° et 90° (strictement).</li>
          <li><strong>Angle droit</strong> : exactement 90°.</li>
          <li><strong>Angle obtus</strong> : entre 90° et 180° (strictement).</li>
          <li><strong>Angle plat</strong> : exactement 180°.</li>
          <li><strong>Angle plein</strong> : 360°.</li>
        </ul>`)}

        <h2>3. Mesurer un angle au rapporteur</h2>
        ${lc.prop("Méthode", `<ol>
          <li>Placer le centre du rapporteur sur le sommet de l'angle.</li>
          <li>Aligner la graduation 0 avec une des deux demi-droites.</li>
          <li>Lire la graduation où passe l'autre demi-droite.</li>
        </ol>`)}
        ${lc.warn("Les deux graduations", `<p>Le rapporteur porte deux graduations (montante et descendante). Il faut suivre celle qui démarre à 0 sur la demi-droite alignée. Vérifie ensuite par cohérence : un angle aigu doit donner moins de 90°, un angle obtus plus de 90°.</p>`)}

        <h2>4. Construire un angle</h2>
        ${lc.prop("Méthode", `<ol>
          <li>Tracer une demi-droite [Ax) et noter A le sommet.</li>
          <li>Placer le centre du rapporteur en A, en alignant 0 sur [Ax).</li>
          <li>Marquer un point B au-dessus de la graduation correspondant à la mesure voulue.</li>
          <li>Tracer la demi-droite [AB).</li>
        </ol>`)}

        <h2>5. Angles complémentaires et supplémentaires</h2>
        ${lc.def("Angles complémentaires", `<p>Deux angles sont <strong>complémentaires</strong> si leur somme vaut <code>90°</code>.</p>
          <p>Exemple : 30° et 60° sont complémentaires.</p>`)}
        ${lc.def("Angles supplémentaires", `<p>Deux angles sont <strong>supplémentaires</strong> si leur somme vaut <code>180°</code>.</p>
          <p>Exemple : 110° et 70° sont supplémentaires.</p>`)}
        ${lc.tip("Astuce mnémotechnique", `<p>« Complémentaires comme dans Compas (90°) ; Supplémentaires comme dans Stop (180°). »</p>`)}

        <h2>6. Bissectrice d'un angle</h2>
        ${lc.def("Bissectrice", `<p>La <strong>bissectrice</strong> d'un angle est la demi-droite issue du sommet qui partage l'angle en <strong>deux angles égaux</strong>.</p>`)}
        ${lc.prop("Construction au compas", `<ol>
          <li>Tracer un arc de cercle centré au sommet, qui coupe les deux demi-droites en deux points.</li>
          <li>De chacun de ces points, tracer un arc de même rayon. Ils se croisent en un point.</li>
          <li>Tracer la demi-droite issue du sommet et passant par ce point d'intersection : c'est la bissectrice.</li>
        </ol>`)}
      `,
    },

    {
      title: "Cercle, médiatrice",
      category: "Géométrie",
      content: `
        <h2>1. Le cercle</h2>
        ${lc.def("Cercle", `<p>Un <strong>cercle</strong> de centre <code>O</code> et de <strong>rayon</strong> <code>r</code> est l'ensemble de tous les points situés à la distance <code>r</code> de <code>O</code>.</p>`)}
        ${lc.tip("Le cercle, c'est la ligne. Le disque, c'est l'intérieur.", `<p>On confond souvent les deux. Strictement parlant : le <strong>cercle</strong> est seulement la courbe ; le <strong>disque</strong>, c'est la zone intérieure.</p>`)}

        <h2>2. Vocabulaire</h2>
        ${lc.prop("Les éléments d'un cercle", `<ul>
          <li><strong>Centre</strong> : le point fixe (souvent appelé <code>O</code>).</li>
          <li><strong>Rayon</strong> : un segment qui relie le centre à un point du cercle. C'est aussi sa longueur.</li>
          <li><strong>Diamètre</strong> : un segment qui relie deux points du cercle <em>en passant par le centre</em>. <strong>Diamètre = 2 × rayon</strong>.</li>
          <li><strong>Corde</strong> : un segment qui relie deux points du cercle (sans forcément passer par le centre).</li>
          <li><strong>Arc</strong> : une portion du cercle entre deux points.</li>
        </ul>`)}
        ${lc.formula("Diamètre &nbsp;=&nbsp; 2 × Rayon &nbsp;&nbsp;&nbsp; Rayon &nbsp;=&nbsp; Diamètre / 2")}

        <h2>3. Tracer un cercle</h2>
        ${lc.prop("Au compas", `<ol>
          <li>Régler l'écartement du compas à la longueur du rayon (avec la règle).</li>
          <li>Planter la pointe sèche au centre <code>O</code>.</li>
          <li>Faire tourner le compas pour tracer le cercle.</li>
        </ol>`)}

        <h2>4. La médiatrice d'un segment</h2>
        ${lc.def("Médiatrice", `<p>La <strong>médiatrice</strong> d'un segment <code>[AB]</code> est la droite qui :</p>
          <ul><li>passe par le <strong>milieu</strong> de <code>[AB]</code>,</li>
          <li>est <strong>perpendiculaire</strong> à <code>(AB)</code>.</li></ul>`)}

        <h2>5. Caractérisation par les distances</h2>
        ${lc.prop("Propriété fondamentale", `<p>Un point appartient à la médiatrice de <code>[AB]</code> si et seulement s'il est à <strong>égale distance</strong> de <code>A</code> et de <code>B</code>.</p>`)}
        ${lc.formula("M ∈ médiatrice de [AB] &nbsp;⇔&nbsp; MA = MB")}

        <h2>6. Construire la médiatrice</h2>
        ${lc.prop("Au compas et à la règle (sans équerre)", `<ol>
          <li>Tracer un arc de cercle centré sur <code>A</code>, de rayon assez grand (plus que la moitié de <code>AB</code>).</li>
          <li>Sans changer l'écartement, tracer un arc centré sur <code>B</code>.</li>
          <li>Les deux arcs se croisent en <strong>deux points</strong> (l'un au-dessus de <code>[AB]</code>, l'autre en-dessous).</li>
          <li>Tracer la droite qui passe par ces deux points : c'est la médiatrice.</li>
        </ol>`)}
        ${lc.tip("Pourquoi ça marche ?", `<p>Les deux points construits sont à la même distance de <code>A</code> et de <code>B</code> (par construction des arcs). Ils sont donc sur la médiatrice (propriété 5). La droite qui les relie EST la médiatrice.</p>`)}
      `,
    },

    {
      title: "Triangles et quadrilatères : reconnaissance",
      category: "Géométrie",
      content: `
        <h2>1. Triangles particuliers</h2>
        ${lc.def("Triangle", `<p>Un <strong>triangle</strong> est une figure formée de 3 points (les <strong>sommets</strong>) reliés par 3 segments (les <strong>côtés</strong>).</p>`)}
        ${lc.prop("Les principaux triangles", `<ul>
          <li><strong>Triangle isocèle</strong> : 2 côtés de même longueur. (Et donc 2 angles égaux.)</li>
          <li><strong>Triangle équilatéral</strong> : 3 côtés de même longueur. (Et 3 angles égaux à 60°.)</li>
          <li><strong>Triangle rectangle</strong> : un angle droit. Le grand côté (opposé à l'angle droit) s'appelle l'<strong>hypoténuse</strong>.</li>
          <li><strong>Triangle quelconque</strong> : aucune particularité.</li>
        </ul>`)}
        ${lc.tip("Combinaisons possibles", `<p>Un triangle peut être à la fois <strong>rectangle ET isocèle</strong> (angle droit + 2 côtés égaux). Mais pas équilatéral ET rectangle (impossible).</p>`)}

        <h2>2. Quadrilatères particuliers</h2>
        ${lc.def("Quadrilatère", `<p>Un <strong>quadrilatère</strong> est une figure à <strong>4 côtés</strong> (et 4 sommets).</p>`)}

        <h3>Le carré</h3>
        ${lc.prop("Propriétés", `<ul>
          <li>4 côtés de <strong>même longueur</strong>.</li>
          <li>4 angles <strong>droits</strong>.</li>
          <li>Les deux <strong>diagonales</strong> sont de même longueur, perpendiculaires, et se coupent en leur milieu.</li>
        </ul>`)}

        <h3>Le rectangle</h3>
        ${lc.prop("Propriétés", `<ul>
          <li>4 angles <strong>droits</strong>.</li>
          <li>Les côtés opposés sont parallèles et de même longueur.</li>
          <li>Les diagonales sont de même longueur et se coupent en leur milieu.</li>
        </ul>`)}

        <h3>Le losange</h3>
        ${lc.prop("Propriétés", `<ul>
          <li>4 côtés de <strong>même longueur</strong>.</li>
          <li>Les diagonales sont <strong>perpendiculaires</strong> et se coupent en leur milieu.</li>
          <li>Les angles opposés sont égaux.</li>
        </ul>`)}

        <h3>Le parallélogramme</h3>
        ${lc.prop("Propriétés", `<ul>
          <li>Les côtés opposés sont <strong>parallèles deux à deux</strong>.</li>
          <li>Les côtés opposés sont de même longueur.</li>
          <li>Les angles opposés sont égaux.</li>
          <li>Les diagonales se coupent en leur milieu.</li>
        </ul>`)}

        <h2>3. Hiérarchie</h2>
        ${lc.tip("Qui contient qui", `<p>Le <strong>carré</strong> est le plus particulier : il est <em>à la fois</em> un rectangle ET un losange (et donc aussi un parallélogramme).</p>
          <ul><li>Carré ⊂ Rectangle ⊂ Parallélogramme</li>
          <li>Carré ⊂ Losange ⊂ Parallélogramme</li></ul>
          <p>Tout carré est un rectangle, mais un rectangle n'est pas forcément un carré (sauf s'il est aussi un losange).</p>`)}

        <h2>4. Reconnaître la nature d'un quadrilatère</h2>
        ${lc.example("Méthode : on vérifie une propriété caractéristique", `<ol>
          <li>4 angles droits + 4 côtés égaux → <strong>carré</strong></li>
          <li>4 angles droits seulement → <strong>rectangle</strong></li>
          <li>4 côtés égaux seulement → <strong>losange</strong></li>
          <li>Côtés opposés parallèles seulement → <strong>parallélogramme</strong></li>
        </ol>`)}
      `,
    },

    {
      title: "Symétrie axiale",
      category: "Géométrie",
      content: `
        <h2>1. Symétrique d'un point</h2>
        ${lc.def("Symétrie par rapport à une droite", `<p>Le <strong>symétrique</strong> d'un point <code>A</code> par rapport à une droite <code>(d)</code> est le point <code>A'</code> tel que :</p>
          <ul><li><code>(d)</code> est <strong>perpendiculaire</strong> à <code>(AA')</code> ;</li>
          <li><code>(d)</code> coupe <code>(AA')</code> en son <strong>milieu</strong>.</li></ul>
          <p>La droite <code>(d)</code> s'appelle l'<strong>axe de symétrie</strong>.</p>`)}
        ${lc.tip("Image du miroir", `<p>Imagine un miroir posé le long de <code>(d)</code> : <code>A'</code> est l'image de <code>A</code> dans le miroir. À la même distance, mais de l'autre côté.</p>`)}

        <h2>2. Construire un symétrique</h2>
        ${lc.prop("Méthode (équerre + règle graduée)", `<ol>
          <li>Tracer la perpendiculaire à <code>(d)</code> passant par <code>A</code>.</li>
          <li>Mesurer la distance entre <code>A</code> et l'axe.</li>
          <li>Reporter cette distance de l'autre côté de l'axe, sur la même perpendiculaire.</li>
          <li>Le point obtenu est <code>A'</code>.</li>
        </ol>`)}
        ${lc.prop("Méthode (au compas)", `<ol>
          <li>Tracer un arc de cercle centré sur l'axe, de rayon assez grand pour qu'il coupe la perpendiculaire des deux côtés.</li>
          <li>L'intersection avec la perpendiculaire de l'autre côté donne <code>A'</code>.</li>
        </ol>`)}

        <h2>3. Symétrique d'une figure</h2>
        ${lc.prop("Conservation", `<p>La symétrie axiale <strong>conserve</strong> :</p>
          <ul><li>les <strong>longueurs</strong> (un segment et son symétrique ont la même longueur),</li>
          <li>les <strong>angles</strong>,</li>
          <li>les <strong>aires</strong> et les <strong>périmètres</strong>,</li>
          <li>le parallélisme et la perpendicularité.</li></ul>
          <p>Mais elle <strong>inverse</strong> le sens (un sens horaire devient anti-horaire — comme dans un miroir).</p>`)}

        <h2>4. Axe de symétrie d'une figure</h2>
        ${lc.def("Axe de symétrie", `<p>Une figure admet un <strong>axe de symétrie</strong> si elle est confondue avec elle-même par cette symétrie.</p>`)}
        ${lc.prop("Axes des figures usuelles", `<ul>
          <li><strong>Carré</strong> : 4 axes (les 2 diagonales + les 2 médianes).</li>
          <li><strong>Rectangle</strong> : 2 axes (les médianes — pas les diagonales !).</li>
          <li><strong>Losange</strong> : 2 axes (les diagonales).</li>
          <li><strong>Triangle équilatéral</strong> : 3 axes (les médiatrices de chaque côté).</li>
          <li><strong>Triangle isocèle</strong> : 1 axe (la médiatrice de la base).</li>
          <li><strong>Cercle</strong> : une infinité d'axes (toute droite passant par le centre).</li>
        </ul>`)}
        ${lc.warn("À ne pas confondre", `<p>Le <strong>rectangle</strong> n'a <strong>pas</strong> ses diagonales comme axes de symétrie (sinon, le pli ne ferait pas coïncider les deux moitiés). Seules ses médianes le sont.</p>`)}
      `,
    },

    {
      title: "Symétrie centrale",
      category: "Géométrie",
      content: `
        <h2>1. Définition</h2>
        ${lc.def("Symétrique d'un point par rapport à un point", `<p>Le <strong>symétrique</strong> d'un point A par rapport à un point O est le point A' tel que O est le <strong>milieu</strong> du segment [AA'].</p>
          <p>O est appelé le <strong>centre de symétrie</strong>.</p>`)}
        ${lc.tip("Image visuelle", `<p>Imagine que tu fais tourner la figure de <strong>180°</strong> (un demi-tour) autour du point O : tu obtiens son symétrique. Pas un effet miroir, mais une rotation.</p>`)}

        <h2>2. Construire un symétrique</h2>
        ${lc.prop("Méthode (règle graduée)", `<ol>
          <li>Tracer la droite (AO).</li>
          <li>Mesurer la distance OA.</li>
          <li>Reporter la même distance de l'autre côté de O sur la droite.</li>
          <li>Le point obtenu est A'.</li>
        </ol>`)}

        <h2>3. Conservation</h2>
        ${lc.prop("Ce que conserve la symétrie centrale", `<ul>
          <li>Les <strong>longueurs</strong> (un segment et son image ont même longueur).</li>
          <li>Les <strong>angles</strong>.</li>
          <li>Les <strong>aires</strong> et les <strong>périmètres</strong>.</li>
          <li>Le <strong>parallélisme</strong>.</li>
        </ul>
          <p>Mais elle <strong>renverse</strong> le sens d'orientation (un sens horaire devient anti-horaire).</p>`)}

        <h2>4. Centre de symétrie d'une figure</h2>
        ${lc.def("Centre de symétrie", `<p>Une figure admet un <strong>centre de symétrie</strong> O si elle est confondue avec elle-même par la symétrie de centre O.</p>`)}
        ${lc.prop("Centres usuels", `<ul>
          <li><strong>Cercle</strong> : son centre.</li>
          <li><strong>Rectangle, losange, carré</strong> : intersection des diagonales.</li>
          <li><strong>Parallélogramme</strong> : intersection des diagonales.</li>
          <li><strong>Triangle équilatéral</strong> : <em>aucun</em> centre de symétrie.</li>
        </ul>`)}

        <h2>5. Différence avec la symétrie axiale</h2>
        ${lc.warn("Ne pas confondre", `<ul>
          <li><strong>Symétrie axiale</strong> : par rapport à une <em>droite</em>. Effet miroir.</li>
          <li><strong>Symétrie centrale</strong> : par rapport à un <em>point</em>. Demi-tour.</li>
        </ul>
          <p>Une lettre comme <strong>A</strong> a un axe de symétrie (vertical) mais pas de centre de symétrie. Une lettre comme <strong>S</strong> n'a pas d'axe mais a un centre de symétrie.</p>`)}
      `,
    },

    {
      title: "Périmètre et aire",
      category: "Grandeurs et mesures",
      content: `
        <h2>1. Périmètre vs aire</h2>
        ${lc.def("Périmètre", `<p>Le <strong>périmètre</strong> d'une figure est la <strong>longueur de son contour</strong>. C'est une longueur, exprimée en m, cm, mm, etc.</p>`)}
        ${lc.def("Aire", `<p>L'<strong>aire</strong> d'une figure est la mesure de la <strong>surface qu'elle occupe</strong>. C'est une grandeur, exprimée en m², cm², etc.</p>`)}
        ${lc.warn("Ne pas confondre", `<p>Le <strong>périmètre</strong> dit « combien il faut de fil pour faire le tour ». L'<strong>aire</strong> dit « combien il faut de carrés pour remplir l'intérieur ». Ce sont deux choses différentes !</p>
          <p>Deux figures de même périmètre peuvent avoir des aires différentes.</p>`)}

        <h2>2. Périmètres usuels</h2>
        ${lc.formula("Polygone &nbsp;:&nbsp; P = somme des longueurs des côtés")}
        ${lc.formula("Carré (côté c) &nbsp;:&nbsp; P = 4 × c")}
        ${lc.formula("Rectangle (longueur L, largeur l) &nbsp;:&nbsp; P = 2 × (L + l)")}
        ${lc.formula("Cercle (rayon r) &nbsp;:&nbsp; P = 2 × π × r &nbsp;&nbsp; (avec π ≈ 3,14)")}
        ${lc.example("Périmètre d'un rectangle de 8 cm × 5 cm", `<p><code>P = 2 × (8 + 5) = 2 × 13 = 26 cm</code>.</p>`)}
        ${lc.example("Périmètre d'un cercle de rayon 4 cm", `<p><code>P = 2 × π × 4 = 8π ≈ 8 × 3,14 ≈ 25,12 cm</code>.</p>`)}

        <h2>3. Aires usuelles</h2>
        ${lc.formula("Carré (côté c) &nbsp;:&nbsp; A = c × c = c²")}
        ${lc.formula("Rectangle (longueur L, largeur l) &nbsp;:&nbsp; A = L × l")}
        ${lc.formula("Triangle (base b, hauteur h) &nbsp;:&nbsp; A = (b × h) / 2")}
        ${lc.formula("Disque (rayon r) &nbsp;:&nbsp; A = π × r²")}
        ${lc.example("Aire d'un carré de 6 cm de côté", `<p><code>A = 6 × 6 = 36 cm²</code>.</p>`)}
        ${lc.example("Aire d'un triangle de base 8 cm et hauteur 5 cm", `<p><code>A = (8 × 5) / 2 = 40 / 2 = 20 cm²</code>.</p>`)}
        ${lc.example("Aire d'un disque de rayon 3 cm", `<p><code>A = π × 3² = 9π ≈ 9 × 3,14 ≈ 28,26 cm²</code>.</p>`)}

        <h2>4. Unités d'aire</h2>
        ${lc.prop("Conversions", `<p>Pour passer d'une unité d'aire à une autre, on multiplie ou divise par <strong>100</strong> à chaque palier (et non par 10 comme pour les longueurs !).</p>
          <ul><li><code>1 m² = 100 dm² = 10 000 cm² = 1 000 000 mm²</code></li>
          <li><code>1 km² = 1 000 000 m²</code></li></ul>`)}
        ${lc.tip("Pourquoi 100 ?", `<p>Parce que <code>1 m = 100 cm</code>, donc <code>1 m² = 1 m × 1 m = 100 cm × 100 cm = 10 000 cm²</code>.</p>`)}

        <h2>5. Aires composées</h2>
        ${lc.example("Aire d'une figure en L", `<p>Pour une figure compliquée, on la <strong>découpe</strong> en rectangles ou triangles simples, on calcule chaque aire, puis on additionne.</p>
          <p>Si on doit retirer une partie (par exemple un trou), on calcule l'aire totale et on <strong>soustrait</strong> l'aire de la partie manquante.</p>`)}
      `,
    },

  ];
}

// ─── Contenu pédagogique : 5e à fond ─────────────────────────────
function chapters5e() {
  return [
    {
      title: "Nombres décimaux",
      category: "Nombres et calcul",
      content: `
        <h2>1. Lecture et écriture</h2>
        <p>Un <strong>nombre décimal</strong> est un nombre qu'on peut écrire avec une partie entière et une partie décimale, séparées par une virgule.</p>
        ${lc.def("Définition", `<p><code>12,375</code> a pour partie entière <code>12</code> et pour partie décimale <code>375</code>. On lit : « douze unités et trois cent soixante-quinze millièmes ».</p>`)}
        ${lc.formula(`12,375 &nbsp;=&nbsp; 1×10 + 2×1 + 3×0,1 + 7×0,01 + 5×0,001`)}
        <h3>Le tableau de position</h3>
        <p>Chaque chiffre a une valeur qui dépend de sa position. À droite de la virgule, on a successivement les <strong>dixièmes</strong> (0,1), <strong>centièmes</strong> (0,01), <strong>millièmes</strong> (0,001), etc.</p>
        ${lc.example("Exemple résolu : décomposer 47,028", `<ol>
          <li>4 est dans la colonne des dizaines : <code>4 × 10 = 40</code>.</li>
          <li>7 est dans la colonne des unités : <code>7 × 1 = 7</code>.</li>
          <li>0 dans les dixièmes (donc 0).</li>
          <li>2 dans les centièmes : <code>2 × 0,01 = 0,02</code>.</li>
          <li>8 dans les millièmes : <code>8 × 0,001 = 0,008</code>.</li>
        </ol><p>Vérification : <code>40 + 7 + 0 + 0,02 + 0,008 = 47,028</code> ✓</p>`)}

        <h2>2. Comparaison de décimaux</h2>
        ${lc.prop("Méthode", `<p>Pour comparer deux décimaux :</p><ol>
          <li>On compare d'abord les <strong>parties entières</strong>. La plus grande gagne.</li>
          <li>Si elles sont égales, on compare chiffre à chiffre <strong>après la virgule</strong> en partant de la gauche (dixièmes, puis centièmes…).</li>
        </ol>`)}
        ${lc.example("Comparer 3,52 et 3,5", `<p>Parties entières : <code>3 = 3</code>, on continue.</p>
          <p>Dixièmes : <code>5 = 5</code>, on continue.</p>
          <p>Centièmes : pour 3,5 il n'y a rien… donc 0. Donc <code>2 > 0</code>.</p>
          <p>Conclusion : <code>3,52 > 3,5</code>.</p>`)}
        ${lc.warn("Piège classique", `<p>Beaucoup d'élèves pensent que <code>3,12 > 3,2</code> parce que « 12 > 2 ». C'est faux : <code>3,12 = 3,12</code> et <code>3,2 = 3,20</code>, donc <code>3,2 > 3,12</code>. Toujours penser à compléter avec des zéros pour comparer.</p>`)}

        <h2>3. Encadrement et arrondi</h2>
        <p><strong>Encadrer</strong> un nombre, c'est trouver deux valeurs entre lesquelles il se situe.</p>
        ${lc.example("Encadrer 7,38 au dixième", `<p>Au dixième, on regarde la position après la virgule. <code>7,38</code> est entre <code>7,3</code> et <code>7,4</code>. On écrit : <code>7,3 < 7,38 < 7,4</code>.</p>`)}
        <p><strong>Arrondir</strong>, c'est choisir la valeur la plus proche.</p>
        ${lc.prop("Règle de l'arrondi", `<p>Pour arrondir au rang voulu, on regarde le <em>chiffre suivant</em> :</p>
          <ul><li>S'il vaut <strong>0, 1, 2, 3 ou 4</strong> → on arrondit vers le bas (on garde).</li>
          <li>S'il vaut <strong>5, 6, 7, 8 ou 9</strong> → on arrondit vers le haut (on ajoute 1).</li></ul>`)}
        ${lc.example("Arrondir 7,386 au dixième", `<p>On regarde le chiffre des centièmes : <code>8</code>. Comme <code>8 ≥ 5</code>, on arrondit vers le haut : <code>7,386 ≈ 7,4</code>.</p>`)}

        <h2>4. Opérations sur les décimaux</h2>
        ${lc.prop("Addition / soustraction posée", `<p>On aligne les <strong>virgules</strong> les unes en dessous des autres. On peut compléter par des zéros à droite si besoin.</p>`)}
        ${lc.example("Calculer 12,7 + 8,35", `<p>On aligne :</p>
          <p><code>&nbsp;12,70&nbsp;</code><br><code>+&nbsp;8,35&nbsp;</code><br><code>━━━━━━</code><br><code>&nbsp;21,05</code></p>`)}
        ${lc.prop("Multiplication", `<p>On multiplie comme des entiers, sans s'occuper des virgules. À la fin, le résultat a autant de chiffres après la virgule que la <strong>somme</strong> des chiffres après la virgule des deux nombres.</p>`)}
        ${lc.example("Calculer 2,5 × 1,3", `<ol><li>On multiplie sans virgule : <code>25 × 13 = 325</code>.</li>
          <li>Compte les décimales : <code>2,5</code> a 1 chiffre après la virgule, <code>1,3</code> a 1 chiffre après la virgule. Total : <code>1 + 1 = 2</code>.</li>
          <li>Donc : <code>2,5 × 1,3 = 3,25</code> (2 chiffres après la virgule).</li></ol>`)}
        ${lc.tip("Astuce", `<p>Pour multiplier par 10, 100, 1000 : on décale la virgule de 1, 2 ou 3 rangs vers la droite. <code>3,57 × 100 = 357</code>.</p>`)}
      `,
