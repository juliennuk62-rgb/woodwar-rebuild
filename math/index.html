        ${lc.example("Décharge d'un condensateur", `<p><code>RC × U' + U = 0</code> donne <code>U(t) = U_0 × e^{−t/(RC)}</code>. Constante de temps <code>τ = RC</code>.</p>`)}
      `,
    },

    {
      title: "Convexité et dérivée seconde",
      category: "Analyse",
      content: `
        <h2>1. Convexité, concavité</h2>
        ${lc.def("Fonction convexe", `<p>Une fonction <code>f</code> est <strong>convexe</strong> sur un intervalle <code>I</code> si, pour tous <code>a, b ∈ I</code>, le segment qui relie les points <code>(a, f(a))</code> et <code>(b, f(b))</code> est <strong>au-dessus</strong> de la courbe entre ces deux points.</p>
          <p>Image : la courbe « tient l'eau » comme un bol ouvert vers le haut.</p>`)}
        ${lc.def("Fonction concave", `<p><code>f</code> est <strong>concave</strong> si le segment est en-dessous de la courbe. Image : un bol retourné, ouvert vers le bas.</p>`)}
        ${lc.example("Exemples", `<ul>
          <li><code>x²</code> est convexe sur ℝ.</li>
          <li><code>√x</code> est concave sur <code>[0, +∞[</code>.</li>
          <li><code>e^x</code> est convexe sur ℝ.</li>
          <li><code>ln(x)</code> est concave sur <code>]0, +∞[</code>.</li>
        </ul>`)}

        <h2>2. Dérivée seconde</h2>
        ${lc.def("Dérivée seconde", `<p>La <strong>dérivée seconde</strong> de <code>f</code>, notée <code>f''</code>, est la dérivée de <code>f'</code> :</p>`)}
        ${lc.formula("f''(x) = (f')'(x)")}
        ${lc.example("Calcul", `<p>Pour <code>f(x) = x³</code> : <code>f'(x) = 3x²</code> et <code>f''(x) = 6x</code>.</p>`)}

        <h2>3. Lien convexité / dérivée seconde</h2>
        ${lc.prop("Théorème", `<p>Soit <code>f</code> deux fois dérivable sur <code>I</code>.</p>
          <ul><li><code>f'' ≥ 0</code> sur <code>I</code> ⇔ <code>f</code> est <strong>convexe</strong> sur <code>I</code>.</li>
          <li><code>f'' ≤ 0</code> sur <code>I</code> ⇔ <code>f</code> est <strong>concave</strong> sur <code>I</code>.</li></ul>`)}
        ${lc.example("Étudier la convexité de f(x) = x³ − 3x", `<ol>
          <li><code>f'(x) = 3x² − 3</code>, <code>f''(x) = 6x</code>.</li>
          <li><code>f'' < 0</code> sur <code>]−∞ ; 0[</code> : f concave.</li>
          <li><code>f'' > 0</code> sur <code>]0 ; +∞[</code> : f convexe.</li>
        </ol>`)}

        <h2>4. Point d'inflexion</h2>
        ${lc.def("Point d'inflexion", `<p>Un <strong>point d'inflexion</strong> est un point où la courbe <em>change de convexité</em> (passe de convexe à concave ou inversement). C'est aussi un point où la tangente <strong>traverse</strong> la courbe.</p>`)}
        ${lc.prop("Caractérisation", `<p>Si <code>f''</code> s'annule en <code>a</code> en changeant de signe, alors <code>(a, f(a))</code> est un point d'inflexion.</p>`)}
        ${lc.example("Avec f(x) = x³ − 3x", `<p><code>f''</code> s'annule en 0 en changeant de signe (négatif puis positif). Donc <code>(0, 0)</code> est un point d'inflexion.</p>`)}

        <h2>5. Application à la position de la tangente</h2>
        ${lc.prop("Conséquence", `<ul>
          <li>Sur un intervalle où <code>f</code> est convexe, sa courbe est <strong>au-dessus</strong> de chacune de ses tangentes.</li>
          <li>Sur un intervalle où <code>f</code> est concave, la courbe est <strong>en-dessous</strong> de ses tangentes.</li>
        </ul>`)}
      `,
    },

    {
      title: "Sommes de variables aléatoires et concentration",
      category: "Probabilités",
      content: `
        <h2>1. Espérance d'une somme</h2>
        ${lc.prop("Linéarité", `<p>Pour deux variables aléatoires <code>X</code> et <code>Y</code> définies sur le même univers :</p>`)}
        ${lc.formula("E(X + Y) = E(X) + E(Y)")}
        ${lc.formula("E(aX + b) = a × E(X) + b")}
        <p>La linéarité de l'espérance est <strong>toujours vraie</strong>, même sans indépendance.</p>

        <h2>2. Variance d'une somme (cas indépendant)</h2>
        ${lc.prop("Si X et Y indépendantes", `<p>La variance d'une somme de variables aléatoires <strong>indépendantes</strong> est la somme des variances :</p>`)}
        ${lc.formula("V(X + Y) = V(X) + V(Y) &nbsp;(si X et Y indépendantes)")}
        ${lc.formula("V(aX + b) = a² × V(X)")}
        ${lc.warn("Attention", `<p>Sans indépendance, la formule générale est <code>V(X+Y) = V(X) + V(Y) + 2×Cov(X,Y)</code>. Sans le terme de covariance, l'égalité est fausse.</p>`)}

        <h2>3. Schéma de Bernoulli répété</h2>
        ${lc.prop("Binomiale = somme de Bernoulli", `<p>Si <code>X₁, …, Xₙ</code> sont des variables de Bernoulli <strong>indépendantes</strong> et <strong>de même loi</strong> de paramètre <code>p</code>, alors leur somme suit la loi binomiale :</p>`)}
        ${lc.formula("S = X₁ + X₂ + … + Xₙ &nbsp;~&nbsp; ℬ(n, p)")}
        ${lc.formula("E(S) = np &nbsp;&nbsp; V(S) = np(1 − p)")}
        ${lc.tip("Démonstration intuitive", `<p>Chaque <code>Xᵢ</code> a espérance <code>p</code> et variance <code>p(1−p)</code>. Par linéarité : <code>E(S) = n × p</code>. Par indépendance : <code>V(S) = n × p(1−p)</code>.</p>`)}

        <h2>4. Inégalité de Bienaymé-Tchebychev</h2>
        ${lc.prop("Énoncé", `<p>Pour toute variable aléatoire <code>X</code> d'espérance <code>μ</code> et variance <code>σ²</code> finies, et tout <code>ε > 0</code> :</p>`)}
        ${lc.formula("P(|X − μ| ≥ ε) ≤ σ² / ε²")}
        <p>Cette inégalité <em>universelle</em> (vraie quelle que soit la loi de X) borne la probabilité d'écart par rapport à la moyenne.</p>
        ${lc.example("Application", `<p><code>X</code> a espérance 50, variance 9 (donc σ = 3). Probabilité que <code>X</code> s'écarte de plus de 6 de sa moyenne ?</p>
          <p><code>P(|X − 50| ≥ 6) ≤ 9 / 36 = 1/4 = 0,25</code>.</p>`)}

        <h2>5. Loi des grands nombres pour la moyenne empirique</h2>
        ${lc.prop("LGN faible", `<p>Soit <code>(Xₙ)</code> une suite de variables i.i.d. d'espérance <code>μ</code>. La moyenne empirique <code>M_n = (X₁ + … + Xₙ)/n</code> vérifie :</p>`)}
        ${lc.formula("∀ ε > 0, &nbsp; P(|M_n − μ| ≥ ε) → 0 &nbsp; (n → +∞)")}
        ${lc.tip("Conséquence pratique", `<p>Sur un grand nombre d'expériences, la moyenne observée se rapproche de l'espérance théorique. C'est le fondement de l'estimation par échantillon.</p>`)}

        <h2>6. Concentration de la binomiale (corollaire)</h2>
        ${lc.example("Application directe", `<p><code>X ~ ℬ(100, 0,5)</code>. Probabilité que <code>X/100</code> s'écarte de 0,5 de plus de 0,1 ?</p>
          <ol><li><code>E(X/100) = 0,5</code>, <code>V(X/100) = (0,5 × 0,5)/100 = 0,0025</code>.</li>
          <li>Tchebychev : <code>P(|X/100 − 0,5| ≥ 0,1) ≤ 0,0025 / 0,01 = 0,25</code>.</li>
          <li>(Borne grossière mais sans calculer la binomiale exactement.)</li></ol>`)}
      `,
    },
  ];
}

// ─── Contenu pédagogique : 1ère à fond ───────────────────────────
function chapters1ere() {
  return [
    {
      title: "Suites numériques : arithmétique et géométrique",
      category: "Suites",
      content: `
        <h2>1. Notion de suite</h2>
        ${lc.def("Suite numérique", `<p>Une <strong>suite numérique</strong> est une fonction qui à chaque entier <code>n</code> (souvent à partir de 0 ou 1) associe un nombre réel, noté <code>uₙ</code> (« u indice n »).</p>
          <p>Notation : on note la suite <code>(uₙ)</code> ou <code>(uₙ)ₙ ∈ ℕ</code>.</p>`)}
        ${lc.example("Une suite simple", `<p>Soit la suite définie par <code>uₙ = 3n + 2</code>. On a <code>u₀ = 2</code>, <code>u₁ = 5</code>, <code>u₂ = 8</code>, <code>u₃ = 11</code>, etc.</p>`)}

        <h2>2. Modes de définition</h2>
        ${lc.prop("Forme explicite", `<p>Une suite est définie de manière <strong>explicite</strong> quand on a une formule directe : <code>uₙ = f(n)</code>. On peut calculer n'importe quel terme directement.</p>`)}
        ${lc.prop("Forme par récurrence", `<p>Une suite est définie par <strong>récurrence</strong> quand on connaît le premier terme et une relation pour passer d'un terme au suivant : <code>u_{n+1} = g(uₙ)</code>.</p>`)}
        ${lc.example("Récurrence", `<p>Soit <code>u₀ = 1</code> et <code>u_{n+1} = 2uₙ + 3</code>. Alors :</p>
          <ul><li><code>u₁ = 2 × 1 + 3 = 5</code></li>
          <li><code>u₂ = 2 × 5 + 3 = 13</code></li>
          <li><code>u₃ = 2 × 13 + 3 = 29</code></li></ul>`)}

        <h2>3. Suites arithmétiques</h2>
        ${lc.def("Suite arithmétique", `<p>Une suite est <strong>arithmétique</strong> de raison <code>r</code> si chaque terme s'obtient en ajoutant <code>r</code> au précédent :</p>`)}
        ${lc.formula("u_{n+1} = uₙ + r")}
        ${lc.prop("Forme explicite", `<p>Si <code>(uₙ)</code> est arithmétique de raison <code>r</code> et de premier terme <code>u₀</code> :</p>`)}
        ${lc.formula("uₙ = u₀ + n × r")}
        <p>Plus généralement, partant de n'importe quel rang <code>p</code> : <code>uₙ = u_p + (n − p) × r</code>.</p>
        ${lc.example("Calcul", `<p>Suite arithmétique de premier terme <code>u₀ = 4</code> et raison <code>r = 3</code>.</p>
          <p><code>uₙ = 4 + 3n</code>. Donc <code>u₁₀ = 4 + 30 = 34</code>.</p>`)}

        <h2>4. Somme des termes d'une suite arithmétique</h2>
        ${lc.formula("u₀ + u₁ + … + uₙ = (n + 1) × (u₀ + uₙ) / 2")}
        ${lc.tip("Astuce de Gauss", `<p>« Nombre de termes × moyenne du premier et du dernier terme ». Cette formule vient d'une astuce célèbre de Gauss enfant pour calculer <code>1 + 2 + … + 100 = 100 × 101 / 2 = 5050</code>.</p>`)}

        <h2>5. Suites géométriques</h2>
        ${lc.def("Suite géométrique", `<p>Une suite est <strong>géométrique</strong> de raison <code>q</code> (avec <code>q ≠ 0</code>) si chaque terme s'obtient en multipliant le précédent par <code>q</code> :</p>`)}
        ${lc.formula("u_{n+1} = q × uₙ")}
        ${lc.prop("Forme explicite", `<p>Si <code>(uₙ)</code> est géométrique de raison <code>q</code> et de premier terme <code>u₀</code> :</p>`)}
        ${lc.formula("uₙ = u₀ × qⁿ")}
        ${lc.example("Calcul", `<p>Suite géométrique de premier terme <code>u₀ = 5</code> et raison <code>q = 2</code>.</p>
          <p><code>uₙ = 5 × 2ⁿ</code>. Donc <code>u₅ = 5 × 32 = 160</code>.</p>`)}

        <h2>6. Somme des termes d'une suite géométrique</h2>
        ${lc.formula("u₀ + u₁ + … + uₙ = u₀ × (1 − q^{n+1}) / (1 − q) &nbsp;&nbsp; (q ≠ 1)")}
        ${lc.example("Application", `<p>Suite géométrique <code>u₀ = 2</code>, <code>q = 3</code>. Somme des 5 premiers termes (<code>u₀</code> à <code>u₄</code>) :</p>
          <p><code>S = 2 × (1 − 3⁵)/(1 − 3) = 2 × (1 − 243)/(−2) = 2 × (−242)/(−2) = 242</code>.</p>`)}

        <h2>7. Sens de variation</h2>
        ${lc.prop("Suites arithmétiques", `<ul>
          <li><code>r > 0</code> : strictement croissante.</li>
          <li><code>r < 0</code> : strictement décroissante.</li>
          <li><code>r = 0</code> : constante.</li>
        </ul>`)}
        ${lc.prop("Suites géométriques (avec u₀ > 0)", `<ul>
          <li><code>q > 1</code> : strictement croissante.</li>
          <li><code>0 < q < 1</code> : strictement décroissante (vers 0).</li>
          <li><code>q = 1</code> : constante.</li>
          <li><code>q < 0</code> : signes alternés (ni croissante ni décroissante).</li>
        </ul>`)}

        <h2>8. Inégalité de Bernoulli</h2>
        ${lc.prop("Énoncé", `<p>Pour tout réel <code>x ≥ −1</code> et tout entier naturel <code>n</code> :</p>`)}
        ${lc.formula("(1 + x)ⁿ ≥ 1 + n × x")}
        ${lc.tip("Démonstration intuitive (par récurrence)", `<p>Pour <code>n = 0</code> : <code>1 ≥ 1</code> ✓. Pour passer de <code>n</code> à <code>n+1</code>, on multiplie par <code>(1 + x) ≥ 0</code> et on développe.</p>`)}
        ${lc.example("Croissance d'une suite géométrique", `<p>Pour <code>q > 1</code>, on pose <code>q = 1 + x</code> avec <code>x > 0</code>. Alors <code>qⁿ ≥ 1 + nx</code>, qui tend vers <code>+∞</code>. Cela justifie pourquoi <code>(qⁿ)</code> diverge vers <code>+∞</code> quand <code>q > 1</code>.</p>`)}
      `,
    },

    {
      title: "Limites de suites (intuition)",
      category: "Suites",
      content: `
        ${lc.warn("Note de programme", `<p>L'étude formelle des limites de suites se fait en <strong>Terminale</strong>. Ce chapitre est une <strong>anticipation intuitive</strong> qui aide à comprendre le comportement asymptotique des suites géométriques (vu en 1ère). Tu pourras y revenir plus tard.</p>`)}

        <h2>1. Idée intuitive</h2>
        ${lc.def("Limite d'une suite", `<p>Étudier la limite d'une suite <code>(uₙ)</code>, c'est observer ce que devient <code>uₙ</code> quand <code>n</code> devient « très grand » (tend vers <code>+∞</code>).</p>`)}

        <h2>2. Suite convergente</h2>
        ${lc.def("Convergence vers un réel", `<p>Une suite <code>(uₙ)</code> <strong>converge</strong> vers un réel <code>L</code> si <code>uₙ</code> se rapproche de plus en plus de <code>L</code> quand <code>n → +∞</code>.</p>
          <p>Notation : <code>lim uₙ = L</code> (quand <code>n → +∞</code>).</p>`)}
        ${lc.example("Suite qui tend vers 0", `<p><code>uₙ = 1/n</code>. Pour <code>n = 100</code>, <code>uₙ = 0,01</code>. Pour <code>n = 1000</code>, <code>uₙ = 0,001</code>. La suite tend vers 0.</p>
          <p><code>lim 1/n = 0</code>.</p>`)}

        <h2>3. Suite divergente vers l'infini</h2>
        ${lc.def("Divergence vers ±∞", `<p>Une suite <strong>diverge vers +∞</strong> si <code>uₙ</code> dépasse n'importe quelle borne pour <code>n</code> assez grand. Idem pour <code>−∞</code>.</p>`)}
        ${lc.example("Croissance non bornée", `<p><code>uₙ = n²</code>. Pour <code>n = 10</code>, <code>uₙ = 100</code> ; pour <code>n = 100</code>, <code>uₙ = 10 000</code>. La suite tend vers <code>+∞</code>.</p>`)}

        <h2>4. Suite divergente sans limite</h2>
        ${lc.example("Sans limite", `<p><code>uₙ = (−1)ⁿ</code> donne <code>1, −1, 1, −1, …</code>. Cette suite ne converge pas et ne diverge pas vers ±∞ : elle <strong>n'a pas de limite</strong>.</p>`)}

        <h2>5. Limites des suites usuelles</h2>
        ${lc.prop("À retenir", `<ul>
          <li><code>lim n = +∞</code></li>
          <li><code>lim n² = +∞</code>, <code>lim n³ = +∞</code>, …, <code>lim nᵏ = +∞</code> (k > 0)</li>
          <li><code>lim 1/n = 0</code></li>
          <li><code>lim 1/n² = 0</code>, etc.</li>
          <li><code>lim √n = +∞</code></li>
        </ul>`)}

        <h2>6. Limite d'une suite géométrique qⁿ</h2>
        ${lc.prop("Selon la valeur de q", `<ul>
          <li>Si <code>q > 1</code> : <code>lim qⁿ = +∞</code>.</li>
          <li>Si <code>q = 1</code> : <code>lim qⁿ = 1</code>.</li>
          <li>Si <code>−1 < q < 1</code> : <code>lim qⁿ = 0</code>.</li>
          <li>Si <code>q ≤ −1</code> : pas de limite (oscille).</li>
        </ul>`)}
        ${lc.example("Calcul", `<ul>
          <li><code>lim 2ⁿ = +∞</code> (q = 2 > 1).</li>
          <li><code>lim (1/3)ⁿ = 0</code> (0 < q < 1).</li>
          <li><code>lim (−2)ⁿ</code> n'existe pas (oscille en signe avec valeur croissante).</li>
        </ul>`)}

        <h2>7. Opérations sur les limites</h2>
        ${lc.prop("Règles intuitives", `<ul>
          <li>Si <code>lim uₙ = a</code> et <code>lim vₙ = b</code>, alors <code>lim (uₙ + vₙ) = a + b</code>.</li>
          <li><code>lim (uₙ × vₙ) = a × b</code>.</li>
          <li>Si <code>b ≠ 0</code> : <code>lim (uₙ / vₙ) = a / b</code>.</li>
        </ul>`)}
        ${lc.warn("Formes indéterminées", `<p>Certains cas ne se calculent pas directement : <code>+∞ − ∞</code>, <code>0 × ∞</code>, <code>∞/∞</code>, <code>0/0</code>. Il faut alors transformer l'expression.</p>`)}
      `,
    },

    {
      title: "Raisonnement par récurrence",
      category: "Suites",
      content: `
        ${lc.warn("Note de programme", `<p>Le raisonnement par récurrence est officiellement introduit en <strong>Terminale spé maths</strong>. Ce chapitre est une <strong>anticipation</strong> très utile pour démontrer des propriétés sur les suites dès la 1ère. Tu retrouveras une présentation plus complète l'an prochain.</p>`)}

        <h2>1. Principe de récurrence</h2>
        ${lc.def("Récurrence", `<p>Pour démontrer qu'une propriété <code>P(n)</code> est vraie pour tout entier <code>n ≥ n₀</code>, on procède en deux temps :</p>
          <ol><li><strong>Initialisation</strong> : on vérifie que <code>P(n₀)</code> est vraie (le cas de base).</li>
          <li><strong>Hérédité</strong> : on suppose <code>P(n)</code> vraie pour un certain <code>n ≥ n₀</code> (« hypothèse de récurrence »), et on démontre <code>P(n + 1)</code>.</li></ol>
          <p>Conclusion : par principe de récurrence, <code>P(n)</code> est vraie pour tout <code>n ≥ n₀</code>.</p>`)}
        ${lc.tip("Image des dominos", `<p>Imagine une chaîne de dominos. Si le premier tombe (initialisation) et que chaque domino fait tomber le suivant (hérédité), alors tous les dominos tombent.</p>`)}

        <h2>2. Premier exemple : somme des n premiers entiers</h2>
        ${lc.example("Démontrer 1 + 2 + … + n = n(n+1)/2", `<p>Soit <code>P(n) :</code> « <code>1 + 2 + … + n = n(n+1)/2</code> ».</p>
          <p><strong>Initialisation</strong> (n = 1) : à gauche, 1. À droite, <code>1×2/2 = 1</code>. <code>P(1)</code> ✓.</p>
          <p><strong>Hérédité</strong> : supposons <code>P(n)</code> vraie. Démontrons <code>P(n+1)</code> :</p>
          <p><code>1 + 2 + … + n + (n+1) = n(n+1)/2 + (n+1)</code> (par hypothèse de récurrence)</p>
          <p><code>= (n+1) × (n/2 + 1) = (n+1)(n+2)/2</code>. ✓</p>
          <p><strong>Conclusion</strong> : <code>P(n)</code> vraie pour tout <code>n ≥ 1</code>.</p>`)}

        <h2>3. Exemple avec une suite</h2>
        ${lc.example("Démontrer 2ⁿ ≥ n + 1 pour n ≥ 0", `<p><strong>Init</strong> : <code>2⁰ = 1 ≥ 0 + 1 = 1</code> ✓.</p>
          <p><strong>Hérédité</strong> : supposons <code>2ⁿ ≥ n + 1</code>. Alors :</p>
          <p><code>2^{n+1} = 2 × 2ⁿ ≥ 2(n+1) = 2n + 2 ≥ n + 2</code> (car <code>n ≥ 0</code>).</p>
          <p>Donc <code>P(n+1)</code> est vraie.</p>`)}

        <h2>4. Démontrer une propriété d'une suite récurrente</h2>
        ${lc.example("Suite encadrée", `<p>Soit <code>u₀ = 0</code> et <code>u_{n+1} = √(uₙ + 6)</code>. Démontrer que <code>0 ≤ uₙ ≤ 3</code> pour tout <code>n</code>.</p>
          <p><strong>Init</strong> : <code>u₀ = 0</code>, donc <code>0 ≤ u₀ ≤ 3</code> ✓.</p>
          <p><strong>Hérédité</strong> : supposons <code>0 ≤ uₙ ≤ 3</code>. Alors <code>6 ≤ uₙ + 6 ≤ 9</code>, donc <code>√6 ≤ u_{n+1} ≤ 3</code>. En particulier <code>0 ≤ u_{n+1} ≤ 3</code>. ✓</p>`)}

        <h2>5. Pièges</h2>
        ${lc.warn("Ne pas oublier l'initialisation", `<p>Une démonstration sans initialisation peut « marcher » mais conclure quelque chose de faux. Toujours commencer par initialiser.</p>`)}
        ${lc.warn("Bien utiliser l'hypothèse", `<p>L'hérédité doit utiliser <code>P(n)</code> pour démontrer <code>P(n+1)</code>. Si on n'utilise pas <code>P(n)</code>, c'est qu'on a une démonstration directe (pas une récurrence).</p>`)}

        <h2>6. Variantes</h2>
        ${lc.tip("Récurrence forte", `<p>Parfois, pour démontrer <code>P(n+1)</code> on a besoin de supposer <code>P(k)</code> vraie pour <em>tous</em> les <code>k ≤ n</code> (pas seulement <code>P(n)</code>). C'est la <strong>récurrence forte</strong>, qui se justifie par le même principe.</p>`)}
      `,
    },

    {
      title: "Dérivation : nombre dérivé, fonction dérivée",
      category: "Analyse",
      content: `
        <h2>1. Idée intuitive de la dérivée</h2>
        ${lc.def("Pente de la tangente", `<p>La <strong>dérivée</strong> de <code>f</code> en un point <code>a</code>, notée <code>f'(a)</code>, est la <strong>pente de la tangente</strong> à la courbe de <code>f</code> au point d'abscisse <code>a</code>.</p>`)}
        ${lc.tip("Vitesse instantanée", `<p>Si <code>f(t)</code> représente une position à l'instant <code>t</code>, alors <code>f'(t)</code> est la <strong>vitesse instantanée</strong> à cet instant.</p>`)}

        <h2>2. Définition formelle</h2>
        ${lc.formula("f'(a) = lim_{h → 0} (f(a + h) − f(a)) / h")}
        <p>Ce nombre représente la limite du <strong>taux d'accroissement</strong> de <code>f</code> entre <code>a</code> et <code>a+h</code>, quand <code>h</code> tend vers 0.</p>

        <h2>3. Tangente à la courbe</h2>
        ${lc.formula("Équation de la tangente en a : y = f'(a)(x − a) + f(a)")}
        ${lc.example("Calcul de tangente", `<p>Soit <code>f(x) = x²</code>. On admet <code>f'(2) = 4</code> et <code>f(2) = 4</code>.</p>
          <p>Tangente : <code>y = 4(x − 2) + 4 = 4x − 4</code>.</p>`)}

        <h2>4. Fonction dérivée</h2>
        ${lc.def("Fonction dérivée", `<p>Si <code>f</code> est dérivable en chaque point d'un intervalle, on peut définir une nouvelle fonction <code>f'</code> qui à <code>x</code> associe <code>f'(x)</code>.</p>`)}

        <h2>5. Dérivées des fonctions usuelles</h2>
        ${lc.formula("(c)' = 0 &nbsp;&nbsp; (x)' = 1 &nbsp;&nbsp; (xⁿ)' = n × x^{n−1}")}
        ${lc.formula("(1/x)' = −1/x² &nbsp;&nbsp; (√x)' = 1/(2√x)")}
        ${lc.example("Dériver f(x) = x³", `<p><code>f'(x) = 3x²</code>.</p>`)}
        ${lc.example("Dériver f(x) = 1/x", `<p><code>f'(x) = −1/x²</code>.</p>`)}

        <h2>6. Règles de dérivation</h2>
        ${lc.prop("Opérations", `<ul>
          <li><code>(u + v)' = u' + v'</code></li>
          <li><code>(k × u)' = k × u'</code> (k constante)</li>
          <li><code>(u × v)' = u' × v + u × v'</code></li>
          <li><code>(u / v)' = (u' × v − u × v') / v²</code></li>
        </ul>`)}

        <h2>7. Exemples pas à pas</h2>
        ${lc.example("Dériver f(x) = 3x² − 5x + 7", `<ol>
          <li><code>(3x²)' = 3 × 2x = 6x</code>.</li>
          <li><code>(−5x)' = −5</code>.</li>
          <li><code>(7)' = 0</code>.</li>
          <li>Donc <code>f'(x) = 6x − 5</code>.</li>
        </ol>`)}
        ${lc.example("Dériver f(x) = x² × (x + 1)", `<ol>
          <li>Avec la formule du produit : <code>u = x²</code>, <code>v = x + 1</code>.</li>
          <li><code>u' = 2x</code>, <code>v' = 1</code>.</li>
          <li><code>f'(x) = 2x × (x + 1) + x² × 1 = 2x² + 2x + x² = 3x² + 2x</code>.</li>
        </ol>`)}

        <h2>8. Dérivées de fonctions composées simples</h2>
        ${lc.prop("Cas (1/u)' et (√u)'", `<p>Pour une fonction <code>u</code> dérivable :</p>`)}
        ${lc.formula("(1/u)' = −u' / u² &nbsp;&nbsp; (u ne s'annule pas)")}
        ${lc.formula("(√u)' = u' / (2 × √u) &nbsp;&nbsp; (u > 0)")}
        ${lc.example("Dériver f(x) = 1/(2x + 3)", `<ol>
          <li><code>u = 2x + 3</code>, <code>u' = 2</code>.</li>
          <li><code>f'(x) = −2/(2x + 3)²</code>.</li>
        </ol>`)}
        ${lc.example("Dériver f(x) = √(x² + 1)", `<ol>
          <li><code>u = x² + 1</code>, <code>u' = 2x</code>.</li>
          <li><code>f'(x) = 2x / (2 × √(x² + 1)) = x / √(x² + 1)</code>.</li>
        </ol>`)}
        ${lc.tip("Anticipation Tle", `<p>La règle générale de dérivation des composées <code>(g ∘ u)' = g'(u) × u'</code> sera vue en Terminale, mais ces deux cas particuliers (1/u, √u) sont au programme de 1ère.</p>`)}
      `,
    },

    {
      title: "Études de fonctions et extremums",
      category: "Analyse",
      content: `
        <h2>1. Lien entre dérivée et variations</h2>
        ${lc.prop("Théorème fondamental", `<p>Soit <code>f</code> dérivable sur un intervalle <code>I</code>.</p>
          <ul><li>Si <code>f'(x) > 0</code> sur <code>I</code> : <code>f</code> est <strong>strictement croissante</strong> sur <code>I</code>.</li>
          <li>Si <code>f'(x) < 0</code> sur <code>I</code> : <code>f</code> est <strong>strictement décroissante</strong>.</li>
          <li>Si <code>f'(x) = 0</code> sur <code>I</code> : <code>f</code> est <strong>constante</strong>.</li></ul>`)}
        ${lc.tip("Méthode d'étude", `<p>Pour étudier les variations d'une fonction <code>f</code> :</p>
          <ol><li>Calculer <code>f'(x)</code>.</li>
          <li>Étudier le signe de <code>f'(x)</code>.</li>
          <li>En déduire les variations de <code>f</code>.</li></ol>`)}

        <h2>2. Étude complète : exemple</h2>
        ${lc.example("Étudier f(x) = x³ − 3x", `<ol>
          <li>Dérivée : <code>f'(x) = 3x² − 3 = 3(x² − 1) = 3(x − 1)(x + 1)</code>.</li>
          <li>Signe de <code>f'</code> :
            <table>
              <tr><th>Intervalle</th><th>]−∞ ; −1[</th><th>]−1 ; 1[</th><th>]1 ; +∞[</th></tr>
              <tr><td>x − 1</td><td>−</td><td>−</td><td>+</td></tr>
              <tr><td>x + 1</td><td>−</td><td>+</td><td>+</td></tr>
              <tr><td>3(x−1)(x+1)</td><td>+</td><td>−</td><td>+</td></tr>
            </table>
          </li>
          <li>Variations : <code>f</code> est croissante sur <code>]−∞ ; −1]</code>, décroissante sur <code>[−1 ; 1]</code>, croissante sur <code>[1 ; +∞[</code>.</li>
          <li>Maximum local en <code>−1</code> : <code>f(−1) = −1 + 3 = 2</code>.</li>
          <li>Minimum local en <code>1</code> : <code>f(1) = 1 − 3 = −2</code>.</li>
        </ol>`)}

        <h2>3. Extremums : maximum et minimum</h2>
        ${lc.def("Extremum local", `<p>Un <strong>maximum local</strong> est atteint en <code>a</code> si <code>f(a)</code> est la plus grande valeur de <code>f</code> sur un voisinage de <code>a</code>. Idem pour un <strong>minimum local</strong>.</p>`)}
        ${lc.prop("Caractérisation par la dérivée", `<p>Si <code>f</code> est dérivable et présente un extremum local en <code>a</code>, alors <code>f'(a) = 0</code>. La dérivée s'annule et <strong>change de signe</strong> en <code>a</code>.</p>`)}
        ${lc.warn("Réciproque fausse", `<p>L'annulation de la dérivée n'est pas suffisante. Pour <code>f(x) = x³</code>, on a <code>f'(0) = 0</code> mais pas d'extremum (la dérivée ne change pas de signe).</p>`)}

        <h2>4. Tableau de variations standard</h2>
        ${lc.example("Tableau type", `<p>Pour <code>f(x) = x³ − 3x</code>, on résume :</p>
          <table>
            <tr><th>Intervalle</th><th>]−∞ ; −1[</th><th>]−1 ; 1[</th><th>]1 ; +∞[</th></tr>
            <tr><td>signe de f'(x)</td><td>+</td><td>−</td><td>+</td></tr>
            <tr><td>variations de f</td><td>↗ jusqu'à 2</td><td>↘ jusqu'à −2</td><td>↗ vers +∞</td></tr>
          </table>
          <p>Aux bornes : <code>f'(−1) = 0</code> et <code>f'(1) = 0</code> ; <code>f(−1) = 2</code> est le maximum local, <code>f(1) = −2</code> le minimum local.</p>`)}

        <h2>5. Application : optimisation</h2>
        ${lc.example("Boîte de volume maximal", `<p>On découpe des carrés de côté <code>x</code> aux 4 coins d'une feuille rectangulaire de 20 cm × 30 cm pour faire une boîte. Quel volume maximum ?</p>
          <ol><li><code>V(x) = x(20 − 2x)(30 − 2x)</code>, défini pour <code>0 < x < 10</code>.</li>
          <li>On dérive et on cherche les zéros : <code>V'(x) = 12x² − 200x + 600</code>.</li>
          <li>Solutions : <code>x ≈ 3,92</code> ou <code>x ≈ 12,75</code> (à rejeter).</li>
          <li>Volume max ≈ <code>1056 cm³</code> pour <code>x ≈ 3,92 cm</code>.</li></ol>`)}
      `,
    },

    {
      title: "Fonction exponentielle",
      category: "Analyse",
      content: `
        <h2>1. Définition</h2>
        ${lc.def("Fonction exponentielle", `<p>Il existe une unique fonction <code>f</code> définie et dérivable sur ℝ telle que :</p>
          <ul><li><code>f' = f</code> (la dérivée est égale à la fonction),</li>
          <li><code>f(0) = 1</code>.</li></ul>
          <p>Cette fonction est appelée <strong>fonction exponentielle</strong> et notée <code>exp</code> ou <code>e^x</code>.</p>`)}
        ${lc.tip("Constante e", `<p>Le nombre <code>e = exp(1) ≈ 2,71828</code> est une constante fondamentale (constante d'Euler).</p>`)}

        <h2>2. Propriétés essentielles</h2>
        ${lc.formula("e⁰ = 1 &nbsp;&nbsp; e¹ = e &nbsp;&nbsp; (e^x)' = e^x")}
        ${lc.prop("Règles algébriques", `<ul>
          <li><code>e^{a+b} = e^a × e^b</code></li>
          <li><code>e^{a−b} = e^a / e^b</code></li>
          <li><code>e^{−a} = 1 / e^a</code></li>
          <li><code>(e^a)^n = e^{na}</code></li>
        </ul>`)}
        ${lc.example("Simplifier", `<p><code>e³ × e^{−5} = e^{3−5} = e^{−2} = 1/e²</code>.</p>`)}

        <h2>3. Équation et inéquations</h2>
        ${lc.prop("Strictement positive et croissante", `<p>Pour tout <code>x</code> réel, <code>e^x > 0</code>. La fonction est strictement croissante sur ℝ.</p>
          <p>Conséquence : <code>e^a = e^b ⇔ a = b</code> et <code>e^a < e^b ⇔ a < b</code>.</p>`)}
        ${lc.example("Résoudre e^{2x+1} = e³", `<p>Équivaut à <code>2x + 1 = 3</code>, donc <code>x = 1</code>.</p>`)}

        <h2>4. Variations et limites</h2>
        ${lc.prop("Variations", `<p><code>(e^x)' = e^x > 0</code>, donc <code>x → e^x</code> est strictement croissante sur ℝ.</p>`)}
        ${lc.prop("Limites", `<ul>
          <li><code>lim_{x → +∞} e^x = +∞</code></li>
          <li><code>lim_{x → −∞} e^x = 0</code></li>
        </ul>`)}

        <h2>5. Croissance comparée</h2>
        ${lc.prop("L'exponentielle écrase tout", `<p>Quand <code>x → +∞</code>, <code>e^x</code> croît plus vite que toute puissance de <code>x</code> :</p>`)}
        ${lc.formula("lim_{x → +∞} e^x / x^n = +∞ &nbsp;&nbsp; (pour tout n > 0)")}

        <h2>6. Dérivée d'une exponentielle composée</h2>
        ${lc.formula("(e^{u(x)})' = u'(x) × e^{u(x)}")}
        ${lc.example("Dériver f(x) = e^{3x²}", `<p><code>u(x) = 3x²</code>, <code>u'(x) = 6x</code>.</p>
          <p><code>f'(x) = 6x × e^{3x²}</code>.</p>`)}

        <h2>7. Modélisation : croissance / décroissance exponentielle</h2>
        ${lc.example("Population qui croît", `<p>Si une population suit <code>P(t) = P₀ × e^{kt}</code> avec <code>k > 0</code>, elle croît exponentiellement. Le temps caractéristique de la croissance se calcule en Terminale avec la fonction logarithme (à venir).</p>`)}
      `,
    },

    {
      title: "Polynômes du second degré",
      category: "Analyse",
      content: `
        <h2>1. Forme générale</h2>
        ${lc.def("Trinôme du 2nd degré", `<p>Un <strong>trinôme du second degré</strong> est une expression de la forme :</p>`)}
        ${lc.formula("f(x) = ax² + bx + c &nbsp;&nbsp; (a ≠ 0)")}
        <p>Sa courbe représentative est une <strong>parabole</strong>, tournée vers le haut si <code>a > 0</code> et vers le bas si <code>a < 0</code>.</p>

        <h2>2. Discriminant</h2>
        ${lc.def("Discriminant Δ", `<p>Le <strong>discriminant</strong> de <code>ax² + bx + c</code> est :</p>`)}
        ${lc.formula("Δ = b² − 4ac")}
        <p>Il détermine le nombre de racines de l'équation <code>ax² + bx + c = 0</code>.</p>
        ${lc.warn("Erreur fréquente avec b négatif", `<p>Quand <code>b</code> est négatif, ne pas oublier que <code>b²</code> est toujours <strong>positif</strong>. Pour <code>x² − 5x + 6 = 0</code> : <code>b = −5</code>, <code>b² = (−5)² = 25</code> (et non <code>−25</code> !), donc <code>Δ = 25 − 24 = 1</code>.</p>`)}

        <h2>3. Racines selon le discriminant</h2>
        ${lc.prop("Trois cas", `<ul>
          <li><strong>Δ > 0</strong> : deux racines réelles distinctes.<br>
            <code>x₁ = (−b − √Δ) / (2a)</code>, <code>x₂ = (−b + √Δ) / (2a)</code></li>
          <li><strong>Δ = 0</strong> : une racine double.<br>
            <code>x₀ = −b / (2a)</code></li>
          <li><strong>Δ < 0</strong> : aucune racine réelle.</li>
        </ul>`)}
        ${lc.example("Résoudre 2x² − 5x + 2 = 0", `<ol>
          <li><code>a = 2</code>, <code>b = −5</code>, <code>c = 2</code>.</li>
          <li><code>Δ = (−5)² − 4 × 2 × 2 = 25 − 16 = 9</code>. Δ > 0.</li>
          <li><code>x₁ = (5 − 3)/4 = 0,5</code> ; <code>x₂ = (5 + 3)/4 = 2</code>.</li>
        </ol>`)}

        <h2>4. Forme factorisée</h2>
        ${lc.prop("Si Δ ≥ 0", `<p>Quand le trinôme admet des racines <code>x₁</code> et <code>x₂</code> (éventuellement confondues), on peut factoriser :</p>`)}
        ${lc.formula("ax² + bx + c = a(x − x₁)(x − x₂)")}

        <h2>5. Forme canonique</h2>
        ${lc.prop("Mise sous forme canonique", `<p>Pour tout trinôme :</p>`)}
        ${lc.formula("ax² + bx + c = a(x + b/(2a))² − Δ/(4a)")}
        ${lc.tip("Sommet de la parabole", `<p>Le sommet de la parabole est le point <code>S(−b/(2a) ; −Δ/(4a))</code>.</p>
          <ul><li>Si <code>a > 0</code> : minimum, atteint en <code>x = −b/(2a)</code>.</li>
          <li>Si <code>a < 0</code> : maximum.</li></ul>`)}

        <h2>6. Signe du trinôme</h2>
        ${lc.prop("Règle du signe", `<ul>
          <li>Si <strong>Δ < 0</strong> : <code>ax² + bx + c</code> est du <strong>signe de a</strong> partout.</li>
          <li>Si <strong>Δ = 0</strong> : du signe de <code>a</code> partout sauf en <code>x₀</code> (où il vaut 0).</li>
          <li>Si <strong>Δ > 0</strong> : du signe de <code>a</code> à l'<em>extérieur</em> des racines, du signe de <code>−a</code> entre elles.</li>
        </ul>`)}
        ${lc.example("Signe de x² − 4x + 3", `<p>Δ = 16 − 12 = 4. Racines : <code>x₁ = 1</code>, <code>x₂ = 3</code>.</p>
          <p><code>a = 1 > 0</code>. Donc le trinôme est :</p>
          <ul><li>positif sur <code>]−∞ ; 1[ ∪ ]3 ; +∞[</code> ;</li>
          <li>négatif sur <code>]1 ; 3[</code>.</li></ul>`)}
      `,
    },

    {
      title: "Trigonométrie : cercle trigonométrique et formules",
      category: "Géométrie",
      content: `
        <h2>1. Cercle trigonométrique</h2>
        ${lc.def("Cercle trigonométrique", `<p>Le <strong>cercle trigonométrique</strong> est le cercle de centre <code>O</code> (origine du repère) et de <strong>rayon 1</strong>, parcouru dans le sens direct (anti-horaire).</p>`)}

        <h2>2. Radian</h2>
        ${lc.def("Radian", `<p>Le <strong>radian</strong> est l'unité d'angle correspondant à un arc de longueur 1 sur le cercle trigonométrique.</p>`)}
        ${lc.formula("180° ↔ π rad &nbsp;&nbsp; 90° ↔ π/2 &nbsp;&nbsp; 60° ↔ π/3 &nbsp;&nbsp; 45° ↔ π/4 &nbsp;&nbsp; 30° ↔ π/6")}
        ${lc.example("Conversion", `<p>Conversion de 120° en radians : <code>120 × π / 180 = 2π/3</code>.</p>`)}

        <h2>3. Cosinus et sinus dans le cercle trigo</h2>
        ${lc.def("Définitions générales", `<p>Pour un angle <code>x</code> en radians, le point <code>M</code> du cercle trigonométrique tel que l'arc <code>(I, M)</code> mesure <code>x</code> a pour coordonnées <code>(cos x, sin x)</code>.</p>`)}
        ${lc.tip("Cas des angles aigus", `<p>Pour <code>0 ≤ x ≤ π/2</code>, on retrouve les définitions du triangle rectangle.</p>`)}

        <h2>4. Valeurs particulières</h2>
        ${lc.prop("À mémoriser", `<table>
          <tr><th>x</th><th>0</th><th>π/6</th><th>π/4</th><th>π/3</th><th>π/2</th></tr>
          <tr><td>cos x</td><td>1</td><td>√3/2</td><td>√2/2</td><td>1/2</td><td>0</td></tr>
          <tr><td>sin x</td><td>0</td><td>1/2</td><td>√2/2</td><td>√3/2</td><td>1</td></tr>
        </table>`)}

        <h2>5. Propriétés fondamentales</h2>
        ${lc.formula("cos²(x) + sin²(x) = 1")}
        ${lc.formula("−1 ≤ cos(x) ≤ 1 &nbsp;&nbsp; −1 ≤ sin(x) ≤ 1")}
        ${lc.prop("Périodicité", `<p>Les fonctions cosinus et sinus sont <strong>2π-périodiques</strong> :</p>
          <p><code>cos(x + 2π) = cos(x)</code> et <code>sin(x + 2π) = sin(x)</code>.</p>`)}

        <h2>6. Parité</h2>
        ${lc.prop("Cosinus est paire, sinus est impaire", `<ul>
          <li><code>cos(−x) = cos(x)</code> (paire)</li>
          <li><code>sin(−x) = −sin(x)</code> (impaire)</li>
        </ul>`)}

        <h2>7. Angles associés</h2>
        ${lc.formula("cos(π − x) = −cos(x) &nbsp;&nbsp; sin(π − x) = sin(x)")}
        ${lc.formula("cos(π + x) = −cos(x) &nbsp;&nbsp; sin(π + x) = −sin(x)")}
        ${lc.formula("cos(π/2 − x) = sin(x) &nbsp;&nbsp; sin(π/2 − x) = cos(x)")}

        <h2>8. Fonctions cosinus et sinus</h2>
        ${lc.prop("Variations sur [0, π]", `<ul>
          <li><code>cos</code> est <strong>décroissante</strong> sur <code>[0 ; π]</code>, de 1 à −1.</li>
          <li><code>sin</code> est croissante sur <code>[0 ; π/2]</code>, décroissante sur <code>[π/2 ; π]</code>.</li>
        </ul>`)}
      `,
    },

    {
      title: "Vecteurs : produit scalaire",
      category: "Géométrie",
      content: `
        <h2>1. Définition par projection</h2>
        ${lc.def("Produit scalaire", `<p>Le <strong>produit scalaire</strong> de deux vecteurs <code>u→</code> et <code>v→</code> est un nombre réel, noté <code>u→ · v→</code>.</p>`)}
        ${lc.formula("u→ · v→ = ||u→|| × ||v→|| × cos(u→, v→)")}
        <p>où <code>(u→, v→)</code> désigne l'angle non orienté entre les deux vecteurs.</p>

        <h3>Définition équivalente par projection orthogonale</h3>
        ${lc.def("Projection", `<p>Soit <code>p→</code> le <strong>projeté orthogonal</strong> de <code>u→</code> sur la droite portée par <code>v→</code>. Alors :</p>`)}
        ${lc.formula("u→ · v→ = p→ · v→ = (longueur algébrique de p→) × ||v→||")}
        ${lc.tip("Lecture géométrique", `<p>Le produit scalaire mesure « combien <code>u→</code> va dans la direction de <code>v→</code> ». S'il est positif, les vecteurs pointent globalement dans le même sens ; négatif, sens contraires ; nul, perpendiculaires.</p>`)}

        <h2>2. Calcul en coordonnées</h2>
        ${lc.formula("Si u→(x ; y) et v→(x' ; y'), alors u→ · v→ = x×x' + y×y'")}
        ${lc.example("Calcul", `<p>Pour <code>u→(2 ; 3)</code> et <code>v→(1 ; 4)</code> :</p>
          <p><code>u→ · v→ = 2 × 1 + 3 × 4 = 2 + 12 = 14</code>.</p>`)}

        <h2>3. Lien avec la norme</h2>
        ${lc.formula("u→ · u→ = ||u→||²")}
        ${lc.example("Avec la norme", `<p><code>u→(3 ; 4)</code>. <code>u→ · u→ = 9 + 16 = 25</code>. Donc <code>||u→|| = 5</code>.</p>`)}

        <h2>4. Orthogonalité</h2>
        ${lc.prop("Caractérisation", `<p>Deux vecteurs non nuls <code>u→</code> et <code>v→</code> sont <strong>orthogonaux</strong> (leur angle vaut π/2) si et seulement si :</p>`)}
        ${lc.formula("u→ · v→ = 0")}
        ${lc.example("Tester l'orthogonalité", `<p><code>u→(2 ; −3)</code> et <code>v→(6 ; 4)</code>. <code>u→ · v→ = 12 − 12 = 0</code> → orthogonaux.</p>`)}

        <h2>5. Propriétés</h2>
        ${lc.prop("Propriétés algébriques", `<ul>
          <li><strong>Symétrie</strong> : <code>u→ · v→ = v→ · u→</code></li>
          <li><strong>Bilinéarité</strong> : <code>(k × u→) · v→ = k × (u→ · v→)</code></li>
          <li><strong>Distributivité</strong> : <code>u→ · (v→ + w→) = u→ · v→ + u→ · w→</code></li>
        </ul>`)}

        <h2>6. Identités remarquables vectorielles</h2>
        ${lc.formula("||u→ + v→||² = ||u→||² + 2 u→·v→ + ||v→||²")}
        ${lc.formula("||u→ − v→||² = ||u→||² − 2 u→·v→ + ||v→||²")}

        <h2>7. Application : calcul d'angle</h2>
        ${lc.formula("cos(u→, v→) = (u→ · v→) / (||u→|| × ||v→||)")}
        ${lc.example("Trouver l'angle", `<p><code>u→(1 ; 1)</code> et <code>v→(0 ; 1)</code>.</p>
          <ol><li><code>u→ · v→ = 0 + 1 = 1</code>.</li>
          <li><code>||u→|| = √2</code>, <code>||v→|| = 1</code>.</li>
          <li><code>cos θ = 1/√2 = √2/2</code>, donc <code>θ = π/4 = 45°</code>.</li></ol>`)}

        <h2>8. Théorème d'Al-Kashi (Pythagore généralisé)</h2>
        ${lc.prop("Énoncé", `<p>Dans un triangle <code>ABC</code>, en notant <code>a = BC</code>, <code>b = AC</code>, <code>c = AB</code> :</p>`)}
        ${lc.formula("a² = b² + c² − 2 × b × c × cos(Â)")}
        <p>(et formules analogues pour les autres côtés). C'est la <strong>généralisation de Pythagore</strong> à un triangle quelconque : si <code>Â = 90°</code>, <code>cos(Â) = 0</code> et on retrouve <code>a² = b² + c²</code>.</p>
        ${lc.example("Calculer un côté", `<p>Triangle <code>ABC</code> avec <code>AB = 5</code>, <code>AC = 7</code> et angle en A = 60°. Calculer BC.</p>
          <ol><li><code>BC² = 5² + 7² − 2 × 5 × 7 × cos(60°) = 25 + 49 − 70 × 0,5 = 74 − 35 = 39</code>.</li>
          <li><code>BC = √39 ≈ 6,24</code>.</li></ol>`)}

        <h2>9. Formule de la médiane</h2>
        ${lc.prop("Énoncé", `<p>Soit <code>I</code> le milieu de <code>[BC]</code>. Alors :</p>`)}
        ${lc.formula("AB² + AC² = 2 × AI² + (BC²)/2")}
        <p>Utile en géométrie analytique pour démontrer l'égalité de distances ou trouver les coordonnées du milieu autrement.</p>

        <h2>10. Équations cos(x) = a et sin(x) = a</h2>
        ${lc.prop("Méthode (par angle de référence)", `<p>Soit <code>α</code> un angle particulier tel que <code>cos(α) = a</code> (à lire sur le cercle trigo ou la table des valeurs particulières). Alors :</p>
          <p>Les solutions de <code>cos(x) = a</code> sont <code>x = α + 2kπ</code> ou <code>x = −α + 2kπ</code> (k ∈ ℤ).</p>
          <p>Pour <code>sin(x) = a</code> avec <code>sin(β) = a</code> : solutions <code>x = β + 2kπ</code> ou <code>x = π − β + 2kπ</code>.</p>`)}
        ${lc.example("Résoudre cos(x) = 1/2 sur [0 ; 2π]", `<ol>
          <li>On cherche un angle <code>α</code> tel que <code>cos(α) = 1/2</code>. La table des valeurs donne <code>α = π/3</code>.</li>
          <li>Solutions générales : <code>x = π/3 + 2kπ</code> ou <code>x = −π/3 + 2kπ</code>.</li>
          <li>Sur <code>[0 ; 2π]</code> : <code>x = π/3</code> et <code>x = −π/3 + 2π = 5π/3</code>.</li>
        </ol>`)}
      `,
    },

    {
      title: "Probabilités conditionnelles, indépendance",
      category: "Probabilités",
      content: `
        <h2>1. Probabilité conditionnelle</h2>
        ${lc.def("Probabilité de A sachant B", `<p>La <strong>probabilité conditionnelle</strong> de l'événement <code>A</code> <em>sachant</em> que <code>B</code> est réalisé, notée <code>P_B(A)</code> ou <code>P(A | B)</code>, est définie pour <code>P(B) ≠ 0</code> par :</p>`)}
        ${lc.formula("P_B(A) = P(A ∩ B) / P(B)")}

        <h2>2. Formule des probabilités composées</h2>
        ${lc.formula("P(A ∩ B) = P(B) × P_B(A) = P(A) × P_A(B)")}
        ${lc.example("Tirage successif sans remise", `<p>Une urne contient 3 boules rouges et 2 vertes. On tire 2 boules <em>sans</em> remise.</p>
          <p>Probabilité de tirer 2 rouges : <code>P(R₁ ∩ R₂) = P(R₁) × P_{R₁}(R₂) = (3/5) × (2/4) = 6/20 = 3/10</code>.</p>`)}

        <h2>3. Arbre pondéré</h2>
        ${lc.prop("Règle des arbres", `<ul>
          <li>La probabilité d'un <strong>chemin</strong> = produit des probabilités des branches qui le composent.</li>
          <li>La probabilité d'un événement = somme des probabilités des chemins qui y mènent.</li>
          <li>La somme des probabilités des branches partant d'un même nœud vaut <strong>1</strong>.</li>
        </ul>`)}

        <h2>4. Formule des probabilités totales</h2>
        ${lc.def("Partition de l'univers", `<p>Si <code>B₁, B₂, …, Bₙ</code> forment une <strong>partition</strong> de l'univers (incompatibles deux à deux et de réunion <code>Ω</code>), alors pour tout événement <code>A</code> :</p>`)}
        ${lc.formula("P(A) = P(A ∩ B₁) + … + P(A ∩ Bₙ)")}
        ${lc.example("Maladie et test", `<p>1 % de la population est malade. Le test est positif chez 95 % des malades et chez 2 % des non-malades. Probabilité d'un test positif ?</p>
          <ol><li><code>P(M) = 0,01</code>, <code>P(M̄) = 0,99</code>.</li>
          <li><code>P_M(+) = 0,95</code>, <code>P_{M̄}(+) = 0,02</code>.</li>
          <li><code>P(+) = 0,01 × 0,95 + 0,99 × 0,02 = 0,0095 + 0,0198 = 0,0293</code>.</li>
          <li>Soit environ <strong>2,93 %</strong>.</li></ol>`)}
        ${lc.warn("Confusion fréquente : P(A | B) vs P(B | A)", `<p>Suite à l'exemple ci-dessus, <strong>question piège</strong> : si je suis testé positif, ai-je 95 % de chance d'être malade ? <strong>Non !</strong> 95 % est <code>P(+ | M)</code>, pas <code>P(M | +)</code>.</p>
          <p>Calcul correct (formule de Bayes) : <code>P(M | +) = P(+ | M) × P(M) / P(+) = (0,95 × 0,01) / 0,0293 ≈ 0,32</code>. Soit seulement <strong>32 %</strong> de chance d'être réellement malade en cas de test positif. C'est contre-intuitif mais c'est dû à la rareté de la maladie. Toujours bien distinguer le sens du conditionnement.</p>`)}

        <h2>5. Indépendance</h2>
        ${lc.def("Événements indépendants", `<p>Deux événements <code>A</code> et <code>B</code> sont <strong>indépendants</strong> si la réalisation de l'un n'influence pas la probabilité de l'autre :</p>`)}
        ${lc.formula("P(A ∩ B) = P(A) × P(B)")}
        ${lc.tip("Caractérisation équivalente", `<p>Si <code>P(B) ≠ 0</code>, l'indépendance équivaut à <code>P_B(A) = P(A)</code> : sachant <code>B</code>, la probabilité de <code>A</code> est inchangée.</p>`)}
        ${lc.example("Lancers de dés", `<p>Deux lancers d'un dé sont <strong>indépendants</strong> : ce que donne le premier lancer ne change pas la probabilité du second.</p>`)}
        ${lc.warn("Indépendance ≠ Incompatibilité", `<p>Deux événements <strong>incompatibles</strong> (<code>A ∩ B = ∅</code>) ne sont <em>pas</em> indépendants si tous deux ont une probabilité non nulle (puisque si l'un est réalisé, l'autre ne peut pas l'être).</p>`)}
      `,
    },

    {
      title: "Variables aléatoires : espérance et variance",
      category: "Probabilités",
      content: `
        <h2>1. Variable aléatoire</h2>
        ${lc.def("Variable aléatoire (réelle)", `<p>Une <strong>variable aléatoire réelle</strong> sur un univers <code>Ω</code> est une fonction <code>X : Ω → ℝ</code>, qui à chaque issue associe un nombre réel.</p>`)}
        ${lc.example("Au jeu de dé", `<p>On lance un dé. <code>X = </code> nombre obtenu. <code>X</code> peut prendre les valeurs 1, 2, 3, 4, 5 ou 6.</p>`)}

        <h2>2. Loi de probabilité de X</h2>
        ${lc.def("Loi de X", `<p>Donner la <strong>loi de probabilité</strong> de <code>X</code>, c'est donner toutes les valeurs possibles <code>x_i</code> avec leurs probabilités <code>P(X = x_i)</code>.</p>
          <p>La somme de ces probabilités doit valoir 1.</p>`)}
        ${lc.example("Loi du dé équilibré", `<table>
          <tr><th>x_i</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th></tr>
          <tr><td>P(X = x_i)</td><td>1/6</td><td>1/6</td><td>1/6</td><td>1/6</td><td>1/6</td><td>1/6</td></tr>
        </table>`)}

        <h2>3. Espérance E(X)</h2>
        ${lc.def("Espérance", `<p>L'<strong>espérance</strong> de <code>X</code> est la « moyenne » que l'on espère sur un très grand nombre d'expériences :</p>`)}
        ${lc.formula("E(X) = Σ x_i × P(X = x_i)")}
        ${lc.example("Espérance du dé", `<p><code>E(X) = (1 + 2 + 3 + 4 + 5 + 6) / 6 = 21/6 = 3,5</code>.</p>`)}

        <h2>4. Linéarité de l'espérance</h2>
        ${lc.formula("E(aX + b) = a × E(X) + b")}
        ${lc.formula("E(X + Y) = E(X) + E(Y) &nbsp;&nbsp; (toujours)")}

        <h2>5. Variance V(X) et écart-type σ(X)</h2>
        ${lc.def("Variance", `<p>La <strong>variance</strong> mesure la dispersion autour de l'espérance :</p>`)}
        ${lc.formula("V(X) = E((X − E(X))²) = Σ (x_i − E(X))² × P(X = x_i)")}
        ${lc.formula("σ(X) = √V(X)")}
        ${lc.example("Variance du dé", `<ol><li><code>E(X) = 3,5</code>.</li>
          <li>Écarts au carré : <code>(1−3,5)² = 6,25</code>, <code>(2−3,5)² = 2,25</code>, <code>(3−3,5)² = 0,25</code>, idem en miroir pour 4, 5, 6.</li>
          <li>Somme pondérée : <code>2 × (6,25 + 2,25 + 0,25) / 6 = 17,5/6 ≈ 2,917</code>.</li>
          <li><code>σ ≈ √2,917 ≈ 1,71</code>.</li></ol>`)}

        <h2>6. Propriétés</h2>
        ${lc.formula("V(aX + b) = a² × V(X)")}
        ${lc.tip("Le b disparaît", `<p>Une translation (<code>+ b</code>) ne change pas la dispersion. Une dilatation (<code>× a</code>) la multiplie par <code>a²</code> en variance, par <code>|a|</code> en écart-type.</p>`)}

        <h2>7. Formule de König-Huygens</h2>
        ${lc.formula("V(X) = E(X²) − [E(X)]²")}
        <p>Souvent plus pratique que la formule de définition.</p>
      `,
    },

    {
      title: "Loi binomiale",
      category: "Probabilités",
      content: `
        <h2>1. Schéma de Bernoulli</h2>
        ${lc.def("Épreuve de Bernoulli", `<p>Une <strong>épreuve de Bernoulli</strong> est une expérience aléatoire à <strong>deux issues</strong> : un « succès » (probabilité <code>p</code>) et un « échec » (probabilité <code>1 − p</code>).</p>`)}
        ${lc.example("Exemples", `<ul>
          <li>Lancer une pièce : succès = pile (p = 1/2).</li>
          <li>Lancer un dé : succès = obtenir 6 (p = 1/6).</li>
          <li>Tirer une carte : succès = obtenir un cœur (p = 13/52 = 1/4).</li>
        </ul>`)}

        <h2>2. Schéma de Bernoulli</h2>
        ${lc.def("Schéma de Bernoulli", `<p>Un <strong>schéma de Bernoulli</strong> de paramètres <code>n</code> et <code>p</code> consiste à répéter <strong>n fois</strong>, de manière <strong>indépendante</strong>, une épreuve de Bernoulli de paramètre <code>p</code>.</p>`)}

        <h2>3. Loi binomiale</h2>
        ${lc.def("Loi binomiale ℬ(n, p)", `<p>Soit <code>X</code> la variable aléatoire qui compte le <strong>nombre de succès</strong> dans un schéma de Bernoulli. <code>X</code> suit la <strong>loi binomiale</strong> de paramètres <code>n</code> et <code>p</code>, notée <code>ℬ(n ; p)</code>.</p>
          <p><code>X</code> peut prendre les valeurs 0, 1, 2, …, n.</p>`)}

        <h2>4. Formule de la loi binomiale</h2>
        ${lc.formula("P(X = k) = C(n, k) × p^k × (1 − p)^{n−k}")}
        <p>où <code>C(n, k)</code> est le <strong>coefficient binomial</strong> (« k parmi n »).</p>

        <h2>5. Coefficient binomial</h2>
        ${lc.def("C(n, k)", `<p>Le coefficient binomial <code>C(n, k)</code> compte le nombre de façons de choisir <code>k</code> objets parmi <code>n</code> (sans tenir compte de l'ordre). Il s'écrit aussi <code>(n choose k)</code> ou ⎛n⎞⎝k⎠.</p>`)}
        ${lc.formula("C(n, k) = n! / (k! × (n−k)!)")}
        ${lc.tip("Triangle de Pascal", `<p>On obtient les coefficients binomiaux par le <strong>triangle de Pascal</strong> :</p>
          <pre>1
1 1
1 2 1
1 3 3 1
1 4 6 4 1
1 5 10 10 5 1</pre>
          <p>La 5e ligne donne <code>C(4, 0) = 1</code>, <code>C(4, 1) = 4</code>, <code>C(4, 2) = 6</code>, <code>C(4, 3) = 4</code>, <code>C(4, 4) = 1</code>.</p>`)}

        <h2>6. Espérance et variance</h2>
        ${lc.formula("Si X ~ ℬ(n, p) : E(X) = np &nbsp;&nbsp; V(X) = np(1−p)")}
        ${lc.example("Calcul", `<p><code>X ~ ℬ(20 ; 0,3)</code>. <code>E(X) = 20 × 0,3 = 6</code>. <code>V(X) = 20 × 0,3 × 0,7 = 4,2</code>. <code>σ(X) ≈ 2,05</code>.</p>`)}

        <h2>7. Exemple complet</h2>
        ${lc.example("Tirages successifs avec remise", `<p>On lance 5 fois un dé équilibré. <code>X</code> = nombre de 6 obtenus. Calculer <code>P(X = 2)</code>.</p>
          <ol><li><code>X ~ ℬ(5 ; 1/6)</code>.</li>
          <li><code>P(X = 2) = C(5, 2) × (1/6)² × (5/6)³</code></li>
          <li><code>= 10 × (1/36) × (125/216)</code></li>
          <li><code>= 1250 / 7776 ≈ 0,161</code> (environ 16,1 %).</li></ol>`)}

        <h2>8. Représentation graphique</h2>
        ${lc.tip("Diagramme en bâtons", `<p>On représente la loi binomiale par un <strong>diagramme en bâtons</strong> : en abscisse les valeurs <code>k = 0, 1, …, n</code> ; en ordonnée la hauteur <code>P(X = k)</code>.</p>
          <ul><li>Pour <code>p = 0,5</code> : la loi est <strong>symétrique</strong> autour de <code>n/2</code>.</li>
          <li>Pour <code>p &lt; 0,5</code> : la loi est dissymétrique vers la gauche (mode petit).</li>
          <li>Pour <code>p &gt; 0,5</code> : dissymétrique vers la droite.</li></ul>
          <p>Quand <code>n</code> est grand, la forme du diagramme s'approche d'une <strong>courbe en cloche</strong> centrée sur <code>np</code> (ce qui annonce le théorème de Moivre-Laplace, vu en Tle).</p>`)}

        <h2>9. Symétrie des coefficients binomiaux</h2>
        ${lc.formula("C(n, k) = C(n, n − k)")}
        <p>Conséquence : <code>P(X = k) = P(X = n − k)</code> uniquement lorsque <code>p = 1/2</code> (loi symétrique). Pour <code>p ≠ 1/2</code>, la loi est dissymétrique.</p>

        <h2>10. Échantillonnage binomial : intervalle de fluctuation</h2>
        ${lc.def("Idée", `<p>Lorsqu'on répète <code>n</code> fois une expérience de Bernoulli de paramètre <code>p</code> et qu'on observe la fréquence empirique <code>F = X/n</code> (proportion de succès), on s'attend à ce que <code>F</code> soit proche de <code>p</code> avec une certaine variabilité.</p>`)}
        ${lc.prop("Intervalle de fluctuation au seuil 95 % (programme 1ère)", `<p>Pour <code>n ≥ 25</code> et <code>0,2 ≤ p ≤ 0,8</code>, la fréquence <code>F</code> appartient à l'intervalle suivant avec une probabilité ≥ 95 % :</p>`)}
        ${lc.formula("[ p − 1,96 × √(p(1−p)/n) ; p + 1,96 × √(p(1−p)/n) ]")}
        ${lc.example("Pile ou face 100 fois", `<p>Avec <code>p = 0,5</code> et <code>n = 100</code> : <code>√(0,25/100) = 0,05</code>. Marge : <code>1,96 × 0,05 ≈ 0,098</code>.</p>
          <p>Intervalle de fluctuation : <code>[0,402 ; 0,598]</code>. Si on observe une fréquence en dehors (par exemple 0,72), on peut soupçonner que la pièce n'est pas équilibrée.</p>`)}
        ${lc.tip("Prise de décision", `<p>Si la fréquence observée tombe <strong>hors</strong> de l'IF au seuil 95 %, on rejette l'hypothèse de la valeur supposée de <code>p</code>. Le risque d'erreur (rejeter à tort) est de 5 %.</p>`)}
      `,
    },
  ];
}

// ─── Contenu pédagogique : 2nde à fond ───────────────────────────
function chapters2nde() {
  return [
    {
      title: "Ensembles de nombres ℕ, ℤ, 𝔻, ℚ, ℝ",
      category: "Nombres et calculs",
      content: `
        <h2>1. Les cinq ensembles de nombres</h2>
        ${lc.def("Les ensembles classiques", `<ul>
          <li><strong>ℕ</strong> : <strong>entiers naturels</strong>. <code>0, 1, 2, 3, 4, 5, …</code></li>
          <li><strong>ℤ</strong> : <strong>entiers relatifs</strong>. <code>…, −3, −2, −1, 0, 1, 2, 3, …</code></li>
          <li><strong>𝔻</strong> : <strong>nombres décimaux</strong>. Tout nombre qui s'écrit avec un nombre fini de chiffres après la virgule. <code>3,5 ; −0,01 ; 12 ; …</code></li>
          <li><strong>ℚ</strong> : <strong>nombres rationnels</strong>. Tout nombre qui s'écrit comme une fraction <code>a/b</code> avec <code>a ∈ ℤ</code> et <code>b ∈ ℤ*</code>. <code>1/3 ; 7/2 ; −5/8 ; …</code></li>
          <li><strong>ℝ</strong> : <strong>nombres réels</strong>. Tout nombre qu'on peut placer sur la droite numérique.</li>
        </ul>`)}

        <h2>2. Inclusions</h2>
        ${lc.prop("Hiérarchie", `<p>Chaque ensemble est inclus dans le suivant :</p>`)}
        ${lc.formula("ℕ ⊂ ℤ ⊂ 𝔻 ⊂ ℚ ⊂ ℝ")}
        <p>Tout entier naturel est un entier relatif, tout entier relatif est un décimal (par exemple <code>5 = 5,0</code>), tout décimal est un rationnel (<code>3,5 = 7/2</code>), et tout rationnel est un réel.</p>
        ${lc.warn("Inclusions strictes", `<p>Ces inclusions sont <strong>strictes</strong> : il existe des éléments à chaque palier qui ne sont pas dans le précédent. Par exemple <code>−2 ∈ ℤ</code> mais <code>−2 ∉ ℕ</code>.</p>`)}

        <h2>3. Notations</h2>
        ${lc.prop("Symboles à connaître", `<ul>
          <li><code>x ∈ E</code> : <code>x</code> appartient à <code>E</code>.</li>
          <li><code>x ∉ E</code> : <code>x</code> n'appartient pas à <code>E</code>.</li>
          <li><code>A ⊂ B</code> : <code>A</code> est inclus dans <code>B</code>.</li>
          <li><code>ℕ*</code>, <code>ℤ*</code>, etc. : l'ensemble privé de 0.</li>
          <li><code>ℝ⁺</code> = <code>[0, +∞[</code> : les réels positifs.</li>
          <li><code>ℝ⁻</code> = <code>]−∞, 0]</code> : les réels négatifs.</li>
        </ul>`)}

        <h2>4. Nombres irrationnels</h2>
        ${lc.def("Irrationnel", `<p>Un nombre <strong>irrationnel</strong> est un réel qui <strong>n'est pas</strong> rationnel : il ne peut pas s'écrire sous la forme d'une fraction <code>a/b</code>.</p>`)}
        ${lc.example("Quelques irrationnels célèbres", `<ul>
          <li><code>√2 ≈ 1,41421356…</code> (les décimales ne se répètent jamais)</li>
          <li><code>π ≈ 3,14159265…</code></li>
          <li><code>e ≈ 2,71828182…</code> (constante d'Euler)</li>
        </ul>`)}
        ${lc.tip("Démonstration célèbre", `<p>On peut démontrer (par l'absurde) que <code>√2</code> est irrationnel : si <code>√2 = p/q</code> avec <code>p/q</code> irréductible, on aboutit à une contradiction. C'est l'un des plus vieux résultats de mathématiques.</p>`)}

        <h2>5. Comment reconnaître l'ensemble d'appartenance</h2>
        ${lc.example("Classer quelques nombres", `<ul>
          <li><code>7</code> : appartient à <strong>ℕ</strong> (et à tous les ensembles plus grands).</li>
          <li><code>−4</code> : appartient à <strong>ℤ</strong> mais pas à ℕ.</li>
          <li><code>3,75</code> : appartient à <strong>𝔻</strong> mais pas à ℤ.</li>
          <li><code>1/3 = 0,333…</code> : appartient à <strong>ℚ</strong> mais pas à 𝔻 (décimales infinies périodiques).</li>
          <li><code>π</code> : appartient à <strong>ℝ</strong> seulement (irrationnel).</li>
        </ul>`)}
      `,
    },

    {
      title: "Calcul numérique et algébrique",
      category: "Nombres et calculs",
      content: `
        <h2>1. Rappels sur les fractions</h2>
        ${lc.formula("a/b + c/d = (ad + bc) / (bd) &nbsp;&nbsp; a/b × c/d = (ac)/(bd) &nbsp;&nbsp; a/b ÷ c/d = (ad)/(bc)")}
        ${lc.tip("Toujours simplifier", `<p>À la fin d'un calcul, on rend la fraction <strong>irréductible</strong> en divisant par le PGCD.</p>`)}

        <h2>2. Puissances</h2>
        ${lc.prop("Règles à maîtriser", `<ul>
          <li><code>a<sup>m</sup> × a<sup>n</sup> = a<sup>m+n</sup></code></li>
          <li><code>a<sup>m</sup> / a<sup>n</sup> = a<sup>m−n</sup></code></li>
          <li><code>(a<sup>m</sup>)<sup>n</sup> = a<sup>mn</sup></code></li>
          <li><code>(ab)<sup>n</sup> = a<sup>n</sup> × b<sup>n</sup></code></li>
          <li><code>a<sup>0</sup> = 1</code> (pour <code>a ≠ 0</code>) ; <code>a<sup>−n</sup> = 1/a<sup>n</sup></code></li>
        </ul>`)}

        <h2>3. Racines carrées</h2>
        ${lc.formula("√(ab) = √a × √b &nbsp;&nbsp; √(a/b) = √a / √b &nbsp;&nbsp; (a, b ≥ 0)")}
        ${lc.warn("Pas la somme", `<p><code>√(a + b) ≠ √a + √b</code>. Toujours.</p>`)}
        ${lc.example("Simplifier 3√12 + √48 − √27", `<ol><li>Simplifier chaque racine : <code>√12 = 2√3</code>, <code>√48 = 4√3</code>, <code>√27 = 3√3</code>.</li>
          <li>Substituer : <code>3 × 2√3 + 4√3 − 3√3 = 6√3 + 4√3 − 3√3</code>.</li>
          <li>Combiner : <code>= 7√3</code>.</li></ol>`)}

        <h2>4. Identités remarquables</h2>
        ${lc.formula("(a + b)² = a² + 2ab + b²<br>(a − b)² = a² − 2ab + b²<br>(a + b)(a − b) = a² − b²")}
        ${lc.example("Développer (3x − 2)²", `<p><code>(3x − 2)² = (3x)² − 2 × 3x × 2 + 2² = 9x² − 12x + 4</code>.</p>`)}
        ${lc.example("Factoriser 25x² − 16", `<p>Différence de carrés : <code>25x² = (5x)²</code> et <code>16 = 4²</code>. Donc <code>25x² − 16 = (5x − 4)(5x + 4)</code>.</p>`)}

        <h2>5. Notation scientifique</h2>
        ${lc.def("Notation scientifique", `<p>Tout nombre non nul s'écrit sous la forme <code>a × 10ⁿ</code> avec <code>1 ≤ |a| < 10</code> et <code>n ∈ ℤ</code>.</p>`)}
        ${lc.example("Convertir", `<ul>
          <li><code>0,000 47 = 4,7 × 10⁻⁴</code></li>
          <li><code>−325 000 = −3,25 × 10⁵</code></li>
        </ul>`)}

        <h2>6. Coefficient multiplicateur (rappel)</h2>
        ${lc.prop("Augmentation / réduction de p%", `<p>Augmenter de <code>p%</code> = multiplier par <code>1 + p/100</code>.</p>
          <p>Réduire de <code>p%</code> = multiplier par <code>1 − p/100</code>.</p>
          <p>Le <strong>coefficient multiplicateur global</strong> de plusieurs évolutions successives est le <em>produit</em> des coefficients (et non leur somme).</p>`)}
        ${lc.example("Évolutions successives", `<p>Une valeur subit +20 % puis −10 %. Coefficient global : <code>1,2 × 0,9 = 1,08</code>. C'est donc une augmentation globale de <code>8 %</code>.</p>`)}

        <h2>7. Équation-produit nul</h2>
        ${lc.prop("Règle clé", `<p>Un produit de facteurs est nul si et seulement si l'un au moins de ses facteurs est nul.</p>`)}
        ${lc.formula("A × B = 0 &nbsp;⇔&nbsp; A = 0 &nbsp;ou&nbsp; B = 0")}
        ${lc.example("Résoudre (x − 3)(2x + 5) = 0", `<ol>
          <li>Le produit est nul si <code>x − 3 = 0</code> ou <code>2x + 5 = 0</code>.</li>
          <li>Première : <code>x = 3</code>. Deuxième : <code>x = −5/2</code>.</li>
          <li>Solutions : <code>S = {−5/2, 3}</code>.</li>
        </ol>`)}
        ${lc.example("Résoudre x² − 25 = 0", `<ol>
          <li>Factoriser (identité remarquable) : <code>(x − 5)(x + 5) = 0</code>.</li>
          <li>Solutions : <code>x = 5</code> ou <code>x = −5</code>.</li>
        </ol>`)}
        ${lc.warn("Comparaison à zéro indispensable", `<p>La règle <em>A × B = 0</em> nécessite d'avoir <strong>0</strong> à droite. <code>(x − 1)(x + 2) = 6</code> ne se résout pas en disant « <code>x − 1 = 6</code> ou <code>x + 2 = 6</code> ». Il faut d'abord ramener à 0.</p>`)}

        <h2>8. Tableau de signes d'un facteur ax + b</h2>
        ${lc.prop("Signe de ax + b", `<ul>
          <li>Si <code>a > 0</code> : <code>ax + b</code> est négatif sur <code>]−∞ ; −b/a[</code>, nul en <code>−b/a</code>, positif sur <code>]−b/a ; +∞[</code>.</li>
          <li>Si <code>a < 0</code> : c'est l'inverse (positif puis nul puis négatif).</li>
        </ul>`)}
        ${lc.example("Étudier le signe de 2x − 6", `<p>Racine : <code>2x − 6 = 0 → x = 3</code>. <code>a = 2 > 0</code>. Donc négatif sur <code>]−∞ ; 3[</code>, positif sur <code>]3 ; +∞[</code>.</p>`)}
      `,
    },

    {
      title: "Inéquations et intervalles",
      category: "Nombres et calculs",
      content: `
        <h2>1. Notation des intervalles</h2>
        ${lc.def("Intervalles", `<p>Un <strong>intervalle</strong> de ℝ est un ensemble de réels « consécutifs ».</p>`)}
        ${lc.prop("Notation", `<table>
          <tr><th>Notation</th><th>Inégalité</th><th>Représentation</th></tr>
          <tr><td>[a ; b]</td><td>a ≤ x ≤ b</td><td>fermé des deux côtés</td></tr>
          <tr><td>]a ; b[</td><td>a < x < b</td><td>ouvert des deux côtés</td></tr>
          <tr><td>[a ; b[</td><td>a ≤ x < b</td><td>fermé en a, ouvert en b</td></tr>
          <tr><td>[a ; +∞[</td><td>x ≥ a</td><td>de a à l'infini, fermé en a</td></tr>
          <tr><td>]−∞ ; b]</td><td>x ≤ b</td><td>de l'infini à b, fermé en b</td></tr>
          <tr><td>]−∞ ; +∞[</td><td>tout x</td><td>= ℝ</td></tr>
        </table>`)}
        ${lc.warn("Crochets ouverts vers l'infini", `<p>Le crochet est <strong>toujours ouvert</strong> vers <code>+∞</code> ou <code>−∞</code> : ce ne sont pas des nombres mais des limites.</p>`)}

        <h2>2. Réunion et intersection</h2>
        ${lc.def("Réunion ∪", `<p><code>A ∪ B</code> = ensemble des nombres qui sont dans <code>A</code> <strong>ou</strong> dans <code>B</code> (ou les deux).</p>`)}
        ${lc.def("Intersection ∩", `<p><code>A ∩ B</code> = ensemble des nombres qui sont à la fois dans <code>A</code> <strong>et</strong> dans <code>B</code>.</p>`)}
        ${lc.example("Avec deux intervalles", `<p><code>[2 ; 5] ∩ [3 ; 7] = [3 ; 5]</code> (la partie commune).</p>
          <p><code>[2 ; 5] ∪ [3 ; 7] = [2 ; 7]</code> (l'union).</p>
          <p><code>[2 ; 5] ∩ [6 ; 9] = ∅</code> (vide, pas d'intersection).</p>`)}

        <h2>3. Résoudre une inéquation</h2>
        ${lc.prop("Règles", `<p>Sans changer les solutions, on peut :</p>
          <ul><li>ajouter / soustraire un même nombre des deux côtés ;</li>
          <li>multiplier / diviser par un nombre <strong>strictement positif</strong> ;</li>
          <li>multiplier / diviser par un nombre <strong>strictement négatif</strong> en <strong>changeant le sens</strong> de l'inégalité.</li></ul>`)}
        ${lc.example("Résoudre 3x − 5 ≤ 7 − x", `<ol><li>Ajouter <code>x</code> : <code>4x − 5 ≤ 7</code>.</li>
          <li>Ajouter 5 : <code>4x ≤ 12</code>.</li>
          <li>Diviser par 4 : <code>x ≤ 3</code>.</li>
          <li>Solutions : <code>S = ]−∞ ; 3]</code>.</li></ol>`)}
        ${lc.example("Résoudre −2x + 1 > 7", `<ol><li>Soustraire 1 : <code>−2x > 6</code>.</li>
          <li>Diviser par <code>−2</code> (inverser) : <code>x < −3</code>.</li>
          <li>Solutions : <code>S = ]−∞ ; −3[</code>.</li></ol>`)}

        <h2>4. Système d'inéquations</h2>
        ${lc.example("Résoudre simultanément 2x − 1 ≥ 3 et 3x + 4 < 10", `<ol><li>Première : <code>2x ≥ 4</code>, donc <code>x ≥ 2</code>, soit <code>S₁ = [2 ; +∞[</code>.</li>
          <li>Deuxième : <code>3x < 6</code>, donc <code>x < 2</code>, soit <code>S₂ = ]−∞ ; 2[</code>.</li>
          <li>Solutions : <code>S = S₁ ∩ S₂ = ∅</code>. Aucune solution !</li></ol>`)}

        <h2>5. Tableau de signes (introduction)</h2>
        ${lc.prop("Pour étudier le signe d'un produit ou d'un quotient", `<p>On dresse un tableau dont les colonnes sont les valeurs où chaque facteur s'annule. Pour chaque ligne (facteur), on note le signe.</p>`)}
        ${lc.example("Signe de (x − 1)(x + 2)", `<p>Les facteurs s'annulent en <code>1</code> et <code>−2</code>. On découpe ℝ en trois intervalles et on étudie le signe de chaque facteur sur chacun :</p>
          <table>
            <tr><th>Intervalle</th><th>]−∞ ; −2[</th><th>]−2 ; 1[</th><th>]1 ; +∞[</th></tr>
            <tr><td>x − 1</td><td>−</td><td>−</td><td>+</td></tr>
            <tr><td>x + 2</td><td>−</td><td>+</td><td>+</td></tr>
            <tr><td>(x − 1)(x + 2)</td><td>+</td><td>−</td><td>+</td></tr>
          </table>
          <p>Donc <code>(x − 1)(x + 2) ≥ 0</code> sur <code>]−∞ ; −2] ∪ [1 ; +∞[</code> (en ajoutant les bornes où le produit s'annule).</p>`)}

        <h2>6. Composition d'inégalités</h2>
        ${lc.prop("Règles", `<p>À partir d'un encadrement <code>a ≤ x ≤ b</code> :</p>
          <ul><li>Ajouter un nombre c : <code>a + c ≤ x + c ≤ b + c</code>.</li>
          <li>Multiplier par <strong>c &gt; 0</strong> : <code>ac ≤ cx ≤ bc</code> (sens conservé).</li>
          <li>Multiplier par <strong>c &lt; 0</strong> : <code>bc ≤ cx ≤ ac</code> (sens inversé !).</li>
          <li>On peut <strong>additionner deux encadrements</strong> dans le même sens : si <code>a ≤ x ≤ b</code> et <code>c ≤ y ≤ d</code>, alors <code>a + c ≤ x + y ≤ b + d</code>.</li>
        </ul>`)}
        ${lc.example("Encadrer 2x − 3 connaissant 1 ≤ x ≤ 5", `<ol>
          <li>Multiplier par 2 (positif) : <code>2 ≤ 2x ≤ 10</code>.</li>
          <li>Soustraire 3 : <code>−1 ≤ 2x − 3 ≤ 7</code>.</li>
        </ol>`)}
        ${lc.warn("Soustraction d'encadrements", `<p>Pour soustraire deux encadrements, on additionne avec l'<em>opposé</em> du second. Si <code>a ≤ x ≤ b</code> et <code>c ≤ y ≤ d</code>, alors <code>a − d ≤ x − y ≤ b − c</code>. Ne <strong>pas</strong> faire « <code>a − c ≤ x − y ≤ b − d</code> » qui est faux.</p>`)}

        <h2>7. Valeur absolue</h2>
        ${lc.def("Valeur absolue", `<p>La <strong>valeur absolue</strong> d'un réel <code>x</code>, notée <code>|x|</code>, est :</p>
          <ul><li><code>|x| = x</code> si <code>x ≥ 0</code> ;</li>
          <li><code>|x| = −x</code> si <code>x &lt; 0</code>.</li></ul>
          <p>C'est toujours un nombre <strong>positif</strong> ou nul.</p>`)}
        ${lc.example("Calculs", `<ul><li><code>|7| = 7</code></li>
          <li><code>|−4| = 4</code></li>
          <li><code>|0| = 0</code></li></ul>`)}
        ${lc.prop("Distance", `<p>La <strong>distance entre deux réels</strong> <code>a</code> et <code>b</code> est <code>|a − b|</code>.</p>`)}
        ${lc.prop("Inéquation |x − a| ≤ r", `<p>Avec <code>r ≥ 0</code> :</p>`)}
        ${lc.formula("|x − a| ≤ r &nbsp;⇔&nbsp; a − r ≤ x ≤ a + r &nbsp;⇔&nbsp; x ∈ [a − r ; a + r]")}
        ${lc.example("Résoudre |x − 3| < 2", `<ol>
          <li>Équivaut à <code>3 − 2 &lt; x &lt; 3 + 2</code>, soit <code>1 &lt; x &lt; 5</code>.</li>
          <li>Solutions : <code>x ∈ ]1 ; 5[</code>.</li>
        </ol>`)}
      `,
    },

    {
      title: "Fonctions : généralités",
      category: "Fonctions",
      content: `
        <h2>1. Définition d'une fonction</h2>
        ${lc.def("Fonction", `<p>Définir une fonction <code>f</code> sur un ensemble <code>D</code>, c'est associer à chaque élément <code>x</code> de <code>D</code> un unique nombre, noté <code>f(x)</code>.</p>
          <p><code>D</code> est l'<strong>ensemble de définition</strong>, <code>x</code> est la <strong>variable</strong>, et <code>f(x)</code> est l'<strong>image</strong> de <code>x</code>.</p>`)}
        ${lc.formula("f : D → ℝ ;  x → f(x)")}

        <h2>2. Image et antécédent</h2>
        ${lc.def("Image et antécédent", `<ul>
          <li>L'<strong>image</strong> de <code>x</code> par <code>f</code> est <code>f(x)</code>. Un nombre a une <em>seule</em> image.</li>
          <li>Un <strong>antécédent</strong> de <code>y</code> est un nombre <code>x</code> tel que <code>f(x) = y</code>. Un nombre peut avoir 0, 1 ou plusieurs antécédents.</li>
        </ul>`)}
        ${lc.example("Avec f(x) = x²", `<ul>
          <li>L'image de 3 est <code>f(3) = 9</code>.</li>
          <li>Les antécédents de 9 sont <code>3</code> et <code>−3</code> (deux antécédents).</li>
          <li>L'antécédent de <code>−4</code> n'existe pas (un carré n'est jamais négatif).</li>
        </ul>`)}

        <h2>3. Ensemble de définition</h2>
        ${lc.prop("Trouver D", `<p>L'ensemble de définition est l'ensemble des <code>x</code> pour lesquels <code>f(x)</code> a un sens.</p>
          <ul><li>Une <strong>fraction</strong> est définie quand le dénominateur n'est pas nul.</li>
          <li>Une <strong>racine carrée</strong> est définie quand son contenu est positif (ou nul).</li></ul>`)}
        ${lc.example("Ensemble de définition", `<ul>
          <li><code>f(x) = 1/(x − 2)</code> : il faut <code>x ≠ 2</code>. Donc <code>D = ]−∞ ; 2[ ∪ ]2 ; +∞[</code>.</li>
          <li><code>g(x) = √(x − 5)</code> : il faut <code>x − 5 ≥ 0</code>, soit <code>x ≥ 5</code>. Donc <code>D = [5 ; +∞[</code>.</li>
        </ul>`)}

        <h2>4. Représentation graphique</h2>
        ${lc.def("Courbe représentative", `<p>La <strong>courbe représentative</strong> de <code>f</code> est l'ensemble des points de coordonnées <code>(x, f(x))</code> dans un repère.</p>`)}
        ${lc.tip("Lecture graphique", `<ul>
          <li><strong>Image de a</strong> : on lit l'ordonnée du point d'abscisse <code>a</code> sur la courbe.</li>
          <li><strong>Antécédents de b</strong> : on cherche les abscisses des points dont l'ordonnée vaut <code>b</code> (intersection avec la droite <code>y = b</code>).</li>
        </ul>`)}

        <h2>5. Variations</h2>
        ${lc.def("Croissance / décroissance (au sens large)", `<p>Sur un intervalle <code>I</code>, <code>f</code> est :</p>
          <ul><li><strong>croissante</strong> si <code>x₁ &lt; x₂ ⇒ f(x₁) ≤ f(x₂)</code> (l'image augmente ou reste constante).</li>
          <li><strong>décroissante</strong> si <code>x₁ &lt; x₂ ⇒ f(x₁) ≥ f(x₂)</code>.</li>
          <li><strong>constante</strong> si <code>f(x)</code> ne change pas sur <code>I</code>.</li></ul>`)}
        ${lc.def("Croissance / décroissance stricte", `<p>On parle de <strong>strict</strong> quand l'image change vraiment :</p>
          <ul><li><strong>strictement croissante</strong> : <code>x₁ &lt; x₂ ⇒ f(x₁) &lt; f(x₂)</code> (inégalité stricte).</li>
          <li><strong>strictement décroissante</strong> : <code>x₁ &lt; x₂ ⇒ f(x₁) &gt; f(x₂)</code>.</li></ul>
          <p>La distinction stricte / large est cruciale en 1ère et Terminale : par exemple, une fonction <em>strictement</em> monotone est injective, mais une fonction monotone large peut ne pas l'être.</p>`)}

        <h2>6. Tableau de variations</h2>
        ${lc.prop("Forme du tableau", `<p>Un tableau de variations résume les variations de <code>f</code> sur son ensemble de définition. Il indique les valeurs aux bornes et aux extrémums.</p>`)}
        ${lc.example("Pour f(x) = x² sur ℝ", `<table>
          <tr><th>x</th><th>−∞</th><th>0</th><th>+∞</th></tr>
          <tr><td>f(x)</td><td>+∞</td><td>0</td><td>+∞</td></tr>
        </table>
          <p>(Décroissante sur <code>]−∞ ; 0]</code>, croissante sur <code>[0 ; +∞[</code>, minimum en 0.)</p>`)}

        <h2>7. Maximum, minimum</h2>
        ${lc.def("Extrémums", `<ul>
          <li><strong>Maximum</strong> de <code>f</code> sur <code>I</code> : la plus grande valeur de <code>f(x)</code> sur <code>I</code>.</li>
          <li><strong>Minimum</strong> : la plus petite.</li>
        </ul>`)}
      `,
    },

    {
      title: "Fonction affine, équations de droites",
      category: "Fonctions",
      content: `
        <h2>1. Fonction affine</h2>
        ${lc.def("Fonction affine", `<p>Une <strong>fonction affine</strong> est définie sur ℝ par <code>f(x) = ax + b</code>, où <code>a</code> et <code>b</code> sont des réels fixés.</p>
          <ul><li><code>a</code> est le <strong>coefficient directeur</strong> (ou pente).</li>
          <li><code>b</code> est l'<strong>ordonnée à l'origine</strong> (la valeur de <code>f(0) = b</code>).</li></ul>`)}
        ${lc.tip("Cas particuliers", `<ul>
          <li><code>b = 0</code> : fonction <strong>linéaire</strong> <code>f(x) = ax</code>.</li>
          <li><code>a = 0</code> : fonction <strong>constante</strong> <code>f(x) = b</code>.</li>
        </ul>`)}

        <h2>2. Représentation graphique</h2>
        ${lc.prop("Une droite", `<p>La courbe représentative est une <strong>droite</strong> non verticale, qui coupe l'axe des ordonnées en <code>(0, b)</code>.</p>
          <ul><li><code>a > 0</code> : la droite est strictement croissante.</li>
          <li><code>a < 0</code> : strictement décroissante.</li>
          <li><code>a = 0</code> : horizontale.</li></ul>`)}

        <h2>3. Calculer le coefficient directeur</h2>
        ${lc.formula("a = (y_B − y_A) / (x_B − x_A) &nbsp;&nbsp; (x_A ≠ x_B)")}
        ${lc.example("Pente d'une droite", `<p>La droite passe par <code>A(2, 5)</code> et <code>B(6, 13)</code>.</p>
          <p><code>a = (13 − 5) / (6 − 2) = 8 / 4 = 2</code>.</p>`)}

        <h2>4. Trouver une équation de droite</h2>
        ${lc.example("À partir de deux points", `<p>Droite passant par <code>A(2, 5)</code> et <code>B(6, 13)</code>.</p>
          <ol><li>Pente : <code>a = 2</code> (ci-dessus).</li>
          <li>Avec <code>A</code> : <code>5 = 2 × 2 + b</code> → <code>b = 1</code>.</li>
          <li>Équation : <code>y = 2x + 1</code>.</li>
          <li>Vérification avec <code>B</code> : <code>2 × 6 + 1 = 13</code> ✓.</li></ol>`)}

        <h2>5. Cas particuliers : droites verticales et horizontales</h2>
        ${lc.prop("Droites particulières", `<ul>
          <li>Une droite <strong>horizontale</strong> a une équation de la forme <code>y = c</code> (avec <code>c</code> constant).</li>
          <li>Une droite <strong>verticale</strong> a une équation de la forme <code>x = c</code>. Ce n'est <em>pas</em> une fonction (un même x donnerait plusieurs y).</li>
        </ul>`)}

        <h2>6. Position relative de deux droites</h2>
        ${lc.prop("Parallélisme et sécance", `<ul>
          <li>Deux droites <code>y = ax + b</code> et <code>y = a'x + b'</code> sont <strong>parallèles</strong> si elles ont le même coefficient directeur (<code>a = a'</code>).</li>
          <li>Si <code>a = a'</code> et <code>b = b'</code> : elles sont <strong>confondues</strong>.</li>
          <li>Si <code>a ≠ a'</code> : elles sont <strong>sécantes</strong> en un point unique.</li>
        </ul>`)}
        ${lc.example("Trouver le point d'intersection", `<p>Droites <code>y = 2x + 1</code> et <code>y = −x + 7</code>.</p>
          <ol><li>Résoudre <code>2x + 1 = −x + 7</code> → <code>3x = 6</code> → <code>x = 2</code>.</li>
          <li>Donc <code>y = 2 × 2 + 1 = 5</code>.</li>
          <li>Point d'intersection : <strong>(2, 5)</strong>.</li></ol>`)}

        <h2>7. Équation cartésienne d'une droite</h2>
        ${lc.def("Forme cartésienne", `<p>Toute droite du plan admet une équation de la forme :</p>`)}
        ${lc.formula("ax + by + c = 0 &nbsp;&nbsp; (avec (a, b) ≠ (0, 0))")}
        <p>Cette forme englobe <em>toutes</em> les droites, y compris les <strong>droites verticales</strong> (cas <code>b = 0</code>, donnant <code>x = −c/a</code>) qu'on ne peut pas écrire <code>y = mx + p</code>.</p>
        ${lc.example("De y = 2x + 3 à la forme cartésienne", `<p><code>y = 2x + 3</code> ⇔ <code>2x − y + 3 = 0</code>. Donc <code>a = 2, b = −1, c = 3</code>.</p>`)}

        <h2>8. Vecteur directeur d'une droite</h2>
        ${lc.def("Vecteur directeur", `<p>Un <strong>vecteur directeur</strong> d'une droite est un vecteur non nul dont la direction est celle de la droite.</p>`)}
        ${lc.prop("À partir de l'équation cartésienne", `<p>Si l'équation est <code>ax + by + c = 0</code>, alors <code>u→(−b ; a)</code> est un vecteur directeur.</p>`)}
        ${lc.example("Vecteur directeur", `<p>Pour <code>2x − y + 3 = 0</code> (avec <code>a = 2, b = −1</code>) : un vecteur directeur est <code>u→(1 ; 2)</code>.</p>
          <p>Vérification graphique : la pente vaut <code>2/1 = 2</code>, ce qui correspond bien à la forme <code>y = 2x + 3</code> ✓.</p>`)}
        ${lc.tip("Lien avec colinéarité", `<p>Deux droites sont parallèles si et seulement si leurs vecteurs directeurs sont colinéaires.</p>`)}
      `,
    },

    {
      title: "Fonction carré, racine carrée, cube",
      category: "Fonctions",
      content: `
        <h2>1. Fonction carré</h2>
        ${lc.def("Fonction carré", `<p>La fonction <code>f(x) = x²</code> est définie sur ℝ.</p>`)}
        ${lc.prop("Variations", `<ul>
          <li>Décroissante sur <code>]−∞ ; 0]</code>.</li>
          <li>Croissante sur <code>[0 ; +∞[</code>.</li>
          <li>Minimum en 0 : <code>f(0) = 0</code>.</li>
        </ul>`)}
        ${lc.tip("Représentation : la parabole", `<p>La courbe est une <strong>parabole</strong> tournée vers le haut, symétrique par rapport à l'axe des ordonnées (la fonction est <strong>paire</strong> : <code>f(−x) = f(x)</code>).</p>`)}

        <h2>2. Équation x² = a</h2>
        ${lc.prop("Solutions", `<ul>
          <li>Si <code>a < 0</code> : <strong>aucune solution</strong>.</li>
          <li>Si <code>a = 0</code> : une solution, <code>x = 0</code>.</li>
          <li>Si <code>a > 0</code> : <strong>deux solutions</strong>, <code>x = √a</code> et <code>x = −√a</code>.</li>
        </ul>`)}

        <h2>3. Fonction cube</h2>
        ${lc.def("Fonction cube", `<p>La fonction <code>f(x) = x³</code> est définie sur ℝ.</p>`)}
        ${lc.prop("Variations", `<p>Strictement <strong>croissante</strong> sur ℝ (sans pause au passage par 0).</p>
          <p>Cette fonction est <strong>impaire</strong> : <code>f(−x) = −f(x)</code>. La courbe est symétrique par rapport à l'origine.</p>`)}

        <h2>4. Équation x³ = a</h2>
        ${lc.prop("Solution unique", `<p>Pour tout réel <code>a</code>, l'équation <code>x³ = a</code> a <strong>une seule solution</strong> dans ℝ : la racine cubique <code>∛a</code>.</p>`)}

        <h2>5. Fonction racine carrée</h2>
        ${lc.def("Racine carrée", `<p>La fonction <code>f(x) = √x</code> est définie sur <code>[0 ; +∞[</code>.</p>`)}
        ${lc.prop("Variations", `<ul>
          <li>Strictement <strong>croissante</strong> sur <code>[0 ; +∞[</code>.</li>
          <li>Mais sa croissance ralentit : la pente diminue à mesure que <code>x</code> augmente.</li>
          <li>Valeurs : <code>√0 = 0</code>, <code>√1 = 1</code>, <code>√4 = 2</code>, <code>√9 = 3</code>, <code>√16 = 4</code>...</li>
        </ul>`)}

        <h2>6. Comparaisons utiles</h2>
        ${lc.prop("Sur l'intervalle [0, 1]", `<p>Pour <code>0 ≤ x ≤ 1</code>, on a : <code>x² ≤ x ≤ √x</code>.</p>`)}
