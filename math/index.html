// ─── Module geom : prédicats géométriques pour figures interactives ─
// Toutes les fonctions opèrent sur des points {x, y} en coordonnées
// logiques (le repère du viewBox SVG). Les tolérances par défaut visent
// des figures de 0–12 unités (où 1 unité ≈ 25–30 px à l'écran).
const geom = (() => {
  const dist = (A, B) => Math.hypot(B.x - A.x, B.y - A.y);
  const dot = (u, v) => u.x * v.x + u.y * v.y;
  const cross = (u, v) => u.x * v.y - u.y * v.x;
  const sub = (A, B) => ({ x: A.x - B.x, y: A.y - B.y });
  const norm = (v) => Math.hypot(v.x, v.y);

  const egal = (a, b, eps = 1e-6) => Math.abs(a - b) < eps;
  const pointsConfondus = (A, B, eps = 0.3) => dist(A, B) < eps;

  const colineaires = (A, B, C, eps = 0.3) => {
    const ab = sub(B, A);
    const n = norm(ab);
    if (n < 1e-9) return pointsConfondus(B, C, eps);
    return Math.abs(cross(ab, sub(C, A))) / n < eps;
  };

  const perpendiculaires = (A, B, C, D, epsDeg = 3) => {
    const u = sub(B, A), v = sub(D, C);
    const nu = norm(u), nv = norm(v);
    if (nu < 1e-9 || nv < 1e-9) return false;
    return Math.abs(dot(u, v)) / (nu * nv) < Math.sin(epsDeg * Math.PI / 180);
  };

  const paralleles = (A, B, C, D, epsDeg = 3) => {
    const u = sub(B, A), v = sub(D, C);
    const nu = norm(u), nv = norm(v);
    if (nu < 1e-9 || nv < 1e-9) return false;
    return Math.abs(cross(u, v)) / (nu * nv) < Math.sin(epsDeg * Math.PI / 180);
  };

  const equidistants = (M, A, B, eps = 0.3) =>
    Math.abs(dist(M, A) - dist(M, B)) < eps;

  const milieu = (M, A, B, eps = 0.3) => {
    const mid = { x: (A.x + B.x) / 2, y: (A.y + B.y) / 2 };
    return dist(M, mid) < eps;
  };

  // M' est le symétrique de B par rapport au point A
  const symetriqueParRapportA = (M, A, B, eps = 0.3) => {
    const target = { x: 2 * A.x - B.x, y: 2 * A.y - B.y };
    return dist(M, target) < eps;
  };

  // M est le symétrique de B par rapport à la droite (PQ)
  const symetriqueAxial = (M, B, P, Q, eps = 0.3) => {
    const pq = sub(Q, P), pb = sub(B, P);
    const npq2 = dot(pq, pq);
    if (npq2 < 1e-12) return false;
    const t = dot(pb, pq) / npq2;
    const H = { x: P.x + t * pq.x, y: P.y + t * pq.y };
    const target = { x: 2 * H.x - B.x, y: 2 * H.y - B.y };
    return dist(M, target) < eps;
  };

  const surCercle = (M, O, r, eps = 0.3) =>
    Math.abs(dist(M, O) - r) < eps;

  // Mesure d'angle ∠ABC en degrés (entre 0 et 180)
  const angleDeg = (A, B, C) => {
    const u = sub(A, B), v = sub(C, B);
    const nu = norm(u), nv = norm(v);
    if (nu < 1e-9 || nv < 1e-9) return NaN;
    const c = Math.max(-1, Math.min(1, dot(u, v) / (nu * nv)));
    return Math.acos(c) * 180 / Math.PI;
  };

  const angleEgal = (A, B, C, theta, epsDeg = 3) => {
    const m = angleDeg(A, B, C);
    return !isNaN(m) && Math.abs(m - theta) < epsDeg;
  };

  const longueurEgale = (A, B, L, eps = 0.3) =>
    Math.abs(dist(A, B) - L) < eps;

  const perimetre = (pts) => {
    let p = 0;
    for (let i = 0; i < pts.length; i++) {
      p += dist(pts[i], pts[(i + 1) % pts.length]);
    }
    return p;
  };
  const perimetreEgal = (pts, P, eps = 0.5) =>
    Math.abs(perimetre(pts) - P) < eps;

  const aire = (pts) => {
    let s = 0;
    for (let i = 0; i < pts.length; i++) {
      const j = (i + 1) % pts.length;
      s += pts[i].x * pts[j].y - pts[j].x * pts[i].y;
    }
    return Math.abs(s) / 2;
  };
  const aireEgale = (pts, A, eps = 0.5) =>
    Math.abs(aire(pts) - A) < eps;

  const appartientSegment = (M, A, B, eps = 0.3) => {
    if (!colineaires(A, B, M, eps)) return false;
    const ab = sub(B, A), am = sub(M, A);
    const ab2 = dot(ab, ab);
    if (ab2 < 1e-12) return pointsConfondus(M, A, eps);
    const t = dot(am, ab) / ab2;
    const slack = eps / Math.max(norm(ab), 1e-9);
    return t >= -slack && t <= 1 + slack;
  };

  // Projection orthogonale de P sur la droite (AB)
  const projection = (P, A, B) => {
    const ab = sub(B, A), ap = sub(P, A);
    const ab2 = dot(ab, ab);
    if (ab2 < 1e-12) return { x: A.x, y: A.y };
    const t = dot(ap, ab) / ab2;
    return { x: A.x + t * ab.x, y: A.y + t * ab.y };
  };

  return {
    dist, dot, cross, sub, norm, projection, angleDeg, perimetre, aire,
    egal, pointsConfondus, colineaires, perpendiculaires, paralleles,
    equidistants, milieu, symetriqueParRapportA, symetriqueAxial,
    surCercle, angleEgal, longueurEgale, perimetreEgal, aireEgale,
    appartientSegment,
  };
})();

// ─── Framework figure : SVG draggable points ───────────────────────
// Crée une figure interactive dans un container HTML. Les points sont
// stockés par nom dans fig.points et exposés via figure.getCoords().
// Les shapes (segment, ligne, cercle, polygone) se recalculent à chaque
// drag. Y est inversé par défaut (Y math vers le haut) pour que les
// formules pédagogiques restent naturelles.
const figure = (() => {
  const NS = 'http://www.w3.org/2000/svg';
  const svgEl = (tag) => document.createElementNS(NS, tag);

  function createFigure(container, opts) {
    const o = Object.assign({
      width: 360, height: 280,
      viewBox: { xMin: 0, xMax: 12, yMin: 0, yMax: 9 },
      grid: false, gridStep: 1,
      snap: 0,
      flipY: true,
      showAxes: false,
    }, opts || {});
    const vb = o.viewBox;
    const W = vb.xMax - vb.xMin, H = vb.yMax - vb.yMin;

    const svg = svgEl('svg');
    svg.setAttribute('class', 'fig-svg');
    svg.setAttribute('viewBox', `${vb.xMin} ${vb.yMin} ${W} ${H}`);
    svg.setAttribute('width', String(o.width));
    svg.setAttribute('height', String(o.height));

    const root = svgEl('g');
    if (o.flipY) {
      root.setAttribute('transform', `translate(0 ${vb.yMin + vb.yMax}) scale(1 -1)`);
    }
    svg.appendChild(root);

    const gGrid = svgEl('g'); gGrid.setAttribute('class', 'fig-grid'); root.appendChild(gGrid);
    const gShapes = svgEl('g'); gShapes.setAttribute('class', 'fig-shapes'); root.appendChild(gShapes);
    const gLabels = svgEl('g'); gLabels.setAttribute('class', 'fig-labels'); root.appendChild(gLabels);
    const gPoints = svgEl('g'); gPoints.setAttribute('class', 'fig-points'); root.appendChild(gPoints);

    const fig = {
      svg, root, gGrid, gShapes, gLabels, gPoints,
      vb, opts: o,
      points: {},
      shapes: [],
      callbacks: [],
      _frame: null,
      _dragging: null,
    };

    // Grille
    if (o.grid) {
      const stp = o.gridStep;
      for (let x = Math.ceil(vb.xMin / stp) * stp; x <= vb.xMax + 1e-9; x += stp) {
        const ln = svgEl('line');
        ln.setAttribute('x1', x); ln.setAttribute('x2', x);
        ln.setAttribute('y1', vb.yMin); ln.setAttribute('y2', vb.yMax);
        ln.setAttribute('class', 'fig-grid-line');
        ln.setAttribute('stroke-width', '0.02');
        gGrid.appendChild(ln);
      }
      for (let y = Math.ceil(vb.yMin / stp) * stp; y <= vb.yMax + 1e-9; y += stp) {
        const ln = svgEl('line');
        ln.setAttribute('y1', y); ln.setAttribute('y2', y);
        ln.setAttribute('x1', vb.xMin); ln.setAttribute('x2', vb.xMax);
        ln.setAttribute('class', 'fig-grid-line');
        ln.setAttribute('stroke-width', '0.02');
        gGrid.appendChild(ln);
      }
    }
    if (o.showAxes) {
      const ax = svgEl('line');
      ax.setAttribute('x1', vb.xMin); ax.setAttribute('x2', vb.xMax);
      ax.setAttribute('y1', 0); ax.setAttribute('y2', 0);
      ax.setAttribute('class', 'fig-axis');
      ax.setAttribute('stroke-width', '0.04');
      gGrid.appendChild(ax);
      const ay = svgEl('line');
      ay.setAttribute('x1', 0); ay.setAttribute('x2', 0);
      ay.setAttribute('y1', vb.yMin); ay.setAttribute('y2', vb.yMax);
      ay.setAttribute('class', 'fig-axis');
      ay.setAttribute('stroke-width', '0.04');
      gGrid.appendChild(ay);
    }

    container.appendChild(svg);
    setupDrag(fig);
    return fig;
  }

  function addPoint(fig, name, x, y, opts) {
    const o = Object.assign({
      draggable: false, color: 'fixed', label: null, hidden: false,
      constrain: null, radius: 0.18,
    }, opts || {});
    const p = { name, x, y, ...o };

    if (!o.hidden) {
      const dot = svgEl('circle');
      dot.setAttribute('class', 'fig-point fig-point-' + o.color + (o.draggable ? ' draggable' : ''));
      dot.setAttribute('r', o.radius);
      dot.setAttribute('cx', x);
      dot.setAttribute('cy', y);
      dot.setAttribute('stroke-width', '0.04');
      p.el = dot;
      fig.gPoints.appendChild(dot);

      if (o.draggable) {
        const hit = svgEl('circle');
        hit.setAttribute('class', 'fig-hit');
        hit.setAttribute('r', Math.max(o.radius * 3, 0.6));
        hit.setAttribute('cx', x);
        hit.setAttribute('cy', y);
        hit.setAttribute('data-point', name);
        hit.setAttribute('fill', 'transparent');
        p.hit = hit;
        fig.gPoints.appendChild(hit);
      }

      if (o.label !== null) {
        const lbl = svgEl('text');
        lbl.setAttribute('class', 'fig-label');
        lbl.setAttribute('font-size', '0.5');
        if (fig.opts.flipY) {
          lbl.setAttribute('transform', `translate(${x + 0.25} ${y + 0.25}) scale(1 -1)`);
          lbl.setAttribute('x', 0);
          lbl.setAttribute('y', 0);
        } else {
          lbl.setAttribute('x', x + 0.25);
          lbl.setAttribute('y', y - 0.25);
        }
        lbl.textContent = o.label;
        p.labelEl = lbl;
        fig.gLabels.appendChild(lbl);
      }
    }

    fig.points[name] = p;
    return p;
  }

  function addShape(fig, type, args, style) {
    const sty = Object.assign({ color: 'user', dashed: false }, style || {});
    let el = null;
    let deps = [];
    if (type === 'segment' || type === 'line') {
      deps = [args.from, args.to];
      el = svgEl('line');
    } else if (type === 'circle') {
      deps = [args.center, args.through].filter(Boolean);
      el = svgEl('circle');
    } else if (type === 'polygon') {
      deps = args.points.slice();
      el = svgEl('polygon');
    }
    if (el) {
      el.setAttribute('class', 'fig-shape fig-shape-' + sty.color + (sty.dashed ? ' dashed' : ''));
      el.setAttribute('stroke-width', '0.05');
      fig.gShapes.appendChild(el);
    }
    const shape = { type, args, style: sty, el, deps };
    fig.shapes.push(shape);
    updateShape(fig, shape);
    return shape;
  }

  function updateShape(fig, shape) {
    const P = (n) => fig.points[n];
    const { type, args, el } = shape;
    if (!el) return;
    if (type === 'segment') {
      const A = P(args.from), B = P(args.to);
      el.setAttribute('x1', A.x); el.setAttribute('y1', A.y);
      el.setAttribute('x2', B.x); el.setAttribute('y2', B.y);
    } else if (type === 'line') {
      const A = P(args.from), B = P(args.to);
      const vb = fig.vb;
      const dx = B.x - A.x, dy = B.y - A.y;
      if (Math.abs(dx) < 1e-9 && Math.abs(dy) < 1e-9) {
        el.setAttribute('x1', A.x); el.setAttribute('y1', A.y);
        el.setAttribute('x2', A.x); el.setAttribute('y2', A.y);
      } else {
        const ts = [];
        if (Math.abs(dx) > 1e-9) {
          ts.push((vb.xMin - A.x) / dx, (vb.xMax - A.x) / dx);
        }
        if (Math.abs(dy) > 1e-9) {
          ts.push((vb.yMin - A.y) / dy, (vb.yMax - A.y) / dy);
        }
        ts.sort((a, b) => a - b);
        const t1 = ts[0], t2 = ts[ts.length - 1];
        el.setAttribute('x1', A.x + t1 * dx);
        el.setAttribute('y1', A.y + t1 * dy);
        el.setAttribute('x2', A.x + t2 * dx);
        el.setAttribute('y2', A.y + t2 * dy);
      }
    } else if (type === 'circle') {
      const O = P(args.center);
      let r;
      if (args.radius != null) r = args.radius;
      else if (args.through) {
        const M = P(args.through);
        r = Math.hypot(M.x - O.x, M.y - O.y);
      } else r = 1;
      el.setAttribute('cx', O.x); el.setAttribute('cy', O.y);
      el.setAttribute('r', r);
    } else if (type === 'polygon') {
      const pts = args.points.map(n => `${P(n).x},${P(n).y}`).join(' ');
      el.setAttribute('points', pts);
    }
  }

  function getCoords(fig, name) {
    const p = fig.points[name];
    return p ? { x: p.x, y: p.y } : null;
  }

  function getState(fig) {
    const out = { points: {} };
    for (const [n, p] of Object.entries(fig.points)) {
      out.points[n] = { x: p.x, y: p.y };
    }
    return out;
  }

  function onUpdate(fig, cb) { fig.callbacks.push(cb); }

  function setPointPosition(fig, name, x, y) {
    const p = fig.points[name];
    if (!p) return;
    p.x = x; p.y = y;
    if (p.el) { p.el.setAttribute('cx', x); p.el.setAttribute('cy', y); }
    if (p.hit) { p.hit.setAttribute('cx', x); p.hit.setAttribute('cy', y); }
    if (p.labelEl) {
      if (fig.opts.flipY) {
        p.labelEl.setAttribute('transform', `translate(${x + 0.25} ${y + 0.25}) scale(1 -1)`);
      } else {
        p.labelEl.setAttribute('x', x + 0.25); p.labelEl.setAttribute('y', y - 0.25);
      }
    }
    for (const s of fig.shapes) {
      if (s.deps.includes(name)) updateShape(fig, s);
    }
  }

  function ptToLogical(fig, clientX, clientY) {
    const m = fig.svg.getScreenCTM();
    if (!m) return null;
    const inv = m.inverse();
    const pt = fig.svg.createSVGPoint();
    pt.x = clientX; pt.y = clientY;
    const lp = pt.matrixTransform(inv);
    if (fig.opts.flipY) {
      return { x: lp.x, y: (fig.vb.yMin + fig.vb.yMax) - lp.y };
    }
    return { x: lp.x, y: lp.y };
  }

  function setupDrag(fig) {
    fig.svg.addEventListener('pointerdown', (e) => {
      const t = e.target;
      if (!t || !t.getAttribute) return;
      const name = t.getAttribute('data-point');
      if (!name) return;
      const p = fig.points[name];
      if (!p || !p.draggable) return;
      const lp = ptToLogical(fig, e.clientX, e.clientY);
      if (!lp) return;
      try { t.setPointerCapture(e.pointerId); } catch (_) {}
      fig._dragging = { name, pointerId: e.pointerId, dx: lp.x - p.x, dy: lp.y - p.y, target: t };
      e.preventDefault();
    });

    fig.svg.addEventListener('pointermove', (e) => {
      const d = fig._dragging;
      if (!d || d.pointerId !== e.pointerId) return;
      const lp = ptToLogical(fig, e.clientX, e.clientY);
      if (!lp) return;
      const p = fig.points[d.name];
      let nx = lp.x - d.dx, ny = lp.y - d.dy;
      if (p.constrain) {
        const cp = p.constrain(nx, ny, fig);
        nx = cp.x; ny = cp.y;
      }
      if (fig.opts.snap > 0) {
        nx = Math.round(nx / fig.opts.snap) * fig.opts.snap;
        ny = Math.round(ny / fig.opts.snap) * fig.opts.snap;
      }
      nx = Math.max(fig.vb.xMin, Math.min(fig.vb.xMax, nx));
      ny = Math.max(fig.vb.yMin, Math.min(fig.vb.yMax, ny));
      if (nx === p.x && ny === p.y) return;
      p.x = nx; p.y = ny;
      if (fig._frame) cancelAnimationFrame(fig._frame);
      fig._frame = requestAnimationFrame(() => {
        fig._frame = null;
        if (p.el) { p.el.setAttribute('cx', p.x); p.el.setAttribute('cy', p.y); }
        if (p.hit) { p.hit.setAttribute('cx', p.x); p.hit.setAttribute('cy', p.y); }
        if (p.labelEl) {
          if (fig.opts.flipY) {
            p.labelEl.setAttribute('transform', `translate(${p.x + 0.25} ${p.y + 0.25}) scale(1 -1)`);
          } else {
            p.labelEl.setAttribute('x', p.x + 0.25); p.labelEl.setAttribute('y', p.y - 0.25);
          }
        }
        for (const s of fig.shapes) {
          if (s.deps.includes(p.name)) updateShape(fig, s);
        }
        const st = getState(fig);
        for (const cb of fig.callbacks) {
          try { cb(st, p.name); } catch (_) {}
        }
      });
    });

    const endDrag = (e) => {
      const d = fig._dragging;
      if (!d || (e.pointerId != null && d.pointerId !== e.pointerId)) return;
      try { d.target && d.target.releasePointerCapture && d.target.releasePointerCapture(e.pointerId); } catch (_) {}
      fig._dragging = null;
    };
    fig.svg.addEventListener('pointerup', endDrag);
    fig.svg.addEventListener('pointercancel', endDrag);
  }

  function destroy(fig) {
    if (!fig) return;
    if (fig._frame) cancelAnimationFrame(fig._frame);
    fig._frame = null;
    fig._dragging = null;
    if (fig.svg && fig.svg.parentNode) fig.svg.parentNode.removeChild(fig.svg);
    fig.points = {};
    fig.shapes = [];
    fig.callbacks = [];
  }

  // Construit une figure à partir d'une description déclarative.
  function build(container, spec) {
    const fig = createFigure(container, spec);
    if (Array.isArray(spec.points)) {
      for (const p of spec.points) {
        const { name, x, y, ...rest } = p;
        addPoint(fig, name, x, y, rest);
      }
    }
    if (Array.isArray(spec.shapes)) {
      for (const s of spec.shapes) {
        const { type, style, ...args } = s;
        addShape(fig, type, args, style);
      }
    }
    return fig;
  }

  return {
    createFigure, addPoint, addShape, updateShape,
    getCoords, getState, onUpdate, setPointPosition,
    destroy, build,
  };
})();

const exState = { current: null, selectedMcq: null, sessionStats: { tried: 0, correct: 0 } };
const exRand = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
const exPick = arr => arr[Math.floor(Math.random() * arr.length)];

function exKey(levelId, idx) { return `${levelId}-${idx}`; }

function hasExercises(levelId, idx) {
  const list = EXERCISES[exKey(levelId, idx)];
  return Array.isArray(list) && list.length > 0;
}

function generateExercise(levelId, idx) {
  const list = EXERCISES[exKey(levelId, idx)];
  const tmpl = list[Math.floor(Math.random() * list.length)];
  const data = tmpl.generate();
  return {
    template: tmpl,
    levelId, idx,
    title: tmpl.title,
    ...data,
    userAnswer: null,
    status: 'pending',
  };
}

function openExercise(levelId, idx) {
  // Empêche un état incohérent si un DS était ouvert.
  dsState.current = null;
  dsState.status = 'idle';
  exState.current = generateExercise(levelId, idx);
  exState.selectedMcq = null;
  $('#ex-backdrop').classList.add('show');
  renderExerciseModal();
}

function closeExercise() {
  if (exState.current && exState.current._fig) {
    figure.destroy(exState.current._fig);
    exState.current._fig = null;
  }
  exState.current = null;
  exState.selectedMcq = null;
  $('#ex-backdrop').classList.remove('show');
}

function newExercise() {
  if (!exState.current) return;
  if (exState.current._fig) {
    figure.destroy(exState.current._fig);
    exState.current._fig = null;
  }
  openExercise(exState.current.levelId, exState.current.idx);
}

function exNormalize(s) {
  return String(s).toLowerCase().trim().normalize('NFD').replace(/[̀-ͯ]/g, '');
}

function exCheckAnswer(ex, userAns) {
  if (typeof ex.template.check === 'function') {
    return !!ex.template.check(userAns, ex);
  }
  if (ex.inputType === 'mcq') return userAns === ex.answer;
  if (ex.inputType === 'number') {
    const n = parseFloat(String(userAns).replace(',', '.').replace(/\s/g, ''));
    if (isNaN(n)) return false;
    return Math.abs(n - ex.answer) < (ex.tolerance != null ? ex.tolerance : 1e-6);
  }
  if (ex.inputType === 'text') {
    return exNormalize(userAns) === exNormalize(ex.answer);
  }
  if (ex.inputType === 'fraction') {
    const m = String(userAns).replace(/\s/g, '').match(/^(-?\d+)\/(-?\d+)$/);
    if (!m) return false;
    const num = parseInt(m[1], 10), den = parseInt(m[2], 10);
    if (den === 0) return false;
    return Math.abs(num / den - ex.answer) < 1e-9;
  }
  if (ex.inputType === 'figure') {
    if (typeof ex.validate !== 'function') return false;
    const r = ex.validate(userAns, ex);
    if (typeof r === 'object' && r !== null) {
      ex._lastHint = r.hint || null;
      return !!r.ok;
    }
    return !!r;
  }
  return false;
}

function checkExercise() {
  const ex = exState.current;
  if (!ex || (ex.status !== 'pending' && ex.status !== 'wrong')) return;
  let userAns;
  if (ex.inputType === 'mcq') {
    userAns = exState.selectedMcq;
    if (userAns == null) return;
  } else if (ex.inputType === 'figure') {
    if (!ex._fig) return;
    userAns = figure.getState(ex._fig);
  } else {
    const input = $('#ex-input');
    if (!input) return;
    userAns = input.value.trim();
    if (!userAns) return;
  }
  ex.userAnswer = userAns;
  ex._lastHint = null;
  const ok = exCheckAnswer(ex, userAns);
  ex.status = ok ? 'correct' : 'wrong';
  exState.sessionStats.tried++;
  if (ok) exState.sessionStats.correct++;
  renderExerciseModal();
}

function revealSolution() {
  if (!exState.current) return;
  exState.current.status = 'revealed';
  renderExerciseModal();
}

function exFormatAnswer(ex) {
  if (ex.inputType === 'mcq') return ex.options[ex.answer];
  if (ex.formatAnswer) return ex.formatAnswer(ex);
  if (ex.inputType === 'figure') {
    if (ex.target && typeof ex.target === 'object') {
      // Format compact des coords cibles : { A: {x:1, y:2} } → "A(1 ; 2)"
      const parts = [];
      for (const [n, c] of Object.entries(ex.target)) {
        if (c && typeof c.x === 'number' && typeof c.y === 'number') {
          parts.push(`${n}(${+c.x.toPrecision(6)} ; ${+c.y.toPrecision(6)})`);
        }
      }
      if (parts.length) return parts.join(', ');
    }
    return 'voir la figure';
  }
  if (typeof ex.answer === 'number') {
    // Nettoie les artefacts flottants (e.g. 1.8000000000000003 → 1.8)
    return String(+ex.answer.toPrecision(12));
  }
  return String(ex.answer);
}

// Monte une figure interactive dans la modale. Si la figure est déjà
// instanciée (ex._fig), on la détruit et on la reconstruit pour rester
// cohérent avec le pattern "innerHTML = ''" utilisé par renderExerciseModal.
function mountFigure(parent, ex, opts) {
  const o = opts || {};
  if (ex._fig) { figure.destroy(ex._fig); ex._fig = null; }
  const wrap = el('div', { class: 'ex-figure' });
  parent.appendChild(wrap);
  const spec = Object.assign({}, ex.figure);
  if (o.readonly) {
    // En lecture, on désactive le drag en remplaçant les points draggables
    // par des points fixes (mais on garde leurs positions actuelles).
    if (Array.isArray(spec.points)) {
      spec.points = spec.points.map(p => Object.assign({}, p, { draggable: false }));
    }
  }
  ex._fig = figure.build(wrap, spec);
  // Restitue les positions de l'élève si on les a (status correct/wrong/revealed)
  if (ex.userAnswer && ex.userAnswer.points) {
    for (const [n, c] of Object.entries(ex.userAnswer.points)) {
      if (ex._fig.points[n]) figure.setPointPosition(ex._fig, n, c.x, c.y);
    }
  }
  // Bandeau d'info dynamique optionnel : ex.figure.info(state) → string
  if (typeof ex.figure.info === 'function' && !o.readonly) {
    const info = el('div', { class: 'fig-info' });
    info.textContent = ex.figure.info(figure.getState(ex._fig));
    wrap.appendChild(info);
    figure.onUpdate(ex._fig, (st) => {
      info.textContent = ex.figure.info(st);
    });
  }
  return ex._fig;
}

function renderExerciseModal() {
  const modal = $('#ex-modal');
  if (!modal) return;
  // Avant de réécrire le modal, détruire toute figure montée précédemment
  // (le innerHTML = '' qui suit retire les nœuds DOM mais pas les listeners).
  if (exState.current && exState.current._fig) {
    figure.destroy(exState.current._fig);
    exState.current._fig = null;
  }
  modal.innerHTML = '';
  const ex = exState.current;
  if (!ex) return;

  const level = findLevel(ex.levelId);
  const chapter = level.chapters[ex.idx];

  modal.appendChild(el('div', { class: 'ex-meta' }, `${level.name} · ${chapter.title}`));
  modal.appendChild(el('h2', { id: 'ex-title' }, ex.title));
  modal.appendChild(el('div', { class: 'ex-question', html: ex.question }));

  if (ex.status === 'pending' || ex.status === 'wrong') {
    if (ex.inputType === 'mcq') {
      const wrap = el('div', { class: 'ex-mcq' });
      ex.options.forEach((opt, i) => {
        wrap.appendChild(el('button', {
          class: 'ex-mcq-option' + (exState.selectedMcq === i ? ' selected' : ''),
          onclick: () => { exState.selectedMcq = i; renderExerciseModal(); },
          html: opt,
        }));
      });
      modal.appendChild(wrap);
    } else if (ex.inputType === 'figure') {
      mountFigure(modal, ex);
    } else {
      const wrap = el('div', { class: 'ex-input-wrap' });
      const input = el('input', {
        class: 'ex-input',
        id: 'ex-input',
        type: 'text',
        inputmode: ex.inputType === 'number' ? 'decimal' : 'text',
        placeholder: ex.placeholder || 'Ta réponse',
        autocomplete: 'off',
        spellcheck: 'false',
      });
      if (ex.userAnswer) input.value = ex.userAnswer;
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); checkExercise(); }
      });
      wrap.appendChild(input);
      modal.appendChild(wrap);
    }
  } else {
    if (ex.inputType === 'figure') {
      // En statut correct/revealed, on remonte la figure en lecture (toujours
      // affichée pour montrer la solution si on l'affiche en correction).
      mountFigure(modal, ex, { readonly: true });
    } else {
      const display = ex.inputType === 'mcq'
        ? (ex.options[ex.userAnswer] || '—')
        : (ex.userAnswer || '—');
      modal.appendChild(el('div', { class: 'ex-readonly', html: display }));
    }
  }

  // Boutons
  const buttons = el('div', { class: 'ex-buttons' });
  if (ex.status === 'pending' || ex.status === 'wrong') {
    buttons.appendChild(el('button', { class: 'nav-btn next', onclick: checkExercise }, 'Vérifier'));
    buttons.appendChild(el('button', { class: 'nav-btn', onclick: revealSolution }, 'Voir la correction'));
  } else {
    buttons.appendChild(el('button', { class: 'nav-btn next', onclick: newExercise }, '🎲 Nouvel exercice'));
  }
  buttons.appendChild(el('button', { class: 'nav-btn', onclick: closeExercise }, 'Fermer'));
  modal.appendChild(buttons);

  if (ex.status === 'correct') {
    modal.appendChild(el('div', { class: 'ex-feedback ok', html: '✅ <strong>Bonne réponse !</strong> Bien joué.' }));
  }
  if (ex.status === 'wrong') {
    const baseMsg = '❌ Ce n\'est pas tout à fait ça. Réessaie ou regarde la correction.';
    modal.appendChild(el('div', { class: 'ex-feedback ko', html: baseMsg }));
    if (ex._lastHint) {
      modal.appendChild(el('div', { class: 'fig-hint', html: '💡 ' + ex._lastHint }));
    }
  }

  if (ex.status === 'revealed' || ex.status === 'correct') {
    const sol = el('div', { class: 'ex-solution' });
    sol.appendChild(el('h3', {}, 'Correction détaillée'));
    if (ex.steps && ex.steps.length) {
      const ol = el('ol');
      for (const step of ex.steps) ol.appendChild(el('li', { html: step }));
      sol.appendChild(ol);
    }
    sol.appendChild(el('div', { class: 'ex-final', html: `Réponse : <code>${exFormatAnswer(ex)}</code>` }));
    modal.appendChild(sol);
  }

  if (exState.sessionStats.tried > 0) {
    const s = exState.sessionStats;
    modal.appendChild(el('div', { class: 'ex-stats' },
      `Session : ${s.correct} / ${s.tried} bonne${s.correct > 1 ? 's' : ''} réponse${s.correct > 1 ? 's' : ''} (${Math.round(100 * s.correct / s.tried)} %).`));
  }

  setTimeout(() => {
    if (ex.inputType === 'figure') return;
    const input = $('#ex-input');
    if (input && (ex.status === 'pending' || ex.status === 'wrong')) input.focus();
  }, 50);
}

// ─── DS (Devoir Surveillé) ──────────────────────────────────────────
// Mode noté : N questions d'affilée tirées des templates du chapitre,
// pas de feedback intermédiaire, note /20 et corrigé détaillé à la fin.
const DS_MIN_TEMPLATES = 5;
const DS_QUESTION_COUNT = 5;
const DS_SCORES_KEY = 'mathcours_ds_scores_v1';

const dsState = { current: null, status: 'idle' };
let dsScores = {};

function loadDsScores() {
  try { dsScores = JSON.parse(localStorage.getItem(DS_SCORES_KEY)) || {}; }
  catch { dsScores = {}; }
}
function saveDsScores() {
  try { localStorage.setItem(DS_SCORES_KEY, JSON.stringify(dsScores)); }
  catch {}
}

function hasDS(levelId, idx) {
  const list = EXERCISES[exKey(levelId, idx)];
  return Array.isArray(list) && list.length >= DS_MIN_TEMPLATES;
}

function openDS(levelId, idx) {
  const list = EXERCISES[exKey(levelId, idx)];
  if (!list || list.length < DS_MIN_TEMPLATES) return;
  // Empêche un état incohérent si un exercice libre était ouvert.
  exState.current = null;
  exState.selectedMcq = null;
  // Pioche DS_QUESTION_COUNT templates distincts (mélange + slice)
  const shuffled = [...list].sort(() => Math.random() - 0.5).slice(0, DS_QUESTION_COUNT);
  const questions = shuffled.map(tmpl => ({
    template: tmpl,
    ...tmpl.generate(),
    userAnswer: null,
    mcqSelected: null,
    correct: false,
  }));
  dsState.current = { levelId, idx, questions, currentIdx: 0, startTime: Date.now() };
  dsState.status = 'in_progress';
  $('#ex-backdrop').classList.add('show');
  renderDsModal();
}

function closeDS() {
  // Si on ferme après une note enregistrée, on re-render le chapitre pour
  // que le bloc « Meilleure note » sous le bouton DS se rafraîchisse.
  const wasFinished = dsState.status === 'finished';
  if (dsState.current && Array.isArray(dsState.current.questions)) {
    for (const q of dsState.current.questions) {
      if (q._fig) { figure.destroy(q._fig); q._fig = null; }
    }
  }
  dsState.current = null;
  dsState.status = 'idle';
  $('#ex-backdrop').classList.remove('show');
  if (wasFinished) render();
}

function dsNextQuestion() {
  const ds = dsState.current;
  if (!ds || dsState.status !== 'in_progress') return;
  const q = ds.questions[ds.currentIdx];
  let userAns;
  if (q.inputType === 'mcq') {
    userAns = q.mcqSelected;
    if (userAns == null) return;
  } else if (q.inputType === 'figure') {
    if (!q._fig) return;
    userAns = figure.getState(q._fig);
  } else {
    const input = $('#ds-input');
    userAns = input ? input.value.trim() : '';
    if (!userAns) return;
  }
  q.userAnswer = userAns;
  q.template = q.template || {};
  // Pour le DS on synthétise un objet "ex-like" qui possède template+inputType+...
  q.correct = exCheckAnswer(q, userAns);
  if (ds.currentIdx < ds.questions.length - 1) {
    ds.currentIdx++;
    renderDsModal();
  } else {
    dsState.status = 'finished';
    saveDsScore();
    renderDsModal();
  }
}

function saveDsScore() {
  const ds = dsState.current;
  const correctCount = ds.questions.filter(q => q.correct).length;
  const note = Math.round((correctCount / ds.questions.length) * 20 * 10) / 10;
  const key = exKey(ds.levelId, ds.idx);
  const prev = dsScores[key] || { best: 0, last: 0, count: 0 };
  dsScores[key] = {
    best: Math.max(prev.best, note),
    last: note,
    count: prev.count + 1,
  };
  saveDsScores();
}

function dsMention(note) {
  if (note >= 18) return 'Très bien';
  if (note >= 14) return 'Bien';
  if (note >= 12) return 'Assez bien';
  if (note >= 10) return 'Passable';
  if (note >= 8) return 'Insuffisant';
  return 'À retravailler';
}

function dsFormatUserAnswer(q) {
  if (q.userAnswer == null || q.userAnswer === '') return '—';
  if (q.inputType === 'mcq') return q.options[q.userAnswer] || '—';
  if (q.inputType === 'figure') {
    if (q.userAnswer && q.userAnswer.points) {
      const parts = [];
      const targetNames = q.target ? Object.keys(q.target) : Object.keys(q.userAnswer.points);
      for (const n of targetNames) {
        const c = q.userAnswer.points[n];
        if (c) parts.push(`${n}(${+c.x.toPrecision(4)} ; ${+c.y.toPrecision(4)})`);
      }
      return parts.join(', ') || '—';
    }
    return '—';
  }
  return String(q.userAnswer);
}

function renderDsModal() {
  const modal = $('#ex-modal');
  if (!modal) return;
  // Détruire les figures de la question précédente avant de réécrire le DOM
  const prevDs = dsState.current;
  if (prevDs && Array.isArray(prevDs.questions)) {
    for (const q of prevDs.questions) {
      if (q._fig) { figure.destroy(q._fig); q._fig = null; }
    }
  }
  modal.innerHTML = '';
  const ds = dsState.current;
  if (!ds) return;
  const level = findLevel(ds.levelId);
  const chapter = level.chapters[ds.idx];

  modal.appendChild(el('div', { class: 'ex-meta' }, `📝 DS · ${level.name} · ${chapter.title}`));

  if (dsState.status === 'in_progress') {
    const total = ds.questions.length;
    const cur = ds.currentIdx + 1;
    const progress = el('div', { class: 'ds-progress' });
    progress.appendChild(el('span', {}, `Question ${cur} / ${total}`));
    const bar = el('div', { class: 'ds-progress-bar' });
    bar.appendChild(el('div', { class: 'ds-progress-fill', style: `width:${100 * cur / total}%` }));
    progress.appendChild(bar);
    modal.appendChild(progress);

    const q = ds.questions[ds.currentIdx];
    modal.appendChild(el('h2', { id: 'ex-title' }, q.title));
    modal.appendChild(el('div', { class: 'ex-question', html: q.question }));

    if (q.inputType === 'mcq') {
      const wrap = el('div', { class: 'ex-mcq' });
      q.options.forEach((opt, i) => {
        wrap.appendChild(el('button', {
          class: 'ex-mcq-option' + (q.mcqSelected === i ? ' selected' : ''),
          onclick: () => { q.mcqSelected = i; renderDsModal(); },
          html: opt,
        }));
      });
      modal.appendChild(wrap);
    } else if (q.inputType === 'figure') {
      mountFigure(modal, q);
    } else {
      const wrap = el('div', { class: 'ex-input-wrap' });
      const input = el('input', {
        class: 'ex-input',
        id: 'ds-input',
        type: 'text',
        inputmode: q.inputType === 'number' ? 'decimal' : 'text',
        placeholder: q.placeholder || 'Ta réponse',
        autocomplete: 'off',
        spellcheck: 'false',
      });
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); dsNextQuestion(); }
      });
      wrap.appendChild(input);
      modal.appendChild(wrap);
    }

    const buttons = el('div', { class: 'ex-buttons' });
    const isLast = ds.currentIdx === total - 1;
    buttons.appendChild(el('button', { class: 'nav-btn next', onclick: dsNextQuestion },
      isLast ? 'Terminer le DS' : 'Question suivante →'));
    buttons.appendChild(el('button', {
      class: 'nav-btn',
      onclick: () => { if (confirm('Abandonner le DS ? Ta progression ne sera pas notée.')) closeDS(); },
    }, 'Abandonner'));
    modal.appendChild(buttons);

    setTimeout(() => {
      if (q.inputType === 'figure') return;
      const input = $('#ds-input');
      if (input) input.focus();
    }, 50);
    return;
  }

  // Statut « finished » : note, stats, récap.
  const correctCount = ds.questions.filter(q => q.correct).length;
  const total = ds.questions.length;
  const note = Math.round((correctCount / total) * 20 * 10) / 10;

  const grade = el('div', { class: 'ds-final-grade' });
  const num = el('div', {});
  num.appendChild(el('span', { class: 'grade-num' }, String(note)));
  num.appendChild(el('span', { class: 'grade-denom' }, ' / 20'));
  grade.appendChild(num);
  grade.appendChild(el('div', { class: 'grade-mention' }, dsMention(note)));
  modal.appendChild(grade);

  const elapsed = Math.round((Date.now() - ds.startTime) / 1000);
  const mins = Math.floor(elapsed / 60), secs = elapsed % 60;
  const timeStr = mins ? `${mins}'${String(secs).padStart(2, '0')}` : `${secs}s`;

  const stats = el('div', { class: 'ds-final-stats' });
  const sCorr = el('div', {});
  sCorr.appendChild(el('span', { class: 'stat-num' }, String(correctCount)));
  sCorr.appendChild(el('div', {}, 'bonnes réponses'));
  stats.appendChild(sCorr);
  const sErr = el('div', {});
  sErr.appendChild(el('span', { class: 'stat-num' }, String(total - correctCount)));
  sErr.appendChild(el('div', {}, 'erreurs'));
  stats.appendChild(sErr);
  const sTime = el('div', {});
  sTime.appendChild(el('span', { class: 'stat-num' }, timeStr));
  sTime.appendChild(el('div', {}, 'temps'));
  stats.appendChild(sTime);
  modal.appendChild(stats);

  const score = dsScores[exKey(ds.levelId, ds.idx)];
  if (score && score.count >= 2) {
    modal.appendChild(el('div', { class: 'ex-stats' },
      `Meilleure note : ${score.best}/20 · ${score.count} DS faits sur ce chapitre.`));
  }

  const recap = el('div', { class: 'ds-recap' });
  recap.appendChild(el('h3', {
    style: 'font-size:13px; text-transform:uppercase; letter-spacing:0.06em; color:var(--text-2); margin:14px 0 10px',
  }, 'Détail des questions'));
  ds.questions.forEach((q, i) => {
    const item = el('div', { class: 'ds-recap-item ' + (q.correct ? 'ok' : 'ko') });
    item.appendChild(el('div', { class: 'ds-recap-q', html: `${q.correct ? '✓' : '✗'} Q${i + 1}. ${escAttr(q.title)}` }));
    item.appendChild(el('div', { html: q.question }));
    const meta = el('div', { class: 'ds-recap-meta' });
    const yours = dsFormatUserAnswer(q);
    if (q.correct) {
      meta.innerHTML = `Ta réponse : <code>${escAttr(yours)}</code> ✓`;
    } else {
      meta.innerHTML = `Ta réponse : <code>${escAttr(yours)}</code> · Correction : <code>${escAttr(exFormatAnswer(q))}</code>`;
    }
    item.appendChild(meta);
    recap.appendChild(item);
  });
  modal.appendChild(recap);

  const buttons = el('div', { class: 'ex-buttons' });
  buttons.appendChild(el('button', { class: 'nav-btn next', onclick: () => openDS(ds.levelId, ds.idx) }, '🔁 Refaire un DS'));
  buttons.appendChild(el('button', { class: 'nav-btn', onclick: closeDS }, 'Fermer'));
  modal.appendChild(buttons);
}

const STATE_KEY = 'mathcours_v1';
let state = { levelId: '5e', chapterId: null };
let searchState = { query: '' };

function loadState() {
  // Priorité 1 : URL hash (#5e ou #5e/3) pour permettre les liens partageables.
  if (location.hash) {
    const m = location.hash.slice(1).match(/^([^/]+)(?:\/(\d+))?$/);
    if (m && findLevel(m[1])) {
      state.levelId = m[1];
      state.chapterId = m[2] !== undefined ? `${m[1]}-${m[2]}` : null;
      return;
    }
  }
  // Priorité 2 : localStorage (dernier chapitre visité).
  try {
    const raw = localStorage.getItem(STATE_KEY);
    if (!raw) return;
    const parsed = JSON.parse(raw);
    if (parsed.levelId && findLevel(parsed.levelId)) state.levelId = parsed.levelId;
    if (parsed.chapterId) state.chapterId = parsed.chapterId;
  } catch (e) { /* ignore */ }
}

function saveState() {
  try { localStorage.setItem(STATE_KEY, JSON.stringify(state)); }
  catch (e) { /* ignore quota */ }
  // Synchronise l'URL avec l'état pour permettre back/forward et partage.
  syncHash();
}

let suppressHashChange = false;
function syncHash() {
  if (!state.levelId) { suppressHashChange = true; location.hash = ''; return; }
  let target = state.levelId;
  if (state.chapterId) {
    const m = state.chapterId.match(/-(\d+)$/);
    if (m) target += '/' + m[1];
  }
  const desired = '#' + target;
  if (location.hash !== desired) {
    suppressHashChange = true;
    location.hash = desired;
  }
}

function findLevel(id) {
  for (const g of CURRICULUM) for (const l of g.levels) if (l.id === id) return l;
  return null;
}

function levelStats(level) {
  const filled = level.chapters.filter(c => c.content).length;
  return { filled, total: level.chapters.length };
}

// ─── Rendering ──────────────────────────────────────────────────
function renderSidebar() {
  const sidebar = $('#sidebar');
  sidebar.innerHTML = '';

  // Barre de recherche en haut, sticky.
  const searchWrap = el('div', { class: 'search-wrap' });
  const searchInput = el('input', {
    class: 'search-input',
    type: 'search',
    id: 'search-input',
    placeholder: 'Rechercher un chapitre…',
    'aria-label': 'Rechercher un chapitre',
    autocomplete: 'off',
    spellcheck: 'false',
  });
  const shortcutHint = el('span', { class: 'search-shortcut' },
    navigator.platform && /Mac/i.test(navigator.platform) ? '⌘K' : 'Ctrl+K');
  searchInput.addEventListener('input', (e) => {
    searchState.query = e.target.value.trim().toLowerCase();
    renderSidebarBody();
  });
  searchInput.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { searchInput.value = ''; searchState.query = ''; renderSidebarBody(); searchInput.blur(); }
  });
  searchWrap.appendChild(searchInput);
  searchWrap.appendChild(shortcutHint);
  sidebar.appendChild(searchWrap);

  // Corps : navigation classique OU résultats de recherche.
  const body = el('div', { class: 'sidebar-content', id: 'sidebar-body' });
  sidebar.appendChild(body);
  renderSidebarBody();
}

function renderSidebarBody() {
  const body = $('#sidebar-body');
  if (!body) return;
  body.innerHTML = '';

  if (searchState.query) {
    const results = searchChapters(searchState.query);
    if (results.length === 0) {
      body.appendChild(el('div', { class: 'search-empty' }, 'Aucun chapitre ne correspond.'));
      return;
    }
    const resultsBox = el('div', { class: 'search-results' });
    for (const r of results.slice(0, 30)) {
      const btn = el('button', {
        class: 'search-result',
        onclick: () => {
          state.levelId = r.levelId;
          state.chapterId = `${r.levelId}-${r.idx}`;
          searchState.query = '';
          saveState();
          render();
          closeSidebarMobile();
        }
      });
      btn.appendChild(el('span', { class: 'result-level' }, `${r.levelName} · ${r.category}`));
      btn.appendChild(el('span', { html: highlightMatch(r.title, searchState.query) }));
      resultsBox.appendChild(btn);
    }
    body.appendChild(resultsBox);
    return;
  }

  // Vue par défaut : groupes / niveaux / chapitres.
  for (const group of CURRICULUM) {
    const groupDiv = el('div', { class: 'group' });
    groupDiv.appendChild(el('h4', {}, group.name));
    for (const level of group.levels) {
      const isActive = state.levelId === level.id;
      const stats = levelStats(level);
      const lvlBtn = el('button', {
        class: 'lvl-btn' + (isActive ? ' active' : ''),
        'aria-current': isActive && !state.chapterId ? 'page' : null,
        onclick: () => {
          state.levelId = level.id;
          state.chapterId = null;
          saveState();
          render();
          closeSidebarMobile();
        }
      });
      lvlBtn.appendChild(el('span', {}, level.name));
      lvlBtn.appendChild(el('span', { class: 'count' }, `${stats.filled}/${stats.total}`));
      groupDiv.appendChild(lvlBtn);
      if (isActive) {
        const chapsBox = el('div', { class: 'chapters' });
        let lastCat = null;
        for (let i = 0; i < level.chapters.length; i++) {
          const ch = level.chapters[i];
          if (ch.category !== lastCat) {
            chapsBox.appendChild(el('div', { class: 'chap-cat' }, ch.category));
            lastCat = ch.category;
          }
          const chId = `${level.id}-${i}`;
          const isChActive = state.chapterId === chId;
          chapsBox.appendChild(el('button', {
            class: 'chap-btn' + (isChActive ? ' active' : '') + (ch.content ? '' : ' placeholder'),
            'aria-current': isChActive ? 'page' : null,
            onclick: () => {
              state.chapterId = chId;
              saveState();
              render();
              closeSidebarMobile();
            }
          }, `${i + 1}. ${ch.title}`));
        }
        groupDiv.appendChild(chapsBox);
      }
    }
    body.appendChild(groupDiv);
  }
}

// Index des chapitres pré-calculé (titre + catégorie + niveau) pour la recherche.
const SEARCH_INDEX = (() => {
  const idx = [];
  for (const g of CURRICULUM) {
    for (const lvl of g.levels) {
      for (let i = 0; i < lvl.chapters.length; i++) {
        const ch = lvl.chapters[i];
        idx.push({
          levelId: lvl.id, levelName: lvl.name, idx: i,
          title: ch.title, category: ch.category,
          haystack: (ch.title + ' ' + ch.category + ' ' + lvl.name).toLowerCase(),
        });
      }
    }
  }
  return idx;
})();

function searchChapters(q) {
  const tokens = q.split(/\s+/).filter(Boolean);
  if (!tokens.length) return [];
  return SEARCH_INDEX.filter(item => tokens.every(t => item.haystack.includes(t)));
}

function highlightMatch(text, q) {
  const escape = s => s.replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  const tokens = q.split(/\s+/).filter(Boolean);
  if (!tokens.length) return escape(text);
  let result = escape(text);
  for (const t of tokens) {
    const re = new RegExp('(' + t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
    result = result.replace(re, '<mark>$1</mark>');
  }
  return result;
}

function renderBreadcrumb() {
  const bc = $('#breadcrumb');
  bc.innerHTML = '';
  if (!state.levelId) return;
  const level = findLevel(state.levelId);
  if (!level) return;
  bc.appendChild(el('span', { class: 'crumb' + (state.chapterId ? '' : ' current') }, level.name));
  if (state.chapterId) {
    const idx = parseChapterIdx(state.chapterId);
    const ch = level.chapters[idx];
    if (ch) {
      bc.appendChild(el('span', { class: 'sep' }, '›'));
      bc.appendChild(el('span', { class: 'crumb current' }, ch.title));
    }
  }
}

function parseChapterIdx(chapterId) {
  // chapterId = `${level.id}-${i}` ; on extrait l'index final.
  const m = chapterId.match(/-(\d+)$/);
  return m ? parseInt(m[1], 10) : -1;
}

function renderContent() {
  const main = $('#content');
  main.innerHTML = '';
  if (!state.levelId) {
    renderHome(main);
    return;
  }
  const level = findLevel(state.levelId);
  if (!level) { renderHome(main); return; }
  if (!state.chapterId) {
    renderLevelIndex(main, level);
    return;
  }
  const idx = parseChapterIdx(state.chapterId);
  const chapter = level.chapters[idx];
  if (!chapter) { renderLevelIndex(main, level); return; }
  renderChapter(main, level, chapter, idx);
}

function renderHome(main) {
  main.appendChild(el('div', { class: 'breadcrumb' }, 'Accueil'));
  main.appendChild(el('h1', {}, 'Cours de maths'));
  main.appendChild(el('p', {}, "Choisis un niveau pour commencer. Le programme couvre du collège (6e) au post-bac (analyse, algèbre, probas)."));
  for (const group of CURRICULUM) {
    main.appendChild(el('h2', {}, group.name));
    const grid = el('div', { class: 'levels-grid' });
    for (const level of group.levels) {
      const stats = levelStats(level);
      const card = el('button', {
        class: 'lvl-card',
        onclick: () => { state.levelId = level.id; state.chapterId = null; saveState(); render(); }
      });
      card.appendChild(el('div', { class: 'lvl-name' }, level.name));
      const info = el('div', { class: 'lvl-info' });
      if (stats.filled === stats.total) {
        info.appendChild(el('span', { class: 'filled' }, `✓ ${stats.total} chapitres rédigés`));
      } else if (stats.filled > 0) {
        info.appendChild(el('span', {}, `${stats.filled}/${stats.total} chapitres rédigés`));
      } else {
        info.appendChild(el('span', {}, `${stats.total} chapitres (à venir)`));
      }
      card.appendChild(info);
      grid.appendChild(card);
    }
    main.appendChild(grid);
  }
}

function renderLevelIndex(main, level) {
  const stats = levelStats(level);
  main.appendChild(el('div', { class: 'breadcrumb' }, level.name));
  main.appendChild(el('h1', {}, `Programme de ${level.name}`));
  const meta = el('div', { class: 'meta' });
  meta.appendChild(el('span', { class: 'pill' }, `${stats.total} chapitres`));
  if (stats.filled === stats.total) {
    meta.appendChild(el('span', { class: 'pill', style: 'background:var(--success-soft);color:var(--success-text)' }, `✓ Tous rédigés`));
  } else if (stats.filled > 0) {
    meta.appendChild(el('span', { class: 'pill' }, `${stats.filled} rédigés`));
    meta.appendChild(el('span', { class: 'pill placeholder' }, `${stats.total - stats.filled} à venir`));
  } else {
    meta.appendChild(el('span', { class: 'pill placeholder' }, `Contenu à venir`));
  }
  main.appendChild(meta);
  // Description courte
  if (stats.filled === 0) {
    main.appendChild(el('p', {}, "Les chapitres de ce niveau sont structurés (titres + catégories visibles dans la barre latérale) mais leur contenu sera ajouté lors d'une prochaine session de rédaction."));
  } else if (stats.filled < stats.total) {
    main.appendChild(el('p', {}, "Les chapitres déjà rédigés sont en bleu, les autres en gris (placeholders à venir)."));
  } else {
    main.appendChild(el('p', {}, "Tous les chapitres du programme sont disponibles. Choisis-en un pour commencer."));
  }
  // Liste groupée par catégorie
  const byCat = {};
  for (let i = 0; i < level.chapters.length; i++) {
    const c = level.chapters[i];
    if (!byCat[c.category]) byCat[c.category] = [];
    byCat[c.category].push({ ...c, idx: i });
  }
  for (const cat of Object.keys(byCat)) {
    const section = el('div', { class: 'cat-section' });
    section.appendChild(el('h2', {}, cat));
    const list = el('div', { class: 'chap-list' });
    for (const c of byCat[cat]) {
      const item = el('button', {
        class: 'chap-item' + (c.content ? '' : ' placeholder'),
        onclick: () => {
          state.chapterId = `${level.id}-${c.idx}`;
          saveState();
          render();
        }
      });
      item.appendChild(el('div', { class: 'num' }, String(c.idx + 1)));
      item.appendChild(el('span', {}, c.title));
      if (!c.content) item.appendChild(el('span', { class: 'badge-todo' }, 'À venir'));
      list.appendChild(item);
    }
    section.appendChild(list);
    main.appendChild(section);
  }
}

function renderChapter(main, level, chapter, idx) {
  main.appendChild(el('div', { class: 'breadcrumb' }, `${level.name} · ${chapter.category}`));
  main.appendChild(el('h1', {}, chapter.title));
  const meta = el('div', { class: 'meta' });
  meta.appendChild(el('span', { class: 'pill' }, `Chapitre ${idx + 1}`));
  meta.appendChild(el('span', { class: 'pill' }, chapter.category));
  main.appendChild(meta);
  if (!chapter.content) {
    const empty = el('div', { class: 'empty-state' });
    empty.appendChild(el('div', { class: 'big' }, '📝'));
    empty.appendChild(el('p', { html: `Ce chapitre n'est <strong>pas encore rédigé</strong>.` }));
    empty.appendChild(el('p', {}, "Il sera ajouté lors d'une prochaine session — niveau par niveau, en commençant par les fondamentaux."));
    const backWrap = el('p', { style: 'margin-top:20px' });
    // Bouton « Retour » via addEventListener, pas via onclick="" inline.
    // En ES6, les let/const top-level du script tag ne sont PAS exposés
    // sur window, donc un handler inline plantait avec « state is not
    // defined ».
    backWrap.appendChild(el('button', {
      class: 'nav-btn next',
      onclick: () => { state.chapterId = null; saveState(); render(); }
    }, 'Retour au sommaire'));
    empty.appendChild(backWrap);
    main.appendChild(empty);
    return;
  }
  const body = el('div');
  body.innerHTML = chapter.content;
  main.appendChild(body);

  // Bouton « S'entraîner » si des exercices sont disponibles pour ce chapitre.
  if (hasExercises(level.id, idx)) {
    const ctaWrap = el('p', { style: 'text-align:center' });
    ctaWrap.appendChild(el('button', {
      class: 'ex-cta',
      onclick: () => openExercise(level.id, idx),
    }, '💪 S\'entraîner sur ce chapitre'));
    main.appendChild(ctaWrap);

    // Bouton « DS noté » : seulement si ≥ DS_MIN_TEMPLATES templates dispo.
    if (hasDS(level.id, idx)) {
      const dsWrap = el('p', { style: 'text-align:center; margin-top:0' });
      dsWrap.appendChild(el('button', {
        class: 'ds-cta',
        onclick: () => openDS(level.id, idx),
      }, `📝 Faire un DS noté (${DS_QUESTION_COUNT} questions)`));
      main.appendChild(dsWrap);
      const score = dsScores[exKey(level.id, idx)];
      if (score) {
        main.appendChild(el('p', { class: 'ds-score-info', style: 'text-align:center' },
          `Meilleure note : ${score.best}/20 · Dernière : ${score.last}/20 · ${score.count} DS fait${score.count > 1 ? 's' : ''}`));
      }
    }
  }

  // Navigation chapitre suivant / précédent
  const nav = el('div', { class: 'chap-nav' });
  if (idx > 0) {
    const prev = level.chapters[idx - 1];
    const b = el('button', {
      class: 'nav-btn',
      onclick: () => { state.chapterId = `${level.id}-${idx - 1}`; saveState(); render(); }
    });
    b.appendChild(el('span', { class: 'small' }, '← Précédent'));
    b.appendChild(el('span', {}, prev.title));
    nav.appendChild(b);
  } else {
    nav.appendChild(el('div', {}));
  }
  if (idx < level.chapters.length - 1) {
    const next = level.chapters[idx + 1];
    const b = el('button', {
      class: 'nav-btn next',
      onclick: () => { state.chapterId = `${level.id}-${idx + 1}`; saveState(); render(); }
    });
    b.appendChild(el('span', { class: 'small' }, 'Suivant →'));
    b.appendChild(el('span', {}, next.title));
    nav.appendChild(b);
  }
  main.appendChild(nav);
}

function render() {
  renderSidebar();
  renderBreadcrumb();
  renderContent();
  window.scrollTo({ top: 0 });
}

// ─── Mobile menu ────────────────────────────────────────────────
function openSidebarMobile() {
  $('#sidebar').classList.add('open');
  $('#backdrop').classList.add('show');
  const btn = $('#menu-btn');
  if (btn) btn.setAttribute('aria-expanded', 'true');
}
function closeSidebarMobile() {
  $('#sidebar').classList.remove('open');
  $('#backdrop').classList.remove('show');
  const btn = $('#menu-btn');
  if (btn) btn.setAttribute('aria-expanded', 'false');
}

// ─── Boot ───────────────────────────────────────────────────────
function boot() {
  loadState();
  loadDsScores();
  render();
  $('#menu-btn').addEventListener('click', openSidebarMobile);
  $('#backdrop').addEventListener('click', closeSidebarMobile);
  $('#ex-backdrop').addEventListener('click', (e) => {
    if (e.target.id !== 'ex-backdrop') return;
    // Si un DS est en cours, on demande confirmation avant de fermer.
    if (dsState.current) {
      if (dsState.status === 'finished') closeDS();
      else if (confirm('Abandonner le DS ? Ta progression ne sera pas notée.')) closeDS();
      return;
    }
    closeExercise();
  });
  $('#home-btn').addEventListener('click', () => {
    state.levelId = null;
    state.chapterId = null;
    saveState();
    render();
  });

  // Synchronisation back/forward du navigateur via le hash.
  window.addEventListener('hashchange', () => {
    if (suppressHashChange) { suppressHashChange = false; return; }
    loadState();
    render();
  });

  // Raccourci global Cmd+K / Ctrl+K → focus la recherche.
  document.addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
      e.preventDefault();
      const input = $('#search-input');
      if (input) {
        // Sur mobile, on ouvre d'abord le drawer.
        if (window.innerWidth < 900) openSidebarMobile();
        input.focus();
        input.select();
      }
    }
    // Échap ferme le drawer mobile ou le modal d'exercice / DS.
    if (e.key === 'Escape') {
      if ($('#ex-backdrop').classList.contains('show')) {
        if (dsState.current) {
          if (dsState.status === 'finished') closeDS();
          else if (confirm('Abandonner le DS ? Ta progression ne sera pas notée.')) closeDS();
        } else {
          closeExercise();
        }
        return;
      }
      if ($('#sidebar').classList.contains('open')) closeSidebarMobile();
    }
  });
}

boot();
</script>
</body>
</html>
