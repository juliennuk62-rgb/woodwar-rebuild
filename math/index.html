          <li><code>1/3 = 0,333…</code> : appartient à <strong>ℚ</strong> mais pas à 𝔻 (décimales infinies périodiques).</li>
          <li><code>π</code> : appartient à <strong>ℝ</strong> seulement (irrationnel).</li>
        </ul>`)}
      `,
    },

    {
      title: "Calcul numérique et algébrique",
      category: "Nombres et calculs",
      content: `
        <h2>1. Rappels sur les fractions</h2>
        ${lc.formula("a/b + c/d = (ad + bc) / (bd) &nbsp;&nbsp; a/b × c/d = (ac)/(bd) &nbsp;&nbsp; a/b ÷ c/d = (ad)/(bc)")}
        ${lc.tip("Toujours simplifier", `<p>À la fin d'un calcul, on rend la fraction <strong>irréductible</strong> en divisant par le PGCD.</p>`)}

        <h2>2. Puissances</h2>
        ${lc.prop("Règles à maîtriser", `<ul>
          <li><code>a<sup>m</sup> × a<sup>n</sup> = a<sup>m+n</sup></code></li>
          <li><code>a<sup>m</sup> / a<sup>n</sup> = a<sup>m−n</sup></code></li>
          <li><code>(a<sup>m</sup>)<sup>n</sup> = a<sup>mn</sup></code></li>
          <li><code>(ab)<sup>n</sup> = a<sup>n</sup> × b<sup>n</sup></code></li>
          <li><code>a<sup>0</sup> = 1</code> (pour <code>a ≠ 0</code>) ; <code>a<sup>−n</sup> = 1/a<sup>n</sup></code></li>
        </ul>`)}

        <h2>3. Racines carrées</h2>
        ${lc.formula("√(ab) = √a × √b &nbsp;&nbsp; √(a/b) = √a / √b &nbsp;&nbsp; (a, b ≥ 0)")}
        ${lc.warn("Pas la somme", `<p><code>√(a + b) ≠ √a + √b</code>. Toujours.</p>`)}
        ${lc.example("Simplifier 3√12 + √48 − √27", `<ol><li>Simplifier chaque racine : <code>√12 = 2√3</code>, <code>√48 = 4√3</code>, <code>√27 = 3√3</code>.</li>
          <li>Substituer : <code>3 × 2√3 + 4√3 − 3√3 = 6√3 + 4√3 − 3√3</code>.</li>
          <li>Combiner : <code>= 7√3</code>.</li></ol>`)}

        <h2>4. Identités remarquables</h2>
        ${lc.formula("(a + b)² = a² + 2ab + b²<br>(a − b)² = a² − 2ab + b²<br>(a + b)(a − b) = a² − b²")}
        ${lc.example("Développer (3x − 2)²", `<p><code>(3x − 2)² = (3x)² − 2 × 3x × 2 + 2² = 9x² − 12x + 4</code>.</p>`)}
        ${lc.example("Factoriser 25x² − 16", `<p>Différence de carrés : <code>25x² = (5x)²</code> et <code>16 = 4²</code>. Donc <code>25x² − 16 = (5x − 4)(5x + 4)</code>.</p>`)}

        <h2>5. Notation scientifique</h2>
        ${lc.def("Notation scientifique", `<p>Tout nombre non nul s'écrit sous la forme <code>a × 10ⁿ</code> avec <code>1 ≤ |a| < 10</code> et <code>n ∈ ℤ</code>.</p>`)}
        ${lc.example("Convertir", `<ul>
          <li><code>0,000 47 = 4,7 × 10⁻⁴</code></li>
          <li><code>−325 000 = −3,25 × 10⁵</code></li>
        </ul>`)}

        <h2>6. Coefficient multiplicateur (rappel)</h2>
        ${lc.prop("Augmentation / réduction de p%", `<p>Augmenter de <code>p%</code> = multiplier par <code>1 + p/100</code>.</p>
          <p>Réduire de <code>p%</code> = multiplier par <code>1 − p/100</code>.</p>
          <p>Le <strong>coefficient multiplicateur global</strong> de plusieurs évolutions successives est le <em>produit</em> des coefficients (et non leur somme).</p>`)}
        ${lc.example("Évolutions successives", `<p>Une valeur subit +20 % puis −10 %. Coefficient global : <code>1,2 × 0,9 = 1,08</code>. C'est donc une augmentation globale de <code>8 %</code>.</p>`)}

        <h2>7. Équation-produit nul</h2>
        ${lc.prop("Règle clé", `<p>Un produit de facteurs est nul si et seulement si l'un au moins de ses facteurs est nul.</p>`)}
        ${lc.formula("A × B = 0 &nbsp;⇔&nbsp; A = 0 &nbsp;ou&nbsp; B = 0")}
        ${lc.example("Résoudre (x − 3)(2x + 5) = 0", `<ol>
          <li>Le produit est nul si <code>x − 3 = 0</code> ou <code>2x + 5 = 0</code>.</li>
          <li>Première : <code>x = 3</code>. Deuxième : <code>x = −5/2</code>.</li>
          <li>Solutions : <code>S = {−5/2, 3}</code>.</li>
        </ol>`)}
        ${lc.example("Résoudre x² − 25 = 0", `<ol>
          <li>Factoriser (identité remarquable) : <code>(x − 5)(x + 5) = 0</code>.</li>
          <li>Solutions : <code>x = 5</code> ou <code>x = −5</code>.</li>
        </ol>`)}
        ${lc.warn("Comparaison à zéro indispensable", `<p>La règle <em>A × B = 0</em> nécessite d'avoir <strong>0</strong> à droite. <code>(x − 1)(x + 2) = 6</code> ne se résout pas en disant « <code>x − 1 = 6</code> ou <code>x + 2 = 6</code> ». Il faut d'abord ramener à 0.</p>`)}

        <h2>8. Tableau de signes d'un facteur ax + b</h2>
        ${lc.prop("Signe de ax + b", `<ul>
          <li>Si <code>a > 0</code> : <code>ax + b</code> est négatif sur <code>]−∞ ; −b/a[</code>, nul en <code>−b/a</code>, positif sur <code>]−b/a ; +∞[</code>.</li>
          <li>Si <code>a < 0</code> : c'est l'inverse (positif puis nul puis négatif).</li>
        </ul>`)}
        ${lc.example("Étudier le signe de 2x − 6", `<p>Racine : <code>2x − 6 = 0 → x = 3</code>. <code>a = 2 > 0</code>. Donc négatif sur <code>]−∞ ; 3[</code>, positif sur <code>]3 ; +∞[</code>.</p>`)}
      `,
    },

    {
      title: "Inéquations et intervalles",
      category: "Nombres et calculs",
      content: `
        <h2>1. Notation des intervalles</h2>
        ${lc.def("Intervalles", `<p>Un <strong>intervalle</strong> de ℝ est un ensemble de réels « consécutifs ».</p>`)}
        ${lc.prop("Notation", `<table>
          <tr><th>Notation</th><th>Inégalité</th><th>Représentation</th></tr>
          <tr><td>[a ; b]</td><td>a ≤ x ≤ b</td><td>fermé des deux côtés</td></tr>
          <tr><td>]a ; b[</td><td>a < x < b</td><td>ouvert des deux côtés</td></tr>
          <tr><td>[a ; b[</td><td>a ≤ x < b</td><td>fermé en a, ouvert en b</td></tr>
          <tr><td>[a ; +∞[</td><td>x ≥ a</td><td>de a à l'infini, fermé en a</td></tr>
          <tr><td>]−∞ ; b]</td><td>x ≤ b</td><td>de l'infini à b, fermé en b</td></tr>
          <tr><td>]−∞ ; +∞[</td><td>tout x</td><td>= ℝ</td></tr>
        </table>`)}
        ${lc.warn("Crochets ouverts vers l'infini", `<p>Le crochet est <strong>toujours ouvert</strong> vers <code>+∞</code> ou <code>−∞</code> : ce ne sont pas des nombres mais des limites.</p>`)}

        <h2>2. Réunion et intersection</h2>
        ${lc.def("Réunion ∪", `<p><code>A ∪ B</code> = ensemble des nombres qui sont dans <code>A</code> <strong>ou</strong> dans <code>B</code> (ou les deux).</p>`)}
        ${lc.def("Intersection ∩", `<p><code>A ∩ B</code> = ensemble des nombres qui sont à la fois dans <code>A</code> <strong>et</strong> dans <code>B</code>.</p>`)}
        ${lc.example("Avec deux intervalles", `<p><code>[2 ; 5] ∩ [3 ; 7] = [3 ; 5]</code> (la partie commune).</p>
          <p><code>[2 ; 5] ∪ [3 ; 7] = [2 ; 7]</code> (l'union).</p>
          <p><code>[2 ; 5] ∩ [6 ; 9] = ∅</code> (vide, pas d'intersection).</p>`)}

        <h2>3. Résoudre une inéquation</h2>
        ${lc.prop("Règles", `<p>Sans changer les solutions, on peut :</p>
          <ul><li>ajouter / soustraire un même nombre des deux côtés ;</li>
          <li>multiplier / diviser par un nombre <strong>strictement positif</strong> ;</li>
          <li>multiplier / diviser par un nombre <strong>strictement négatif</strong> en <strong>changeant le sens</strong> de l'inégalité.</li></ul>`)}
        ${lc.example("Résoudre 3x − 5 ≤ 7 − x", `<ol><li>Ajouter <code>x</code> : <code>4x − 5 ≤ 7</code>.</li>
          <li>Ajouter 5 : <code>4x ≤ 12</code>.</li>
          <li>Diviser par 4 : <code>x ≤ 3</code>.</li>
          <li>Solutions : <code>S = ]−∞ ; 3]</code>.</li></ol>`)}
        ${lc.example("Résoudre −2x + 1 > 7", `<ol><li>Soustraire 1 : <code>−2x > 6</code>.</li>
          <li>Diviser par <code>−2</code> (inverser) : <code>x < −3</code>.</li>
          <li>Solutions : <code>S = ]−∞ ; −3[</code>.</li></ol>`)}

        <h2>4. Système d'inéquations</h2>
        ${lc.example("Résoudre simultanément 2x − 1 ≥ 3 et 3x + 4 < 10", `<ol><li>Première : <code>2x ≥ 4</code>, donc <code>x ≥ 2</code>, soit <code>S₁ = [2 ; +∞[</code>.</li>
          <li>Deuxième : <code>3x < 6</code>, donc <code>x < 2</code>, soit <code>S₂ = ]−∞ ; 2[</code>.</li>
          <li>Solutions : <code>S = S₁ ∩ S₂ = ∅</code>. Aucune solution !</li></ol>`)}

        <h2>5. Tableau de signes (introduction)</h2>
        ${lc.prop("Pour étudier le signe d'un produit ou d'un quotient", `<p>On dresse un tableau dont les colonnes sont les valeurs où chaque facteur s'annule. Pour chaque ligne (facteur), on note le signe.</p>`)}
        ${lc.example("Signe de (x − 1)(x + 2)", `<p>Les facteurs s'annulent en <code>1</code> et <code>−2</code>. On découpe ℝ en trois intervalles et on étudie le signe de chaque facteur sur chacun :</p>
          <table>
            <tr><th>Intervalle</th><th>]−∞ ; −2[</th><th>]−2 ; 1[</th><th>]1 ; +∞[</th></tr>
            <tr><td>x − 1</td><td>−</td><td>−</td><td>+</td></tr>
            <tr><td>x + 2</td><td>−</td><td>+</td><td>+</td></tr>
            <tr><td>(x − 1)(x + 2)</td><td>+</td><td>−</td><td>+</td></tr>
          </table>
          <p>Donc <code>(x − 1)(x + 2) ≥ 0</code> sur <code>]−∞ ; −2] ∪ [1 ; +∞[</code> (en ajoutant les bornes où le produit s'annule).</p>`)}
      `,
    },

    {
      title: "Fonctions : généralités",
      category: "Fonctions",
      content: `
        <h2>1. Définition d'une fonction</h2>
        ${lc.def("Fonction", `<p>Définir une fonction <code>f</code> sur un ensemble <code>D</code>, c'est associer à chaque élément <code>x</code> de <code>D</code> un unique nombre, noté <code>f(x)</code>.</p>
          <p><code>D</code> est l'<strong>ensemble de définition</strong>, <code>x</code> est la <strong>variable</strong>, et <code>f(x)</code> est l'<strong>image</strong> de <code>x</code>.</p>`)}
        ${lc.formula("f : D → ℝ ;  x → f(x)")}

        <h2>2. Image et antécédent</h2>
        ${lc.def("Image et antécédent", `<ul>
          <li>L'<strong>image</strong> de <code>x</code> par <code>f</code> est <code>f(x)</code>. Un nombre a une <em>seule</em> image.</li>
          <li>Un <strong>antécédent</strong> de <code>y</code> est un nombre <code>x</code> tel que <code>f(x) = y</code>. Un nombre peut avoir 0, 1 ou plusieurs antécédents.</li>
        </ul>`)}
        ${lc.example("Avec f(x) = x²", `<ul>
          <li>L'image de 3 est <code>f(3) = 9</code>.</li>
          <li>Les antécédents de 9 sont <code>3</code> et <code>−3</code> (deux antécédents).</li>
          <li>L'antécédent de <code>−4</code> n'existe pas (un carré n'est jamais négatif).</li>
        </ul>`)}

        <h2>3. Ensemble de définition</h2>
        ${lc.prop("Trouver D", `<p>L'ensemble de définition est l'ensemble des <code>x</code> pour lesquels <code>f(x)</code> a un sens.</p>
          <ul><li>Une <strong>fraction</strong> est définie quand le dénominateur n'est pas nul.</li>
          <li>Une <strong>racine carrée</strong> est définie quand son contenu est positif (ou nul).</li></ul>`)}
        ${lc.example("Ensemble de définition", `<ul>
          <li><code>f(x) = 1/(x − 2)</code> : il faut <code>x ≠ 2</code>. Donc <code>D = ]−∞ ; 2[ ∪ ]2 ; +∞[</code>.</li>
          <li><code>g(x) = √(x − 5)</code> : il faut <code>x − 5 ≥ 0</code>, soit <code>x ≥ 5</code>. Donc <code>D = [5 ; +∞[</code>.</li>
        </ul>`)}

        <h2>4. Représentation graphique</h2>
        ${lc.def("Courbe représentative", `<p>La <strong>courbe représentative</strong> de <code>f</code> est l'ensemble des points de coordonnées <code>(x, f(x))</code> dans un repère.</p>`)}
        ${lc.tip("Lecture graphique", `<ul>
          <li><strong>Image de a</strong> : on lit l'ordonnée du point d'abscisse <code>a</code> sur la courbe.</li>
          <li><strong>Antécédents de b</strong> : on cherche les abscisses des points dont l'ordonnée vaut <code>b</code> (intersection avec la droite <code>y = b</code>).</li>
        </ul>`)}

        <h2>5. Variations</h2>
        ${lc.def("Croissance / décroissance", `<p>Sur un intervalle <code>I</code>, <code>f</code> est :</p>
          <ul><li><strong>croissante</strong> si quand <code>x</code> augmente, <code>f(x)</code> augmente aussi : <code>x₁ < x₂ ⇒ f(x₁) ≤ f(x₂)</code>.</li>
          <li><strong>décroissante</strong> si quand <code>x</code> augmente, <code>f(x)</code> diminue : <code>x₁ < x₂ ⇒ f(x₁) ≥ f(x₂)</code>.</li>
          <li><strong>constante</strong> si <code>f(x)</code> ne change pas.</li></ul>`)}

        <h2>6. Tableau de variations</h2>
        ${lc.prop("Forme du tableau", `<p>Un tableau de variations résume les variations de <code>f</code> sur son ensemble de définition. Il indique les valeurs aux bornes et aux extrémums.</p>`)}
        ${lc.example("Pour f(x) = x² sur ℝ", `<table>
          <tr><th>x</th><th>−∞</th><th>0</th><th>+∞</th></tr>
          <tr><td>f(x)</td><td>+∞</td><td>0</td><td>+∞</td></tr>
        </table>
          <p>(Décroissante sur <code>]−∞ ; 0]</code>, croissante sur <code>[0 ; +∞[</code>, minimum en 0.)</p>`)}

        <h2>7. Maximum, minimum</h2>
        ${lc.def("Extrémums", `<ul>
          <li><strong>Maximum</strong> de <code>f</code> sur <code>I</code> : la plus grande valeur de <code>f(x)</code> sur <code>I</code>.</li>
          <li><strong>Minimum</strong> : la plus petite.</li>
        </ul>`)}
      `,
    },

    {
      title: "Fonction affine, équations de droites",
      category: "Fonctions",
      content: `
        <h2>1. Fonction affine</h2>
        ${lc.def("Fonction affine", `<p>Une <strong>fonction affine</strong> est définie sur ℝ par <code>f(x) = ax + b</code>, où <code>a</code> et <code>b</code> sont des réels fixés.</p>
          <ul><li><code>a</code> est le <strong>coefficient directeur</strong> (ou pente).</li>
          <li><code>b</code> est l'<strong>ordonnée à l'origine</strong> (la valeur de <code>f(0) = b</code>).</li></ul>`)}
        ${lc.tip("Cas particuliers", `<ul>
          <li><code>b = 0</code> : fonction <strong>linéaire</strong> <code>f(x) = ax</code>.</li>
          <li><code>a = 0</code> : fonction <strong>constante</strong> <code>f(x) = b</code>.</li>
        </ul>`)}

        <h2>2. Représentation graphique</h2>
        ${lc.prop("Une droite", `<p>La courbe représentative est une <strong>droite</strong> non verticale, qui coupe l'axe des ordonnées en <code>(0, b)</code>.</p>
          <ul><li><code>a > 0</code> : la droite est strictement croissante.</li>
          <li><code>a < 0</code> : strictement décroissante.</li>
          <li><code>a = 0</code> : horizontale.</li></ul>`)}

        <h2>3. Calculer le coefficient directeur</h2>
        ${lc.formula("a = (y_B − y_A) / (x_B − x_A) &nbsp;&nbsp; (x_A ≠ x_B)")}
        ${lc.example("Pente d'une droite", `<p>La droite passe par <code>A(2, 5)</code> et <code>B(6, 13)</code>.</p>
          <p><code>a = (13 − 5) / (6 − 2) = 8 / 4 = 2</code>.</p>`)}

        <h2>4. Trouver une équation de droite</h2>
        ${lc.example("À partir de deux points", `<p>Droite passant par <code>A(2, 5)</code> et <code>B(6, 13)</code>.</p>
          <ol><li>Pente : <code>a = 2</code> (ci-dessus).</li>
          <li>Avec <code>A</code> : <code>5 = 2 × 2 + b</code> → <code>b = 1</code>.</li>
          <li>Équation : <code>y = 2x + 1</code>.</li>
          <li>Vérification avec <code>B</code> : <code>2 × 6 + 1 = 13</code> ✓.</li></ol>`)}

        <h2>5. Cas particuliers : droites verticales et horizontales</h2>
        ${lc.prop("Droites particulières", `<ul>
          <li>Une droite <strong>horizontale</strong> a une équation de la forme <code>y = c</code> (avec <code>c</code> constant).</li>
          <li>Une droite <strong>verticale</strong> a une équation de la forme <code>x = c</code>. Ce n'est <em>pas</em> une fonction (un même x donnerait plusieurs y).</li>
        </ul>`)}

        <h2>6. Position relative de deux droites</h2>
        ${lc.prop("Parallélisme et sécance", `<ul>
          <li>Deux droites <code>y = ax + b</code> et <code>y = a'x + b'</code> sont <strong>parallèles</strong> si elles ont le même coefficient directeur (<code>a = a'</code>).</li>
          <li>Si <code>a = a'</code> et <code>b = b'</code> : elles sont <strong>confondues</strong>.</li>
          <li>Si <code>a ≠ a'</code> : elles sont <strong>sécantes</strong> en un point unique.</li>
        </ul>`)}
        ${lc.example("Trouver le point d'intersection", `<p>Droites <code>y = 2x + 1</code> et <code>y = −x + 7</code>.</p>
          <ol><li>Résoudre <code>2x + 1 = −x + 7</code> → <code>3x = 6</code> → <code>x = 2</code>.</li>
          <li>Donc <code>y = 2 × 2 + 1 = 5</code>.</li>
          <li>Point d'intersection : <strong>(2, 5)</strong>.</li></ol>`)}

        <h2>7. Équation cartésienne d'une droite</h2>
        ${lc.def("Forme cartésienne", `<p>Toute droite du plan admet une équation de la forme :</p>`)}
        ${lc.formula("ax + by + c = 0 &nbsp;&nbsp; (avec (a, b) ≠ (0, 0))")}
        <p>Cette forme englobe <em>toutes</em> les droites, y compris les <strong>droites verticales</strong> (cas <code>b = 0</code>, donnant <code>x = −c/a</code>) qu'on ne peut pas écrire <code>y = mx + p</code>.</p>
        ${lc.example("De y = 2x + 3 à la forme cartésienne", `<p><code>y = 2x + 3</code> ⇔ <code>2x − y + 3 = 0</code>. Donc <code>a = 2, b = −1, c = 3</code>.</p>`)}

        <h2>8. Vecteur directeur d'une droite</h2>
        ${lc.def("Vecteur directeur", `<p>Un <strong>vecteur directeur</strong> d'une droite est un vecteur non nul dont la direction est celle de la droite.</p>`)}
        ${lc.prop("À partir de l'équation cartésienne", `<p>Si l'équation est <code>ax + by + c = 0</code>, alors <code>u→(−b ; a)</code> est un vecteur directeur.</p>`)}
        ${lc.example("Vecteur directeur", `<p>Pour <code>2x − y + 3 = 0</code> (avec <code>a = 2, b = −1</code>) : un vecteur directeur est <code>u→(1 ; 2)</code>.</p>
          <p>Vérification graphique : la pente vaut <code>2/1 = 2</code>, ce qui correspond bien à la forme <code>y = 2x + 3</code> ✓.</p>`)}
        ${lc.tip("Lien avec colinéarité", `<p>Deux droites sont parallèles si et seulement si leurs vecteurs directeurs sont colinéaires.</p>`)}
      `,
    },

    {
      title: "Fonction carré, racine carrée, cube",
      category: "Fonctions",
      content: `
        <h2>1. Fonction carré</h2>
        ${lc.def("Fonction carré", `<p>La fonction <code>f(x) = x²</code> est définie sur ℝ.</p>`)}
        ${lc.prop("Variations", `<ul>
          <li>Décroissante sur <code>]−∞ ; 0]</code>.</li>
          <li>Croissante sur <code>[0 ; +∞[</code>.</li>
          <li>Minimum en 0 : <code>f(0) = 0</code>.</li>
        </ul>`)}
        ${lc.tip("Représentation : la parabole", `<p>La courbe est une <strong>parabole</strong> tournée vers le haut, symétrique par rapport à l'axe des ordonnées (la fonction est <strong>paire</strong> : <code>f(−x) = f(x)</code>).</p>`)}

        <h2>2. Équation x² = a</h2>
        ${lc.prop("Solutions", `<ul>
          <li>Si <code>a < 0</code> : <strong>aucune solution</strong>.</li>
          <li>Si <code>a = 0</code> : une solution, <code>x = 0</code>.</li>
          <li>Si <code>a > 0</code> : <strong>deux solutions</strong>, <code>x = √a</code> et <code>x = −√a</code>.</li>
        </ul>`)}

        <h2>3. Fonction cube</h2>
        ${lc.def("Fonction cube", `<p>La fonction <code>f(x) = x³</code> est définie sur ℝ.</p>`)}
        ${lc.prop("Variations", `<p>Strictement <strong>croissante</strong> sur ℝ (sans pause au passage par 0).</p>
          <p>Cette fonction est <strong>impaire</strong> : <code>f(−x) = −f(x)</code>. La courbe est symétrique par rapport à l'origine.</p>`)}

        <h2>4. Équation x³ = a</h2>
        ${lc.prop("Solution unique", `<p>Pour tout réel <code>a</code>, l'équation <code>x³ = a</code> a <strong>une seule solution</strong> dans ℝ : la racine cubique <code>∛a</code>.</p>`)}

        <h2>5. Fonction racine carrée</h2>
        ${lc.def("Racine carrée", `<p>La fonction <code>f(x) = √x</code> est définie sur <code>[0 ; +∞[</code>.</p>`)}
        ${lc.prop("Variations", `<ul>
          <li>Strictement <strong>croissante</strong> sur <code>[0 ; +∞[</code>.</li>
          <li>Mais sa croissance ralentit : la pente diminue à mesure que <code>x</code> augmente.</li>
          <li>Valeurs : <code>√0 = 0</code>, <code>√1 = 1</code>, <code>√4 = 2</code>, <code>√9 = 3</code>, <code>√16 = 4</code>...</li>
        </ul>`)}

        <h2>6. Comparaisons utiles</h2>
        ${lc.prop("Sur l'intervalle [0, 1]", `<p>Pour <code>0 ≤ x ≤ 1</code>, on a : <code>x² ≤ x ≤ √x</code>.</p>`)}
        ${lc.prop("Sur [1, +∞[", `<p>Pour <code>x ≥ 1</code>, on a : <code>√x ≤ x ≤ x²</code>.</p>`)}
        ${lc.example("Vérifier", `<ul>
          <li>Pour <code>x = 0,25</code> : <code>x² = 0,0625</code>, <code>x = 0,25</code>, <code>√x = 0,5</code>. ✓ <code>x² < x < √x</code>.</li>
          <li>Pour <code>x = 4</code> : <code>√x = 2</code>, <code>x = 4</code>, <code>x² = 16</code>. ✓ <code>√x < x < x²</code>.</li>
        </ul>`)}
      `,
    },

    {
      title: "Fonction inverse",
      category: "Fonctions",
      content: `
        <h2>1. Définition</h2>
        ${lc.def("Fonction inverse", `<p>La fonction <code>f(x) = 1/x</code> est définie sur <code>ℝ*</code> (réels sauf 0).</p>
          <p>Son ensemble de définition est <code>]−∞ ; 0[ ∪ ]0 ; +∞[</code>.</p>`)}
        ${lc.warn("Pas définie en 0", `<p>On ne peut pas calculer <code>1/0</code>. La courbe a un « trou » en <code>x = 0</code>.</p>`)}

        <h2>2. Variations</h2>
        ${lc.prop("Variations", `<ul>
          <li>Strictement <strong>décroissante</strong> sur <code>]−∞ ; 0[</code>.</li>
          <li>Strictement <strong>décroissante</strong> sur <code>]0 ; +∞[</code>.</li>
        </ul>
          <p>⚠ Mais on ne peut <strong>pas</strong> dire qu'elle est décroissante sur tout <code>ℝ*</code> : il y a un saut autour de 0.</p>`)}
        ${lc.example("Vérifier", `<p><code>f(−1) = −1</code> et <code>f(1) = 1</code>. Bien que <code>−1 < 1</code>, on a <code>f(−1) < f(1)</code>. Donc la fonction n'est pas globalement décroissante sur <code>ℝ*</code>.</p>`)}

        <h2>3. Représentation graphique</h2>
        ${lc.prop("Une hyperbole", `<p>La courbe est une <strong>hyperbole</strong> à deux branches, symétrique par rapport à l'origine.</p>
          <p>La fonction est <strong>impaire</strong> : <code>f(−x) = −f(x)</code>.</p>`)}
        ${lc.tip("Asymptotes (intuition)", `<ul>
          <li>Quand <code>x → ±∞</code>, <code>1/x → 0</code> : la courbe se rapproche de l'axe des abscisses.</li>
          <li>Quand <code>x → 0⁺</code>, <code>1/x → +∞</code> ; quand <code>x → 0⁻</code>, <code>1/x → −∞</code>.</li>
        </ul>`)}

        <h2>4. Équation 1/x = a</h2>
        ${lc.prop("Solutions", `<ul>
          <li>Si <code>a = 0</code> : <strong>aucune solution</strong> (un inverse n'est jamais nul).</li>
          <li>Si <code>a ≠ 0</code> : une seule solution, <code>x = 1/a</code>.</li>
        </ul>`)}

        <h2>5. Comparaisons</h2>
        ${lc.prop("Sur ]0, +∞[", `<p>Sur <code>]0 ; +∞[</code>, la fonction inverse est décroissante. Donc <code>x₁ < x₂ ⇒ 1/x₁ > 1/x₂</code> : <strong>l'inégalité s'inverse</strong>.</p>`)}
        ${lc.example("Vérifier", `<p><code>2 < 5</code>, et <code>1/2 = 0,5 > 0,2 = 1/5</code>. ✓</p>`)}
        ${lc.warn("Avec des signes différents", `<p>Si <code>x₁ < 0 < x₂</code>, on ne peut <strong>pas</strong> en déduire l'ordre des inverses : <code>1/x₁ < 0 < 1/x₂</code> est correct, mais ne suit pas la règle de la décroissance.</p>`)}
      `,
    },

    {
      title: "Vecteurs : définition, somme, colinéarité",
      category: "Géométrie",
      content: `
        <h2>1. Définition</h2>
        ${lc.def("Vecteur", `<p>Un <strong>vecteur</strong> est défini par trois caractéristiques :</p>
          <ul><li>une <strong>direction</strong> (la droite qui le porte) ;</li>
          <li>un <strong>sens</strong> (orientation sur la droite) ;</li>
          <li>une <strong>longueur</strong> (ou « norme »).</li></ul>
          <p>Notation : <code>AB→</code> (vecteur de A vers B), ou avec une lettre : <code>u→</code>.</p>`)}

        <h2>2. Vecteurs égaux</h2>
        ${lc.def("Égalité de vecteurs", `<p>Deux vecteurs sont <strong>égaux</strong> s'ils ont même direction, même sens et même longueur.</p>
          <p>Caractérisation : <code>AB→ = CD→</code> si et seulement si <code>ABDC</code> est un <strong>parallélogramme</strong> (sommets dans cet ordre).</p>`)}

        <h2>3. Vecteur nul</h2>
        ${lc.def("Vecteur nul", `<p>Le <strong>vecteur nul</strong>, noté <code>0→</code>, a une longueur nulle. C'est <code>AA→</code> pour n'importe quel point <code>A</code>.</p>`)}

        <h2>4. Somme de vecteurs (relation de Chasles)</h2>
        ${lc.prop("Relation de Chasles", `<p>Pour tous points <code>A</code>, <code>B</code>, <code>C</code> :</p>`)}
        ${lc.formula("AB→ + BC→ = AC→")}
        ${lc.tip("Astuce mnémotechnique", `<p>Le <code>B</code> du milieu « disparaît ». On enchaîne deux trajets pour obtenir le trajet direct.</p>`)}

        <h2>5. Multiplication par un nombre (scalaire)</h2>
        ${lc.def("Produit d'un vecteur par un scalaire", `<p>Pour un réel <code>k</code> et un vecteur <code>u→</code> :</p>
          <ul><li>Si <code>k > 0</code> : <code>k × u→</code> a même sens que <code>u→</code> et est <code>k</code> fois plus long.</li>
          <li>Si <code>k < 0</code> : sens contraire et <code>|k|</code> fois plus long.</li>
          <li>Si <code>k = 0</code> : produit = <code>0→</code>.</li></ul>`)}

        <h2>6. Vecteurs colinéaires</h2>
        ${lc.def("Colinéarité", `<p>Deux vecteurs <code>u→</code> et <code>v→</code> sont <strong>colinéaires</strong> s'ils ont la même direction (peu importe le sens et la longueur).</p>
          <p>Caractérisation : <code>u→</code> et <code>v→</code> colinéaires ⇔ il existe un réel <code>k</code> tel que <code>v→ = k × u→</code> (ou si <code>u→ = 0→</code>).</p>`)}

        <h2>7. Applications géométriques</h2>
        ${lc.prop("Démonstrations classiques", `<ul>
          <li><strong>Alignement</strong> : les points <code>A</code>, <code>B</code>, <code>C</code> sont alignés ⇔ <code>AB→</code> et <code>AC→</code> sont colinéaires.</li>
          <li><strong>Parallélisme</strong> : <code>(AB) ∥ (CD)</code> ⇔ <code>AB→</code> et <code>CD→</code> sont colinéaires.</li>
          <li><strong>Milieu</strong> : <code>I</code> est le milieu de <code>[AB]</code> ⇔ <code>AI→ = IB→</code> ⇔ <code>AI→ = (1/2) × AB→</code>.</li>
        </ul>`)}
      `,
    },

    {
      title: "Géométrie repérée",
      category: "Géométrie",
      content: `
        <h2>1. Coordonnées d'un point</h2>
        ${lc.def("Repère orthonormé", `<p>On se place dans un <strong>repère orthonormé</strong> du plan, avec origine <code>O</code> et axes perpendiculaires <code>(Ox)</code> et <code>(Oy)</code>. Un point <code>A</code> est repéré par ses coordonnées <code>(x_A, y_A)</code> : abscisse et ordonnée.</p>`)}

        <h2>2. Coordonnées d'un vecteur</h2>
        ${lc.formula("Si A(x_A, y_A) et B(x_B, y_B), alors AB→(x_B − x_A ; y_B − y_A)")}
        ${lc.example("Calcul", `<p>Avec <code>A(1, 3)</code> et <code>B(5, 7)</code> :</p>
          <p><code>AB→ = (5 − 1 ; 7 − 3) = (4 ; 4)</code>.</p>`)}

        <h2>3. Norme d'un vecteur (longueur)</h2>
        ${lc.formula("Si u→(x ; y), alors ||u→|| = √(x² + y²)")}
        ${lc.example("Calcul", `<p>Pour <code>u→(3 ; 4)</code> : <code>||u→|| = √(9 + 16) = √25 = 5</code>.</p>`)}

        <h2>4. Distance entre deux points</h2>
        ${lc.formula("AB = √((x_B − x_A)² + (y_B − y_A)²)")}
        ${lc.example("Distance", `<p>Avec <code>A(1, 2)</code> et <code>B(4, 6)</code> :</p>
          <p><code>AB = √((4−1)² + (6−2)²) = √(9 + 16) = √25 = 5</code>.</p>`)}

        <h2>5. Coordonnées du milieu</h2>
        ${lc.formula("Milieu I de [AB] : I = ((x_A + x_B)/2 ; (y_A + y_B)/2)")}
        ${lc.example("Milieu", `<p>Avec <code>A(2, 4)</code> et <code>B(6, 10)</code> : milieu = <code>((2+6)/2 ; (4+10)/2) = (4 ; 7)</code>.</p>`)}

        <h2>6. Test de colinéarité (déterminant)</h2>
        ${lc.prop("Critère par le déterminant", `<p>Soit <code>u→(x ; y)</code> et <code>v→(x' ; y')</code> deux vecteurs. Ils sont <strong>colinéaires</strong> si et seulement si :</p>`)}
        ${lc.formula("x × y' − x' × y = 0")}
        ${lc.example("Tester la colinéarité", `<p><code>u→(2 ; 6)</code> et <code>v→(3 ; 9)</code>. Calcul : <code>2 × 9 − 3 × 6 = 18 − 18 = 0</code>. Colinéaires ✓.</p>
          <p><code>u→(2 ; 5)</code> et <code>v→(3 ; 7)</code>. Calcul : <code>2 × 7 − 3 × 5 = 14 − 15 = −1 ≠ 0</code>. Non colinéaires.</p>`)}

        <h2>7. Application : démontrer un parallélisme</h2>
        ${lc.example("Démonstration", `<p>Soit <code>A(1, 2)</code>, <code>B(4, 5)</code>, <code>C(2, 1)</code>, <code>D(8, 7)</code>. Démontrer que <code>(AB) ∥ (CD)</code>.</p>
          <ol><li><code>AB→ = (4−1 ; 5−2) = (3 ; 3)</code>.</li>
          <li><code>CD→ = (8−2 ; 7−1) = (6 ; 6)</code>.</li>
          <li>Déterminant : <code>3 × 6 − 6 × 3 = 18 − 18 = 0</code> → colinéaires.</li>
          <li>Donc <code>(AB) ∥ (CD)</code>.</li></ol>`)}

        <h2>8. Équation d'un cercle</h2>
        ${lc.prop("Cercle de centre Ω et de rayon r", `<p>Un point <code>M(x, y)</code> appartient au cercle de centre <code>Ω(a, b)</code> et de rayon <code>r</code> si et seulement si <code>ΩM = r</code>, soit <code>ΩM² = r²</code>. En utilisant la formule de distance :</p>`)}
        ${lc.formula("(x − a)² + (y − b)² = r²")}
        ${lc.example("Cercle de centre (3, −1) et de rayon 5", `<p>Équation : <code>(x − 3)² + (y + 1)² = 25</code>.</p>`)}
        ${lc.example("Tester si un point est sur le cercle", `<p>Le point <code>M(6, 3)</code> est-il sur ce cercle ?</p>
          <p><code>(6 − 3)² + (3 + 1)² = 9 + 16 = 25</code> ✓ → oui, M est sur le cercle.</p>`)}
        ${lc.tip("Cas particulier : cercle centré en O", `<p>Si le centre est l'origine, l'équation devient simplement <code>x² + y² = r²</code>.</p>`)}
      `,
    },

    {
      title: "Statistiques : moyenne, médiane, écart-type",
      category: "Statistiques",
      content: `
        <h2>1. Moyenne et médiane (rappels)</h2>
        ${lc.formula("Moyenne x̄ = (somme des valeurs) / (effectif total)")}
        ${lc.def("Médiane", `<p>La <strong>médiane</strong> partage la série en deux moitiés de même effectif. Elle est plus robuste aux valeurs extrêmes que la moyenne.</p>`)}

        <h2>2. Quartiles</h2>
        ${lc.def("Premier et troisième quartile", `<ul>
          <li><code>Q₁</code> (1er quartile) : 25 % des valeurs sont ≤ Q₁.</li>
          <li><code>Q₃</code> (3e quartile) : 75 % des valeurs sont ≤ Q₃.</li>
          <li>La médiane est le 2e quartile <code>Q₂</code>.</li>
        </ul>`)}
        ${lc.def("Écart interquartile", `<p>L'<strong>écart interquartile</strong> est <code>Q₃ − Q₁</code>. Il mesure la dispersion de la moitié centrale de la série, en éliminant les valeurs extrêmes.</p>`)}

        <h2>3. Étendue (rappel)</h2>
        ${lc.formula("Étendue = (valeur max) − (valeur min)")}

        <h2>4. Variance et écart-type</h2>
        ${lc.def("Variance", `<p>La <strong>variance</strong> mesure la dispersion par rapport à la moyenne.</p>`)}
        ${lc.formula("V = (1/n) × Σ(x_i − x̄)²")}
        ${lc.def("Écart-type", `<p>L'<strong>écart-type</strong> est la racine carrée de la variance. Il s'exprime dans la même unité que les valeurs.</p>`)}
        ${lc.formula("σ = √V")}

        <h2>5. Calcul pas-à-pas</h2>
        ${lc.example("Série 4, 6, 8, 10, 12", `<ol>
          <li>Moyenne : <code>x̄ = (4+6+8+10+12)/5 = 40/5 = 8</code>.</li>
          <li>Écarts à la moyenne : <code>−4, −2, 0, 2, 4</code>.</li>
          <li>Carrés des écarts : <code>16, 4, 0, 4, 16</code>. Somme : <code>40</code>.</li>
          <li>Variance : <code>V = 40/5 = 8</code>.</li>
          <li>Écart-type : <code>σ = √8 ≈ 2,83</code>.</li>
        </ol>`)}

        <h2>6. Interprétation</h2>
        ${lc.prop("Plus σ est petit", `<p>Plus l'écart-type est petit, plus les valeurs sont concentrées autour de la moyenne. Un écart-type nul (σ = 0) signifie que toutes les valeurs sont égales.</p>`)}
        ${lc.example("Comparer deux séries", `<p>Série A : <code>9, 10, 11</code> → moyenne 10, écart-type ≈ 0,82.</p>
          <p>Série B : <code>5, 10, 15</code> → moyenne 10, écart-type ≈ 4,08.</p>
          <p>Même moyenne, mais B est <strong>plus dispersée</strong> que A.</p>`)}

        <h2>7. Diagramme en boîte</h2>
        ${lc.def("Boîte à moustaches", `<p>Le <strong>diagramme en boîte</strong> représente visuellement min, Q₁, médiane, Q₃, max. La boîte va de Q₁ à Q₃ ; la médiane est marquée à l'intérieur ; les « moustaches » s'étendent jusqu'aux extrêmes.</p>`)}
      `,
    },

    {
      title: "Probabilités : modélisation",
      category: "Probabilités",
      content: `
        <h2>1. Univers et événements</h2>
        ${lc.def("Univers Ω", `<p>L'<strong>univers</strong> d'une expérience aléatoire est l'ensemble de toutes les <strong>issues</strong> possibles. On le note <code>Ω</code>.</p>
          <p>Exemple : pour le lancer d'un dé, <code>Ω = {1, 2, 3, 4, 5, 6}</code>.</p>`)}
        ${lc.def("Événement", `<p>Un <strong>événement</strong> est un sous-ensemble de <code>Ω</code>.</p>
          <p>« Obtenir un nombre pair » correspond à <code>A = {2, 4, 6}</code>.</p>`)}

        <h2>2. Loi de probabilité</h2>
        ${lc.def("Loi de probabilité", `<p>Une <strong>loi de probabilité</strong> sur <code>Ω = {ω₁, ω₂, …, ωₙ}</code> attribue à chaque issue <code>ωᵢ</code> un nombre <code>pᵢ</code> entre 0 et 1, tel que :</p>`)}
        ${lc.formula("p₁ + p₂ + … + pₙ = 1")}
        <p>La probabilité d'un événement <code>A</code> est la <strong>somme des probabilités</strong> des issues qui le composent.</p>

        <h2>3. Cas équiprobable</h2>
        ${lc.def("Équiprobabilité", `<p>Quand toutes les issues ont la même probabilité <code>1/n</code>, la situation est <strong>équiprobable</strong>.</p>`)}
        ${lc.formula("P(A) = (nombre d'issues de A) / (nombre total d'issues)")}
        ${lc.example("Dé équilibré", `<p><code>P(« obtenir un pair ») = 3/6 = 1/2</code>.</p>`)}

        <h2>4. Cas non équiprobable</h2>
        ${lc.example("Pièce truquée", `<p>Pile a une probabilité de 0,7, face de 0,3.</p>
          <p>Vérification : <code>0,7 + 0,3 = 1</code> ✓.</p>
          <p>Si on lance et qu'on regarde « obtenir face » : <code>P = 0,3</code>.</p>`)}

        <h2>5. Réunion, intersection, contraire</h2>
        ${lc.formula("P(A ∪ B) = P(A) + P(B) − P(A ∩ B)")}
        ${lc.formula("Si A et B incompatibles : P(A ∪ B) = P(A) + P(B)")}
        ${lc.formula("P(Ā) = 1 − P(A)")}
        ${lc.example("Avec un dé", `<p>A = « pair », B = « multiple de 3 ».</p>
          <p><code>A = {2, 4, 6}</code>, <code>B = {3, 6}</code>, <code>A ∩ B = {6}</code>.</p>
          <p><code>P(A ∪ B) = 3/6 + 2/6 − 1/6 = 4/6 = 2/3</code>.</p>`)}

        <h2>6. Exemples typiques de modélisation</h2>
        ${lc.example("Tirage au hasard dans une urne", `<p>Une urne contient 3 boules rouges et 5 boules vertes (8 au total).</p>
          <ul><li><code>P(rouge) = 3/8</code></li>
          <li><code>P(verte) = 5/8</code></li>
          <li>Vérification : <code>3/8 + 5/8 = 1</code> ✓</li></ul>`)}
        ${lc.example("Deux dés à six faces", `<p>Univers : 36 couples possibles. Probabilité d'obtenir une somme égale à 7 ?</p>
          <p>Couples : <code>(1,6), (2,5), (3,4), (4,3), (5,2), (6,1)</code>. 6 couples favorables.</p>
          <p><code>P = 6/36 = 1/6</code>.</p>`)}
      `,
    },

    {
      title: "Algorithmique et programmation Python",
      category: "Algorithmique",
      content: `
        <h2>1. Variables et affectation</h2>
        ${lc.def("Variable", `<p>Une <strong>variable</strong> est une « boîte » qui mémorise une valeur. En Python, on utilise l'opérateur <code>=</code> pour <strong>affecter</strong> une valeur.</p>`)}
        ${lc.example("Affectations", `<pre><code>x = 5
y = 2 * x + 3
nom = "Pythagore"
pi = 3.14159</code></pre>`)}
        ${lc.tip("Bien lire =", `<p>En Python, <code>x = 5</code> ne signifie <em>pas</em> « x est égal à 5 », mais <em>« mets la valeur 5 dans x »</em>. Cette nuance est importante : <code>x = x + 1</code> a un sens (incrémentation).</p>`)}

        <h2>2. Types de données</h2>
        ${lc.prop("Principaux types", `<ul>
          <li><code>int</code> : entiers (<code>0, 7, −3</code>).</li>
          <li><code>float</code> : décimaux (<code>3.14</code>, <code>−0.5</code>) — point, pas virgule.</li>
          <li><code>str</code> : chaînes de caractères (<code>"bonjour"</code>).</li>
          <li><code>bool</code> : booléens (<code>True</code>, <code>False</code>).</li>
        </ul>`)}

        <h2>3. Structure conditionnelle</h2>
        ${lc.prop("if / elif / else", `<pre><code>if condition:
    # bloc exécuté si condition vraie
elif autre_condition:
    # sinon, si autre_condition vraie
else:
    # sinon</code></pre>`)}
        ${lc.example("Test de signe", `<pre><code>x = float(input("Entre un nombre : "))
if x > 0:
    print("positif")
elif x < 0:
    print("négatif")
else:
    print("nul")</code></pre>`)}

        <h2>4. Boucle for</h2>
        ${lc.prop("for", `<pre><code>for i in range(5):
    print(i)</code></pre>
          <p>Affiche <code>0, 1, 2, 3, 4</code>. <code>range(n)</code> génère les entiers de 0 à <code>n−1</code>.</p>`)}
        ${lc.example("Somme des entiers de 1 à 10", `<pre><code>somme = 0
for i in range(1, 11):
    somme = somme + i
print(somme)  # affiche 55</code></pre>`)}

        <h2>5. Boucle while</h2>
        ${lc.prop("while", `<pre><code>while condition:
    # bloc répété tant que la condition est vraie</code></pre>`)}
        ${lc.example("Trouver le plus petit n tel que 2ⁿ > 1000", `<pre><code>n = 0
puissance = 1
while puissance &lt;= 1000:
    n = n + 1
    puissance = puissance * 2
print(n)  # affiche 10</code></pre>`)}

        <h2>6. Listes</h2>
        ${lc.def("Listes", `<p>Une <strong>liste</strong> stocke plusieurs valeurs. On la note avec des crochets, et on accède aux éléments par leur indice (commençant à 0).</p>`)}
        ${lc.example("Manipulation de listes", `<pre><code>notes = [12, 14, 9, 15]
print(notes[0])     # 12 (premier élément)
print(len(notes))   # 4 (longueur)
notes.append(18)    # ajoute 18 à la fin</code></pre>`)}

        <h2>7. Fonctions</h2>

        ${lc.prop("Une infinité de solutions", `<p>Si on aboutit à une <strong>égalité toujours vraie</strong> (par exemple <code>0 = 0</code>), le système a une <strong>infinité</strong> de solutions. Les deux équations représentent en fait la même droite.</p>`)}

        <h2>1. Rappel du théorème direct</h2>
        ${lc.prop("Configuration", `<p>Soit deux droites sécantes en <code>A</code>. Sur l'une, deux points <code>B</code> et <code>M</code> ; sur l'autre, deux points <code>C</code> et <code>N</code>. Si <code>(BC) ∥ (MN)</code>, alors :</p>`)}
        ${lc.formula("AM/AB &nbsp;=&nbsp; AN/AC &nbsp;=&nbsp; MN/BC")}
        ${lc.tip("Configuration en triangle ou en papillon", `<p>Le théorème s'applique aux deux configurations classiques : les triangles emboîtés (M entre A et B) ou en papillon (B entre M et A, etc.). L'essentiel est que <code>(BC) ∥ (MN)</code>.</p>`)}

        <h2>2. Réciproque du théorème</h2>
        ${lc.prop("Énoncé de la réciproque", `<p>Si :</p>
          <ul><li>les points <code>A</code>, <code>M</code>, <code>B</code> sont alignés <em>dans cet ordre ou dans l'ordre A, B, M</em>,</li>
          <li>les points <code>A</code>, <code>N</code>, <code>C</code> sont alignés <em>dans le même ordre que A, M, B</em>,</li>
          <li>et <code>AM/AB = AN/AC</code>,</li></ul>
          <p>alors les droites <code>(BC)</code> et <code>(MN)</code> sont <strong>parallèles</strong>.</p>`)}
        ${lc.warn("Conditions précises", `<p>L'<strong>ordre des points</strong> compte. Si l'ordre n'est pas le même sur les deux droites, le résultat n'est pas valable. Toujours bien examiner la figure.</p>`)}

        <h2>3. Comment utiliser la réciproque</h2>
        ${lc.example("Démontrer un parallélisme", `<p>Sur une figure : <code>A, M, B</code> alignés dans cet ordre, idem pour <code>A, N, C</code>. <code>AM = 2</code>, <code>AB = 5</code>, <code>AN = 3</code>, <code>AC = 7,5</code>. Les droites <code>(BC)</code> et <code>(MN)</code> sont-elles parallèles ?</p>
          <ol><li>Calculer les rapports : <code>AM/AB = 2/5 = 0,4</code> et <code>AN/AC = 3/7,5 = 0,4</code>.</li>
          <li>Les rapports sont égaux et l'ordre est respecté.</li>
          <li>D'après la réciproque de Thalès, <code>(BC) ∥ (MN)</code>.</li></ol>`)}

        <h2>4. Contraposée : montrer un non-parallélisme</h2>
        ${lc.prop("Contraposée", `<p>Si <code>AM/AB ≠ AN/AC</code> (rapports différents), alors les droites ne sont <strong>pas parallèles</strong>.</p>`)}
        ${lc.example("Cas non parallèle", `<p><code>AM/AB = 2/5 = 0,4</code> mais <code>AN/AC = 3/7 ≈ 0,43</code>. Différents ! Donc <code>(BC)</code> et <code>(MN)</code> <strong>ne sont pas parallèles</strong>.</p>`)}

        <h2>5. Quand utiliser quoi ?</h2>
        ${lc.tip("Choix de l'outil", `<ul>
          <li>Pour <strong>calculer une longueur</strong>, on utilise le théorème direct (les côtés parallèles sont donnés).</li>
          <li>Pour <strong>démontrer un parallélisme</strong>, on utilise la <strong>réciproque</strong>.</li>
          <li>Pour <strong>montrer qu'on n'a pas parallélisme</strong>, on utilise la contraposée (rapports différents).</li>
        </ul>`)}
      `,
    },

    {
      title: "Trigonométrie : sin, cos, tan",
      category: "Géométrie",
      content: `
        <h2>1. Définitions</h2>
        ${lc.def("Cosinus, sinus, tangente d'un angle aigu", `<p>Dans un triangle rectangle, pour un angle aigu <code>α</code> :</p>`)}
        ${lc.formula("cos(α) &nbsp;=&nbsp; (côté adjacent) / (hypoténuse)<br>sin(α) &nbsp;=&nbsp; (côté opposé) / (hypoténuse)<br>tan(α) &nbsp;=&nbsp; (côté opposé) / (côté adjacent)")}

        <h2>2. Le mnémotechnique SOH-CAH-TOA</h2>
        ${lc.tip("Pour ne plus oublier", `<p>Trois lettres pour chacun :</p>
          <ul><li><strong>SOH</strong> : Sinus = Opposé sur Hypoténuse</li>
          <li><strong>CAH</strong> : Cosinus = Adjacent sur Hypoténuse</li>
          <li><strong>TOA</strong> : Tangente = Opposé sur Adjacent</li></ul>`)}

        <h2>3. Identifier les côtés</h2>
        ${lc.prop("À chaque angle ses côtés", `<p>Toujours partir de l'angle qu'on étudie :</p>
          <ul><li>L'<strong>hypoténuse</strong> est le grand côté, opposé à l'angle droit. Elle ne change pas.</li>
          <li>Le côté <strong>opposé</strong> à <code>α</code> est celui qui ne touche pas <code>α</code>.</li>
          <li>Le côté <strong>adjacent</strong> à <code>α</code> est celui qui touche <code>α</code> (sans être l'hypoténuse).</li></ul>`)}

        <h2>4. Calculer une longueur</h2>
        ${lc.example("Avec sinus", `<p>Triangle rectangle, angle α = 35°, hypoténuse = 12 cm. Calculer le côté opposé à α.</p>
          <ol><li><code>sin(35°) = opposé / 12</code>.</li>
          <li><code>opposé = 12 × sin(35°) ≈ 12 × 0,574 ≈ 6,88 cm</code>.</li></ol>`)}

        <h2>5. Calculer un angle</h2>
        ${lc.prop("Avec les fonctions inverses", `<p>Quand on connaît un rapport, on retrouve l'angle avec les touches inverses : <code>sin⁻¹</code>, <code>cos⁻¹</code>, <code>tan⁻¹</code>.</p>`)}
        ${lc.example("Application", `<p>Triangle rectangle, opposé = 3 cm, hypoténuse = 5 cm. Trouver l'angle α.</p>
          <ol><li><code>sin(α) = 3/5 = 0,6</code>.</li>
          <li><code>α = sin⁻¹(0,6) ≈ 36,87°</code>.</li></ol>`)}

        <h2>6. Relations importantes</h2>
        ${lc.formula("cos²(α) + sin²(α) &nbsp;=&nbsp; 1")}
        ${lc.formula("tan(α) &nbsp;=&nbsp; sin(α) / cos(α)")}
        ${lc.tip("Conséquence", `<p>Si on connaît <code>cos(α)</code>, on peut retrouver <code>sin(α)</code> sans calculatrice :</p>
          <p>Si <code>cos(α) = 3/5</code>, alors <code>sin²(α) = 1 − 9/25 = 16/25</code>, donc <code>sin(α) = 4/5</code>.</p>`)}

        <h2>7. Valeurs particulières</h2>
        ${lc.prop("À mémoriser", `<table style="margin:8px 0;font-family:monospace;font-size:13px"><tr><td>α</td><td style="padding:0 12px">cos</td><td style="padding:0 12px">sin</td><td>tan</td></tr><tr><td>30°</td><td style="padding:0 12px">√3/2</td><td style="padding:0 12px">1/2</td><td>√3/3</td></tr><tr><td>45°</td><td style="padding:0 12px">√2/2</td><td style="padding:0 12px">√2/2</td><td>1</td></tr><tr><td>60°</td><td style="padding:0 12px">1/2</td><td style="padding:0 12px">√3/2</td><td>√3</td></tr></table>`)}
      `,
    },

    {
      title: "Géométrie dans l'espace : volumes",
      category: "Géométrie",
      content: `
        <h2>1. Vocabulaire 3D</h2>
        ${lc.def("Solides", `<ul>
          <li><strong>Cube</strong> : 6 faces carrées identiques.</li>
          <li><strong>Pavé droit (parallélépipède rectangle)</strong> : 6 faces rectangulaires.</li>
          <li><strong>Cylindre</strong> : deux disques parallèles reliés par une surface courbe (boîte de conserve).</li>
          <li><strong>Prisme droit</strong> : deux polygones identiques parallèles reliés par des rectangles.</li>
          <li><strong>Pyramide</strong> : une base polygonale et un sommet ; les faces latérales sont des triangles.</li>
          <li><strong>Cône</strong> : base circulaire et un sommet (cornet de glace).</li>
          <li><strong>Sphère / boule</strong> : la sphère est la surface ; la boule est ce qu'il y a à l'intérieur.</li>
        </ul>`)}

        <h2>2. Formules de volumes</h2>
        ${lc.formula("Cube (côté c) &nbsp;:&nbsp; V = c³")}
        ${lc.formula("Pavé droit (L, l, h) &nbsp;:&nbsp; V = L × l × h")}
        ${lc.formula("Cylindre (rayon r, hauteur h) &nbsp;:&nbsp; V = π × r² × h")}
        ${lc.formula("Prisme droit (aire base B, hauteur h) &nbsp;:&nbsp; V = B × h")}
        ${lc.formula("Pyramide (aire base B, hauteur h) &nbsp;:&nbsp; V = (1/3) × B × h")}
        ${lc.formula("Cône (rayon r, hauteur h) &nbsp;:&nbsp; V = (1/3) × π × r² × h")}
        ${lc.formula("Boule (rayon r) &nbsp;:&nbsp; V = (4/3) × π × r³")}
        ${lc.tip("À retenir", `<p>Les pyramides et cônes ont toujours un facteur <code>1/3</code> par rapport au prisme/cylindre de même base et hauteur.</p>`)}

        <h2>3. Exemples de calcul</h2>
        ${lc.example("Cylindre", `<p>Cylindre de rayon 4 cm, hauteur 10 cm. Volume ?</p>
          <p><code>V = π × 4² × 10 = 160π ≈ 502,65 cm³</code>.</p>`)}
        ${lc.example("Pyramide", `<p>Pyramide à base carrée de côté 6 cm, hauteur 9 cm. Volume ?</p>
          <ol><li>Aire de la base : <code>B = 6 × 6 = 36 cm²</code>.</li>
          <li><code>V = (1/3) × 36 × 9 = 108 cm³</code>.</li></ol>`)}
        ${lc.example("Boule", `<p>Boule de rayon 5 cm. Volume ?</p>
          <p><code>V = (4/3) × π × 5³ = (4/3) × π × 125 ≈ 523,6 cm³</code>.</p>`)}

        <h2>4. Unités de volume</h2>
        ${lc.prop("Conversions", `<p>Pour passer d'une unité de volume à une autre, on multiplie ou divise par <strong>1000</strong> à chaque palier (et non par 10).</p>
          <ul><li><code>1 m³ = 1 000 dm³ = 1 000 000 cm³</code></li>
          <li><code>1 dm³ = 1 L</code> (lien avec les capacités)</li>
          <li><code>1 m³ = 1 000 L</code></li></ul>`)}
        ${lc.tip("Pourquoi 1000 ?", `<p>Parce que <code>1 m = 10 dm</code>, donc <code>1 m³ = 10 dm × 10 dm × 10 dm = 1000 dm³</code>.</p>`)}

        <h2>5. Effet d'agrandissement / réduction</h2>
        ${lc.prop("Coefficient k", `<p>Si on multiplie toutes les dimensions d'un solide par un coefficient <code>k</code> :</p>
          <ul><li>les longueurs sont multipliées par <code>k</code> ;</li>
          <li>les aires sont multipliées par <code>k²</code> ;</li>
          <li>les volumes sont multipliés par <code>k³</code>.</li></ul>`)}
        ${lc.example("Doubler les dimensions", `<p>Si on double (k = 2) toutes les dimensions d'un cube, son volume est multiplié par <code>2³ = 8</code>. Un cube 8 fois plus volumineux !</p>`)}
        ${lc.example("Réduire d'un tiers", `<p>Pour <code>k = 1/3</code> : longueurs ÷ 3, aires ÷ 9, volumes ÷ 27.</p>`)}

        <h2>6. Sections planes des solides</h2>
        ${lc.def("Section plane", `<p>La <strong>section plane</strong> d'un solide par un plan est la figure qu'on obtient en « coupant » le solide avec ce plan.</p>`)}
        ${lc.prop("Sections du pavé droit", `<ul>
          <li>Section parallèle à une face : <strong>rectangle</strong> identique à cette face.</li>
          <li>Section perpendiculaire à une arête : <strong>rectangle</strong>.</li>
        </ul>`)}
        ${lc.prop("Sections du cylindre", `<ul>
          <li>Section parallèle à la base : <strong>disque</strong> identique à la base.</li>
          <li>Section perpendiculaire à la base et passant par l'axe : <strong>rectangle</strong> (largeur = diamètre, hauteur = hauteur du cylindre).</li>
        </ul>`)}
        ${lc.prop("Sections du cône / pyramide", `<p>Une section <strong>parallèle à la base</strong> donne une figure <strong>semblable</strong> à la base, mais réduite. C'est une <strong>réduction</strong> de la base par un coefficient <code>k</code>.</p>`)}
        ${lc.example("Cône réduit par section parallèle", `<p>Cône de rayon 6, hauteur 12. On le coupe par un plan parallèle à la base à 4 cm du sommet.</p>
          <ol><li>Coefficient de réduction : <code>k = 4/12 = 1/3</code> (rapport des hauteurs depuis le sommet).</li>
          <li>Rayon du nouveau disque : <code>6 × 1/3 = 2 cm</code>.</li>
          <li>Volume du « petit cône » obtenu : <code>(1/3) × π × 2² × 4 = 16π/3 ≈ 16,76 cm³</code>.</li>
          <li>Vérification via k³ : volume initial = <code>(1/3) × π × 36 × 12 = 144π</code>. Volume réduit = <code>144π × (1/3)³ = 144π/27 = 16π/3</code> ✓.</li>
        </ol>`)}

        <h2>7. Tronc de cône / pyramide</h2>
        ${lc.def("Tronc", `<p>Quand on enlève le « petit » cône (ou pyramide) d'une réduction par section parallèle, ce qui reste est un <strong>tronc de cône</strong> (ou de pyramide).</p>
          <p>Volume du tronc = volume initial − volume du « petit » solide retiré.</p>`)}
      `,
    },

    {
      title: "Homothéties",
      category: "Géométrie",
      content: `
        <h2>1. Qu'est-ce qu'une homothétie ?</h2>
        ${lc.def("Homothétie", `<p>Une <strong>homothétie</strong> est une transformation qui agrandit ou réduit une figure à partir d'un point fixe (le <strong>centre</strong>), avec un facteur multiplicatif (le <strong>rapport</strong>).</p>`)}
        ${lc.tip("Exemples concrets", `<p>Faire un zoom photo, projeter une image, agrandir un plan... ce sont des homothéties.</p>`)}

        <h2>2. Image d'un point</h2>
        ${lc.def("Image", `<p>Soit <code>O</code> un point (le centre) et <code>k</code> un nombre non nul (le rapport). L'image d'un point <code>A</code> par l'homothétie de centre <code>O</code> et de rapport <code>k</code> est l'unique point <code>A'</code> tel que :</p>
          <ul><li><code>O</code>, <code>A</code> et <code>A'</code> sont alignés ;</li>
          <li><code>OA' = |k| × OA</code> ;</li>
          <li>si <code>k > 0</code>, <code>A'</code> est <em>du même côté</em> que <code>A</code> par rapport à <code>O</code> ;</li>
          <li>si <code>k < 0</code>, <code>A'</code> est <em>de l'autre côté</em>.</li></ul>`)}

        <h2>3. Cas particuliers</h2>
        ${lc.prop("Selon la valeur de k", `<ul>
          <li><code>k = 1</code> : <strong>identité</strong> (chaque point est son propre image).</li>
          <li><code>k = −1</code> : <strong>symétrie centrale</strong> de centre <code>O</code>.</li>
          <li><code>|k| > 1</code> : agrandissement.</li>
          <li><code>0 < |k| < 1</code> : réduction.</li>
        </ul>`)}

        <h2>4. Propriétés</h2>
        ${lc.prop("Conservations", `<p>Une homothétie conserve :</p>
          <ul><li>l'<strong>alignement</strong> des points ;</li>
          <li>les <strong>angles</strong> (la figure n'est pas déformée) ;</li>
          <li>le <strong>parallélisme</strong>.</li></ul>
          <p>Mais elle <strong>multiplie</strong> :</p>
          <ul><li>les <strong>longueurs</strong> par <code>|k|</code> ;</li>
          <li>les <strong>aires</strong> par <code>k²</code> ;</li>
          <li>les <strong>volumes</strong> par <code>|k|³</code>.</li></ul>`)}

        <h2>5. Exemples concrets</h2>
        ${lc.example("Agrandissement d'un triangle", `<p>Un triangle a des côtés de 3, 4 et 5 cm. On lui applique une homothétie de rapport 2.</p>
          <ul><li>Côtés du triangle image : 6, 8 et 10 cm.</li>
          <li>Aire multipliée par <code>2² = 4</code>.</li></ul>`)}
        ${lc.example("Réduction d'un photo", `<p>Une photo est réduite avec un rapport <code>k = 1/3</code>. Si elle mesurait 18 cm × 24 cm, la nouvelle photo mesure :</p>
          <p><code>18/3 = 6 cm</code> et <code>24/3 = 8 cm</code>. Aire divisée par <code>3² = 9</code>.</p>`)}

        <h2>6. Construire l'image</h2>
        ${lc.prop("Méthode (rapport positif)", `<ol>
          <li>Tracer la droite <code>(OA)</code>.</li>
          <li>Mesurer <code>OA</code>.</li>
          <li>Reporter <code>k × OA</code> à partir de <code>O</code>, sur la droite (du même côté que <code>A</code> si <code>k > 0</code>).</li>
          <li>Le point obtenu est <code>A'</code>.</li>
        </ol>`)}
      `,
    },

    {
      title: "Fonctions linéaires et affines",
      category: "Fonctions",
      content: `
        <h2>1. Fonction linéaire</h2>
        ${lc.def("Fonction linéaire", `<p>Une <strong>fonction linéaire</strong> est une fonction <code>f</code> de la forme :</p>`)}
        ${lc.formula("f(x) &nbsp;=&nbsp; a × x &nbsp;&nbsp; (a est un nombre fixé, le coefficient)")}
        <p>Une fonction linéaire correspond à une <strong>situation de proportionnalité</strong> : <code>a</code> est le coefficient.</p>
        ${lc.example("f(x) = 3x", `<p><code>f(2) = 6</code>, <code>f(5) = 15</code>, <code>f(−4) = −12</code>.</p>`)}

        <h2>2. Représentation graphique d'une fonction linéaire</h2>
        ${lc.prop("Une droite par l'origine", `<p>La représentation graphique de <code>f(x) = ax</code> est une <strong>droite passant par l'origine</strong> du repère. Le coefficient <code>a</code> est appelé la <strong>pente</strong> de la droite.</p>`)}
        ${lc.tip("Sens de la pente", `<ul>
          <li>Si <code>a > 0</code> : la droite « monte ».</li>
          <li>Si <code>a < 0</code> : la droite « descend ».</li>
          <li>Si <code>a = 0</code> : la droite est horizontale (sur l'axe des abscisses).</li>
        </ul>`)}

        <h2>3. Fonction affine</h2>
        ${lc.def("Fonction affine", `<p>Une <strong>fonction affine</strong> est une fonction de la forme :</p>`)}
        ${lc.formula("f(x) &nbsp;=&nbsp; a × x + b &nbsp;&nbsp; (a et b fixés)")}
        <ul>
          <li><code>a</code> est le <strong>coefficient directeur</strong> (ou pente).</li>
          <li><code>b</code> est l'<strong>ordonnée à l'origine</strong> (la valeur de <code>f(0) = b</code>).</li>
        </ul>
        ${lc.example("f(x) = 2x + 3", `<p><code>f(0) = 3</code>, <code>f(1) = 5</code>, <code>f(−2) = −1</code>.</p>`)}

        <h2>4. Représentation graphique d'une fonction affine</h2>
        ${lc.prop("Une droite", `<p>La représentation de <code>f(x) = ax + b</code> est une <strong>droite</strong> :</p>
          <ul><li>qui coupe l'axe des ordonnées au point <code>(0, b)</code> ;</li>
          <li>de pente <code>a</code> (montée verticale par unité horizontale).</li></ul>
          <p>Si <code>b = 0</code>, on retrouve une fonction linéaire (droite par l'origine). Une fonction linéaire est donc un cas particulier de fonction affine.</p>`)}

        <h2>5. Calcul d'images et d'antécédents</h2>
        ${lc.def("Image et antécédent", `<ul>
          <li>L'<strong>image</strong> de <code>x</code> par <code>f</code> est <code>f(x)</code>.</li>
          <li>Un <strong>antécédent</strong> de <code>y</code> est un nombre <code>x</code> tel que <code>f(x) = y</code>.</li>
        </ul>`)}
        ${lc.example("Avec f(x) = 2x + 3", `<ul>
          <li>Image de 4 : <code>f(4) = 2 × 4 + 3 = 11</code>.</li>
          <li>Antécédent de 9 : on résout <code>2x + 3 = 9</code> → <code>x = 3</code>.</li>
        </ul>`)}

        <h2>6. Déterminer une fonction affine</h2>
        ${lc.prop("À partir de deux points", `<p>Si une droite passe par les points <code>(x₁, y₁)</code> et <code>(x₂, y₂)</code>, la pente est :</p>`)}
        ${lc.formula("a &nbsp;=&nbsp; (y₂ − y₁) / (x₂ − x₁)")}
        ${lc.example("Trouver f connaissant deux points", `<p>Droite passant par <code>(1, 5)</code> et <code>(3, 9)</code>.</p>
          <ol><li>Pente : <code>a = (9 − 5)/(3 − 1) = 4/2 = 2</code>.</li>
          <li>Avec un point : <code>5 = 2 × 1 + b</code> → <code>b = 3</code>.</li>
          <li>Donc <code>f(x) = 2x + 3</code>.</li></ol>`)}
      `,
    },

    {
      title: "Statistiques : médiane, étendue",
      category: "Organisation des données",
      content: `
        <h2>1. Rappels</h2>
        ${lc.def("Moyenne", `<p>La <strong>moyenne</strong> = (somme des valeurs) / (nombre de valeurs).</p>`)}
        ${lc.def("Étendue", `<p>L'<strong>étendue</strong> = (valeur maximale) − (valeur minimale). C'est une mesure de la <em>dispersion</em>.</p>`)}

        <h2>2. La médiane</h2>
        ${lc.def("Médiane", `<p>La <strong>médiane</strong> d'une série de valeurs (rangées dans l'ordre croissant) est la valeur qui <strong>partage la série en deux moitiés de même effectif</strong> : 50 % des valeurs sont en dessous et 50 % au-dessus.</p>`)}

        <h2>3. Calculer la médiane</h2>
        ${lc.prop("Effectif impair", `<p>Si l'effectif total <code>n</code> est <strong>impair</strong>, la médiane est la valeur à la position <code>(n + 1) / 2</code> (la valeur centrale).</p>`)}
        ${lc.example("Série de 7 notes", `<p>Notes triées : <code>8 ; 10 ; 12 ; 13 ; 14 ; 15 ; 18</code>. Effectif 7 (impair). Position centrale : <code>(7 + 1)/2 = 4</code>.</p>
          <p>La médiane est la 4e valeur : <strong>13</strong>.</p>`)}
        ${lc.prop("Effectif pair", `<p>Si l'effectif <code>n</code> est <strong>pair</strong>, la médiane est la moyenne des deux valeurs centrales (positions <code>n/2</code> et <code>n/2 + 1</code>).</p>`)}
        ${lc.example("Série de 8 notes", `<p>Notes triées : <code>6 ; 9 ; 10 ; 11 ; 13 ; 14 ; 16 ; 18</code>. Effectif 8.</p>
          <p>Valeurs centrales (4e et 5e) : <code>11</code> et <code>13</code>. Médiane : <code>(11 + 13)/2 = 12</code>.</p>`)}

        <h2>4. Médiane vs moyenne</h2>
        ${lc.tip("Différence importante", `<p>La <strong>moyenne</strong> est sensible aux valeurs extrêmes ; la <strong>médiane</strong>, non. Avec une valeur très grande ou très petite, la médiane bouge peu, la moyenne beaucoup.</p>`)}
        ${lc.example("Salaires d'une entreprise", `<p>Quatre salariés gagnent 1 800 €, un patron gagne 30 000 €.</p>
          <ul><li>Moyenne : <code>(4 × 1800 + 30000)/5 = 7440 €</code> (peu représentative).</li>
          <li>Médiane : <strong>1 800 €</strong> (représentative du salarié type).</li></ul>`)}

        <h2>5. Étendue : la dispersion</h2>
        ${lc.example("Comparer deux séries", `<p>Série A : <code>10, 11, 12, 13, 14</code>. Étendue = <code>14 − 10 = 4</code>.</p>
          <p>Série B : <code>5, 8, 12, 16, 19</code>. Étendue = <code>19 − 5 = 14</code>.</p>
          <p>Les deux séries ont la même <strong>moyenne</strong> (12) et même <strong>médiane</strong> (12), mais B est beaucoup plus dispersée.</p>`)}

        <h2>6. Quartiles (notion)</h2>
        ${lc.def("Premier et troisième quartile", `<ul>
          <li>Le <strong>premier quartile</strong> <code>Q1</code> : 25 % des valeurs sont en dessous.</li>
          <li>Le <strong>troisième quartile</strong> <code>Q3</code> : 75 % des valeurs sont en dessous.</li>
        </ul>
          <p>L'<strong>écart interquartile</strong> <code>Q3 − Q1</code> donne la dispersion de la « moitié centrale » de la série (sans tenir compte des extrêmes).</p>`)}
      `,
    },

    {
      title: "Probabilités : événements",
      category: "Organisation des données",
      content: `
        <h2>1. Rappel</h2>
        ${lc.formula("P(A) &nbsp;=&nbsp; (nb d'issues favorables à A) / (nb total d'issues)")}
        <p>Cette formule s'applique uniquement en <strong>situation équiprobable</strong> (chaque issue a la même chance).</p>

        <h2>2. Réunion et intersection</h2>
        ${lc.def("Réunion (A ou B)", `<p>L'événement « <code>A</code> ou <code>B</code> » se réalise si <code>A</code> se réalise, ou <code>B</code> se réalise, ou les deux.</p>`)}
        ${lc.def("Intersection (A et B)", `<p>L'événement « <code>A</code> et <code>B</code> » se réalise si <code>A</code> et <code>B</code> se réalisent en même temps.</p>`)}

        <h2>3. Événements incompatibles</h2>
        ${lc.def("Événements incompatibles", `<p>Deux événements sont <strong>incompatibles</strong> s'ils ne peuvent pas se réaliser en même temps.</p>`)}
        ${lc.example("Lancer d'un dé", `<p>« Obtenir 3 » et « Obtenir un nombre pair » sont incompatibles (3 n'est pas pair).</p>
          <p>Mais « Obtenir un multiple de 3 » et « Obtenir un nombre pair » sont compatibles : ils sont vrais en même temps si on obtient 6.</p>`)}

        <h2>4. Formule de la réunion</h2>
        ${lc.prop("Cas général", `<p>Pour deux événements quelconques :</p>`)}
        ${lc.formula("P(A ou B) &nbsp;=&nbsp; P(A) + P(B) − P(A et B)")}
        ${lc.prop("Cas incompatibles", `<p>Si <code>A</code> et <code>B</code> sont incompatibles (<code>P(A et B) = 0</code>) :</p>`)}
        ${lc.formula("P(A ou B) &nbsp;=&nbsp; P(A) + P(B)")}
        ${lc.example("Avec un dé", `<p><code>A</code> = « obtenir 2 », <code>B</code> = « obtenir 5 ». Incompatibles. <code>P(A) = 1/6</code>, <code>P(B) = 1/6</code>.</p>
          <p><code>P(« 2 ou 5 ») = 1/6 + 1/6 = 2/6 = 1/3</code>.</p>`)}

        <h2>5. Événement contraire</h2>
        ${lc.def("Contraire", `<p>L'événement contraire de <code>A</code>, noté <code>Ā</code>, se réalise quand <code>A</code> ne se réalise pas.</p>`)}
        ${lc.formula("P(Ā) &nbsp;=&nbsp; 1 − P(A)")}
        ${lc.example("Avec une carte", `<p>Probabilité de tirer un roi : <code>P = 4/32 = 1/8</code>. Probabilité de <em>ne pas</em> tirer un roi : <code>1 − 1/8 = 7/8</code>.</p>`)}

        <h2>6. Arbres de probabilité</h2>
        ${lc.def("Arbre", `<p>Pour une expérience à <strong>plusieurs étapes</strong>, on peut représenter les issues par un <strong>arbre</strong>. Chaque branche porte une probabilité.</p>`)}
        ${lc.prop("Règles de l'arbre", `<ul>
          <li>La somme des probabilités des branches issues d'un même nœud vaut <strong>1</strong>.</li>
          <li>La probabilité d'un <strong>chemin</strong> est le produit des probabilités sur les branches.</li>
          <li>La probabilité d'un événement est la somme des probabilités des chemins qui y mènent.</li>
        </ul>`)}
        ${lc.example("Deux lancers de pièce", `<p>On lance une pièce 2 fois. Probabilité d'obtenir au moins une fois pile ?</p>
          <ol><li>Plus simple : passer par le contraire « jamais pile » = « FF ». <code>P(FF) = (1/2) × (1/2) = 1/4</code>.</li>
          <li>Donc <code>P(au moins un pile) = 1 − 1/4 = 3/4</code>.</li></ol>`)}
      `,
    },
  ];
}

// ─── Contenu pédagogique : 4e à fond ─────────────────────────────

          <li>On applique la <strong>règle des signes</strong> :</li></ol>

        ${lc.example("Calculer (−7) × (−3)", `<ol><li>Distances : <code>7 × 3 = 21</code>.</li>

        ${lc.example("Avec relatif et fraction", `<p>Calculer <code>(−3) × (−5/6)</code> : signes mêmes → positif. Distance : <code>3 × 5/6 = 15/6 = 5/2</code>. Donc <code>(−3) × (−5/6) = +5/2</code>.</p>`)}

        <h2>1. Rappels : addition et soustraction</h2>

        ${lc.formula("a/n + b/n &nbsp;=&nbsp; (a + b)/n")}
        ${lc.prop("Avec dénominateurs différents", `<p>Réduire au même dénominateur d'abord, puis additionner.</p>`)}
        ${lc.example("Calculer 2/3 + 1/4", `<ol><li>Dénominateur commun : <code>3 × 4 = 12</code>.</li>

        <h2>2. Multiplication</h2>
        ${lc.prop("Règle simple", `<p>On multiplie les numérateurs entre eux et les dénominateurs entre eux.</p>`)}
        ${lc.formula("a/b × c/d &nbsp;=&nbsp; (a × c) / (b × d)")}

        <h2>3. Inverse d'un nombre, d'une fraction</h2>

        ${lc.warn("Ne pas confondre", `<p><code>2³ × 5³</code> ne s'additionne <strong>pas</strong> en exposant : ce sont des bases différentes (2 et 5). Ici on a <code>(2 × 5)³ = 10³</code>.</p>`)}

        <h2>1. Développer, c'est quoi ?</h2>

        <h2>2. Distributivité simple</h2>
        ${lc.prop("Règle clé", `<p>Pour tous nombres <code>k, a, b</code> :</p>`)}
        ${lc.formula("k × (a + b) &nbsp;=&nbsp; k × a + k × b<br>k × (a − b) &nbsp;=&nbsp; k × a − k × b")}

        ${lc.example("Développer −2(y − 4)", `<p><code>−2(y − 4) = −2 × y + (−2) × (−4) = −2y + 8</code>.</p>

        <h2>3. Distributivité double</h2>
        ${lc.prop("Règle plus générale", `<p>Pour tous nombres <code>a, b, c, d</code> :</p>`)}
        ${lc.formula("(a + b)(c + d) &nbsp;=&nbsp; ac + ad + bc + bd")}
        ${lc.example("Développer (x + 2)(x + 3)", `<ol><li>On distribue chaque terme du premier facteur sur chaque terme du deuxième :</li>
          <li><code>= x × x + x × 3 + 2 × x + 2 × 3</code></li>
          <li><code>= x² + 3x + 2x + 6</code></li>
          <li>On réduit : <code>= x² + 5x + 6</code>.</li></ol>`)}
        ${lc.example("Développer (x − 4)(2x + 1)", `<ol><li><code>= x × 2x + x × 1 + (−4) × 2x + (−4) × 1</code></li>
          <li><code>= 2x² + x − 8x − 4</code></li>
          <li><code>= 2x² − 7x − 4</code>.</li></ol>`)}
        ${lc.tip("Astuce mnémotechnique", `<p>Pour ne rien oublier dans <code>(a + b)(c + d)</code>, on visualise <strong>4 flèches</strong> qui partent de chaque terme du premier facteur vers chaque terme du second. On obtient toujours <strong>4 produits</strong> à additionner : <code>ac + ad + bc + bd</code>.</p>`)}

        <h2>4. Réduire après développement</h2>
        ${lc.prop("Toujours après distribution", `<p>Après avoir développé, on regroupe les termes de même nature (mêmes lettres, même exposant).</p>`)}
        ${lc.example("Développer puis réduire 3(x + 2) − 5(x − 1)", `<ol><li>Développer chaque terme : <code>3x + 6 − 5x + 5</code>.</li>
