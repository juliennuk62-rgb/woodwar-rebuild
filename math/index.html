      title: "Priorités opératoires",
      category: "Nombres et calcul",
      content: `
        <h2>1. La règle PEMDAS</h2>
        ${lc.prop("Ordre des opérations", `<p>Dans un calcul avec plusieurs opérations, on suit cet ordre :</p>
          <ol><li><strong>Parenthèses</strong> d'abord (et calculs entre parenthèses, en commençant par les plus internes).</li>
          <li>Puis <strong>Multiplications</strong> et <strong>Divisions</strong>, de gauche à droite.</li>
          <li>Enfin <strong>Additions</strong> et <strong>Soustractions</strong>, de gauche à droite.</li></ol>`)}
        ${lc.example("Calculer 5 + 2 × 3", `<p>Multiplication d'abord : <code>2 × 3 = 6</code>. Puis <code>5 + 6 = 11</code>.</p>
          <p>Et <strong>non</strong> : « <code>5 + 2 = 7</code> puis <code>7 × 3 = 21</code> » qui est faux.</p>`)}

        <h2>2. Avec parenthèses</h2>
        <p>Les parenthèses servent à <strong>forcer un autre ordre</strong>.</p>
        ${lc.example("Calculer (5 + 2) × 3", `<p>Parenthèses d'abord : <code>5 + 2 = 7</code>. Puis <code>7 × 3 = 21</code>.</p>`)}
        ${lc.example("Calculer 20 − (3 + 4) × 2", `<ol><li>Parenthèses : <code>3 + 4 = 7</code>.</li>
          <li>Multiplication : <code>7 × 2 = 14</code>.</li>
          <li>Soustraction : <code>20 − 14 = 6</code>.</li></ol>`)}

        <h2>3. Parenthèses imbriquées</h2>
        ${lc.example("Calculer 4 × (3 + (8 − 2))", `<ol><li>Parenthèse la plus interne : <code>8 − 2 = 6</code>. Reste : <code>4 × (3 + 6)</code>.</li>
          <li>Parenthèse externe : <code>3 + 6 = 9</code>. Reste : <code>4 × 9</code>.</li>
          <li>Multiplication : <code>4 × 9 = 36</code>.</li></ol>`)}

        <h2>4. Pièges classiques</h2>
        ${lc.warn("Soustraction et addition à priorité égale", `<p><code>10 − 3 + 2</code> se calcule de gauche à droite : <code>(10 − 3) + 2 = 7 + 2 = 9</code>. Et <strong>non</strong> <code>10 − (3 + 2) = 5</code>.</p>`)}
        ${lc.warn("Division avant addition", `<p><code>12 + 8 ÷ 4</code> = <code>12 + 2 = 14</code> (division d'abord). Et non <code>(12 + 8) ÷ 4 = 5</code>.</p>`)}
        ${lc.tip("Astuce de lecture", `<p>Quand un calcul est ambigu pour toi, ajoute mentalement des parenthèses autour des multiplications et divisions pour clarifier l'ordre.</p>`)}

        <h2>5. Avec relatifs et fractions</h2>
        <p>Les règles sont les mêmes : parenthèses, puis ×/÷, puis +/−.</p>
        ${lc.example("Calculer −3 + 2 × (−4)", `<ol><li>Multiplication : <code>2 × (−4) = −8</code>.</li>
          <li>Addition : <code>−3 + (−8) = −11</code>.</li></ol>`)}
        ${lc.example("Calculer 1/2 + 1/3 × 1/4", `<ol><li>Multiplication : <code>1/3 × 1/4 = 1/12</code>.</li>
          <li>Addition : <code>1/2 + 1/12 = 6/12 + 1/12 = 7/12</code>.</li></ol>`)}
      `,
    },
    {
      title: "Proportionnalité",
      category: "Organisation des données",
      content: `
        <h2>1. Reconnaître une situation proportionnelle</h2>
        ${lc.def("Définition", `<p>Deux grandeurs sont <strong>proportionnelles</strong> si l'une s'obtient en multipliant l'autre par un nombre fixe, appelé <strong>coefficient de proportionnalité</strong>.</p>`)}
        <p>Exemples typiques :</p>
        <ul><li>Le prix payé est proportionnel à la quantité achetée (à prix unitaire fixe).</li>
        <li>La distance parcourue à vitesse constante est proportionnelle au temps.</li>
        <li>L'aire d'un carré <em>n'est pas</em> proportionnelle à son côté (c'est <code>côté²</code>).</li></ul>
        ${lc.example("Tableau proportionnel ?", `<p>3 stylos coûtent 6 €. 5 stylos coûtent 10 €. 8 stylos coûtent 16 €.</p>
          <p>On vérifie : <code>6/3 = 2</code>, <code>10/5 = 2</code>, <code>16/8 = 2</code>. Le coefficient est toujours 2 (le prix unitaire). C'est <strong>proportionnel</strong>.</p>`)}

        <h2>2. Coefficient de proportionnalité</h2>
        ${lc.prop("Calcul", `<p>Si <code>y</code> est proportionnel à <code>x</code> avec coefficient <code>k</code>, alors <code>y = k × x</code> et <code>k = y / x</code>.</p>`)}
        ${lc.example("Trouver le coefficient", `<p>Pour 4 kg de pommes, on paie 8 €. Le coefficient (= prix par kg) est <code>8 ÷ 4 = 2 €/kg</code>.</p>
          <p>On peut alors prédire : pour 7 kg, on paiera <code>7 × 2 = 14 €</code>.</p>`)}

        <h2>3. La 4ème proportionnelle</h2>
        ${lc.def("Quatrième proportionnelle", `<p>Quand on connaît trois nombres dans un tableau de proportionnalité, on peut calculer le quatrième. C'est la <strong>quatrième proportionnelle</strong>.</p>`)}
        ${lc.formula("Si &nbsp; a/b &nbsp;=&nbsp; c/d &nbsp;, &nbsp; alors &nbsp; d &nbsp;=&nbsp; (b × c) / a")}
        ${lc.example("Recette pour 6 personnes → pour 10 ?", `<p>Pour 6 personnes, il faut 300 g de farine. Combien pour 10 ?</p>
          <ol><li>On pose : <code>300/6 = ?/10</code>.</li>
          <li>Calcul : <code>? = (300 × 10) / 6 = 3000 / 6 = 500</code>.</li>
          <li>Il faut <strong>500 g</strong>.</li></ol>`)}

        <h2>4. Le passage par l'unité</h2>
        ${lc.tip("Méthode classique", `<p>On calcule d'abord la valeur pour <strong>1 unité</strong>, puis on multiplie par la quantité voulue.</p>`)}
        ${lc.example("Au passage par l'unité", `<p>5 kg de pommes coûtent 12 €. Combien coûtent 8 kg ?</p>
          <ol><li>1 kg coûte : <code>12 ÷ 5 = 2,4 €</code>.</li>
          <li>8 kg coûtent : <code>8 × 2,4 = 19,2 €</code>.</li></ol>`)}

        <h2>5. Échelles</h2>
        ${lc.def("Échelle d'une carte", `<p>Une <strong>échelle</strong> exprime le rapport entre une distance sur le plan et la distance réelle.</p>
          <p>Une échelle de <code>1/100</code> signifie que <strong>1 cm sur le plan = 100 cm en réalité</strong>.</p>`)}
        ${lc.example("Distance réelle", `<p>Sur un plan à l'échelle 1/200, deux points sont distants de 4 cm. Quelle est la distance réelle ?</p>
          <p>Distance réelle = <code>4 × 200 = 800 cm = 8 m</code>.</p>`)}
      `,
    },
    {
      title: "Pourcentages",
      category: "Organisation des données",
      content: `
        <h2>1. Définition</h2>
        ${lc.def("Pourcentage", `<p>Un <strong>pourcentage</strong> est une fraction dont le dénominateur est 100. <code>p%</code> signifie <code>p/100</code>.</p>
          <p>Exemple : <code>25% = 25/100 = 0,25</code>.</p>`)}

        <h2>2. Prendre p% d'une quantité</h2>
        ${lc.formula("p% de N &nbsp;=&nbsp; (p / 100) × N &nbsp;=&nbsp; p × N / 100")}
        ${lc.example("Calculer 20% de 75", `<p><code>20% de 75 = (20 × 75) / 100 = 1500 / 100 = 15</code>.</p>`)}
        ${lc.tip("Calcul mental", `<ul><li><strong>10%</strong> : divise par 10 (<code>10% de 240 = 24</code>).</li>
          <li><strong>50%</strong> : divise par 2 (la moitié).</li>
          <li><strong>25%</strong> : divise par 4 (le quart).</li>
          <li><strong>5%</strong> : prends la moitié de 10%.</li></ul>`)}

        <h2>3. Augmentation et réduction</h2>
        ${lc.prop("Augmenter de p%", `<p>Augmenter une valeur de <code>p%</code>, c'est la multiplier par <code>(1 + p/100)</code>.</p>`)}
        ${lc.example("Une augmentation de 15%", `<p>Un prix de 80 € augmente de 15%. Nouveau prix ?</p>
          <p>Nouveau prix = <code>80 × (1 + 15/100) = 80 × 1,15 = 92 €</code>.</p>
          <p>Vérification par étapes : <code>15% de 80 = 12 €</code>. <code>80 + 12 = 92</code> ✓</p>`)}
        ${lc.prop("Réduire de p%", `<p>Réduire de <code>p%</code>, c'est multiplier par <code>(1 − p/100)</code>.</p>`)}
        ${lc.example("Une réduction de 30%", `<p>Article à 50 €, soldé à −30%. Prix soldé ?</p>
          <p>Prix soldé = <code>50 × (1 − 30/100) = 50 × 0,70 = 35 €</code>.</p>`)}

        <h2>4. Calculer un pourcentage à partir de valeurs</h2>
        ${lc.formula("Pourcentage &nbsp;=&nbsp; (partie / total) × 100")}
        ${lc.example("Quel pourcentage ?", `<p>Sur 200 élèves, 36 portent des lunettes. Quel pourcentage ?</p>
          <p><code>(36 / 200) × 100 = 18%</code>.</p>`)}

        <h2>5. Augmentations et réductions successives</h2>
        ${lc.warn("Piège classique", `<p>Une augmentation de 50% suivie d'une baisse de 50% <strong>ne ramène pas</strong> au prix de départ !</p>
          <p><code>100 → 100 × 1,5 = 150 → 150 × 0,5 = 75</code>. Au final, baisse de 25% par rapport au départ.</p>`)}
        ${lc.example("Deux augmentations", `<p>Un loyer de 600 € subit deux augmentations successives de 5% puis 3%.</p>
          <p>Loyer final = <code>600 × 1,05 × 1,03 = 648,90 €</code>.</p>
          <p>Au total : <code>(648,90 / 600 − 1) × 100 ≈ 8,15%</code>, et non 8% (les pourcentages ne s'additionnent pas).</p>`)}
      `,
    },
    {
      title: "Calcul littéral : expressions et tests",
      category: "Calcul littéral",
      content: `
        <h2>1. Qu'est-ce qu'une expression littérale ?</h2>
        ${lc.def("Expression littérale", `<p>Une <strong>expression littérale</strong> est une expression mathématique qui contient des <strong>lettres</strong> (en plus, parfois, de chiffres).</p>
          <p>Les lettres représentent des nombres dont la valeur peut varier ou est inconnue.</p>`)}
        <p>Exemples : <code>3x + 2</code> ; <code>2a − 5b</code> ; <code>x² + 1</code>.</p>
        ${lc.tip("Notation simplifiée", `<p>On omet souvent le signe × :</p>
          <ul><li><code>3 × x</code> s'écrit <code>3x</code>.</li>
          <li><code>a × b</code> s'écrit <code>ab</code>.</li>
          <li><code>2 × (x + 1)</code> s'écrit <code>2(x + 1)</code>.</li></ul>
          <p>Mais on garde le signe entre deux nombres : <code>3 × 5</code> ne s'écrit jamais <code>35</code>.</p>`)}

        <h2>2. Calculer la valeur d'une expression</h2>
        ${lc.prop("Méthode", `<p>Pour calculer la valeur d'une expression pour une valeur donnée d'une lettre, on <strong>remplace</strong> la lettre par sa valeur, puis on calcule en respectant les priorités.</p>`)}
        ${lc.example("Valeur de 3x + 5 pour x = 4", `<p><code>3x + 5 = 3 × 4 + 5 = 12 + 5 = 17</code>.</p>`)}
        ${lc.example("Valeur de a² − 2a + 1 pour a = 3", `<ol><li>On remplace : <code>3² − 2 × 3 + 1</code>.</li>
          <li>Puissance d'abord : <code>9 − 2 × 3 + 1</code>.</li>
          <li>Multiplication : <code>9 − 6 + 1</code>.</li>
          <li>Gauche à droite : <code>3 + 1 = 4</code>.</li></ol>`)}
        ${lc.warn("Attention au signe", `<p>Pour <code>x = −2</code>, le calcul de <code>x²</code> donne <code>(−2)² = 4</code>. Toujours mettre des parenthèses autour des nombres négatifs lors du remplacement.</p>`)}

        <h2>3. Tester une égalité</h2>
        ${lc.def("Tester une égalité", `<p><strong>Tester</strong> une égalité, c'est vérifier si elle est vraie pour une valeur donnée des lettres. On calcule chaque membre séparément et on compare.</p>`)}
        ${lc.example("L'égalité 2x + 3 = 11 est-elle vraie pour x = 4 ?", `<ol><li>Membre de gauche : <code>2 × 4 + 3 = 11</code>.</li>
          <li>Membre de droite : <code>11</code>.</li>
          <li>Les deux membres sont égaux : oui, l'égalité est vraie pour <code>x = 4</code>.</li></ol>`)}
        ${lc.example("L'égalité 5y − 1 = 14 est-elle vraie pour y = 2 ?", `<ol><li>Gauche : <code>5 × 2 − 1 = 9</code>.</li>
          <li>Droite : <code>14</code>.</li>
          <li><code>9 ≠ 14</code> : l'égalité <strong>n'est pas vraie</strong> pour <code>y = 2</code>.</li></ol>`)}

        <h2>4. Réduire une expression</h2>
        ${lc.def("Réduire", `<p>Réduire une expression littérale, c'est l'écrire avec le moins de termes possibles. On regroupe les termes <strong>de même nature</strong> (mêmes lettres avec les mêmes puissances).</p>`)}
        ${lc.example("Réduire 3x + 5 + 2x − 1", `<ol><li>Termes en x : <code>3x + 2x = 5x</code>.</li>
          <li>Termes constants : <code>5 − 1 = 4</code>.</li>
          <li>Résultat : <code>5x + 4</code>.</li></ol>`)}
        ${lc.warn("Ne pas mélanger", `<p>On <strong>ne peut pas</strong> additionner <code>3x</code> et <code>2</code> : ce ne sont pas des termes de même nature. <code>3x + 2</code> reste <code>3x + 2</code>.</p>`)}
      `,
    },
    {
      title: "Symétrie centrale",
      category: "Géométrie",
      content: `
        <h2>1. Définition</h2>
        ${lc.def("Symétrique d'un point par rapport à un point", `<p>Le <strong>symétrique</strong> d'un point A par rapport à un point O est le point A' tel que O est le <strong>milieu</strong> de [AA'].</p>
          <p>On dit que A et A' sont symétriques par rapport au <strong>centre</strong> O.</p>`)}
        ${lc.tip("Image visuelle", `<p>Imagine que tu fais tourner une figure de <strong>180°</strong> autour du point O : tu obtiens son symétrique.</p>`)}

        <h2>2. Construire un symétrique</h2>
        ${lc.prop("Méthode au compas et à la règle", `<ol>
          <li>Tracer la droite passant par A et O.</li>
          <li>Reporter avec le compas la distance OA, à partir de O, dans le prolongement de [AO].</li>
          <li>Le point obtenu est A', symétrique de A par rapport à O.</li>
        </ol>`)}
        ${lc.example("Cas concret", `<p>A et O sont placés sur la feuille. <code>OA = 4 cm</code>. On trace la droite (OA), on reporte 4 cm de l'autre côté de O. On obtient A' avec <code>OA' = 4 cm</code> et O milieu de [AA'].</p>`)}

        <h2>3. Symétrique d'une figure</h2>
        ${lc.prop("Conservation des longueurs", `<p>La symétrie centrale <strong>conserve</strong> :</p>
          <ul><li>Les <strong>longueurs</strong> (un segment et son symétrique ont même longueur).</li>
          <li>Les <strong>angles</strong> (un angle et son symétrique sont égaux).</li>
          <li>Les <strong>aires</strong> et les <strong>périmètres</strong>.</li>
          <li>Le <strong>parallélisme</strong> et la <strong>perpendicularité</strong>.</li></ul>
          <p>En revanche, elle <strong>inverse l'orientation</strong> (un sens horaire devient anti-horaire).</p>`)}

        <h2>4. Centre de symétrie d'une figure</h2>
        ${lc.def("Centre de symétrie", `<p>Une figure admet un <strong>centre de symétrie</strong> O si la symétrie centrale de centre O laisse la figure inchangée.</p>`)}
        ${lc.prop("Exemples", `<ul><li>Le <strong>cercle</strong> a pour centre de symétrie son centre.</li>
          <li>Le <strong>parallélogramme</strong> a pour centre de symétrie le point d'intersection de ses diagonales.</li>
          <li>Le <strong>rectangle</strong>, le <strong>losange</strong> et le <strong>carré</strong> aussi (ce sont des parallélogrammes particuliers).</li>
          <li>Le <strong>triangle équilatéral</strong> n'a <strong>pas</strong> de centre de symétrie.</li></ul>`)}

        <h2>5. Symétrie centrale vs symétrie axiale</h2>
        ${lc.warn("Ne pas confondre", `<p>La <strong>symétrie axiale</strong> se fait par rapport à une <em>droite</em> (effet miroir). La <strong>symétrie centrale</strong> se fait par rapport à un <em>point</em> (rotation de 180°).</p>
          <p>Test rapide : si une lettre garde la même apparence en la regardant à l'envers (rotation 180°), elle a un centre de symétrie. <code>S</code>, <code>N</code>, <code>Z</code>, <code>O</code>, <code>X</code>, <code>I</code>, <code>H</code> ont un centre de symétrie. <code>A</code>, <code>M</code>, <code>T</code> n'en ont pas.</p>`)}
      `,
    },
    {
      title: "Triangles : construction et propriétés",
      category: "Géométrie",
      content: `
        <h2>1. Vocabulaire</h2>
        ${lc.def("Triangle", `<p>Un <strong>triangle</strong> est une figure formée par <strong>trois points</strong> non alignés (les <strong>sommets</strong>) reliés par trois segments (les <strong>côtés</strong>).</p>`)}
        <p>On nomme un triangle par ses trois sommets : triangle <code>ABC</code>.</p>

        <h2>2. Triangles particuliers</h2>
        ${lc.prop("Les 4 grandes familles", `<ul>
          <li><strong>Isocèle</strong> : 2 côtés de même longueur (et donc 2 angles égaux).</li>
          <li><strong>Équilatéral</strong> : 3 côtés de même longueur (et 3 angles égaux à 60°).</li>
          <li><strong>Rectangle</strong> : 1 angle droit (90°).</li>
          <li><strong>Rectangle isocèle</strong> : 1 angle droit + 2 côtés égaux.</li>
        </ul>`)}
        ${lc.tip("Vocabulaire utile", `<p>Dans un triangle rectangle :</p>
          <ul><li>Les deux côtés qui forment l'angle droit s'appellent les <strong>côtés de l'angle droit</strong> (ou les « pattes »).</li>
          <li>Le grand côté, opposé à l'angle droit, s'appelle l'<strong>hypoténuse</strong>.</li></ul>`)}

        <h2>3. Inégalité triangulaire</h2>
        ${lc.prop("Règle clé", `<p>Dans un triangle, la longueur de chaque côté est <strong>inférieure ou égale</strong> à la somme des deux autres.</p>`)}
        ${lc.formula("AB ≤ AC + CB &nbsp;&nbsp; AC ≤ AB + BC &nbsp;&nbsp; BC ≤ AB + AC")}
        ${lc.example("Peut-on construire un triangle de côtés 3, 4, 8 cm ?", `<p>On vérifie : <code>3 + 4 = 7 < 8</code>. L'inégalité est violée.</p>
          <p>Réponse : <strong>non, ce triangle n'existe pas</strong>. Les deux petits côtés ne se rejoignent pas.</p>`)}
        ${lc.example("Peut-on construire un triangle de côtés 5, 6, 9 cm ?", `<p><code>5 + 6 = 11 > 9</code> ✓ &nbsp;&nbsp; <code>5 + 9 = 14 > 6</code> ✓ &nbsp;&nbsp; <code>6 + 9 = 15 > 5</code> ✓</p>
          <p>Réponse : <strong>oui</strong>, ce triangle existe.</p>`)}

        <h2>4. Somme des angles</h2>
        ${lc.prop("Théorème fondamental", `<p>La somme des trois angles d'un triangle est toujours égale à <strong>180°</strong>.</p>`)}
        ${lc.formula("∠A + ∠B + ∠C &nbsp;=&nbsp; 180°")}
        ${lc.example("Trouver le 3e angle", `<p>Dans un triangle, deux angles mesurent 50° et 65°. Quel est le 3e ?</p>
          <p>Troisième angle = <code>180° − 50° − 65° = 65°</code>.</p>
          <p>(Le triangle est donc isocèle, puisque deux angles sont égaux.)</p>`)}
        ${lc.example("Cas particuliers", `<ul><li><strong>Équilatéral</strong> : trois angles égaux à <code>60°</code> (car <code>180/3 = 60</code>).</li>
          <li><strong>Rectangle</strong> : un angle de 90°. Les deux autres sont complémentaires : leur somme fait 90°.</li>
          <li><strong>Rectangle isocèle</strong> : 90° + 45° + 45°.</li></ul>`)}

        <h2>5. Construction d'un triangle</h2>
        ${lc.prop("Connaître les 3 côtés", `<ol><li>Vérifier d'abord l'inégalité triangulaire.</li>
          <li>Tracer un côté à la règle (par exemple AB).</li>
          <li>À partir de A, tracer un arc de cercle de rayon AC.</li>
          <li>À partir de B, tracer un arc de cercle de rayon BC.</li>
          <li>L'intersection des deux arcs est le point C.</li></ol>`)}
        ${lc.tip("Méthode pratique", `<p>Pour vérifier ton triangle, mesure les trois côtés au final : tu dois retrouver les longueurs demandées (à 1 mm près).</p>`)}
      `,
    },
    {
      title: "Parallélogrammes",
      category: "Géométrie",
      content: `
        <h2>1. Définition</h2>
        ${lc.def("Parallélogramme", `<p>Un <strong>parallélogramme</strong> est un quadrilatère dont les côtés opposés sont <strong>parallèles deux à deux</strong>.</p>`)}

        <h2>2. Propriétés</h2>
        ${lc.prop("Les 4 propriétés-clés", `<p>Dans un parallélogramme :</p>
          <ol><li>Les côtés opposés sont <strong>de même longueur</strong>.</li>
          <li>Les angles opposés sont <strong>égaux</strong>.</li>
          <li>Les diagonales se <strong>coupent en leur milieu</strong>.</li>
          <li>Il a un <strong>centre de symétrie</strong> (l'intersection des diagonales).</li></ol>`)}

        <h2>3. Reconnaître un parallélogramme</h2>
        ${lc.prop("4 façons équivalentes", `<p>Un quadrilatère est un parallélogramme si et seulement si l'<strong>une</strong> des conditions est vraie :</p>
          <ul><li>ses côtés opposés sont parallèles deux à deux ;</li>
          <li>ses côtés opposés sont de même longueur ;</li>
          <li>ses diagonales se coupent en leur milieu ;</li>
          <li>il a deux côtés opposés à la fois <strong>parallèles et de même longueur</strong>.</li></ul>`)}
        ${lc.example("Démontrer qu'ABCD est un parallélogramme", `<p>On sait que <code>AB = 5 cm</code>, <code>CD = 5 cm</code>, et <code>(AB) ∥ (CD)</code>.</p>
          <p>Les côtés [AB] et [CD] sont à la fois parallèles et de même longueur, donc <strong>ABCD est un parallélogramme</strong>.</p>`)}

        <h2>4. Parallélogrammes particuliers</h2>
        ${lc.prop("Le rectangle", `<p>Un <strong>rectangle</strong> est un parallélogramme avec un angle droit (et donc 4 angles droits).</p>
          <p>Propriété supplémentaire : ses diagonales sont de <strong>même longueur</strong>.</p>`)}
        ${lc.prop("Le losange", `<p>Un <strong>losange</strong> est un parallélogramme dont les 4 côtés sont de même longueur.</p>
          <p>Propriété supplémentaire : ses diagonales sont <strong>perpendiculaires</strong>.</p>`)}
        ${lc.prop("Le carré", `<p>Un <strong>carré</strong> est à la fois un rectangle <em>et</em> un losange.</p>
          <p>Donc : 4 côtés égaux, 4 angles droits, diagonales de même longueur, perpendiculaires, et qui se coupent en leur milieu.</p>`)}
        ${lc.tip("Hiérarchie", `<p>Carré ⊂ Rectangle ⊂ Parallélogramme. Carré ⊂ Losange ⊂ Parallélogramme.</p>
          <p>Un carré est un rectangle, mais un rectangle n'est pas forcément un carré.</p>`)}

        <h2>5. Aires (rappels)</h2>
        ${lc.formula("Parallélogramme &nbsp;:&nbsp; A = base × hauteur")}
        ${lc.formula("Rectangle &nbsp;:&nbsp; A = longueur × largeur")}
        ${lc.formula("Carré &nbsp;:&nbsp; A = côté²")}
        ${lc.formula("Losange &nbsp;:&nbsp; A = (D × d) / 2  (D et d = diagonales)")}
        ${lc.example("Aire d'un parallélogramme", `<p>Base = 8 cm, hauteur = 5 cm. Aire = <code>8 × 5 = 40 cm²</code>.</p>
          <p>Attention : la <strong>hauteur</strong> est la distance entre la base et le côté opposé, mesurée perpendiculairement (et non la longueur du côté oblique).</p>`)}
      `,
    },
  ];
}

// ─── État + persistance ─────────────────────────────────────────
const STATE_KEY = 'mathcours_v1';
let state = { levelId: '5e', chapterId: null };

function loadState() {
  try {
    const raw = localStorage.getItem(STATE_KEY);
    if (!raw) return;
    const parsed = JSON.parse(raw);
    if (parsed.levelId) state.levelId = parsed.levelId;
    if (parsed.chapterId) state.chapterId = parsed.chapterId;
  } catch (e) { /* ignore */ }
}

function saveState() {
  try { localStorage.setItem(STATE_KEY, JSON.stringify(state)); }
  catch (e) { /* ignore quota */ }
}

function findLevel(id) {
  for (const g of CURRICULUM) for (const l of g.levels) if (l.id === id) return l;
  return null;
}

function levelStats(level) {
  const filled = level.chapters.filter(c => c.content).length;
  return { filled, total: level.chapters.length };
}

// ─── Rendering ──────────────────────────────────────────────────
function renderSidebar() {
  const sidebar = $('#sidebar');
  sidebar.innerHTML = '';
  for (const group of CURRICULUM) {
    const groupDiv = el('div', { class: 'group' });
    groupDiv.appendChild(el('h4', {}, group.name));
    for (const level of group.levels) {
      const isActive = state.levelId === level.id;
      const stats = levelStats(level);
      const lvlBtn = el('button', {
        class: 'lvl-btn' + (isActive ? ' active' : ''),
        onclick: () => {
          state.levelId = level.id;
          state.chapterId = null;
          saveState();
          render();
          closeSidebarMobile();
        }
      });
      lvlBtn.appendChild(el('span', {}, level.name));
      lvlBtn.appendChild(el('span', { class: 'count' }, `${stats.filled}/${stats.total}`));
      groupDiv.appendChild(lvlBtn);
      if (isActive) {
        const chapsBox = el('div', { class: 'chapters' });
        // Grouper par catégorie
        let lastCat = null;
        for (let i = 0; i < level.chapters.length; i++) {
          const ch = level.chapters[i];
          if (ch.category !== lastCat) {
            chapsBox.appendChild(el('div', { class: 'chap-cat' }, ch.category));
            lastCat = ch.category;
          }
          const chId = `${level.id}-${i}`;
          const isChActive = state.chapterId === chId;
          chapsBox.appendChild(el('button', {
            class: 'chap-btn' + (isChActive ? ' active' : '') + (ch.content ? '' : ' placeholder'),
            onclick: () => {
              state.chapterId = chId;
              saveState();
              render();
              closeSidebarMobile();
            }
          }, `${i + 1}. ${ch.title}`));
        }
        groupDiv.appendChild(chapsBox);
      }
    }
    sidebar.appendChild(groupDiv);
  }
}

function renderBreadcrumb() {
  const bc = $('#breadcrumb');
  bc.innerHTML = '';
  if (!state.levelId) return;
  const level = findLevel(state.levelId);
  if (!level) return;
  bc.appendChild(el('span', { class: 'crumb' + (state.chapterId ? '' : ' current') }, level.name));
  if (state.chapterId) {
    const idx = parseChapterIdx(state.chapterId);
    const ch = level.chapters[idx];
    if (ch) {
      bc.appendChild(el('span', { class: 'sep' }, '›'));
      bc.appendChild(el('span', { class: 'crumb current' }, ch.title));
    }
  }
}

function parseChapterIdx(chapterId) {
  // chapterId = `${level.id}-${i}` ; on extrait l'index final.
  const m = chapterId.match(/-(\d+)$/);
  return m ? parseInt(m[1], 10) : -1;
}

function renderContent() {
  const main = $('#content');
  main.innerHTML = '';
  if (!state.levelId) {
    renderHome(main);
    return;
  }
  const level = findLevel(state.levelId);
  if (!level) { renderHome(main); return; }
  if (!state.chapterId) {
    renderLevelIndex(main, level);
    return;
  }
  const idx = parseChapterIdx(state.chapterId);
  const chapter = level.chapters[idx];
  if (!chapter) { renderLevelIndex(main, level); return; }
  renderChapter(main, level, chapter, idx);
}

function renderHome(main) {
  main.appendChild(el('div', { class: 'breadcrumb' }, 'Accueil'));
  main.appendChild(el('h1', {}, 'Cours de maths'));
  main.appendChild(el('p', {}, "Choisis un niveau pour commencer. Le programme couvre du collège (6e) au post-bac (analyse, algèbre, probas)."));
  for (const group of CURRICULUM) {
    main.appendChild(el('h2', {}, group.name));
    const grid = el('div', { class: 'levels-grid' });
    for (const level of group.levels) {
      const stats = levelStats(level);
      const card = el('button', {
        class: 'lvl-card',
        onclick: () => { state.levelId = level.id; state.chapterId = null; saveState(); render(); }
      });
      card.appendChild(el('div', { class: 'lvl-name' }, level.name));
      const info = el('div', { class: 'lvl-info' });
      if (stats.filled === stats.total) {
        info.appendChild(el('span', { class: 'filled' }, `✓ ${stats.total} chapitres rédigés`));
      } else if (stats.filled > 0) {
        info.appendChild(el('span', {}, `${stats.filled}/${stats.total} chapitres rédigés`));
      } else {
        info.appendChild(el('span', {}, `${stats.total} chapitres (à venir)`));
      }
      card.appendChild(info);
      grid.appendChild(card);
    }
    main.appendChild(grid);
  }
}

function renderLevelIndex(main, level) {
  const stats = levelStats(level);
  main.appendChild(el('div', { class: 'breadcrumb' }, level.name));
  main.appendChild(el('h1', {}, `Programme de ${level.name}`));
  const meta = el('div', { class: 'meta' });
  meta.appendChild(el('span', { class: 'pill' }, `${stats.total} chapitres`));
  if (stats.filled === stats.total) {
    meta.appendChild(el('span', { class: 'pill', style: 'background:var(--success-soft);color:var(--success-text)' }, `✓ Tous rédigés`));
  } else if (stats.filled > 0) {
    meta.appendChild(el('span', { class: 'pill' }, `${stats.filled} rédigés`));
    meta.appendChild(el('span', { class: 'pill placeholder' }, `${stats.total - stats.filled} à venir`));
  } else {
    meta.appendChild(el('span', { class: 'pill placeholder' }, `Contenu à venir`));
  }
  main.appendChild(meta);
  // Description courte
  if (stats.filled === 0) {
    main.appendChild(el('p', {}, "Les chapitres de ce niveau sont structurés (titres + catégories visibles dans la barre latérale) mais leur contenu sera ajouté lors d'une prochaine session de rédaction."));
  } else if (stats.filled < stats.total) {
    main.appendChild(el('p', {}, "Les chapitres déjà rédigés sont en bleu, les autres en gris (placeholders à venir)."));
  } else {
    main.appendChild(el('p', {}, "Tous les chapitres du programme sont disponibles. Choisis-en un pour commencer."));
  }
  // Liste groupée par catégorie
  const byCat = {};
  for (let i = 0; i < level.chapters.length; i++) {
    const c = level.chapters[i];
    if (!byCat[c.category]) byCat[c.category] = [];
    byCat[c.category].push({ ...c, idx: i });
  }
  for (const cat of Object.keys(byCat)) {
    const section = el('div', { class: 'cat-section' });
    section.appendChild(el('h2', {}, cat));
    const list = el('div', { class: 'chap-list' });
    for (const c of byCat[cat]) {
      const item = el('button', {
        class: 'chap-item' + (c.content ? '' : ' placeholder'),
        onclick: () => {
          state.chapterId = `${level.id}-${c.idx}`;
          saveState();
          render();
        }
      });
      item.appendChild(el('div', { class: 'num' }, String(c.idx + 1)));
      item.appendChild(el('span', {}, c.title));
      if (!c.content) item.appendChild(el('span', { class: 'badge-todo' }, 'À venir'));
      list.appendChild(item);
    }
    section.appendChild(list);
    main.appendChild(section);
  }
}

function renderChapter(main, level, chapter, idx) {
  main.appendChild(el('div', { class: 'breadcrumb' }, `${level.name} · ${chapter.category}`));
  main.appendChild(el('h1', {}, chapter.title));
  const meta = el('div', { class: 'meta' });
  meta.appendChild(el('span', { class: 'pill' }, `Chapitre ${idx + 1}`));
  meta.appendChild(el('span', { class: 'pill' }, chapter.category));
  main.appendChild(meta);
  if (!chapter.content) {
    const empty = el('div', { class: 'empty-state' });
    empty.appendChild(el('div', { class: 'big' }, '📝'));
    empty.appendChild(el('p', { html: `Ce chapitre n'est <strong>pas encore rédigé</strong>.` }));
    empty.appendChild(el('p', {}, "Il sera ajouté lors d'une prochaine session — niveau par niveau, en commençant par les fondamentaux."));
    const backWrap = el('p', { style: 'margin-top:20px' });
    // Bouton « Retour » via addEventListener, pas via onclick="" inline.
    // En ES6, les let/const top-level du script tag ne sont PAS exposés
    // sur window, donc un handler inline plantait avec « state is not
    // defined ».
    backWrap.appendChild(el('button', {
      class: 'nav-btn',
      onclick: () => { state.chapterId = null; saveState(); render(); }
    }, 'Retour au sommaire'));
    empty.appendChild(backWrap);
    main.appendChild(empty);
    return;
  }
  const body = el('div');
  body.innerHTML = chapter.content;
  main.appendChild(body);
  // Navigation chapitre suivant / précédent
  const nav = el('div', { class: 'chap-nav' });
  if (idx > 0) {
    const prev = level.chapters[idx - 1];
    const b = el('button', {
      class: 'nav-btn',
      onclick: () => { state.chapterId = `${level.id}-${idx - 1}`; saveState(); render(); }
    });
    b.appendChild(el('span', { class: 'small' }, '← Précédent'));
    b.appendChild(el('span', {}, prev.title));
    nav.appendChild(b);
  } else {
    nav.appendChild(el('div', {}));
  }
  if (idx < level.chapters.length - 1) {
    const next = level.chapters[idx + 1];
    const b = el('button', {
      class: 'nav-btn next',
      onclick: () => { state.chapterId = `${level.id}-${idx + 1}`; saveState(); render(); }
    });
    b.appendChild(el('span', { class: 'small' }, 'Suivant →'));
    b.appendChild(el('span', {}, next.title));
    nav.appendChild(b);
  }
  main.appendChild(nav);
}

function render() {
  renderSidebar();
  renderBreadcrumb();
  renderContent();
  window.scrollTo({ top: 0 });
}

// ─── Mobile menu ────────────────────────────────────────────────
function openSidebarMobile() {
  $('#sidebar').classList.add('open');
  $('#backdrop').classList.add('show');
}
function closeSidebarMobile() {
  $('#sidebar').classList.remove('open');
  $('#backdrop').classList.remove('show');
}

// ─── Boot ───────────────────────────────────────────────────────
function boot() {
  loadState();
  render();
  $('#menu-btn').addEventListener('click', openSidebarMobile);
  $('#backdrop').addEventListener('click', closeSidebarMobile);
}

boot();
</script>
</body>
</html>
