          <li><code>A_y = ((2,7);(4,5))</code>, <code>det = 10 − 28 = −18</code>. Donc <code>y = −18/−14 = 9/7</code>.</li></ul>`)}

        <h2>9. Caractérisation complète de l'inversibilité</h2>
        ${lc.prop("Toutes ces conditions sont équivalentes (matrice carrée n×n)", `<ul>
          <li><code>A</code> est inversible ;</li>
          <li><code>det(A) ≠ 0</code> ;</li>
          <li><code>rg(A) = n</code> ;</li>
          <li><code>ker(A) = {0}</code> (seul le vecteur nul est dans le noyau) ;</li>
          <li>Pour tout <code>B</code>, le système <code>AX = B</code> a <strong>une unique</strong> solution ;</li>
          <li>0 n'est <strong>pas</strong> valeur propre de <code>A</code> ;</li>
          <li>Les colonnes de <code>A</code> forment une famille libre (donc une base de ℝⁿ) ;</li>
          <li>Les lignes de <code>A</code> forment une famille libre.</li>
        </ul>`)}
        ${lc.tip("Mémoriser", `<p>Cette équivalence est <em>le</em> théorème central de l'algèbre linéaire en dimension finie : tout (presque) se ramène à ces conditions.</p>`)}
      `,
    },

    {
      title: "Diagonalisation, valeurs propres",
      category: "Algèbre linéaire",
      content: `
        <h2>1. Vecteurs et valeurs propres</h2>
        ${lc.def("Valeur propre", `<p>Un scalaire <code>λ</code> est <strong>valeur propre</strong> de la matrice <code>A</code> s'il existe un vecteur <strong>non nul</strong> <code>v</code> tel que :</p>`)}
        ${lc.formula("A × v = λ × v")}
        <p>Le vecteur <code>v</code> est appelé <strong>vecteur propre</strong> associé à <code>λ</code>.</p>

        <h2>2. Polynôme caractéristique</h2>
        ${lc.def("Polynôme caractéristique", `<p>Le <strong>polynôme caractéristique</strong> de <code>A</code> est :</p>`)}
        ${lc.formula("P_A(λ) = det(A − λI)")}
        ${lc.prop("Théorème", `<p>Les valeurs propres de <code>A</code> sont exactement les <strong>racines</strong> de <code>P_A</code>.</p>`)}
        ${lc.example("Calcul des valeurs propres de A = ((4, 1); (2, 3))", `<ol>
          <li><code>A − λI = ((4 − λ, 1); (2, 3 − λ))</code>.</li>
          <li><code>P_A(λ) = (4 − λ)(3 − λ) − 2 = λ² − 7λ + 10</code>.</li>
          <li>Racines : <code>λ² − 7λ + 10 = 0</code>, Δ = 49 − 40 = 9, λ = (7±3)/2.</li>
          <li>Valeurs propres : <code>λ₁ = 5</code>, <code>λ₂ = 2</code>.</li>
        </ol>`)}

        <h2>3. Sous-espaces propres</h2>
        ${lc.def("Sous-espace propre", `<p>Le <strong>sous-espace propre</strong> associé à <code>λ</code> est :</p>`)}
        ${lc.formula("E_λ = ker(A − λI) = { v : Av = λv }")}
        ${lc.example("Sous-espaces propres de A précédente", `<p>Pour <code>λ = 5</code> : résoudre <code>(A − 5I)v = 0</code>.</p>
          <p><code>A − 5I = ((−1, 1); (2, −2))</code>. Système : <code>−x + y = 0</code>, donc <code>y = x</code>.</p>
          <p><code>E_5 = vect((1, 1))</code>. Vecteur propre : <code>(1, 1)</code>.</p>
          <p>Pour <code>λ = 2</code> : <code>A − 2I = ((2, 1); (2, 1))</code>. Système : <code>2x + y = 0</code>, vecteur propre <code>(1, −2)</code>.</p>`)}

        <h2>4. Diagonalisation</h2>
        ${lc.def("Matrice diagonalisable", `<p>Une matrice <code>A</code> est <strong>diagonalisable</strong> s'il existe une base de vecteurs propres. Dans ce cas :</p>`)}
        ${lc.formula("A = P × D × P⁻¹")}
        <p>où <code>D</code> est diagonale (valeurs propres) et <code>P</code> a pour colonnes les vecteurs propres.</p>
        ${lc.warn("Sens de la formule : P·D·P⁻¹, pas P⁻¹·D·P", `<p>L'erreur classique est d'écrire <code>A = P⁻¹DP</code>. Souvenez-vous : si <code>P</code> a pour colonnes les vecteurs propres, alors <code>P</code> est la matrice qui envoie la <em>base canonique</em> sur la <em>base de vecteurs propres</em>. Donc <code>A·P = P·D</code>, soit <code>A = P·D·P⁻¹</code>.</p>`)}
        ${lc.prop("Critère", `<p>Une matrice <code>n × n</code> est diagonalisable si la somme des dimensions des sous-espaces propres égale <code>n</code>. Cas suffisant : si elle a <code>n</code> valeurs propres distinctes.</p>`)}

        <h2>5. Application : puissances de matrice</h2>
        ${lc.example("Calculer A^k", `<p>Si <code>A = PDP⁻¹</code> :</p>`)}
        ${lc.formula("A^k = P × D^k × P⁻¹")}
        <p><code>D^k</code> se calcule trivialement (élever chaque valeur propre à la puissance <code>k</code>).</p>
        ${lc.tip("Pourquoi c'est utile", `<p>Permet d'étudier des systèmes dynamiques discrets, des suites définies par récurrence matricielle, etc.</p>`)}
      `,
    },

    {
      title: "Produits scalaires en dimension n",
      category: "Algèbre linéaire",
      content: `
        <h2>1. Définition</h2>
        ${lc.def("Produit scalaire", `<p>Un <strong>produit scalaire</strong> sur un espace vectoriel <code>E</code> est une forme bilinéaire :</p>
          <ul><li><strong>symétrique</strong> : <code>⟨u, v⟩ = ⟨v, u⟩</code> ;</li>
          <li><strong>définie positive</strong> : <code>⟨u, u⟩ ≥ 0</code> et <code>⟨u, u⟩ = 0 ⇔ u = 0</code>.</li></ul>`)}
        ${lc.example("Produit scalaire canonique sur ℝⁿ", `<p>Pour <code>u = (x₁, …, xₙ)</code> et <code>v = (y₁, …, yₙ)</code> :</p>
          <p><code>⟨u, v⟩ = x₁y₁ + x₂y₂ + … + xₙyₙ</code>.</p>`)}

        <h2>2. Norme et distance</h2>
        ${lc.formula("||u|| = √⟨u, u⟩")}
        ${lc.formula("d(u, v) = ||u − v||")}
        ${lc.prop("Inégalité de Cauchy-Schwarz", `<p>Pour tous <code>u, v</code> :</p>`)}
        ${lc.formula("|⟨u, v⟩| ≤ ||u|| × ||v||")}
        <p>Avec égalité si et seulement si <code>u</code> et <code>v</code> sont colinéaires.</p>
        ${lc.example("Vérification chiffrée", `<p>Soit <code>u = (1, 2, 2)</code> et <code>v = (2, 1, 0)</code> dans ℝ³.</p>
          <ol><li><code>⟨u, v⟩ = 1×2 + 2×1 + 2×0 = 4</code>. <code>|⟨u, v⟩| = 4</code>.</li>
          <li><code>||u|| = √(1 + 4 + 4) = 3</code>. <code>||v|| = √(4 + 1) = √5</code>.</li>
          <li><code>||u|| × ||v|| = 3√5 ≈ 6,7</code>.</li>
          <li>Vérification : <code>4 ≤ 6,7</code> ✓ (non colinéaires, donc inégalité stricte).</li>
          <li>Cas d'égalité avec <code>w = (2, 4, 4) = 2u</code> : <code>⟨u, w⟩ = 2 + 8 + 8 = 18</code>, <code>||u|| × ||w|| = 3 × 6 = 18</code> ✓ (colinéaires).</li>
        </ol>`)}

        <h2>3. Orthogonalité</h2>
        ${lc.def("Vecteurs orthogonaux", `<p>Deux vecteurs <code>u</code> et <code>v</code> sont <strong>orthogonaux</strong> si <code>⟨u, v⟩ = 0</code>. On note <code>u ⊥ v</code>.</p>`)}
        ${lc.prop("Théorème de Pythagore", `<p>Si <code>u ⊥ v</code> :</p>`)}
        ${lc.formula("||u + v||² = ||u||² + ||v||²")}

        <h2>4. Bases orthonormées</h2>
        ${lc.def("Base orthonormée", `<p>Une base <code>(e₁, …, eₙ)</code> est <strong>orthonormée</strong> si :</p>
          <ul><li>les vecteurs sont deux à deux orthogonaux : <code>⟨eᵢ, eⱼ⟩ = 0</code> si <code>i ≠ j</code> ;</li>
          <li>chaque vecteur est unitaire : <code>||eᵢ|| = 1</code>.</li></ul>`)}
        ${lc.tip("Coordonnées dans une BON", `<p>Si <code>(eᵢ)</code> est une BON, les coordonnées d'un vecteur <code>u</code> dans cette base sont <code>⟨u, eᵢ⟩</code>.</p>`)}

        <h2>5. Procédé de Gram-Schmidt</h2>
        ${lc.prop("Orthogonalisation", `<p>À partir d'une famille libre <code>(v₁, …, vₙ)</code>, on construit une base orthonormée <code>(e₁, …, eₙ)</code> du sous-espace engendré, par récurrence :</p>
          <ol><li><code>e₁ = v₁ / ||v₁||</code>.</li>
          <li>Pour <code>k > 1</code>, on calcule <code>w_k = v_k − Σᵢ ⟨v_k, eᵢ⟩ × eᵢ</code> (somme sur i = 1..k−1), puis <code>e_k = w_k / ||w_k||</code>.</li></ol>`)}
        ${lc.example("Gram-Schmidt sur ℝ³", `<p>Soit <code>v₁ = (1, 1, 0)</code>, <code>v₂ = (1, 0, 1)</code>, <code>v₃ = (0, 1, 1)</code>. Construisons une BON.</p>
          <ol>
          <li><strong>Étape 1</strong> : <code>||v₁|| = √2</code>. Donc <code>e₁ = (1/√2, 1/√2, 0)</code>.</li>
          <li><strong>Étape 2</strong> : <code>⟨v₂, e₁⟩ = 1×(1/√2) + 0 + 0 = 1/√2</code>.<br>
            <code>w₂ = v₂ − (1/√2) × e₁ = (1, 0, 1) − (1/2, 1/2, 0) = (1/2, −1/2, 1)</code>.<br>
            <code>||w₂|| = √(1/4 + 1/4 + 1) = √(3/2) = √6/2</code>.<br>
            <code>e₂ = w₂ / ||w₂|| = (1/√6, −1/√6, 2/√6)</code>.</li>
          <li><strong>Étape 3</strong> : on retire les projections sur <code>e₁</code> et <code>e₂</code> à <code>v₃</code>, puis on normalise. Calcul similaire (laissé en exercice).</li>
          <li>Résultat : la famille <code>(e₁, e₂, e₃)</code> est une base orthonormée de ℝ³.</li>
          </ol>
          <p>Vérification rapide : <code>⟨e₁, e₂⟩ = (1/√2)(1/√6) + (1/√2)(−1/√6) + 0 = 0</code> ✓.</p>
        `)}

        <h2>6. Projection orthogonale</h2>
        ${lc.def("Projeté orthogonal", `<p>Soit <code>F</code> un sous-espace vectoriel de <code>E</code>. Le <strong>projeté orthogonal</strong> de <code>u</code> sur <code>F</code> est l'unique vecteur <code>p ∈ F</code> tel que <code>u − p</code> est orthogonal à <code>F</code>.</p>`)}
        ${lc.formula("Si (e₁, …, e_k) est une BON de F : p = Σᵢ ⟨u, eᵢ⟩ × eᵢ")}
        ${lc.tip("Application", `<p>Le projeté orthogonal est l'élément de <code>F</code> le plus proche de <code>u</code> au sens de la distance : <code>||u − p|| ≤ ||u − w||</code> pour tout <code>w ∈ F</code>. C'est la base de la <strong>méthode des moindres carrés</strong>.</p>`)}
      `,
    },

    {
      title: "Changement de base et théorème spectral",
      category: "Algèbre linéaire",
      content: `
        <h2>1. Matrice de passage</h2>
        ${lc.def("Matrice de passage", `<p>Soit <code>B = (e₁, …, eₙ)</code> et <code>B' = (e'₁, …, e'ₙ)</code> deux bases d'un même espace vectoriel <code>E</code>. La <strong>matrice de passage</strong> de <code>B</code> à <code>B'</code>, notée <code>P_{B → B'}</code>, est la matrice dont les colonnes sont les coordonnées des vecteurs de <code>B'</code> exprimés dans <code>B</code>.</p>`)}
        ${lc.prop("Propriété", `<p><code>P_{B → B'}</code> est inversible, et <code>(P_{B → B'})⁻¹ = P_{B' → B}</code>.</p>`)}

        <h2>2. Formule de changement de coordonnées</h2>
        ${lc.formula("Si X est le vecteur colonne des coordonnées dans B, et X' celui dans B' :<br>X = P × X' &nbsp;&nbsp; (avec P = P_{B → B'})")}

        <h2>3. Changement de base pour une matrice</h2>
        ${lc.prop("Formule fondamentale", `<p>Si <code>f</code> est un endomorphisme de matrice <code>A</code> dans <code>B</code> et <code>A'</code> dans <code>B'</code> :</p>`)}
        ${lc.formula("A' = P⁻¹ × A × P &nbsp;&nbsp; (P = matrice de passage B → B')")}
        <p>Les matrices <code>A</code> et <code>A'</code> sont dites <strong>semblables</strong>.</p>

        <h2>4. Multiplicité algébrique vs géométrique</h2>
        ${lc.def("Multiplicités", `<ul>
          <li><strong>Multiplicité algébrique</strong> de <code>λ</code> : ordre de <code>λ</code> comme racine du polynôme caractéristique <code>P_A</code>.</li>
          <li><strong>Multiplicité géométrique</strong> de <code>λ</code> : dimension du sous-espace propre <code>E_λ = ker(A − λI)</code>.</li>
        </ul>`)}
        ${lc.prop("Inégalité fondamentale", `<p>Pour toute valeur propre <code>λ</code> :</p>`)}
        ${lc.formula("1 ≤ mult_géo(λ) ≤ mult_alg(λ)")}
        ${lc.prop("Critère de diagonalisation", `<p>Une matrice est diagonalisable si et seulement si pour chaque valeur propre, <strong>mult_géo = mult_alg</strong>.</p>`)}

        <h2>5. Théorème de Cayley-Hamilton</h2>
        ${lc.prop("Énoncé", `<p>Toute matrice carrée <code>A</code> annule son polynôme caractéristique :</p>`)}
        ${lc.formula("P_A(A) = 0")}
        ${lc.tip("Conséquence", `<p>Permet d'exprimer <code>A^n</code> en fonction de puissances inférieures, ou de calculer <code>A⁻¹</code> sans inverser de matrice.</p>`)}

        <h2>6. Théorème spectral</h2>
        ${lc.prop("Énoncé (cas réel)", `<p>Toute matrice <strong>symétrique réelle</strong> est <strong>diagonalisable dans une base orthonormée</strong>. Plus précisément, il existe une matrice orthogonale <code>P</code> (avec <code>P^T = P⁻¹</code>) telle que :</p>`)}
        ${lc.formula("P^T × A × P = D &nbsp;&nbsp; (D diagonale)")}
        ${lc.tip("Conséquence", `<p>Les valeurs propres d'une matrice symétrique réelle sont toujours <strong>réelles</strong>, et il existe une base orthonormée de vecteurs propres.</p>`)}
        ${lc.example("Application en physique", `<p>Le tenseur d'inertie d'un solide est symétrique. Le théorème spectral dit qu'il existe trois axes principaux d'inertie deux à deux orthogonaux.</p>`)}

        <h2>7. Formes quadratiques (notion)</h2>
        ${lc.def("Forme quadratique", `<p>Une <strong>forme quadratique</strong> sur ℝⁿ est une application <code>q(x) = x^T × A × x</code> où <code>A</code> est une matrice symétrique. Sa <strong>signature</strong> (nombre de valeurs propres positives, négatives, nulles) caractérise sa nature géométrique.</p>`)}
      `,
    },
  ];
}

// ─── Contenu pédagogique : Post-bac Probabilités ─────────────────
function chaptersProbasPostBac() {
  return [
    {
      title: "Espaces probabilisés",
      category: "Probabilités",
      content: `
        <h2>1. Univers et tribu</h2>
        ${lc.def("Univers", `<p>L'<strong>univers</strong> <code>Ω</code> est l'ensemble de toutes les issues possibles d'une expérience aléatoire.</p>`)}
        ${lc.def("Tribu", `<p>Une <strong>tribu</strong> <code>𝓕</code> sur <code>Ω</code> est une collection de parties de <code>Ω</code> contenant <code>∅</code> et <code>Ω</code>, stable par <strong>complémentaire</strong> et par <strong>union dénombrable</strong>.</p>
          <p>Les éléments de <code>𝓕</code> sont les <strong>événements</strong>.</p>`)}

        <h2>2. Probabilité</h2>
        ${lc.def("Probabilité (axiomes de Kolmogorov)", `<p>Une <strong>probabilité</strong> est une application <code>P : 𝓕 → [0, 1]</code> vérifiant :</p>
          <ul><li><code>P(Ω) = 1</code> ;</li>
          <li>pour toute famille dénombrable d'événements <em>disjoints</em> <code>(Aₙ)</code> : <code>P(∪ Aₙ) = Σ P(Aₙ)</code> (σ-additivité).</li></ul>`)}

        <h2>3. Propriétés élémentaires</h2>
        ${lc.formula("P(∅) = 0")}
        ${lc.formula("P(Ā) = 1 − P(A)")}
        ${lc.formula("P(A ∪ B) = P(A) + P(B) − P(A ∩ B)")}
        ${lc.formula("Si A ⊂ B : P(A) ≤ P(B)")}
        ${lc.formula("P(∪ Aᵢ) ≤ Σ P(Aᵢ)  (inégalité de Boole)")}

        <h2>4. Probabilité conditionnelle</h2>
        ${lc.def("Conditionnement", `<p>Si <code>P(B) > 0</code>, la probabilité conditionnelle de <code>A</code> sachant <code>B</code> est :</p>`)}
        ${lc.formula("P(A | B) = P(A ∩ B) / P(B)")}
        ${lc.prop("Formule de Bayes", `<p>Pour deux événements <code>A</code> et <code>B</code> avec <code>P(B) > 0</code> :</p>`)}
        ${lc.formula("P(A | B) = P(B | A) × P(A) / P(B)")}

        <h2>5. Probabilités totales</h2>
        ${lc.prop("Théorème", `<p>Si <code>(Bᵢ)</code> forme une partition (finie ou dénombrable) de <code>Ω</code>, alors pour tout <code>A</code> :</p>`)}
        ${lc.formula("P(A) = Σᵢ P(A ∩ Bᵢ) = Σᵢ P(A | Bᵢ) × P(Bᵢ)")}

        <h2>6. Indépendance</h2>
        ${lc.def("Indépendance", `<p><code>A</code> et <code>B</code> sont <strong>indépendants</strong> si <code>P(A ∩ B) = P(A) × P(B)</code>.</p>`)}
        ${lc.def("Indépendance mutuelle", `<p>Une famille <code>(Aᵢ)</code> est <strong>mutuellement indépendante</strong> si pour toute sous-famille <code>(Aᵢ₁, …, Aᵢₖ)</code> : <code>P(Aᵢ₁ ∩ … ∩ Aᵢₖ) = P(Aᵢ₁) × … × P(Aᵢₖ)</code>.</p>`)}
        ${lc.warn("Indépendance 2 à 2 ≠ mutuelle", `<p>Trois événements peuvent être indépendants deux à deux sans être mutuellement indépendants. La condition mutuelle est strictement plus forte.</p>`)}
      `,
    },

    {
      title: "Variables aléatoires discrètes",
      category: "Probabilités",
      content: `
        <h2>1. Définition</h2>
        ${lc.def("Variable aléatoire discrète", `<p>Une <strong>variable aléatoire discrète</strong> est une application <code>X : Ω → ℝ</code> dont l'ensemble des valeurs <code>X(Ω)</code> est <strong>fini ou dénombrable</strong>.</p>`)}

        <h2>2. Loi de probabilité</h2>
        ${lc.def("Loi de X", `<p>Donner la <strong>loi</strong> de <code>X</code>, c'est donner toutes les valeurs <code>x_k</code> possibles avec leurs probabilités <code>p_k = P(X = x_k)</code>. La somme des <code>p_k</code> vaut 1.</p>`)}

        <h2>3. Espérance</h2>
        ${lc.formula("E(X) = Σ_k x_k × P(X = x_k)")}
        <p>(série supposée absolument convergente.)</p>
        ${lc.prop("Linéarité", `<p>Pour <code>X</code>, <code>Y</code> et constantes <code>a</code>, <code>b</code> :</p>`)}
        ${lc.formula("E(aX + bY) = a × E(X) + b × E(Y)")}

        <h2>4. Variance et écart-type</h2>
        ${lc.formula("V(X) = E((X − E(X))²) = E(X²) − E(X)²")}
        ${lc.formula("σ(X) = √V(X)")}
        ${lc.formula("V(aX + b) = a² × V(X)")}

        <h2>5. Moments</h2>
        ${lc.def("Moment d'ordre k", `<p>Le <strong>moment d'ordre k</strong> de <code>X</code> est <code>E(X^k)</code>. Le moment d'ordre 1 est l'espérance ; le moment centré d'ordre 2 est la variance.</p>`)}

        <h2>6. Inégalités classiques</h2>
        ${lc.prop("Inégalité de Markov", `<p>Pour <code>X ≥ 0</code> et <code>a > 0</code> :</p>`)}
        ${lc.formula("P(X ≥ a) ≤ E(X) / a")}
        ${lc.prop("Inégalité de Bienaymé-Tchebychev", `<p>Pour tout <code>ε > 0</code> :</p>`)}
        ${lc.formula("P(|X − E(X)| ≥ ε) ≤ V(X) / ε²")}
        ${lc.tip("Utilité", `<p>Ces inégalités permettent de borner les probabilités d'<em>écarts</em> à la moyenne sans connaître la loi exacte.</p>`)}

        <h2>7. Théorème de transfert (cas discret)</h2>
        ${lc.prop("Énoncé", `<p>Pour toute fonction <code>g</code>, si <code>X</code> est discrète :</p>`)}
        ${lc.formula("E(g(X)) = Σ_k g(x_k) × P(X = x_k)")}
        <p>Cas particulier : <code>E(X²) = Σ x_k² × P(X = x_k)</code>, qui sert à calculer la variance via König-Huygens.</p>

        <h2>8. Couples (X, Y)</h2>
        ${lc.def("Loi conjointe", `<p>La <strong>loi conjointe</strong> de <code>(X, Y)</code> est donnée par les <code>P(X = x_i, Y = y_j)</code>.</p>`)}
        ${lc.def("Indépendance", `<p><code>X</code> et <code>Y</code> sont <strong>indépendantes</strong> si pour tous <code>x</code>, <code>y</code> : <code>P(X = x, Y = y) = P(X = x) × P(Y = y)</code>.</p>`)}

        <h2>9. Covariance et corrélation</h2>
        ${lc.def("Covariance", `<p>La <strong>covariance</strong> de deux variables aléatoires est :</p>`)}
        ${lc.formula("Cov(X, Y) = E((X − E(X))(Y − E(Y))) = E(XY) − E(X) × E(Y)")}
        ${lc.formula("V(X + Y) = V(X) + V(Y) + 2 × Cov(X, Y)")}
        ${lc.prop("Si X et Y sont indépendantes", `<p><code>Cov(X, Y) = 0</code>, donc <code>V(X+Y) = V(X) + V(Y)</code>.</p>`)}
        ${lc.warn("Réciproque fausse", `<p>Cov = 0 n'implique <strong>pas</strong> l'indépendance. Cov mesure une dépendance <em>linéaire</em> ; deux variables peuvent être très liées par une relation non linéaire (ex. <code>Y = X²</code>) avec Cov = 0.</p>`)}
        ${lc.def("Coefficient de corrélation", `<p>Le <strong>coefficient de corrélation linéaire</strong> est :</p>`)}
        ${lc.formula("ρ(X, Y) = Cov(X, Y) / (σ(X) × σ(Y))")}
        <p>Il vérifie <code>−1 ≤ ρ ≤ 1</code>. Plus <code>|ρ|</code> est proche de 1, plus la dépendance linéaire est forte.</p>
      `,
    },

    {
      title: "Variables aléatoires continues",
      category: "Probabilités",
      content: `
        <h2>1. Définition</h2>
        ${lc.def("Variable continue à densité", `<p>Une variable aléatoire <code>X</code> est <strong>continue à densité</strong> s'il existe une fonction positive <code>f</code> (la <strong>densité</strong>) telle que :</p>`)}
        ${lc.formula("P(a ≤ X ≤ b) = ∫_a^b f(x) dx")}
        <p>Avec <code>∫_{−∞}^{+∞} f(x) dx = 1</code>.</p>

        <h2>2. Fonction de répartition</h2>
        ${lc.def("Fonction de répartition", `<p>La <strong>fonction de répartition</strong> de <code>X</code> est <code>F(x) = P(X ≤ x)</code>.</p>`)}
        ${lc.formula("F(x) = ∫_{−∞}^x f(t) dt")}
        ${lc.prop("Propriétés", `<ul>
          <li><code>F</code> est croissante.</li>
          <li><code>lim_{x → −∞} F(x) = 0</code>, <code>lim_{x → +∞} F(x) = 1</code>.</li>
          <li><code>F</code> est continue (pour une variable à densité).</li>
          <li><code>F'(x) = f(x)</code> aux points où <code>f</code> est continue.</li>
        </ul>`)}

        <h2>3. Espérance et variance</h2>
        ${lc.formula("E(X) = ∫_{−∞}^{+∞} x × f(x) dx")}
        ${lc.formula("V(X) = E(X²) − E(X)² = ∫ x² f(x) dx − [E(X)]²")}
        <p>(intégrales supposées convergentes.)</p>

        <h2>4. Loi uniforme</h2>
        ${lc.def("Loi uniforme U([a, b])", `<p>Densité : <code>f(x) = 1/(b − a)</code> sur <code>[a, b]</code>, 0 ailleurs.</p>`)}
        ${lc.formula("E(X) = (a + b) / 2 &nbsp;&nbsp; V(X) = (b − a)² / 12")}

        <h2>5. Loi exponentielle</h2>
        ${lc.def("Loi exponentielle ε(λ)", `<p>Densité : <code>f(x) = λ × e^{−λx}</code> sur <code>[0, +∞[</code>.</p>`)}
        ${lc.formula("E(X) = 1/λ &nbsp;&nbsp; V(X) = 1/λ²")}
        ${lc.prop("Sans mémoire", `<p>Pour <code>s, t ≥ 0</code> : <code>P(X > s + t | X > s) = P(X > t)</code>. La probabilité de durer encore <code>t</code> ne dépend pas de l'âge déjà accumulé.</p>`)}

        <h2>6. Loi normale</h2>
        ${lc.def("Loi normale N(μ, σ²)", `<p>Densité : <code>f(x) = (1/(σ√(2π))) × e^{−(x−μ)²/(2σ²)}</code>.</p>`)}
        ${lc.formula("E(X) = μ &nbsp;&nbsp; V(X) = σ²")}
        ${lc.prop("Centrer-réduire", `<p>Si <code>X ~ N(μ, σ²)</code>, alors <code>(X − μ)/σ ~ N(0, 1)</code>.</p>`)}

        <h2>7. Théorème de transfert (cas continu)</h2>
        ${lc.prop("Énoncé", `<p>Pour toute fonction <code>g</code> mesurable et <code>X</code> continue de densité <code>f</code> :</p>`)}
        ${lc.formula("E(g(X)) = ∫_{−∞}^{+∞} g(x) × f(x) dx")}
        <p>Cas particulier <code>g(x) = x²</code> : <code>E(X²) = ∫ x² f(x) dx</code>, base du calcul de la variance.</p>

        <h2>8. Changement de variable</h2>
        ${lc.prop("Densité de Y = g(X)", `<p>Si <code>g</code> est strictement monotone et dérivable, et <code>X</code> a pour densité <code>f_X</code>, alors <code>Y</code> a pour densité :</p>`)}
        ${lc.formula("f_Y(y) = f_X(g⁻¹(y)) × |1 / g'(g⁻¹(y))|")}

        <h2>9. Couples continus</h2>
        ${lc.def("Densité jointe", `<p>Un couple continu <code>(X, Y)</code> a une <strong>densité jointe</strong> <code>f(x, y)</code> avec <code>f ≥ 0</code> et <code>∬ f = 1</code>. Pour tout domaine <code>D</code> :</p>`)}
        ${lc.formula("P((X, Y) ∈ D) = ∬_D f(x, y) dx dy")}
        ${lc.def("Lois marginales", `<p>Les <strong>lois marginales</strong> sont les densités de <code>X</code> et <code>Y</code> séparément, obtenues en intégrant l'autre variable :</p>`)}
        ${lc.formula("f_X(x) = ∫_{−∞}^{+∞} f(x, y) dy<br>f_Y(y) = ∫_{−∞}^{+∞} f(x, y) dx")}
        ${lc.prop("Indépendance continue", `<p><code>X</code> et <code>Y</code> sont indépendantes si et seulement si <code>f(x, y) = f_X(x) × f_Y(y)</code>.</p>`)}
      `,
    },

    {
      title: "Lois usuelles : Poisson, géométrique, ...",
      category: "Probabilités",
      content: `
        <h2>1. Loi de Bernoulli ℬ(p)</h2>
        ${lc.def("Bernoulli", `<p><code>X ~ ℬ(p)</code> prend les valeurs 0 et 1 avec <code>P(X = 1) = p</code> et <code>P(X = 0) = 1 − p</code>.</p>`)}
        ${lc.formula("E(X) = p &nbsp;&nbsp; V(X) = p(1 − p)")}

        <h2>2. Loi binomiale 𝓑(n, p)</h2>
        ${lc.def("Binomiale", `<p><code>X</code> compte le nombre de succès dans <code>n</code> répétitions indépendantes d'épreuves de Bernoulli.</p>`)}
        ${lc.formula("P(X = k) = C(n, k) × p^k × (1 − p)^{n−k}")}
        ${lc.formula("E(X) = np &nbsp;&nbsp; V(X) = np(1 − p)")}

        <h2>3. Loi géométrique 𝒢(p)</h2>
        ${lc.def("Géométrique", `<p><code>X</code> est le rang du <strong>premier succès</strong> dans une suite d'épreuves de Bernoulli indépendantes.</p>`)}
        ${lc.formula("P(X = k) = (1 − p)^{k−1} × p &nbsp;&nbsp; (k ≥ 1)")}
        ${lc.formula("E(X) = 1/p &nbsp;&nbsp; V(X) = (1 − p) / p²")}
        ${lc.example("Application", `<p>Lancer un dé jusqu'à obtenir un 6. <code>p = 1/6</code>. Espérance : <code>1/(1/6) = 6</code> lancers en moyenne.</p>`)}

        <h2>4. Loi de Poisson 𝒫(λ)</h2>
        ${lc.def("Poisson", `<p>Modélise le nombre d'événements rares survenant dans un intervalle de temps.</p>`)}
        ${lc.formula("P(X = k) = e^{−λ} × λ^k / k! &nbsp;&nbsp; (k ∈ ℕ)")}
        ${lc.formula("E(X) = λ &nbsp;&nbsp; V(X) = λ")}
        ${lc.tip("Utilisation", `<p>Nombre de clients dans une heure, nombre de pannes par jour, désintégrations radioactives par seconde…</p>`)}

        <h2>5. Loi exponentielle ε(λ) (rappel)</h2>
        <p>Cas continu de Poisson : modélise le <em>temps</em> entre deux événements.</p>
        ${lc.formula("E(X) = 1/λ &nbsp;&nbsp; V(X) = 1/λ²")}

        <h2>6. Loi normale N(μ, σ²) (rappel)</h2>
        ${lc.formula("E(X) = μ &nbsp;&nbsp; V(X) = σ²")}

        <h2>7. Approximations</h2>
        ${lc.prop("Binomiale → Poisson", `<p>Si <code>n</code> est grand, <code>p</code> petit, et <code>np = λ</code> reste modéré, alors <code>𝓑(n, p) ≈ 𝒫(λ)</code>.</p>`)}
        ${lc.prop("Binomiale → Normale", `<p>Si <code>n</code> est grand et <code>np(1−p) ≥ 5</code>, alors <code>𝓑(n, p) ≈ N(np, np(1−p))</code>. C'est le théorème de Moivre-Laplace, cas particulier du TCL.</p>`)}
      `,
    },

    {
      title: "Théorèmes limites : LGN, TCL",
      category: "Probabilités",
      content: `
        <h2>1. Convergence en probabilité</h2>
        ${lc.def("Convergence en proba", `<p>Une suite <code>(Xₙ)</code> de variables aléatoires <strong>converge en probabilité</strong> vers <code>X</code> si :</p>`)}
        ${lc.formula("∀ ε > 0, lim_{n → +∞} P(|Xₙ − X| ≥ ε) = 0")}

        <h2>2. Loi (faible) des grands nombres</h2>
        ${lc.prop("LGN faible", `<p>Soit <code>(Xₙ)</code> une suite de variables aléatoires <strong>indépendantes</strong>, de <strong>même loi</strong>, d'espérance <code>μ</code> et de variance finie. La moyenne empirique converge en probabilité vers l'espérance :</p>`)}
        ${lc.formula("M_n = (X₁ + … + Xₙ) / n &nbsp; ⟶ &nbsp; μ")}
        ${lc.tip("Sens intuitif", `<p>Avec un grand échantillon, la moyenne observée est très proche de l'espérance théorique. C'est le fondement de la statistique inférentielle.</p>`)}

        <h2>3. Théorème central limite (TCL)</h2>
        ${lc.prop("TCL", `<p>Soit <code>(Xₙ)</code> i.i.d. d'espérance <code>μ</code> et variance <code>σ² > 0</code>. Alors :</p>`)}
        ${lc.formula("(M_n − μ) × √n / σ &nbsp; ⟶ &nbsp; N(0, 1) en loi")}
        <p>Plus concrètement : la somme normalisée <code>(X₁ + … + Xₙ − nμ) / (σ√n)</code> tend en loi vers <code>N(0, 1)</code>.</p>
        ${lc.tip("Pouvoir du TCL", `<p>Quelle que soit la loi des <code>Xᵢ</code> (uniforme, exponentielle, Bernoulli…), la moyenne d'un grand nombre suit approximativement une loi normale. C'est pourquoi cette loi est si universelle.</p>`)}

        <h2>4. Application : intervalle de confiance</h2>
        ${lc.example("Pour la moyenne", `<p>Avec un échantillon de taille <code>n = 100</code>, moyenne empirique <code>M = 50</code>, écart-type connu <code>σ = 8</code> :</p>
          <ol><li>Erreur standard : <code>σ/√n = 0,8</code>.</li>
          <li>IC 95 % : <code>[M − 1,96 × σ/√n ; M + 1,96 × σ/√n] = [48,4 ; 51,6]</code>.</li>
          <li>Avec 95 % de confiance, la moyenne réelle <code>μ</code> est entre 48,4 et 51,6.</li></ol>`)}

        <h2>5. Convergence en loi (vue rapide)</h2>
        ${lc.def("Convergence en loi", `<p><code>Xₙ</code> converge en loi vers <code>X</code> si <code>F_{Xₙ}(x) → F_X(x)</code> en tout point de continuité de <code>F_X</code>.</p>`)}
        ${lc.tip("Hiérarchie des convergences", `<p>Convergence presque sûre ⇒ convergence en probabilité ⇒ convergence en loi. Les implications réciproques sont fausses en général.</p>`)}

        <h2>6. Loi forte des grands nombres</h2>
        ${lc.prop("LGN forte (Kolmogorov)", `<p>Soit <code>(Xₙ)</code> i.i.d. d'espérance <code>μ</code> finie. Alors la moyenne empirique converge <strong>presque sûrement</strong> vers <code>μ</code> :</p>`)}
        ${lc.formula("M_n = (X₁ + … + Xₙ)/n &nbsp;⟶&nbsp; μ &nbsp;&nbsp; (presque sûrement)")}
        ${lc.tip("Différence avec LGN faible", `<p>La LGN <strong>faible</strong> donne convergence en probabilité. La LGN <strong>forte</strong> donne convergence presque sûre, plus puissante : pour <em>presque toute</em> trajectoire individuelle, <code>M_n(ω) → μ</code>. C'est le résultat qui justifie rigoureusement la modélisation fréquentiste des probabilités.</p>`)}

        <h2>7. Fonction caractéristique</h2>
        ${lc.def("Fonction caractéristique", `<p>La <strong>fonction caractéristique</strong> d'une variable aléatoire <code>X</code> est :</p>`)}
        ${lc.formula("φ_X(t) = E(e^{itX}) &nbsp;&nbsp; (t ∈ ℝ, i² = −1)")}
        ${lc.prop("Propriétés-clé", `<ul>
          <li><code>φ_X(0) = 1</code> et <code>|φ_X(t)| ≤ 1</code> pour tout <code>t</code>.</li>
          <li><code>φ_{aX+b}(t) = e^{ibt} × φ_X(at)</code>.</li>
          <li>Si <code>X</code> et <code>Y</code> sont indépendantes : <code>φ_{X+Y} = φ_X × φ_Y</code>.</li>
          <li><code>φ_X</code> caractérise entièrement la loi de <code>X</code> (deux variables qui ont même fonction caractéristique ont même loi).</li>
        </ul>`)}
        ${lc.example("Exemples", `<ul>
          <li>Bernoulli ℬ(p) : <code>φ(t) = 1 − p + p·e^{it}</code>.</li>
          <li>Normale N(0, 1) : <code>φ(t) = e^{−t²/2}</code>.</li>
          <li>Normale N(μ, σ²) : <code>φ(t) = e^{iμt − σ²t²/2}</code>.</li>
          <li>Poisson 𝒫(λ) : <code>φ(t) = e^{λ(e^{it} − 1)}</code>.</li>
        </ul>`)}

        <h2>8. Démonstration du TCL via la fonction caractéristique</h2>
        ${lc.tip("Esquisse", `<p>Soit <code>(Xₙ)</code> i.i.d. centrées réduites. La fonction caractéristique de la somme normalisée <code>S_n / √n</code> est <code>(φ(t/√n))ⁿ</code>. Un développement de Taylor donne <code>φ(t/√n) ≈ 1 − t²/(2n)</code>, et donc <code>(1 − t²/(2n))ⁿ → e^{−t²/2}</code>, qui est la fonction caractéristique de N(0, 1). Par le théorème de Lévy, on a convergence en loi : c'est le TCL.</p>`)}
      `,
    },

    {
      title: "Tests statistiques",
      category: "Statistiques",
      content: `
        <h2>1. Hypothèses</h2>
        ${lc.def("Hypothèses nulle et alternative", `<ul>
          <li><strong>Hypothèse nulle</strong> <code>H₀</code> : statu quo, ce qu'on veut « rejeter ».</li>
          <li><strong>Hypothèse alternative</strong> <code>H₁</code> : ce qu'on essaie de mettre en évidence.</li>
        </ul>
          <p>Exemple : tester si une pièce est équilibrée. <code>H₀ : p = 1/2</code> vs <code>H₁ : p ≠ 1/2</code>.</p>`)}

        <h2>2. Erreurs de type I et II</h2>
        ${lc.def("Risques", `<ul>
          <li><strong>Erreur de type I</strong> (α, ou « risque de première espèce ») : rejeter <code>H₀</code> alors qu'elle est vraie.</li>
          <li><strong>Erreur de type II</strong> (β) : ne pas rejeter <code>H₀</code> alors qu'elle est fausse.</li>
          <li><strong>Puissance</strong> du test : <code>1 − β</code>, probabilité de détecter l'effet quand il existe.</li>
        </ul>`)}
        ${lc.tip("Compromis", `<p>Diminuer α augmente β (et vice versa). On choisit α = 5 % par convention.</p>`)}

        <h2>3. Démarche d'un test</h2>
        ${lc.prop("Étapes", `<ol>
          <li>Formuler <code>H₀</code> et <code>H₁</code>.</li>
          <li>Choisir le seuil α (généralement 5 %).</li>
          <li>Calculer la statistique de test à partir des données.</li>
          <li>Comparer à la valeur critique (ou calculer la <strong>p-valeur</strong>).</li>
          <li>Conclure : si <code>p &lt; α</code>, on rejette <code>H₀</code>.</li>
        </ol>`)}

        <h2>4. p-valeur</h2>
        ${lc.def("p-valeur", `<p>La <strong>p-valeur</strong> est la probabilité, sous <code>H₀</code>, d'observer un résultat au moins aussi extrême que celui observé. Plus la p-valeur est petite, plus la donnée est incompatible avec <code>H₀</code>.</p>`)}
        ${lc.tip("Règle pratique", `<p>p &lt; 0,05 → on rejette <code>H₀</code> (résultat « significatif »). p ≥ 0,05 → on ne rejette pas.</p>`)}

        <h2>5. Test Z (proportion connue σ)</h2>
        ${lc.prop("Statistique Z", `<p>Pour un échantillon de taille <code>n</code> de moyenne <code>x̄</code> tiré d'une loi <code>N(μ, σ²)</code> avec <code>σ</code> connu :</p>`)}
        ${lc.formula("Z = (x̄ − μ₀) / (σ / √n)")}
        <p>Sous <code>H₀ : μ = μ₀</code>, <code>Z ~ N(0, 1)</code>. On rejette <code>H₀</code> au seuil 5 % bilatéral si <code>|Z| > 1,96</code>.</p>

        <h2>6. Test de Student (σ inconnu)</h2>
        ${lc.prop("Statistique T", `<p>Si <code>σ</code> est inconnu, on l'estime par l'écart-type empirique <code>s</code> :</p>`)}
        ${lc.formula("T = (x̄ − μ₀) / (s / √n)")}
        <p>Sous <code>H₀</code>, <code>T</code> suit une loi de Student à <code>n − 1</code> degrés de liberté.</p>

        <h2>7. Test du χ²</h2>
        ${lc.def("Test du chi-deux", `<p>Permet de tester l'<strong>adéquation</strong> à une loi théorique en comparant effectifs observés et théoriques.</p>`)}
        ${lc.formula("χ² = Σ (Oᵢ − Eᵢ)² / Eᵢ")}
        <p>Sous <code>H₀</code>, <code>χ²</code> suit une loi du chi-deux à <code>k − 1 − r</code> degrés de liberté, où <code>k</code> est le nombre de classes et <code>r</code> le nombre de paramètres estimés à partir des données. Si la loi théorique est <strong>entièrement spécifiée</strong> à l'avance (r = 0), on retrouve <code>k − 1</code> ddl.</p>
        ${lc.warn("Conditions de validité", `<p>Le test n'est fiable que si chaque effectif théorique vérifie <code>Eᵢ ≥ 5</code>. Sinon, on regroupe des classes voisines.</p>`)}

        <h2>8. Précautions d'interprétation</h2>
        ${lc.warn("Significatif ≠ important", `<p>Un test significatif (<code>p &lt; α</code>) <strong>ne dit pas</strong> que l'effet est grand, juste qu'il est non nul. Toujours regarder l'<strong>amplitude</strong> de l'effet, pas seulement la p-valeur.</p>`)}
      `,
    },

    {
      title: "Estimation et maximum de vraisemblance",
      category: "Statistiques",
      content: `
        <h2>1. Notion d'estimateur</h2>
        ${lc.def("Estimateur", `<p>Un <strong>estimateur</strong> d'un paramètre <code>θ</code> est une fonction des observations <code>(X₁, …, Xₙ)</code> dont la valeur sert à approcher <code>θ</code>. On le note souvent <code>θ̂_n</code>.</p>
          <p>Exemple : la moyenne empirique <code>X̄_n = (X₁ + … + Xₙ)/n</code> est un estimateur de l'espérance <code>μ</code>.</p>`)}

        <h2>2. Biais</h2>
        ${lc.def("Biais", `<p>Le <strong>biais</strong> d'un estimateur <code>θ̂</code> est :</p>`)}
        ${lc.formula("biais(θ̂) = E(θ̂) − θ")}
        <p>Un estimateur est dit <strong>sans biais</strong> si son espérance est exactement <code>θ</code>.</p>
        ${lc.example("Moyenne empirique", `<p><code>E(X̄_n) = μ</code>, donc <code>X̄_n</code> est <strong>sans biais</strong>.</p>`)}

        <h2>3. Convergence</h2>
        ${lc.def("Estimateur convergent", `<p>Un estimateur est <strong>convergent</strong> si <code>θ̂_n → θ</code> en probabilité quand <code>n → +∞</code>.</p>`)}
        ${lc.tip("Conséquence de la LGN", `<p>La moyenne empirique <code>X̄_n</code> converge vers <code>μ</code> par la loi des grands nombres : c'est un estimateur convergent.</p>`)}

        <h2>4. Erreur quadratique moyenne (MSE)</h2>
        ${lc.def("MSE", `<p>L'<strong>erreur quadratique moyenne</strong> de <code>θ̂</code> est :</p>`)}
        ${lc.formula("MSE(θ̂) = E((θ̂ − θ)²) = V(θ̂) + biais(θ̂)²")}
        <p>Plus la MSE est petite, plus l'estimateur est précis. La décomposition montre qu'il faut équilibrer biais et variance.</p>

        <h2>5. Variance empirique</h2>
        ${lc.formula("S²_n = (1/n) × Σ (Xᵢ − X̄_n)²")}
        ${lc.warn("Biais", `<p>Cet estimateur est <strong>biaisé</strong> : <code>E(S²_n) = ((n−1)/n) × σ²</code>. On préfère souvent l'estimateur corrigé :</p>`)}
        ${lc.formula("S'²_n = (1/(n−1)) × Σ (Xᵢ − X̄_n)²")}
        <p><code>S'²_n</code> est sans biais (correction de Bessel).</p>

        <h2>6. Maximum de vraisemblance</h2>
        ${lc.def("Vraisemblance", `<p>Soit un modèle paramétrique avec densité <code>f(x ; θ)</code>. La <strong>vraisemblance</strong> de l'échantillon <code>(x₁, …, xₙ)</code> est :</p>`)}
        ${lc.formula("L(θ) = f(x₁ ; θ) × f(x₂ ; θ) × … × f(xₙ ; θ)")}
        ${lc.def("Estimateur du maximum de vraisemblance", `<p>L'<strong>EMV</strong> est la valeur de <code>θ</code> qui maximise <code>L(θ)</code> (ou de manière équivalente <code>ln L(θ)</code>, plus pratique car la somme remplace le produit).</p>`)}

        <h2>7. Exemple : EMV pour la loi normale</h2>
        ${lc.example("Estimer μ et σ² d'une loi N(μ, σ²)", `<p>La log-vraisemblance s'écrit :</p>
          <p><code>ln L(μ, σ²) = −n/2 × ln(2π) − n/2 × ln(σ²) − (1/(2σ²)) × Σ (xᵢ − μ)²</code></p>
          <p>En annulant les dérivées partielles, on obtient :</p>
          <ul><li><code>μ̂_{MV} = X̄_n</code> (moyenne empirique).</li>
          <li><code>σ̂²_{MV} = (1/n) × Σ (xᵢ − X̄_n)² = S²_n</code> (variance empirique non corrigée).</li></ul>`)}

        <h2>8. Intervalle de confiance rigoureux</h2>
        ${lc.def("IC", `<p>Un <strong>intervalle de confiance</strong> au niveau <code>1 − α</code> pour <code>θ</code> est un intervalle aléatoire <code>[L_n, U_n]</code> tel que <code>P(L_n ≤ θ ≤ U_n) = 1 − α</code>.</p>`)}
        ${lc.example("IC pour μ (σ² connu, échantillon gaussien)", `<p>Avec <code>X̄_n ~ N(μ, σ²/n)</code>, on a :</p>
          <p><code>IC_{1−α}(μ) = [X̄_n − z_{α/2} × σ/√n ; X̄_n + z_{α/2} × σ/√n]</code></p>
          <p>où <code>z_{α/2}</code> est le quantile de la loi normale centrée réduite (1,96 pour α = 5 %).</p>`)}
      `,
    },
  ];
}

function chaptersTle() {
  return [
    {
      title: "Limites de fonctions",
      category: "Analyse",
      content: `
        ${lc.tip("Pont depuis la 1ère", `<p>En 1ère tu as étudié intuitivement les limites de suites (<em>« uₙ se rapproche de plus en plus de L »</em>). Ici, on étend cette idée aux <strong>fonctions</strong>, et on commence à <em>calculer</em> les limites avec des règles d'opérations. La définition formelle ε-δ vient en post-bac ; pour la Tle, on s'appuie sur l'intuition graphique et les opérations.</p>`)}

          <p>Notation : <code>lim_{x → +∞} f(x) = L</code>.</p>
          <p>Géométriquement, la droite <code>y = L</code> est une <strong>asymptote horizontale</strong> à la courbe.</p>`)}
        ${lc.example("Limite usuelle", `<ul>
          <li><code>lim_{x → +∞} 1/x = 0</code></li>

        <h2>2. Limite infinie en l'infini</h2>
        ${lc.example("Limites usuelles", `<ul>
          <li><code>lim_{x → +∞} x = +∞</code> ; <code>lim_{x → +∞} x² = +∞</code> ; <code>lim_{x → +∞} √x = +∞</code></li>

        ${lc.example("Pour la fonction inverse", `<ul>

          <li><code>lim_{x → 0⁻} 1/x = −∞</code></li>

        ${lc.formula("lim_{x → a} f(x) = f(a)")}

        ${lc.prop("TVI", `<p>Soit <code>f</code> continue sur un intervalle <code>[a ; b]</code>. Pour tout réel <code>k</code> compris entre <code>f(a)</code> et <code>f(b)</code>, l'équation <code>f(x) = k</code> admet <strong>au moins une solution</strong> dans <code>[a ; b]</code>.</p>`)}

      content: `
        <h2>1. Dérivée d'une fonction composée</h2>
        ${lc.prop("Règle de la chaîne", `<p>Si <code>g</code> est dérivable en <code>f(x)</code> et <code>f</code> dérivable en <code>x</code> :</p>`)}
        ${lc.formula("(g ∘ f)'(x) = g'(f(x)) × f'(x)")}
        ${lc.tip("Idée", `<p>On dérive la « grande » fonction puis on multiplie par la dérivée du « contenu ».</p>`)}

        <h2>2. Dérivées des composées usuelles</h2>
        ${lc.formula("(u^n)' = n × u' × u^{n−1}")}
        ${lc.formula("(√u)' = u' / (2√u) &nbsp;&nbsp; (u > 0)")}
        ${lc.formula("(1/u)' = −u' / u²")}
        ${lc.formula("(e^u)' = u' × e^u")}
        ${lc.formula("(ln(u))' = u' / u &nbsp;&nbsp; (u > 0)")}
        ${lc.formula("(cos(u))' = −u' × sin(u) &nbsp;&nbsp; (sin(u))' = u' × cos(u)")}

        <h2>3. Exemples</h2>
        ${lc.example("Dériver f(x) = (3x + 1)⁵", `<ol>
          <li>Forme <code>u^n</code> avec <code>u = 3x + 1</code>, <code>n = 5</code>.</li>
          <li><code>u' = 3</code>.</li>
          <li><code>f'(x) = 5 × 3 × (3x + 1)⁴ = 15(3x + 1)⁴</code>.</li>
        </ol>`)}
        ${lc.example("Dériver f(x) = √(x² + 1)", `<ol>
          <li><code>u = x² + 1</code>, <code>u' = 2x</code>.</li>
          <li><code>f'(x) = 2x / (2√(x² + 1)) = x / √(x² + 1)</code>.</li>
        </ol>`)}
        ${lc.example("Dériver f(x) = e^{x² − 3}", `<ol>
          <li><code>u = x² − 3</code>, <code>u' = 2x</code>.</li>
          <li><code>f'(x) = 2x × e^{x² − 3}</code>.</li>
        </ol>`)}
        ${lc.example("Dériver f(x) = ln(2x + 5)", `<ol>
          <li><code>u = 2x + 5</code>, <code>u' = 2</code>.</li>
          <li><code>f'(x) = 2 / (2x + 5)</code>.</li>
        </ol>`)}
      `,
    },

    {
      title: "Fonction logarithme népérien",
      category: "Analyse",
      content: `
        <h2>1. Définition</h2>
        ${lc.def("Logarithme népérien", `<p>La fonction <strong>logarithme népérien</strong>, notée <code>ln</code>, est définie sur <code>]0 ; +∞[</code> comme la fonction réciproque de la fonction exponentielle.</p>`)}
        ${lc.formula("e^{ln(x)} = x &nbsp;&nbsp; pour x > 0<br>ln(e^x) = x &nbsp;&nbsp; pour tout x")}
        ${lc.example("Valeurs particulières", `<ul>
          <li><code>ln(1) = 0</code> (car <code>e⁰ = 1</code>)</li>
          <li><code>ln(e) = 1</code> (car <code>e¹ = e</code>)</li>
          <li><code>ln(e²) = 2</code></li>
        </ul>`)}

        <h2>2. Propriétés algébriques</h2>
        ${lc.formula("ln(a × b) = ln(a) + ln(b)")}
        ${lc.formula("ln(a / b) = ln(a) − ln(b)")}
        ${lc.formula("ln(1 / a) = −ln(a)")}
        ${lc.formula("ln(a^n) = n × ln(a)")}
        ${lc.formula("ln(√a) = (1/2) × ln(a)")}
        <p>(toutes valables pour <code>a, b > 0</code>)</p>

        <h2>3. Variations et limites</h2>
        ${lc.prop("Dérivée", `<p>La fonction <code>ln</code> est dérivable sur <code>]0 ; +∞[</code> et :</p>`)}
        ${lc.formula("ln'(x) = 1 / x")}
        <p>Comme <code>1/x > 0</code> sur <code>]0 ; +∞[</code>, <code>ln</code> est <strong>strictement croissante</strong>.</p>
        ${lc.prop("Limites", `<ul>
          <li><code>lim_{x → +∞} ln(x) = +∞</code></li>
          <li><code>lim_{x → 0⁺} ln(x) = −∞</code> (l'axe des ordonnées est asymptote)</li>
        </ul>`)}

        <h2>4. Équations et inéquations</h2>
        ${lc.prop("Comme ln est strictement croissante", `<ul>
          <li><code>ln(a) = ln(b) ⇔ a = b</code> (avec <code>a, b > 0</code>)</li>
          <li><code>ln(a) < ln(b) ⇔ a < b</code></li>
          <li><code>ln(x) = k ⇔ x = e^k</code></li>
          <li><code>ln(x) > k ⇔ x > e^k</code></li>
        </ul>`)}
        ${lc.example("Résoudre ln(2x − 1) = 3", `<ol>
          <li>Domaine : <code>2x − 1 > 0</code>, soit <code>x > 1/2</code>.</li>
          <li>Équation : <code>2x − 1 = e³</code>, soit <code>x = (e³ + 1)/2 ≈ 10,54</code>.</li>
          <li>Cohérent avec le domaine ✓.</li>
        </ol>`)}

        <h2>5. Croissance comparée</h2>
        ${lc.prop("Le logarithme est plus lent que toute puissance", `<p>Quand <code>x → +∞</code>, le logarithme croît plus lentement que toute puissance positive de <code>x</code> :</p>`)}
        ${lc.formula("lim_{x → +∞} ln(x) / x^n = 0 &nbsp;&nbsp; (pour tout n > 0)")}

        <h2>6. Logarithme décimal</h2>
        ${lc.def("log₁₀", `<p>Le <strong>logarithme décimal</strong>, noté <code>log</code>, est défini par <code>log(x) = ln(x) / ln(10)</code>.</p>
          <p>Utile en sciences pour exprimer des quantités sur plusieurs ordres de grandeur (échelle de Richter, pH, décibels…).</p>`)}
        ${lc.formula("log(10) = 1, log(100) = 2, log(1000) = 3, …")}
      `,
    },

    {
      title: "Primitives",
      category: "Analyse",
      content: `
        <h2>1. Définition</h2>
        ${lc.def("Primitive", `<p>Soit <code>f</code> une fonction définie sur un intervalle <code>I</code>. Une <strong>primitive</strong> de <code>f</code> sur <code>I</code> est une fonction <code>F</code> dérivable sur <code>I</code> telle que :</p>`)}
        ${lc.formula("F'(x) = f(x) &nbsp;&nbsp; pour tout x ∈ I")}
        <p>Trouver une primitive, c'est <strong>l'opération inverse de dériver</strong>.</p>

        <h2>2. Existence et unicité</h2>
        ${lc.prop("Théorème", `<p>Toute fonction continue sur un intervalle admet une infinité de primitives. Si <code>F</code> et <code>G</code> sont deux primitives de <code>f</code>, alors <code>F − G</code> est constante.</p>`)}
        ${lc.tip("Bref", `<p>Les primitives d'une fonction diffèrent d'une <strong>constante</strong>. On parle souvent de « la » primitive en sous-entendant « à constante près ».</p>`)}
        ${lc.warn("L'hypothèse intervalle est cruciale", `<p>La constante d'intégration n'est unique que sur un <strong>intervalle</strong>. Sur un domaine en plusieurs morceaux (par exemple <code>ℝ*</code> = <code>]−∞, 0[ ∪ ]0, +∞[</code>), on peut avoir une constante différente sur chaque morceau. Pour <code>1/x</code> par exemple, la primitive sur <code>]0, +∞[</code> est <code>ln(x) + C₁</code>, et sur <code>]−∞, 0[</code> c'est <code>ln(−x) + C₂</code> avec <code>C₁</code> et <code>C₂</code> indépendantes.</p>`)}

        <h2>3. Primitives usuelles</h2>
        ${lc.formula("Primitives de a (constante) : F(x) = ax + C")}
        ${lc.formula("Primitives de x : F(x) = x²/2 + C")}
        ${lc.formula("Primitives de x^n (n ≠ −1) : F(x) = x^{n+1} / (n+1) + C")}
        ${lc.formula("Primitives de 1/x : F(x) = ln(|x|) + C")}
        ${lc.formula("Primitives de e^x : F(x) = e^x + C")}
        ${lc.formula("Primitives de cos(x) : F(x) = sin(x) + C")}
        ${lc.formula("Primitives de sin(x) : F(x) = −cos(x) + C")}
        ${lc.formula("Primitives de 1/√x : F(x) = 2√x + C")}

        <h2>4. Linéarité</h2>
        ${lc.prop("Combinaisons linéaires", `<p>Si <code>F</code> est primitive de <code>f</code> et <code>G</code> primitive de <code>g</code>, alors <code>aF + bG</code> est primitive de <code>af + bg</code>.</p>`)}
        ${lc.example("Primitives de 3x² + 4x − 1", `<ol>
          <li>Primitive de <code>x²</code> : <code>x³/3</code>.</li>
          <li>Primitive de <code>x</code> : <code>x²/2</code>.</li>
          <li>Primitive de <code>1</code> : <code>x</code>.</li>
          <li>Donc primitives : <code>F(x) = x³ + 2x² − x + C</code>.</li>
        </ol>`)}

        <h2>5. Trouver la primitive vérifiant une condition</h2>
        ${lc.example("Avec condition initiale", `<p>Trouver la primitive de <code>f(x) = 2x</code> sur ℝ qui vaut 5 en 1.</p>
          <ol><li>Primitives : <code>F(x) = x² + C</code>.</li>
          <li>Condition : <code>F(1) = 5</code>, soit <code>1 + C = 5</code>, donc <code>C = 4</code>.</li>
          <li>Réponse : <code>F(x) = x² + 4</code>.</li>
        </ol>`)}

        <h2>6. Primitives de fonctions composées</h2>
        ${lc.formula("Primitive de u' × u^n (n ≠ −1) : u^{n+1} / (n+1) + C")}
        ${lc.formula("Primitive de u' / u : ln(|u|) + C")}
        ${lc.formula("Primitive de u' × e^u : e^u + C")}
        ${lc.example("Primitive de 2x × e^{x²}", `<p>On reconnaît <code>u'×e^u</code> avec <code>u = x²</code>. Primitive : <code>e^{x²} + C</code>.</p>`)}
      `,
    },

    {
      title: "Intégrales",
      category: "Analyse",
      content: `
        <h2>1. Notion d'intégrale</h2>
        ${lc.def("Intégrale d'une fonction continue positive", `<p>Soit <code>f</code> continue et positive sur <code>[a ; b]</code>. L'<strong>intégrale</strong> de <code>f</code> entre <code>a</code> et <code>b</code> est l'<strong>aire</strong>, en unités d'aire, du domaine sous la courbe entre <code>x = a</code> et <code>x = b</code>.</p>`)}
        ${lc.formula("∫_a^b f(x) dx")}
        ${lc.tip("Lecture", `<p>« <code>∫</code> » est un « S » allongé pour « somme ». L'intégrale est intuitivement une somme d'aires de rectangles très fins.</p>`)}

        <h2>2. Lien fondamental avec les primitives</h2>
        ${lc.prop("Théorème fondamental de l'analyse", `<p>Si <code>f</code> est <strong>continue</strong> sur <code>[a ; b]</code> et <code>F</code> est une primitive de <code>f</code> :</p>`)}
        ${lc.formula("∫_a^b f(x) dx = F(b) − F(a) = [F(x)]_a^b")}
        <p class="hint" style="font-size:13px;color:var(--text-2);font-style:italic">L'hypothèse de continuité de <code>f</code> est nécessaire pour garantir l'existence de l'intégrale au sens de Riemann.</p>
        ${lc.example("Calcul d'aire", `<p>Calculer <code>∫_0^2 x² dx</code>.</p>
          <ol><li>Primitive de <code>x²</code> : <code>F(x) = x³/3</code>.</li>
          <li><code>F(2) − F(0) = 8/3 − 0 = 8/3</code>.</li>
          <li>Donc <code>∫_0^2 x² dx = 8/3 ≈ 2,67</code> unités d'aire.</li>
        </ol>`)}

        <h2>3. Propriétés</h2>
        ${lc.formula("Linéarité : ∫_a^b (αf + βg) dx = α∫_a^b f dx + β∫_a^b g dx")}
        ${lc.formula("Relation de Chasles : ∫_a^c f dx = ∫_a^b f dx + ∫_b^c f dx")}
        ${lc.formula("Inversion des bornes : ∫_a^b f dx = −∫_b^a f dx")}
        ${lc.formula("Intégrale nulle : ∫_a^a f dx = 0")}

        <h2>4. Positivité et signe</h2>
        ${lc.prop("Si f est négative", `<p>Si <code>f</code> est négative sur <code>[a ; b]</code> (avec <code>a < b</code>), alors <code>∫_a^b f dx ≤ 0</code>. L'aire est comptée <em>négativement</em>.</p>
          <p>Pour avoir l'aire « géométrique » (positive), on prend <code>−∫_a^b f dx</code> ou on intègre <code>|f|</code>.</p>`)}

        <h2>5. Valeur moyenne</h2>
        ${lc.def("Valeur moyenne", `<p>La <strong>valeur moyenne</strong> de <code>f</code> sur <code>[a ; b]</code> est :</p>`)}
        ${lc.formula("μ = (1 / (b − a)) × ∫_a^b f(x) dx")}
        ${lc.example("Valeur moyenne de f(x) = x² sur [0 ; 3]", `<ol>
          <li><code>∫_0^3 x² dx = [x³/3]_0^3 = 9</code>.</li>
          <li><code>μ = 9 / (3 − 0) = 3</code>.</li>
        </ol>`)}

        <h2>6. Aire entre deux courbes</h2>
        ${lc.prop("Si f ≥ g sur [a ; b]", `<p>L'aire du domaine compris entre les deux courbes est :</p>`)}
        ${lc.formula("Aire = ∫_a^b (f(x) − g(x)) dx")}
        ${lc.example("Aire entre y = x et y = x² sur [0 ; 1]", `<ol>
          <li>Sur [0 ; 1], <code>x ≥ x²</code>.</li>
          <li><code>∫_0^1 (x − x²) dx = [x²/2 − x³/3]_0^1 = 1/2 − 1/3 = 1/6</code>.</li>
          <li>Aire = <code>1/6</code> u.a.</li>
        </ol>`)}
      `,
    },

    {
      title: "Suites : raisonnement par récurrence",
      category: "Suites",
      content: `
        <h2>1. Principe de récurrence</h2>
        ${lc.def("Raisonnement par récurrence", `<p>Pour démontrer qu'une propriété <code>P(n)</code> est vraie pour tout entier <code>n ≥ n₀</code>, on procède en deux temps :</p>
          <ol><li><strong>Initialisation</strong> : on vérifie <code>P(n₀)</code> (le cas de base).</li>
          <li><strong>Hérédité</strong> : on suppose <code>P(n)</code> vraie pour un <code>n ≥ n₀</code> quelconque (« hypothèse de récurrence »), puis on démontre <code>P(n + 1)</code>.</li></ol>
          <p><strong>Conclusion</strong> : par récurrence, <code>P(n)</code> est vraie pour tout <code>n ≥ n₀</code>.</p>`)}
        ${lc.tip("Image", `<p>Comme une chaîne de dominos : si le premier tombe (initialisation) et que chaque domino fait tomber le suivant (hérédité), alors tous tombent.</p>`)}

        <h2>2. Premier exemple : somme d'entiers</h2>
        ${lc.example("Démontrer que 1 + 2 + … + n = n(n+1)/2", `<p>On note <code>P(n)</code> : « <code>1 + 2 + … + n = n(n+1)/2</code> ».</p>
          <p><strong>Initialisation</strong> (n = 1) : à gauche, <code>1</code>. À droite, <code>1×2/2 = 1</code>. ✓ <code>P(1)</code> vraie.</p>
          <p><strong>Hérédité</strong> : supposons <code>P(n)</code> vraie pour un <code>n ≥ 1</code>. Montrons <code>P(n + 1)</code>.</p>
          <p><code>1 + 2 + … + n + (n+1) = n(n+1)/2 + (n+1)</code> (par hypothèse de récurrence)<br>
          <code>= (n+1) × (n/2 + 1) = (n+1)(n+2)/2</code>. ✓</p>
          <p><strong>Conclusion</strong> : <code>P(n)</code> est vraie pour tout <code>n ≥ 1</code>.</p>`)}

        <h2>3. Exemple : suite géométrique encadrée</h2>
        ${lc.example("Démontrer que 2^n ≥ n + 1 pour tout n ≥ 0", `<p><strong>Init</strong> (n = 0) : <code>2⁰ = 1</code>, <code>0 + 1 = 1</code>. <code>1 ≥ 1</code> ✓.</p>
          <p><strong>Hérédité</strong> : supposons <code>2^n ≥ n + 1</code>.</p>
          <p>Alors <code>2^{n+1} = 2 × 2^n ≥ 2(n + 1) = 2n + 2 ≥ n + 2</code> (car <code>n ≥ 0</code>).</p>
          <p>Donc <code>P(n+1)</code> vraie. <strong>Conclusion</strong> : OK pour tout <code>n ≥ 0</code>.</p>`)}

        <h2>4. Récurrence et suites définies par récurrence</h2>
        ${lc.example("Suite u_{n+1} = √(uₙ + 6), u₀ = 0", `<p>Démontrer que <code>0 ≤ uₙ ≤ 3</code> pour tout <code>n</code>.</p>
          <p><strong>Init</strong> : <code>u₀ = 0</code>, <code>0 ≤ 0 ≤ 3</code> ✓.</p>
          <p><strong>Hérédité</strong> : supposons <code>0 ≤ uₙ ≤ 3</code>. Alors <code>6 ≤ uₙ + 6 ≤ 9</code>, donc <code>√6 ≤ u_{n+1} ≤ 3</code>. En particulier <code>0 ≤ u_{n+1} ≤ 3</code>.</p>
          <p><strong>Conclusion</strong> : la suite est encadrée par 0 et 3.</p>`)}

        <h2>5. Pièges</h2>
        ${lc.warn("Ne pas oublier l'initialisation", `<p>Une démonstration sans initialisation peut « marcher » mais conclure quelque chose de faux. Par exemple, on peut hériter <code>1 = 0</code> mais l'initialisation n'a jamais été vérifiée. Toujours commencer par initialiser.</p>`)}
        ${lc.warn("Bien utiliser l'hypothèse de récurrence", `<p>L'hérédité doit utiliser <code>P(n)</code> pour démontrer <code>P(n+1)</code>. Si on n'utilise pas <code>P(n)</code>, c'est qu'on n'a pas vraiment fait une récurrence (c'est une démonstration directe).</p>`)}
      `,
    },

    {
      title: "Limites de suites (formel)",
      category: "Suites",
      content: `
        <h2>1. Définition formelle de la limite</h2>
        ${lc.def("Convergence vers L", `<p>Une suite <code>(uₙ)</code> converge vers <code>L</code> si pour tout <code>ε > 0</code>, il existe un rang <code>N</code> à partir duquel <code>|uₙ − L| < ε</code>.</p>`)}
        ${lc.tip("En clair", `<p>« Aussi proche de L qu'on veut, à condition d'aller assez loin. »</p>`)}

        <h2>2. Limite infinie</h2>
        ${lc.def("Divergence vers +∞", `<p><code>(uₙ)</code> diverge vers <code>+∞</code> si pour tout réel <code>A</code>, il existe un rang à partir duquel <code>uₙ ≥ A</code>.</p>`)}

        <h2>3. Théorèmes sur les limites</h2>
        ${lc.prop("Opérations standards", `<p>Si <code>lim uₙ = a</code> et <code>lim vₙ = b</code> :</p>
          <ul><li><code>lim (uₙ + vₙ) = a + b</code></li>
          <li><code>lim (uₙ × vₙ) = a × b</code></li>
          <li><code>lim (uₙ / vₙ) = a/b</code> si <code>b ≠ 0</code></li></ul>`)}
        ${lc.prop("Théorème des gendarmes", `<p>Si <code>vₙ ≤ uₙ ≤ wₙ</code> à partir d'un certain rang, et si <code>(vₙ)</code> et <code>(wₙ)</code> ont la même limite <code>L</code>, alors <code>(uₙ)</code> aussi.</p>`)}
        ${lc.prop("Comparaison à l'infini", `<ul>
          <li>Si <code>uₙ ≥ vₙ</code> et <code>lim vₙ = +∞</code>, alors <code>lim uₙ = +∞</code>.</li>
          <li>Si <code>uₙ ≤ vₙ</code> et <code>lim vₙ = −∞</code>, alors <code>lim uₙ = −∞</code>.</li>
        </ul>`)}

        <h2>4. Théorème de la convergence monotone</h2>
        ${lc.prop("Énoncé clé", `<p>Toute suite <strong>croissante et majorée</strong> converge. Toute suite <strong>décroissante et minorée</strong> converge.</p>`)}
        ${lc.warn("Attention", `<p>Le théorème dit qu'il existe une limite, mais ne donne pas sa valeur. Il faut la calculer autrement (souvent en passant à la limite dans la relation de récurrence).</p>`)}
        ${lc.example("Application", `<p>Soit <code>u₀ = 1</code> et <code>u_{n+1} = √(uₙ + 2)</code>.</p>
          <ol><li>Par récurrence, on montre que <code>1 ≤ uₙ ≤ 2</code>.</li>
          <li>On montre que <code>(uₙ)</code> est croissante (car <code>√(uₙ + 2) ≥ uₙ</code> quand <code>0 ≤ uₙ ≤ 2</code>).</li>
          <li>Croissante et majorée par 2 → converge vers une limite <code>ℓ</code>.</li>
          <li><code>ℓ = √(ℓ + 2)</code>, donc <code>ℓ² = ℓ + 2</code>, soit <code>ℓ² − ℓ − 2 = 0</code>. Solutions : 2 ou −1. Comme <code>ℓ ≥ 1</code>, <code>ℓ = 2</code>.</li></ol>`)}

        <h2>5. Limites de suites géométriques</h2>
        ${lc.prop("Selon la raison q", `<ul>
          <li>Si <code>q > 1</code> : <code>lim qⁿ = +∞</code>.</li>
          <li>Si <code>q = 1</code> : <code>lim qⁿ = 1</code>.</li>
          <li>Si <code>−1 < q < 1</code> : <code>lim qⁿ = 0</code>.</li>
          <li>Si <code>q ≤ −1</code> : pas de limite (oscillations).</li>
        </ul>`)}
      `,
    },

    {
      title: "Géométrie dans l'espace : vecteurs, droites, plans",
      category: "Géométrie",
      content: `
        <h2>1. Repérage dans l'espace</h2>
        ${lc.def("Repère orthonormé", `<p>Un <strong>repère orthonormé</strong> de l'espace est défini par une origine <code>O</code> et trois axes <code>(Ox)</code>, <code>(Oy)</code>, <code>(Oz)</code> deux à deux perpendiculaires, avec la même unité de longueur.</p>
          <p>Un point <code>M</code> est repéré par ses coordonnées <code>(x, y, z)</code>.</p>`)}

        <h2>2. Vecteurs dans l'espace</h2>
        ${lc.formula("AB→ a pour coordonnées (x_B − x_A ; y_B − y_A ; z_B − z_A)")}
        ${lc.formula("Norme : ||u→|| = √(x² + y² + z²)")}
        ${lc.formula("Distance : AB = √((x_B−x_A)² + (y_B−y_A)² + (z_B−z_A)²)")}

        <h2>3. Vecteurs colinéaires et coplanaires</h2>
        ${lc.def("Colinéarité", `<p>Deux vecteurs <code>u→</code> et <code>v→</code> sont <strong>colinéaires</strong> s'il existe un réel <code>k</code> tel que <code>v→ = k × u→</code> (ou si <code>u→ = 0→</code>).</p>`)}
        ${lc.def("Coplanaires", `<p>Trois vecteurs sont <strong>coplanaires</strong> s'ils peuvent être placés dans un même plan, c'est-à-dire si l'un peut s'écrire comme combinaison linéaire des deux autres.</p>`)}

        <h2>4. Droite dans l'espace</h2>
        ${lc.def("Représentation paramétrique", `<p>Une droite <code>(D)</code> passant par <code>A(x_A, y_A, z_A)</code> et de vecteur directeur <code>u→(a ; b ; c)</code> est l'ensemble des points <code>M(x, y, z)</code> tels que :</p>`)}
        ${lc.formula("x = x_A + a·t<br>y = y_A + b·t<br>z = z_A + c·t &nbsp;&nbsp; (t ∈ ℝ)")}
        <p><code>t</code> est appelé le <strong>paramètre</strong>.</p>

        <h2>5. Plan dans l'espace</h2>
        ${lc.def("Plan défini par un point et deux vecteurs non colinéaires", `<p>Un plan est entièrement déterminé par un point <code>A</code> et deux vecteurs non colinéaires <code>u→</code> et <code>v→</code>.</p>`)}
        ${lc.formula("Représentation paramétrique :<br>OM→ = OA→ + s × u→ + t × v→ &nbsp;(s, t ∈ ℝ)")}

        <h2>6. Positions relatives</h2>
        ${lc.prop("Deux droites dans l'espace", `<ul>
          <li><strong>Confondues</strong> (même droite).</li>
          <li><strong>Strictement parallèles</strong> (vecteurs directeurs colinéaires, mais ne se touchent pas).</li>
          <li><strong>Sécantes</strong> (un point d'intersection unique).</li>
          <li><strong>Non coplanaires</strong> (pas de point commun, et pas parallèles ; ne sont pas dans le même plan).</li>
        </ul>`)}
        ${lc.prop("Deux plans", `<ul>
          <li>Confondus, parallèles strictement, ou sécants selon une droite.</li>
        </ul>`)}
        ${lc.prop("Une droite et un plan", `<ul>
          <li>Droite incluse dans le plan, parallèle au plan, ou sécante (un point unique).</li>
        </ul>`)}
      `,
    },

    {
      title: "Produit scalaire dans l'espace",
      category: "Géométrie",
      content: `
        <h2>1. Définition</h2>
        ${lc.def("Produit scalaire", `<p>Le <strong>produit scalaire</strong> de deux vecteurs <code>u→</code> et <code>v→</code> de l'espace est défini comme dans le plan :</p>`)}
        ${lc.formula("u→ · v→ = ||u→|| × ||v→|| × cos(u→, v→)")}

        <h2>2. Calcul en coordonnées</h2>
        ${lc.formula("Si u→(x ; y ; z) et v→(x' ; y' ; z') :<br>u→ · v→ = x×x' + y×y' + z×z'")}
        ${lc.example("Calcul", `<p><code>u→(2 ; −1 ; 3)</code> et <code>v→(1 ; 4 ; 0)</code>.</p>
          <p><code>u→ · v→ = 2×1 + (−1)×4 + 3×0 = 2 − 4 + 0 = −2</code>.</p>`)}

        <h2>3. Lien avec la norme et la distance</h2>
        ${lc.formula("u→ · u→ = ||u→||² = x² + y² + z²")}

        <h2>4. Orthogonalité</h2>
        ${lc.prop("Caractérisation", `<p>Deux vecteurs non nuls sont orthogonaux si et seulement si leur produit scalaire est nul.</p>`)}
        ${lc.formula("u→ ⊥ v→ ⇔ u→ · v→ = 0")}
        ${lc.example("Tester l'orthogonalité", `<p><code>u→(1 ; 2 ; −1)</code> et <code>v→(3 ; −1 ; 1)</code>. <code>u→ · v→ = 3 − 2 − 1 = 0</code> → orthogonaux.</p>`)}

        <h2>5. Vecteur normal à un plan</h2>
        ${lc.def("Vecteur normal", `<p>Un <strong>vecteur normal</strong> à un plan est un vecteur non nul orthogonal à tous les vecteurs du plan.</p>
          <p>Pour qu'un vecteur soit normal à un plan, il suffit qu'il soit orthogonal à <strong>deux vecteurs non colinéaires</strong> du plan.</p>`)}

        <h2>6. Équation cartésienne d'un plan</h2>
        ${lc.prop("Théorème", `<p>Le plan passant par <code>A(x_A, y_A, z_A)</code> et de vecteur normal <code>n→(a ; b ; c)</code> a pour équation :</p>`)}
        ${lc.formula("a(x − x_A) + b(y − y_A) + c(z − z_A) = 0")}
        <p>Ce qui se réécrit sous la forme <strong>cartésienne</strong> :</p>
        ${lc.formula("a·x + b·y + c·z + d = 0 &nbsp;&nbsp; (avec d = −(a·x_A + b·y_A + c·z_A))")}
        ${lc.example("Trouver une équation", `<p>Plan passant par <code>A(1, 2, 3)</code>, de vecteur normal <code>n→(2 ; −1 ; 4)</code>.</p>
          <ol><li><code>2(x − 1) − (y − 2) + 4(z − 3) = 0</code></li>
          <li><code>2x − 2 − y + 2 + 4z − 12 = 0</code></li>
          <li><code>2x − y + 4z − 12 = 0</code></li></ol>`)}

        <h2>7. Distance d'un point à un plan</h2>
        ${lc.formula("Plan : ax + by + cz + d = 0, point M(x_M, y_M, z_M).<br>Distance : |a·x_M + b·y_M + c·z_M + d| / √(a² + b² + c²)")}
        ${lc.example("Distance", `<p>Distance du point <code>M(1, 0, 2)</code> au plan <code>x + 2y − z + 3 = 0</code>.</p>
          <p><code>d = |1 + 0 − 2 + 3| / √(1 + 4 + 1) = 2 / √6 = 2√6/6 = √6/3</code>.</p>`)}
      `,
    },

    {
      title: "Lois de probabilité à densité",
      category: "Probabilités",
      content: `
        ${lc.warn("Note de programme", `<p>Ce chapitre figurait au programme de Terminale S avant 2020 ; le programme actuel de spé maths (2020+) ne l'inclut plus. Il reste utile en option « Maths complémentaires » ou comme transition vers le post-bac (cf. chapitres post-bac « Variables continues » et « Lois usuelles »).</p>`)}
        <h2>1. Variable aléatoire continue</h2>
        ${lc.def("Variable continue", `<p>Une variable aléatoire <code>X</code> est <strong>continue</strong> si elle peut prendre n'importe quelle valeur dans un intervalle (ou ℝ tout entier), pas seulement des valeurs discrètes.</p>
          <p>Exemple : la taille d'une personne, le temps d'attente à un guichet, la durée de vie d'une ampoule.</p>`)}

        <h2>2. Densité de probabilité</h2>
        ${lc.def("Fonction densité", `<p>Une fonction <code>f</code> est une <strong>densité de probabilité</strong> sur un intervalle <code>I</code> si :</p>
          <ul><li><code>f</code> est continue (ou continue par morceaux) et positive sur <code>I</code> ;</li>
          <li><code>∫_I f(x) dx = 1</code>.</li></ul>`)}
        ${lc.prop("Probabilité d'un intervalle", `<p>Si <code>X</code> a pour densité <code>f</code> :</p>`)}
        ${lc.formula("P(a ≤ X ≤ b) = ∫_a^b f(x) dx")}
        ${lc.warn("Cas individuel", `<p>Pour une variable continue, <code>P(X = a) = 0</code> pour tout <code>a</code> ! Seule la probabilité d'un intervalle a un sens. <code>P(X ≤ a) = P(X < a)</code>.</p>`)}

        <h2>3. Espérance d'une variable continue</h2>
        ${lc.formula("E(X) = ∫_I x × f(x) dx")}

        <h2>4. Loi uniforme</h2>
        ${lc.def("Loi uniforme sur [a, b]", `<p>La loi uniforme sur <code>[a, b]</code> a pour densité :</p>`)}
        ${lc.formula("f(x) = 1 / (b − a) &nbsp;&nbsp; pour x ∈ [a ; b]<br>f(x) = 0 &nbsp;&nbsp; sinon")}
        ${lc.formula("E(X) = (a + b) / 2")}
        ${lc.example("Loi uniforme sur [0 ; 10]", `<p>Densité : <code>f(x) = 1/10</code> sur <code>[0 ; 10]</code>.</p>
          <p><code>P(2 ≤ X ≤ 5) = (5 − 2)/10 = 0,3</code>.</p>
          <p><code>E(X) = 5</code>.</p>`)}

        <h2>5. Loi exponentielle</h2>
        ${lc.def("Loi exponentielle de paramètre λ", `<p>La loi exponentielle <code>ε(λ)</code> sur <code>[0 ; +∞[</code> a pour densité :</p>`)}
        ${lc.formula("f(x) = λ × e^{−λx}")}
        ${lc.formula("P(X ≤ a) = 1 − e^{−λa} &nbsp;&nbsp; (a ≥ 0)")}
        ${lc.formula("E(X) = 1 / λ")}
        ${lc.tip("Modélisation", `<p>La loi exponentielle modélise des durées : durée de vie, temps entre deux événements aléatoires (clients, particules…). Elle est <strong>sans mémoire</strong> : <code>P(X > s + t | X > s) = P(X > t)</code>.</p>`)}
        ${lc.example("Durée de vie d'une ampoule", `<p>Durée de vie modélisée par une loi exponentielle d'espérance 5000 h. Donc <code>λ = 1/5000</code>.</p>
          <p>Probabilité que l'ampoule dure moins de 1000 h : <code>P(X ≤ 1000) = 1 − e^{−1000/5000} = 1 − e^{−0,2} ≈ 0,181</code>.</p>`)}
      `,
    },

    {
      title: "Loi normale",
      category: "Probabilités",
      content: `
        ${lc.warn("Note de programme", `<p>Comme le chapitre précédent, la loi normale a été retirée du programme spé maths Terminale en 2020. Conservée ici pour la culture générale et la préparation au post-bac.</p>`)}
        <h2>1. Loi normale centrée réduite</h2>
        ${lc.def("N(0, 1)", `<p>La <strong>loi normale centrée réduite</strong>, notée <code>N(0, 1)</code>, a pour densité sur ℝ :</p>`)}
        ${lc.formula("φ(x) = (1 / √(2π)) × e^{−x²/2}")}
        <p>Sa courbe est la fameuse « courbe en cloche », symétrique autour de 0.</p>
        ${lc.prop("Propriétés", `<ul>
          <li><code>E(X) = 0</code>, <code>V(X) = 1</code>, <code>σ(X) = 1</code>.</li>
          <li>La courbe est symétrique : <code>φ(−x) = φ(x)</code>.</li>
          <li><code>P(X ≤ 0) = 0,5</code> par symétrie.</li>
        </ul>`)}

        <h2>2. Loi normale générale</h2>
        ${lc.def("N(μ, σ²)", `<p>Une variable suit la <strong>loi normale</strong> de paramètres <code>μ</code> (espérance) et <code>σ²</code> (variance) si :</p>
          <p><code>X ~ N(μ, σ²)</code> ⇔ <code>(X − μ) / σ ~ N(0, 1)</code></p>
          <p>(centrer-réduire la variable la transforme en N(0, 1).)</p>`)}

        <h2>3. Règle des trois sigmas</h2>
        ${lc.prop("À retenir", `<p>Pour une variable <code>X ~ N(μ, σ²)</code> :</p>
          <ul>
            <li><code>P(μ − σ ≤ X ≤ μ + σ) ≈ 0,68</code> (≈ 68 %)</li>
            <li><code>P(μ − 2σ ≤ X ≤ μ + 2σ) ≈ 0,95</code> (≈ 95 %)</li>
            <li><code>P(μ − 3σ ≤ X ≤ μ + 3σ) ≈ 0,997</code> (≈ 99,7 %)</li>
          </ul>`)}
        ${lc.tip("Interprétation", `<p>La quasi-totalité (99,7 %) des valeurs sont à moins de <code>3σ</code> de la moyenne. Les « écarts-types » sont l'unité naturelle pour mesurer l'écart à la moyenne.</p>`)}

        <h2>4. Calcul à la calculatrice</h2>
        ${lc.prop("Fonctions à utiliser", `<p>Sur les calculatrices :</p>
          <ul><li><code>NormalCDF(a, b, μ, σ)</code> : calcule <code>P(a ≤ X ≤ b)</code>.</li>
          <li><code>InvNorm(p, μ, σ)</code> : trouve <code>x</code> tel que <code>P(X ≤ x) = p</code>.</li></ul>`)}
        ${lc.example("Application", `<p>Soit <code>X ~ N(100, 15²)</code>. Calculer <code>P(85 ≤ X ≤ 115)</code>.</p>
          <p>On reconnaît <code>μ ± σ</code> avec <code>μ = 100</code> et <code>σ = 15</code>. Donc <code>P ≈ 0,68</code>.</p>
          <p>Vérification calculatrice : <code>NormalCDF(85, 115, 100, 15) ≈ 0,6827</code> ✓.</p>`)}

        <h2>5. Pourquoi cette loi est si importante</h2>
        ${lc.tip("Théorème central limite (intuition)", `<p>De très nombreuses variables réelles suivent approximativement une loi normale : taille, poids, erreurs de mesure, scores standardisés. Le <strong>théorème central limite</strong> explique pourquoi : la somme (ou la moyenne) d'un grand nombre de variables aléatoires indépendantes suit approximativement une loi normale, quelle que soit la loi de chaque variable individuellement.</p>`)}
      `,
    },

    {
      title: "Échantillonnage et estimation",
      category: "Probabilités",
      content: `
        ${lc.warn("Note de programme", `<p>Le programme spé maths Terminale 2020+ a remplacé ce contenu par <strong>l'inégalité de Bienaymé-Tchebychev et la loi (faible) des grands nombres pour la binomiale</strong> (cf. nouveaux chapitres). Le chapitre ci-dessous reste pertinent pour les filières qui en ont besoin (sciences sociales, prépa éco) et pour le post-bac.</p>`)}
        <h2>1. Loi des grands nombres</h2>
        ${lc.prop("Énoncé intuitif", `<p>Quand le nombre d'expériences augmente, la <strong>fréquence</strong> observée d'un événement se rapproche de sa <strong>probabilité théorique</strong>.</p>`)}
        ${lc.example("Pile ou face", `<p>Sur 10 lancers d'une pièce équilibrée, on peut très bien obtenir 7 piles. Mais sur 10 000 lancers, la proportion se rapproche très près de 0,5.</p>`)}

        <h2>2. Échantillon</h2>
        ${lc.def("Échantillon", `<p>Un <strong>échantillon de taille n</strong> est obtenu en répétant <code>n</code> fois la même expérience aléatoire dans des conditions identiques.</p>`)}

        <h2>3. Intervalle de fluctuation</h2>
        ${lc.def("Intervalle de fluctuation", `<p>Pour une fréquence observée <code>f</code> dans un échantillon de taille <code>n</code> issu d'une population de proportion <code>p</code>, on attend que <code>f</code> soit « proche » de <code>p</code>.</p>
          <p>Au seuil de 95 %, l'intervalle de fluctuation est :</p>`)}
        ${lc.formula("[p − 1,96 × √(p(1−p)/n) ; p + 1,96 × √(p(1−p)/n)]")}
        ${lc.tip("Approximation simplifiée", `<p>En première : <code>[p − 1/√n ; p + 1/√n]</code> donne un intervalle un peu plus large, mais plus simple à manipuler.</p>`)}

        <h2>4. Intervalle de confiance</h2>
        ${lc.def("Intervalle de confiance", `<p>L'<strong>intervalle de confiance</strong> au niveau 95 % d'une proportion inconnue <code>p</code>, à partir d'une fréquence observée <code>f</code> dans un échantillon de taille <code>n</code>, est :</p>`)}
        ${lc.formula("[f − 1,96 × √(f(1−f)/n) ; f + 1,96 × √(f(1−f)/n)]")}
        ${lc.tip("Différence", `<p>L'<strong>intervalle de fluctuation</strong> part de <code>p</code> connu et encadre <code>f</code> futur. L'<strong>intervalle de confiance</strong> part de <code>f</code> observé et encadre <code>p</code> inconnu.</p>`)}

        <h2>5. Application : sondage</h2>
        ${lc.example("Sondage politique", `<p>Sur 1000 personnes interrogées, 530 déclarent voter pour le candidat A. Estimer sa proportion réelle dans la population.</p>
          <ol><li>Fréquence observée : <code>f = 530/1000 = 0,53</code>.</li>
          <li>Marge d'erreur : <code>1,96 × √(0,53 × 0,47 / 1000) ≈ 1,96 × 0,0158 ≈ 0,031</code>.</li>
          <li>Intervalle de confiance : <code>[0,499 ; 0,561]</code>.</li>
          <li>Avec 95 % de confiance, le candidat A obtient entre 49,9 % et 56,1 %.</li></ol>`)}

        <h2>6. Taille d'échantillon</h2>
        ${lc.prop("Pour une marge donnée", `<p>Pour avoir une marge d'erreur d'au plus <code>m</code> au niveau 95 %, il faut que <code>n ≥ 1/m²</code> (en utilisant l'approximation simplifiée).</p>`)}
        ${lc.example("Sondage à ±3 %", `<p>Pour une marge de 3 % (<code>m = 0,03</code>), il faut <code>n ≥ 1/0,0009 ≈ 1112</code> personnes.</p>`)}
      `,
    },

    {
      title: "Combinatoire et coefficients binomiaux",
      category: "Probabilités",
      content: `
        <h2>1. Factorielle</h2>
        ${lc.def("Factorielle de n", `<p>La <strong>factorielle</strong> de <code>n</code> (entier naturel), notée <code>n!</code>, est le produit de tous les entiers de 1 à n :</p>`)}
        ${lc.formula("n! = n × (n−1) × (n−2) × … × 2 × 1")}
        ${lc.example("Quelques factorielles", `<ul>
          <li><code>0! = 1</code> (par convention)</li>
          <li><code>1! = 1</code></li>
          <li><code>2! = 2</code></li>
          <li><code>3! = 6</code></li>
          <li><code>5! = 120</code></li>
          <li><code>10! = 3 628 800</code></li>
        </ul>`)}

        <h2>2. Permutations et arrangements</h2>
        ${lc.prop("Permutations", `<p>Le nombre de façons d'<strong>ordonner</strong> <code>n</code> objets distincts (= permutation de <code>n</code>) est <code>n!</code>.</p>`)}
        ${lc.example("Ordonner 5 livres", `<p>Nombre de permutations possibles : <code>5! = 120</code>.</p>`)}
        ${lc.def("Arrangement A(n, k)", `<p>Le nombre de façons de <strong>choisir et ordonner</strong> <code>k</code> objets parmi <code>n</code> distincts est :</p>`)}
        ${lc.formula("A(n, k) = n × (n−1) × … × (n−k+1) = n! / (n−k)!")}
        ${lc.example("Podium d'une course à 8 coureurs", `<p>Combien de podiums distincts (1ᵉʳ, 2ᵉ, 3ᵉ) ?</p>
          <p><code>A(8, 3) = 8 × 7 × 6 = 336</code>.</p>`)}
        ${lc.tip("Arrangement vs combinaison", `<p><strong>Arrangement</strong> : l'ordre compte (un podium 1-2-3 est différent de 2-1-3).<br>
          <strong>Combinaison</strong> <code>C(n,k)</code> : l'ordre ne compte pas (juste « qui est sur le podium »).<br>
          Lien : <code>C(n,k) = A(n,k) / k!</code>.</p>`)}

        <h2>3. Coefficient binomial</h2>
        ${lc.def("Coefficient binomial C(n, k)", `<p>Le <strong>coefficient binomial</strong> <code>C(n, k)</code> compte le nombre de façons de <strong>choisir k objets parmi n</strong> (sans tenir compte de l'ordre).</p>`)}
        ${lc.formula("C(n, k) = n! / (k! × (n−k)!)")}
        ${lc.example("Calculs", `<ul>
          <li><code>C(5, 2) = 5! / (2! × 3!) = 120 / 12 = 10</code></li>
          <li><code>C(10, 3) = 10! / (3! × 7!) = 720/6 = 120</code></li>
          <li><code>C(n, 0) = 1</code> ; <code>C(n, n) = 1</code></li>
          <li><code>C(n, 1) = n</code></li>
        </ul>`)}

        <h2>4. Symétrie et triangle de Pascal</h2>
        ${lc.formula("C(n, k) = C(n, n − k)")}
        ${lc.formula("C(n, k) + C(n, k+1) = C(n+1, k+1)  (formule de Pascal)")}
        ${lc.tip("Triangle de Pascal", `<pre>1
1 1
1 2 1
1 3 3 1
1 4 6 4 1
1 5 10 10 5 1
1 6 15 20 15 6 1</pre>
          <p>Chaque coefficient est la somme des deux du dessus.</p>`)}

        <h2>5. Formule du binôme de Newton</h2>
        ${lc.prop("Énoncé", `<p>Pour tous réels <code>a, b</code> et entier <code>n ≥ 0</code> :</p>`)}
        ${lc.formula("(a + b)ⁿ = Σ_{k=0}^{n} C(n, k) × a^{n−k} × b^k")}
        ${lc.example("Développer (a + b)³", `<p>Avec <code>n = 3</code> : coefficients C(3,0), C(3,1), C(3,2), C(3,3) = 1, 3, 3, 1.</p>
          <p><code>(a + b)³ = a³ + 3a²b + 3ab² + b³</code>.</p>`)}
        ${lc.example("Développer (1 + x)⁵", `<p>Coefficients : 1, 5, 10, 10, 5, 1.</p>
          <p><code>(1 + x)⁵ = 1 + 5x + 10x² + 10x³ + 5x⁴ + x⁵</code>.</p>`)}
      `,
    },

    {
      title: "Équations différentielles linéaires",
      category: "Analyse",
      content: `
        <h2>1. Vocabulaire</h2>
        ${lc.def("Équation différentielle", `<p>Une <strong>équation différentielle</strong> est une équation reliant une fonction inconnue <code>y</code> et ses dérivées. <strong>Linéaire d'ordre 1</strong> : <code>y' = ay + b</code> ou <code>y' + a(x)y = b(x)</code>.</p>`)}

        <h2>2. Cas y' = ay (a constante)</h2>
        ${lc.prop("Solutions", `<p>Les solutions de <code>y' = ay</code> sont :</p>`)}
        ${lc.formula("y(x) = C × e^{ax} &nbsp;&nbsp; (C ∈ ℝ)")}
        ${lc.example("Application : croissance exponentielle", `<p>Une population vérifie <code>P'(t) = 0,05 × P(t)</code>. Solutions : <code>P(t) = C × e^{0,05 t}</code>. Avec <code>P(0) = 1000</code>, <code>C = 1000</code>, donc <code>P(t) = 1000 × e^{0,05 t}</code>.</p>`)}

        <h2>3. Cas y' = ay + b (a, b constantes, a ≠ 0)</h2>
        ${lc.prop("Solution générale", `<p>Solution générale = solution homogène + solution particulière constante :</p>`)}
        ${lc.formula("y(x) = C × e^{ax} − b/a &nbsp;&nbsp; (C ∈ ℝ)")}
        <p>La solution particulière constante <code>−b/a</code> s'obtient en posant <code>y' = 0</code>.</p>
        ${lc.example("Résoudre y' = 2y − 6", `<ol>
          <li>Solution particulière constante : <code>0 = 2y − 6</code> → <code>y = 3</code>.</li>
          <li>Solution homogène : <code>y' = 2y</code> → <code>y = C × e^{2x}</code>.</li>
          <li>Solution générale : <code>y(x) = C × e^{2x} + 3</code>.</li>
        </ol>`)}

        <h2>4. Problème de Cauchy</h2>
        ${lc.def("Condition initiale", `<p>Une équation différentielle accompagnée d'une <strong>condition initiale</strong> <code>y(x₀) = y₀</code> a une <strong>unique</strong> solution.</p>`)}
        ${lc.example("Avec condition initiale", `<p>Résoudre <code>y' = 2y − 6</code> avec <code>y(0) = 5</code>.</p>
          <ol><li>Forme générale : <code>y(x) = C × e^{2x} + 3</code>.</li>
          <li>Condition : <code>y(0) = C + 3 = 5</code>, donc <code>C = 2</code>.</li>
          <li>Solution : <code>y(x) = 2 × e^{2x} + 3</code>.</li></ol>`)}

        <h2>5. Cas y' = ay + f(x) (second membre fonction)</h2>
        ${lc.prop("Méthode", `<p>Quand le second membre <code>b</code> n'est plus constant mais une fonction <code>f(x)</code>, on procède en deux temps :</p>
          <ol><li>Résoudre l'équation <strong>homogène</strong> associée <code>y' = ay</code> → <code>y_h(x) = C × e^{ax}</code>.</li>
          <li>Trouver une <strong>solution particulière</strong> <code>y_p(x)</code> de <code>y' = ay + f(x)</code>.</li>
          <li>La solution générale est <code>y(x) = y_h(x) + y_p(x)</code>.</li></ol>`)}
        ${lc.example("Résoudre y' = 2y + x", `<ol>
          <li>Homogène : <code>y_h = C × e^{2x}</code>.</li>
          <li>Cherchons une solution particulière de la forme <code>y_p = αx + β</code>. Alors <code>y'_p = α</code> et il faut <code>α = 2(αx + β) + x</code>, soit <code>α = 2αx + 2β + x</code>.</li>
          <li>Identification : <code>0 = 2α + 1</code> donc <code>α = −1/2</code> ; <code>α = 2β</code> donc <code>β = −1/4</code>.</li>
          <li>Solution particulière : <code>y_p = −x/2 − 1/4</code>.</li>
          <li>Solution générale : <code>y(x) = C × e^{2x} − x/2 − 1/4</code>.</li>
        </ol>`)}

        <h2>6. Modélisations classiques</h2>
        ${lc.example("Refroidissement (loi de Newton)", `<p>Un objet de température <code>T(t)</code> dans un milieu à température <code>T_a</code> vérifie <code>T'(t) = −k(T − T_a)</code>, avec <code>k > 0</code>.</p>
          <p>Solution : <code>T(t) = (T_0 − T_a) × e^{−kt} + T_a</code>. La température tend vers <code>T_a</code> exponentiellement.</p>`)}
