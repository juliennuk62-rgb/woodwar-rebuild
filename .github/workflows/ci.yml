name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run data + logic tests
        run: python -m unittest tests.test_data tests.test_logic -v

      - name: Run route smoke tests
        run: python -m unittest tests.test_routes -v

      - name: Run playtest simulator
        run: python scripts/playtest.py
