{% extends "base.html" %}

{% block title %}Connexion — Woodwar Rebuild{% endblock %}

{% block content %}
  <div class="card" style="max-width: 460px; margin: 2em auto;">
    <h1>Retourner à son royaume</h1>
    <p style="color: var(--fg-dim);">
      Seigneur, le royaume vous attend.
    </p>

    <form method="post" action="{{ url_for('login') }}">
      <label for="username">Pseudo</label>
      <input type="text" id="username" name="username" required
             value="{{ form_data.username or '' }}"
             autocomplete="username"
             autofocus>

      <label for="password">Mot de passe</label>
      <input type="password" id="password" name="password" required
             autocomplete="current-password">

      <button type="submit">Entrer dans le royaume</button>
    </form>

    <p style="margin-top: 1.5em; color: var(--fg-dim);">
      Pas encore de compte ? <a href="{{ url_for('register') }}">Inscrivez-vous</a>.
    </p>
  </div>
{% endblock %}
