{% extends "base.html" %}

{% block title %}Fonder une alliance — Woodwar Rebuild{% endblock %}

{% block content %}
  <div class="card" style="max-width: 560px; margin: 2em auto;">
    <h1>Fonder une alliance</h1>
    <p style="color: var(--fg-dim);">
      Coût de fondation : <strong style="color: var(--accent);">{{ creation_cost }} or</strong>.
      Vous êtes automatiquement désigné fondateur de l'alliance.
    </p>

    <form method="post" action="{{ url_for('alliance_new') }}">
      <label for="name">Nom de l'alliance</label>
      <input type="text" id="name" name="name" required minlength="3" maxlength="48"
             value="{{ form_data.name }}" autofocus>

      <label for="tag">Tag (2-5 caractères, affiché entre crochets)</label>
      <input type="text" id="tag" name="tag" required minlength="2" maxlength="5"
             pattern="[A-Za-z0-9]+" value="{{ form_data.tag }}"
             placeholder="EX: ORD">

      <label for="description">Description (optionnelle)</label>
      <textarea id="description" name="description" rows="4"
                style="width: 100%; padding: 0.6em 0.8em; background: var(--bg); color: var(--fg); border: 1px solid var(--border); border-radius: 4px; font-family: inherit;">{{ form_data.description }}</textarea>

      <button type="submit">Fonder l'alliance</button>
    </form>

    <p style="margin-top: 1.5em;">
      <a href="{{ url_for('alliances_list') }}">Retour à la liste</a>
    </p>
  </div>
{% endblock %}
